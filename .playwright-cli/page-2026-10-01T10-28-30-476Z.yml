            - listitem [ref=f1e788]: 2026년은 9월 30일까지 수집한 진행 중 자료다.
            - listitem [ref=f1e789]: 지도는 대표 수행기관 소재지이며 실제 연구 현장 전체를 나타내지 않는다. 행정경계는 통계청 2013년 시도 경계 자료를 사용했다.
            - listitem [ref=f1e790]: 주제군은 과제명·키워드 규칙의 대표값이며 공식 학문 분류가 아니다.
            - listitem [ref=f1e791]: 의미 기반 14개 군집은 텍스트 유사도를 이용한 탐색용 묶음이며, 안정도 ARI 0.61로 경계에 있는 연구는 다른 군집으로 달라질 수 있다.
            - listitem [ref=f1e792]: 웹 공개본에서 연구 원문·사업자번호·연락처·내부 검토 로그를 제외했다.
