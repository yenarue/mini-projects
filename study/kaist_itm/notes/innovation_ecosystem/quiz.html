서 시민이 자유 혁신자이자 공론장 주체로 참여한다는 형태로 이론적 근거를 얻는다.\u003c/p>\n\u003cp>이 흐름은 다시 W15의 신시민성 논의로 독립된 주제가 되어 세 번째로 다뤄진다.\u003c/p>\n"}},"W03/c17":{"title":"국가 역할의 전환 — 지휘관에서 제도 건축가로","en":"From Commander to Institutional Architect","week":"W03","href":"W03.html#c17","stars":4,"byIndex":{"0":"\u003cp>\u003cstrong>지휘관(Commander)\u003c/strong> 모델은 특정 기술·연구자를 직접 지정하는 방식이고, \u003cstrong>제도 건축가(Institutional Architect)\u003c/strong> 모델은 분산된 지식 주체들이 마음껏 시도하고 기회를 발견할 판을 짜 주는 방식이다.\u003c/p>\n\u003cp>지휘관 모델은 상부가 기술 가치를 안다고 전제하며 예산 배분과 서류 심사로 작동하고, 제도 건축가 모델은 아무도 미리 모른다고 전제하며 거버넌스 규칙과 공유지 조성, 데이터 공유 제도로 작동한다.\u003c/p>\n\u003cp>지휘관 모델의 네 가지 한계는 ① 과학기술지식을 단지 투자가 부족한 공공재로 보는 \u003cstrong>공공재 가정의 오류\u003c/strong>, ② 관료적 사전 지정이 지식 발견에 실패하는 \u003cstrong>picking winners의 실패\u003c/strong>, ③ 감사 위험에 따른 \u003cstrong>안전한 과제 쏠림\u003c/strong>, ④ 추격형 관성에 갇혀 프론티어 창출이 불가능해지는 \u003cstrong>추격형 관성\u003c/strong>이다.\u003c/p>\n","1":"\u003cp>거버넌스가 국지적이어야 하는 이유는 기회주의를 막으려면 \u003cstrong>모니터링하고 제재\u003c/strong>해야 하는데, 그러려면 현장 가까이 있어야 하기 때문이다.\u003c/p>\n\u003cp>예를 들어 의료 데이터로 커먼즈를 만든다면 전국 단위로는 안 되고, 부산시는 부산시 단위로 해야 온·오프라인에서 서로 모니터링이 된다.\u003c/p>\n\u003cp>중앙정부가 전국 단위 플랫폼을 만드는 방식은 오히려 지휘관 모델의 재판이 되기 쉽다. 반면 지역 단위 커먼즈를 여러 개 만드는 쪽이 Ostrom의 설계 원칙, 즉 명확한 경계·지역 조건에 맞는 규칙·감시·단계적 제재에 더 부합한다.\u003c/p>\n\u003cp>따라서 국지성은 제도 건축가 역할의 구체적 설계 원칙이 된다.\u003c/p>\n","2":"\u003cp>\u003cstrong>Mazzucato의 기업가형 국가\u003c/strong>는 국가가 방향을 정하고 과감히 투자해 시장을 만든다(market-creating)는 입장으로, 국가가 미션을 설정할 수 있다고 전제한다. 다만 이는 지휘관 모델로 되돌아갈 위험이 있다.\u003c/p>\n\u003cp>\u003cstrong>제도 건축가 모델\u003c/strong>은 국가가 판을 깔고 조정해 발견 비용을 줄인다는 입장으로, 아무도 미리 모른다고 전제한다. 다만 방향성이 없어 표류할 위험이 있다.\u003c/p>\n\u003cp>둘은 긴장 관계에 있지만, 교수가 &quot;아폴로·맨해튼은 당연히 그렇죠&quot;라고 한 단서가 이를 조정한다.\u003c/p>\n\u003cp>즉 \u003cstrong>미션이 분명한 영역\u003c/strong>에서는 Mazzucato의 기업가형 국가가, \u003cstrong>안개 속에 있는 영역\u003c/strong>에서는 제도 건축가 모델이 적합하다는 것이 이 비교의 결론이다.\u003c/p>\n"}},"W03/c18":{"title":"McCloskey의 부르주아적 합의와 혁신의 사회적 허용","en":"Bourgeois Deal; Social Permission to Innovate","week":"W03","href":"W03.html#c18","stars":4,"byIndex":{"0":"\u003cp>\u003cstrong>부르주아적 합의\u003c/strong>는 &quot;혁신가가 자유롭게 실험하도록 허용해 달라(Leave me alone). 그 결과 발생하는 풍요를 사회 전체가 공유하겠다&quot;는 거래다.\u003c/p>\n\u003cp>McCloskey는 근대의 성장이 자본이나 제도가 아니라 혁신가를 대하는 사회적 태도의 변화에서 왔다고 본다.\u003c/p>\n\u003cp>이 거래가 \u003cstrong>양방향\u003c/strong>이라는 점이 핵심이다. 자유만 요구하는 것이 아니라 풍요의 공유를 약속하기 때문에, 이 합의는 깨질 수 있다. 혁신가 쪽이 풍요를 공유하지 않으면 사회가 자유를 거둬들이고, 사회가 자유를 주지 않으면 혁신이 멈춘다.\u003c/p>\n\u003cp>따라서 부르주아적 합의는 혁신에 대한 관용이 무조건적 선물이 아니라 대가를 조건으로 하는 쌍방 계약임을 보여준다.\u003c/p>\n","1":"\u003cp>\u003cstrong>혁신의 사회적 허용(Social Permission to Innovate)\u003c/strong>은 아무리 뛰어난 기술이라도 시민 사회의 윤리적·문화적 승인을 얻지 못하면 \u003cstrong>소멸\u003c/strong>한다는 개념이다.\u003c/p>\n\u003cp>이는 시장에서 안 팔리는 수준이 아니라 아예 금지되거나 사회적으로 퇴출된다는 뜻이다. AI 프라이버시, 자율주행 윤리, 유전자 편집 안전성처럼 비가격적 가치가 충돌하는 영역에서 두드러진다.\u003c/p>\n\u003cp>\u003cstrong>GMO\u003c/strong>가 유럽에서 사회적 허용을 얻지 못해 사실상 거부된 대표 사례다. 지금 AI 데이터센터도 미국에서 비슷한 길을 걷고 있다.\u003c/p>\n\u003cp>이는 기술의 우수성이 아니라 신뢰와 분배에 대한 인식이 기술의 생존을 가른다는 것을 보여준다.\u003c/p>\n","2":"\u003cp>\u003cstrong>Mokyr\u003c/strong>는 근대 성장이 \u003cstrong>지식의 코드화\u003c/strong>가 접근 비용을 낮춘 결과라고 설명한다. 즉 지식이 문제라는 입장이다.\u003c/p>\n\u003cp>\u003cstrong>McCloskey\u003c/strong>는 근대 성장이 혁신가를 대하는 \u003cstrong>사회적 태도의 변화\u003c/strong>, 즉 가치관과 수사(rhetoric)의 문제에서 왔다고 설명한다. 전통 사회에서 천대받던 상인에 대한 평가가 근대에 뒤집힌 것이 결정적이라는 것이다.\u003c/p>\n\u003cp>두 설명은 경쟁하는 설명으로, Mokyr는 지식 접근의 문제를, McCloskey는 혁신가에 대한 사회적 존중의 문제를 근대 성장의 핵심으로 본다는 점에서 대비된다.\u003c/p>\n\u003cp>이 비교는 &quot;왜 근대에 성장이 폭발했나&quot;라는 같은 질문에 지식과 태도라는 서로 다른 열쇠를 제시하는 셈이다.\u003c/p>\n"}},"W05-1/c01":{"title":"Mode 1 vs Mode 2","en":"Mode 1 and Mode 2 Knowledge Production (Gibbons et al. 1994)","week":"W05-1","href":"W05-1.html#c01","stars":5,"byIndex":{}},"W05-1/c02":{"title":"초학제성과 다원화된 품질 관리","en":"Transdisciplinarity and Pluralised Quality Control","week":"W05-1","href":"W05-1.html#c02","stars":3,"byIndex":{}},"W05-1/c03":{"title":"Mode 2의 구조적 동인","en":"Structural Drivers of Mode 2 — Supply, Demand, Digital","week":"W05-1","href":"W05-1.html#c03
