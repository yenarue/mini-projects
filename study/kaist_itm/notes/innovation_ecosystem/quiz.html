,"core":true},{"id":"W02-1/c05/1","conceptId":"W02-1/c05","index":1,"week":"W02-1","no":5,"href":"W02-1.html#c05","html":"\u003cp>코드화(codification)가 왜 접근 비용을 낮추는가? 특허 제도가 같은 논리를 어떻게 구현하는지 설명하라.\u003c/p>","text":"코드화(codification)가 왜 접근 비용을 낮추는가? 특허 제도가 같은 논리를 어떻게 구현하는지 설명하라.","isComparison":false,"isApplied":false,"stars":5,"core":true},{"id":"W02-1/c05/2","conceptId":"W02-1/c05","index":2,"week":"W02-1","no":5,"href":"W02-1.html#c05","html":"\u003cp>Ω/λ 구분과 형식지/암묵지, STI/DUI의 대응 관계를 정리하라.\u003c/p>","text":"Ω/λ 구분과 형식지/암묵지, STI/DUI의 대응 관계를 정리하라.","isComparison":false,"isApplied":false,"stars":5,"core":true},{"id":"W02-1/c06/0","conceptId":"W02-1/c06","index":0,"week":"W02-1","no":6,"href":"W02-1.html#c06","html":"\u003cp>★ 불만족스러운 혁신이란 무엇이며, 생산자 지배 → 기술 궤적의 괴리 → dead end로 이어지는 구조적 원인을 설명하라.\u003c/p>","text":"★ 불만족스러운 혁신이란 무엇이며, 생산자 지배 → 기술 궤적의 괴리 → dead end로 이어지는 구조적 원인을 설명하라.","isComparison":false,"isApplied":false,"stars":5,"core":true},{"id":"W02-1/c06/1","conceptId":"W02-1/c06","index":1,"week":"W02-1","no":6,"href":"W02-1.html#c06","html":"\u003cp>★ &quot;사용자의 수용성 변동 없이 지식 접근 비용만 낮아지는 것은 위험하다&quot;의 뜻을 Mokyr의 주장과 대비해 서술하라.\u003c/p>","text":"★ \"사용자의 수용성 변동 없이 지식 접근 비용만 낮아지는 것은 위험하다\"의 뜻을 Mokyr의 주장과 대비해 서술하라.","isComparison":true,"isApplied":false,"stars":5,"core":true},{"id":"W02-1/c06/2","conceptId":"W02-1/c06","index":2,"week":"W02-1","no":6,"href":"W02-1.html#c06","html":"\u003cp>사용자 관점에서 기술 수용이 &quot;유용/무용&quot;이 아니라 &quot;좋다/싫다&quot;의 문제가 된다는 말의 함의를 사례(GMO, AI 데이터센터, 유럽 에어컨)로 설명하라.\u003c/p>","text":"사용자 관점에서 기술 수용이 \"유용/무용\"이 아니라 \"좋다/싫다\"의 문제가 된다는 말의 함의를 사례(GMO, AI 데이터센터, 유럽 에어컨)로 설명하라.","isComparison":false,"isApplied":false,"stars":5,"core":true},{"id":"W02-1/c06/3","conceptId":"W02-1/c06","index":3,"week":"W02-1","no":6,"href":"W02-1.html#c06","html":"\u003cp>응용: 한국의 디지털 전환(DX) 정책이 불만족스러운 혁신의 사례가 될 수 있는 이유를 서술하라.\u003c/p>","text":"응용: 한국의 디지털 전환(DX) 정책이 불만족스러운 혁신의 사례가 될 수 있는 이유를 서술하라.","isComparison":false,"isApplied":true,"stars":5,"core":true},{"id":"W tml#c06","html":"★★ AI 규제에서 EU·미국·한국의 접근이 어떻게 분화하는지 서술하고, 그것이 GMO 때의 패턴과 어떻게 같은지 설명하라.","text":"★★ AI 규제에서 EU·미국·한국의 접근이 어떻게 분화하는지 서술하고, 그것이 GMO 때의 패턴과 어떻게 같은지 설명하라.","isComparison":false,"isApplied":false,"stars":3,"core":false},{"id":"W05-2/c06/3","conceptId":"W05-2/c06","index":3,"week":"W05-2","no":6,"href":"W05-2.html#c06","html":"★ 한국의 시민 인식론 전환 방향으로 제시된 네 가지(지역·현장·참여·공개)를 설명하라.","text":"★ 한국의 시민 인식론 전환 방향으로 제시된 네 가지(지역·현장·참여·공개)를 설명하라.","isComparison":false,"isApplied":false,"stars":3,"core":false},{"id":"W05-2/c06/4","conceptId":"W05-2/c06","index":4,"week":"W05-2","no":6,"href":"W05-2.html#c06","html":"비교형: CTA(W03)와 겸손의 기술은 사전 개입이라는 점에서 같지만 성격이 다르다. 그 차이를 논하라.","text":"비교형: CTA(W03)와 겸손의 기술은 사전 개입이라는 점에서 같지만 성격이 다르다. 그 차이를 논하라.","isComparison":true,"isApplied":false,"stars":3,"core":false},{"id":"W05-2/c07/0","conceptId":"W05-2/c07","index":0,"week":"W05-2","no":7,"href":"W05-2.html#c07","html":"★★ 기술 수용 기준이 경제적 타당성에서 사회적 타당성으로 전환된다는 주장의 내용을 응급 서비스 사례로 설명하라.","text":"★★ 기술 수용 기준이 경제적 타당성에서 사회적 타당성으로 전환된다는 주장의 내용을 응급 서비스 사례로 설명하라.","isComparison":false,"isApplied":false,"stars":5,"core":false},{"id":"W05-2/c07/1","conceptId":"W05-2/c07","index":1,"week":"W05-2","no":7,"href":"W05-2.html#c07","html":"★★ &quot;기본권으로 정하면 그만큼 투자가 일어나고 시장이 달라진다&quot;는 명제가 공동생산 개념과 어떻게 연결되는지 서술하라.","text":"★★ \"기본권으로 정하면 그만큼 투자가 일어나고 시장이 달라진다\"는 명제가 공동생산 개념과 어떻게 연결되는지 서술하라.","isComparison":false,"isApplied":false,"stars":5,"core":false},{"id":"W05-2/c07/2","conceptId":"W05-2/c07","index":2,"week":"W05-2","no":7,"href":"W05-2.html#c07","html":"★ SOC 개념이 달라진다는 말의 뜻을 도로와 응급 서비스를 대비해 설명하라.","text":"★ SOC 개념이 달라진다는 말의 뜻을 도로와 응급 서비스를 대비해 설명하라.","isComparison":true,"isApplied":false,"stars":5,"core":false},{"id":"W05-2/c07/3","conceptId":"W05-2/c07","index":3,"week":"W05-2","no":7,"href":"W05-2.html#c07","html":"★ Frugal innovation과 Responsible innovation의 차이를 유럽의 에어컨 사례로 설명하고, 그것이 &quot;기술 선택이 아니라 입장의 차이&quot;라는 주장과 어떻게 연결되는지 논하라.","text":"★ Frugal innovation과 Responsible innovation의 차이를 유럽의 에어컨 사례로 설명하고, 그것이 \"기술 선택이 아니라 입장의 차이\"라는 주장과 어떻게 연결되는지 논하라.","isComparison":true,"isApplied":false,"stars":5,"core":false},{"id":"W05-2/c07/4","conceptId":"W05-2/c07","index":4,"week":"W05-2","no":7,"href":"W05-2.html#c07","html":"비판적 검토: 사회적 타당성 기준의 한계는 무엇이며, 그 한계를 다루려면 무엇이 필요한가?","text":"비판적 검토: 사회적 타당성 기준의 한계는 무엇이며, 그 한계를 다루려면 무엇이 필요한가?","isComparison":false,"isApplied":false,"stars":5,"core":false}],"answers":{"W01/c01":{"title":"사회 속의 시스템 — 정치·경제·혁신 활동","en":"System in a Society — Political / Economic / Innovation Activity","week":"W01","href":"W01.html#c01","stars":3,"byIndex":{"0":"\u003cp>정치·경제·혁신 활동은 모두 사람이 혼자 살 수 없어 생기는 \u003cstrong>집단행동문제(collective action problem)\u003c/strong>를 푸는 서로 다른 방식이다.\u003c/p>\n\u003cp>\u003cstrong>정치활동\u003c/strong>은 가치를 \u003cstrong>권위적으로 배분\u003c/strong>한다. 대통령·국회에 권위를 위임해 대신 정하게 하는 집단적 결정(collective decision-making) 방식이다(Easton, 1953).\u003c/p>\n\u003cp>\u003cstrong>경제활동\u003c/strong>은 가치를 \u003cstrong>시장적으로 배분\u003c/strong>한다. 희소자원을 가격으로 나누지만, 실은 동등한 두 당사자의 \u003cstrong>1:1 계약\u003c/strong>들이 모인 것이라 집단적 결정이라 부르기는 애매하다.\u003c/p>\n\u003cp>\u003cstrong>혁신활동\u003c/strong>은 나누는 것이 아니라 \u003cstrong>값어치 있는 새 지식을 창출\u003c/strong>하는 활동이다. Schumpeter식 기업가의 solo act처럼 보이지만 실은 여럿이 얽힌 집단적 활동이다.\u003c/p>\n\u003cp>셋을 묶는 것은 결국 &quot;함께&quot; 문제를 풀어야 한다는 collective action problem이며, 이것이 이 수업이 혁신을 시스템으로 보는 출발점이다.\u003c/p>\n","1":"\u003cp>이 수업의 입장은 혁신이 solo act가 아니라 \u003cstrong>collective한 활동\u003c/strong>이라는 것이다.\u003c/p>\n\u003cp>교수는 잡스·게이츠를 예로 들며, 겉보기에는 천재 한 명이 이룬 일 같지만 &quot;\u003cstrong>이미 누군가 하고 있었던\u003c/strong>&quot; 일을 이들이 &quot;이거 되겠다&quot; 하며 치고 나온 것일 뿐이라고 설명한다.\u003c/p>\n\u003cp>그리고 그 판단이 성공으로 이어진 결정적 이유는 \u003cstrong>시장이 그것을 당겨 줬기 때문\u003c/strong>이다 — 같은 판단을 한 사람 중에는 망한 사람도 있었지만, 시장의 수요가 잡스·게이츠의 시도를 끌어올렸다.\u003c/p>\n\u003cp>즉 혁신은 한 개인의 통찰만으로 완성되지 않고, 선행하는 시도와 그것을 받아들이는 시장(수요자)이라는 여러 행위자가 얽혀야 일어난다. 그래서 이 수업은 혁신을 개인이 아니라 \u003cstrong>혁신시스템\u003c/strong>으로 다룬다.\u003c/p>\n","2":"\u003cp>교수는 혁신활동을 &quot;\u003cstrong>값어치 있는 지식을 만드는 활동\u003c/strong>&quot;이라고 정의한다.\u003c/p>\n\u003cp>여기서 핵심은 &quot;지식을 만든다&quot;는 것 자체가 아니라 그 지식에 \u003cstrong>값어치(가치)가 붙는지 여부\u003c/strong>다. 논문을 쓰는 것처럼 지식을 만들기만 하면 그것은 그냥 \u003cstrong>지식 활동\u003c/strong>이다.\u003c/p>\n\u003cp>반면 그 지식이 경제적(혹은 정치적) 가치를 인정받아 실제로 쓰이게 되면 비로소 \u003cstrong>혁신\u003c/strong>이라 부른다. 즉 지식 활동과 혁신의 차이는 지식이 존재하느냐가 아니라 그 지식이 \u003cstrong>가치를 창출하느냐\u003c/strong>에 있다.\u003c/p>\n\u003cp>이 정의는 앞선 비교표의 &quot;혁신활동 = 경제(·정치) 가치의 창출&quot;이라는 슬라이드 표현과 정확히 대응하며, 혁신을 정치·경제와 나란히 놓고 시스템으로 보는 이 수업 전체의 틀을 이룬다.\u003c/p>\n"}},"W01/c02":{"title":"인간–제도–과학기술의 상호구성","en":"Co-constitution of Actors, Institutions and Socio-technical Systems (Geels 2004)","week":"W01","href":"W01.html#c02","stars":5,"byIndex":{"0":"\u003cp>Geels(2004)는 사회를 \u003cstrong>규칙·제도\u003c/strong>, \u003cstrong>인간·조직\u003c/strong>, \u003cstrong>사회기술시스템(물질세계)\u003c/strong> 세 축의 상호구성으로 본다.\u003c/p>\n\u003cp>\u003cstrong>규칙·제도\u003c/strong>는 도덕·공공정책·법 등이고, \u003cstrong>인간·조직\u003c/strong>은 lifestyle·관행·조직 routine이다. 이 두 축만 보는 것이 기존 사회과학의 범위다 — Adam Smith도 분업·전문화는 얘기했지만 과학기술 자체는 다루지 않았다.\u003c/p>\n\u003cp>Geels의 프레임은 여기에 지구·생태계·원자력·디지털 같은 \u003cstrong>사회기술시스템\u003c/strong> 축을 세 번째로 더한다. 기술은 사람이 만들지만, 일단 깔리면 사람의 행동 범위와 제도까지 거꾸로 바꾼다고 보는 것이다.\u003c/p>\n\u003cp>따라서 기존 사회과학과 다른 점은 \u003cstrong>물질세계(과학기술)를 사회 설명의 독립적 축으로 넣었다는 것\u003c/strong>이며, 세 축이 일방적 인과가 아니라 서로를 만들어 가는 \u003cstrong>상호구성\u003c/strong> 관계라는 점이다.\u003c/p>\n","1":"\u003cp>④와 ⑤는 방향이 반대인 관계다. ④는 시스템이 인간을 규정하고, ⑤는 규칙이 시스템에 새겨진다.\u003c/p>\n\u003cp>\u003cstrong>④(시스템 → 인간·조직)\u003c/strong>는 인공물·물질조건이 행동의 가능성과 한계, 즉 맥락을 구성한다는 것이다. 교수는 서울 사람과 부산 사람의 24시간이 다르다는 예를 든다 — 서울은 뒷골목까지 전철이 들어가지만 부산은 그렇지 않아, 같은 하루도 전혀 다른 삶이 된다.\u003c/p>\n\u003cp>\u003cstrong>⑤(규칙 → 시스템)\u003c/strong>는 규칙이 인공물의 디자인 목적과 기능에 새겨진다(inscribe)는 것이다. AI 챗봇 \u003cstrong>이루다\u003c/strong>는 어떻게 교육시키느냐에 따라 결과가 달라졌고, 이는 기술이 중립적이지 않다는 Winner(1980)의 논지와 같다.\u003c/p>\n\u003cp>\u003cstrong>전력망\u003c/strong> 사례는 이 둘이 맞물리는 지점을 보여 준다. 원전·화력 집중 발전이라는 시스템(④)이 송전망 건설을 &quot;당연한 효율&quot;로 만들고, 동시에 그 전체 효율의 논리라는 규칙이 반대 주민을 &quot;이상한 사람&quot;으로 만드는 방식으로 시스템에 새겨진다(⑤).\u003c/p>\n","2":"\u003cp>\u003cstrong>역적응(reverse adaptation)\u003c/strong>이란 사람이 편하려고 만든 수단에 오히려 사람이 맞춰 가는 현상, 즉 수단이 목적을 가려 버리는 것이다.\u003c/p>\n\u003cp>전력망 사례에서 이는 다음과 같이 나타난다. 원전·화력 집중 발전 시스템에서는 송전망 건설이 전체 효율에 맞다고 전제된다. 지역 주민이 반대하면 &quot;전체 시스템을 위해 왜 고집이냐&quot;는 시각이 나오는데, 이것이 바로 \u003cstrong>효율성을 위해 사람을 시스템에 맞추라는 역적응 논리\u003c/strong>다.\u003c/p>\n\u003cp>원래 전력망은 사람을 편하게 하려는 수단이었지만, 논의의 무게중심이 &quot;시스템 효율&quot;로 옮겨 가면서 그 수단 자체가 목적처럼 다뤄지고 주민의 요구는 시스템에 대한 비합리적 저항으로 취급된다.\u003c/p>\n\u003cp>이런 역적응이 분산형 태양광 같은 대안이 나오는 배경이며, W01/05의 사용자 고착에서 기술 고착이 사회적 관습으로 내재화되는 메커니즘으로 다시 등장한다.\u003c/p>\n"}},"W01/c03":{"title":"인간에 대한 4가지 기본 이해","en":"Four Views of the Human — Rational / Social / Tool-using / Learning","week":"W01","href":"W01.html#c03","stars":4,"byIndex":{"0":"\u003cp>이 수업은 경제학의 합리적 행위자 가정을 넘어 인간을 네 겹으로 본다. ① \u003cstrong>합리적으로 선택하는 인간\u003c/strong>, ② \u003cstrong>사회적 관계 속의 인간\u003c/strong>, ③ \u003cstrong>도구를 사용하는 인간\u003c/strong>, ④ \u003cstrong>학습하는 인간\u003c/strong>이다.\u003c/p>\n\u003cp>①은 유틸리티를 계산하는 Entrepreneur의 원형이고, ②는 가족·학연·국가 같은 관계 속의 Civic Actor의 원형이며, ③은 도구·SOC 속에서 살아가는, 기술화(technologization)된 존재다.\u003c/p>\n\u003cp>혁신학이 가장 강조하는 것은 ④ \u003cstrong>학습하는 인간\u003c/strong>이다. 혁신활동의 정의 자체가 &quot;값어치 있는 지식을 만드는 것&quot;이므로, 지식을 습득·축적·창출하는 학습 역량이 곧 혁신 역량과 직결되기 때문이다.\u003c/p>\n\u003cp>그래서 이 인간관은 나머지 셋을 배제하지 않으면서도, 혁신을 다루는 이 수업의 중심 렌즈로 기능한다.\u003c/p>\n","1":"\u003cp>\u003cstrong>동태적 효율성(dynamic efficiency)\u003c/strong>이란 시간이 갈수록 더 잘하게 되는 능력, 즉 &quot;어제보다 오늘이 낫고 내일이 더 나은&quot; 상태를 가리키는 개념이다.\u003c/p>\n\u003cp>이는 주어진 자원을 지금 최적으로 배분하는 정태적 효율성과 대비된다. 동태적 효율성의 핵심은 배분의 최적화가 아니라 \u003cstrong>역량 자체가 시간에 따라 향상되는 것\u003c/strong>에 있다.\u003c/p>\n\u003cp>이것이 학습하는 인간과 직결되는 이유는, 혁신학이 말하는 학습(learning by doing/using/interacting)이 바로 이런 시간에 따른 역량 향상의 과정이기 때문이다. 교수는 한국이 이런 학습 DNA를 조선 성리학의 \u003cstrong>수기치인(修己治人)\u003c/strong>적 자기 수양 전통에서 찾으며, 과학기술 역량뿐 아니라 봉준호·박찬욱 같은 문화적 역량도 여기서 나온다고 본다.\u003c/p>\n\u003cp>즉 동태적 효율성은 학습하는 인간관을 &quot;시간이 지나면 더 잘한다&quot;는 명제로 구체화한 개념이며, 혁신 역량은 결국 이 동태적 효율성을 얼마나 쌓았는가의 문제다.\u003c/p>\n","2":"\u003cp>\u003cstrong>전문가 인식론\u003c/strong>은 안전(safety)을 과학적 판정의 문제로 다루지만, \u003cstrong>시민 인식론\u003c/strong>은 그 판정을 믿는 안심(assurance)의 문제를 따로 요구한다 — 안전과 안심은 다르다.\u003c/p>\n\u003cp>후쿠시마 사례에서 정부는 농산물에 대해 공식적으로 안전 판정을 내렸다. 그러나 협동조합의 엄마들은 그 판정을 그대로 받아들이지 않고 \u003cstrong>직접 방사능 검사를 했다.\u003c/strong>\u003c/p>\n\u003cp>이는 전문가가 &quot;안전하다&quot;고 말하는 것과 일반인이 &quot;안심&quot;을 느끼는 것이 서로 다른 메커니즘으로 만들어짐을 보여 준다. 전문가 인식론은 검증된 절차와 권위에 근거하지만, 시민 인식론은 스스로 확인하는 과정을 통해서만 안심이라는 결과에 도달한다.\u003c/p>\n\u003cp>교수는 이런 태도를 단순한 &#39;선동&#39;으로 치부하는 시각을 경계하며, 안심이 어떻게 만들어지는가를 물어야 한다고 강조한다. 이 사례는 이후 Scientific Citizenship(신고리 공론화)으로 이어진다.\u003c/p>\n"}},"W01/c04":{"title":"혁신 → 혁신시스템 → 시스템 혁신의 층위","en":"Innovation / Innovation System / System Innovation (Transition)","week":"W01","href":"W01.html#c04","stars":5,"byIndex":{"0":"\u003cp>혁신은 \u003cstrong>혁신\u003c/strong>(새 제품·서비스), \u003cstrong>혁신시스템\u003c/strong>(그것을 만드는 행위자 체제), \u003cstrong>시스템 혁신\u003c/strong>(생산과 소비를 아우르는 시스템 전체의 변화) 세 층위로 커진다.\u003c/p>\n\u003cp>혁신은 더 좋은 제품 하나를 만드는 층위이고, 혁신시스템은 그 제품을 만들어 내는 회사·연구소·정부·표준의 네트워크다. 시스템 혁신은 여기서 더 나아가 제품을 둘러싼 인프라·제도·습관까지 통째로 바뀌는 것을 뜻한다.\u003c/p>\n\u003cp>이 수업이 세 번째 층위에 주목하는 이유는 기후변화가 보여 주는 \u003cstrong>carbon lock-in\u003c/strong> 때문이다. 좋은 친환경 기술 하나를 만든다고 문제가 풀리지 않는다 — 시스템 자체가 화석연료에 고착되어 있어 잘 바뀌지 않는다.\u003c/p>\n\u003cp>반면 테슬라나 이를 캐치업한 BYD는 자동차 회사가 아니라 데이터·소프트웨어 중심의 \u003cstrong>테크 회사\u003c/strong>로 출발했기 때문에 내연기관 회사와 달리 이 고착에서 벗어날 수 있었다. 이처럼 기술 하나가 아니라 시스템 전체의 변화가 이 수업의 관심사다.\u003c/p>\n","1":"\u003cp>혁신시스템은 범위가 좁은 순서로 \u003cstrong>연구시스템 → 국가/산업 혁신시스템 → 사회기술시스템\u003c/strong>의 세 층위를 이룬다.\u003c/p>\n\u003cp>\u003cstrong>연구시스템\u003c/strong>은 연구자–중재/중개기관–정부(sponsor)로 이루어진 가장 좁은 시스템이다. \u003cstrong>국가/산업 혁신시스템\u003c/strong>은 기업과 그를 둘러싼 산업생태계·혁신생태계를 포함해 산업·기업 중심으로 확장된 범위다.\u003c/p>\n\u003cp>\u003cstrong>사회기술시스템\u003c/strong>은 여기서 한 단계 더 나아가 \u003cstrong>생산과 소비를 아우르는\u003c/strong> 시스템이다. 즉 국가혁신시스템이 만드는(생산) 쪽 행위자에 초점을 둔다면, 사회기술시스템은 그것을 쓰는(소비) 사용자까지 시스템의 구성원으로 포함한다는 점이 다르다.\u003c/p>\n\u003cp>이 확장은 W01/10의 &quot;구조의 차이&quot;(NIS 등)와 &quot;구조의 변화&quot;(StS 등) 구분과도 맞물리며, 소비자까지 포함해야 시스템이 실제로 바뀌는 과정을 설명할 수 있다는 이 수업의 입장을 뒷받침한다.\u003c/p>\n","2":"\u003cp>\u003cstrong>Korea Paradox\u003c/strong>란 정부·민간 R&amp;D 투자가 세계 최고 수준임에도 불구하고 그에 걸맞은 혁신 성과, 특히 &quot;우리는 왜 AI를 먼저 못 만들었을까&quot;라는 질문으로 대표되는 성과 정체가 나타나는 현상이다.\u003c/p>\n\u003cp>교수는 이 원인을 &quot;\u003cstrong>너무 정부가 중심에 서 있다\u003c/strong>&quot;는 데서 찾는다. 그 분야에 있던 사람들은 이미 가능성을 알고 있었을 텐데도 성과로 이어지지 못했다는 것이다.\u003c/p>\n\u003cp>이는 탈개발국가(post-developmental state) 논의와 연결된다. 한국은 국가가 나서서 주도하며 강한 관료 시스템을 발전시켰고, 이 \u003cstrong>탑다운\u003c/strong> 구조가 추격 단계에서는 성공의 동력이었다. 장경섭 교수가 지적하듯 이제는 이 탑다운을 어떻게 극복할 것인가, 즉 지방화·지역혁신으로의 전환이 21세기 한국의 과제로 남는다.\u003c/p>\n\u003cp>따라서 Korea Paradox는 투입의 문제가 아니라 정부 중심 구조라는 \u003cstrong>시스템의 문제\u003c/strong>로 읽어야 한다는 것이 교수의 진단이다.\u003c/p>\n"}},"W01/c05":{"title":"세 가지 고착 — 조직·기술·사용자 lock-in","en":"Lock-in — Organisational / Technological / User","week":"W01","href":"W01.html#c05","stars":5,"byIndex":{"0":"\u003cp>시스템이 잘 안 바뀌는 이유는 \u003cstrong>조직·기술·사용자\u003c/strong> 세 군데에서 동시에 고착(lock-in)되어 있기 때문이다.\u003c/p>\n\u003cp>\u003cstrong>조직 고착\u003c/strong>은 성공 공식에 갇혀 제도화된 조직 routine·inertia로 새 시도를 어렵게 만드는 것이다(Johnson 2010). \u003cstrong>개발국가 멘탈리티\u003c/strong>가 그 예다 — 정부 주도 성공 방식이 성공했기 때문에 오히려 그 틀에서 벗어나지 못한다.\u003c/p>\n\u003cp>\u003cstrong>기술 고착\u003c/strong>은 지배적 디자인이 최고가 아니어도 한 번 깔리면 바뀌지 않는 현상이다(David 1985, Arthur 1988). \u003cstrong>QWERTY 키보드\u003c/strong>가 대표 사례로, 더 나은 배열이 가능했지만 이미 익숙해진 표준을 바꿀 수 없었다.\u003c/p>\n\u003cp>\u003cstrong>사용자 고착\u003c/strong>은 소비가 기술 기반의 사회적 관습으로 내재화되는 것이다(Lim 2012). \u003cstrong>영국의 전기포트\u003c/strong>가 그 예로, 저녁 뉴스가 끝나는 시각에 모두가 차를 끓이며 전력 피크가 발생하는 것은 소비가 이미 기술에 깊이 의존함을 보여 준다.\u003c/p>\n","1":"\u003cp>기술 고착을 만드는 메커니즘은 \u003cstrong>한계 체증(increasing returns)\u003c/strong>이며, 다섯 요소가 있다: 규모의 경제(공급), 학습, 성장에 대한 기대, \u003cstrong>네트워크 경제\u003c/strong>(수요 측면 규모의 경제), 기술 연결성.\u003c/p>\n\u003cp>이 요소들은 먼저 채택된 기술일수록 더 유리해지도록 서로를 강화한다. 단가가 낮아지고(규모의 경제), 다루는 사람이 늘수록 익숙해지며(학습), 커질 거란 기대가 채택을 부르고(성장 기대), 사용자가 많을수록 가치가 커지며(네트워크 경제), 주변 기술이 거기에 맞춰 연결된다(기술 연결성).\u003c/p>\n\u003cp>그 결과 지배적 디자인을 지원하는 \u003cstrong>사회기술시스템 전체가 함께 자리 잡고\u003c/strong>, 인프라의 비용 무게(매몰비용) 때문에 더 나은 대안이 나와도 쉽게 바뀌지 않는다.\u003c/p>\n\u003cp>즉 지배적 디자인이 &quot;최고가 아니어도&quot; 유지되는 이유는 기술 자체의 우수성이 아니라, 먼저 자리 잡은 데서 오는 누적적 이점과 이미 깔린 인프라의 무게 때문이다.\u003c/p>\n","2":"\u003cp>정부 주도 R&amp;D의 기본 논리인 &quot;\u003cstrong>잘하는 애한테 몰아주면 뭔가 나온다\u003c/strong>&quot;는 추격(catch-up) 단계에서는 통했지만 프론티어에서는 통하지 않는다.\u003c/p>\n\u003cp>추격 단계에서는 따라잡아야 할 목표(선도국의 기술)가 이미 분명하므로, 자원을 검증된 소수에게 집중하는 것이 효율적이다. 한국·일본·중국의 성공이 이를 보여 준다 — 방향이 정해져 있을 때는 몰아주기가 곧 속도다.\u003c/p>\n\u003cp>그러나 프론티어에서는 가야 할 방향 자체가 정해져 있지 않다. 이때 소수에게만 자원을 몰아주는 것은 조직 고착의 국가 버전으로 작동해, 성공했던 방식을 반복하며 새로운 시도(변이, variety)의 씨앗을 없애 버린다.\u003c/p>\n\u003cp>즉 추격 단계는 고착을 활용하는 전략이 유효하지만, 프론티어에서는 고착을 깨는 다양성이 필요하다는 것이 비교의 핵심이며, 이는 세 고착을 깨기 위해 기술·사용자·시민 각각에서 새로운 변이를 만들어야 한다는 처방과 연결된다.\u003c/p>\n"}},"W01/c06":{"title":"시장 실패·시스템 실패·전환 실패","en":"Market Failure / System Failure / Transformational Failure","week":"W01","href":"W01.html#c06","stars":4,"byIndex":{"0":"\u003cp>정부가 혁신에 개입하는 근거는 \u003cstrong>시장 실패 → 시스템 실패 → 전환 실패\u003c/strong> 세 단계로 진화해 왔다.\u003c/p>\n\u003cp>\u003cstrong>시장 실패\u003c/strong>는 시장에 맡기면 지식이 공공재라 민간의 R&amp;D 투자가 과소해진다는 진단이다. \u003cstrong>시스템 실패\u003c/strong>는 돈은 있어도 행위자들 사이의 연결·제도·역량이 부족하다는 진단이다. \u003cstrong>전환 실패\u003c/strong>는 시스템이 어느 방향으로 가야 하는지, 수요는 누가 표출하는지, 정책은 조율되는지가 빠져 있다는 진단이다.\u003c/p>\n\u003cp>&quot;시스템 전환은 경제·사회·정치·문화 프로젝트&quot;라는 말은 이 중 \u003cstrong>전환 실패\u003c/strong>와 연결된다. 전환 실패가 다루는 방향성·수요 표출·조율의 문제는 기술 문제가 아니라 누가 방향을 정하고(정치), 누구의 수요를 듣고(사회·시민), 어떤 관습을 바꿀 것인가(문화)의 문제이기 때문이다.\u003c/p>\n\u003cp>그래서 시스템 전환은 단순한 R&amp;D 투자 확대로는 이루어지지 않고, 세 실패의 마지막 단계에 대한 답을 요구한다.\u003c/p>\n","1":"\u003cp>Korea Paradox는 세 실패 프레임에서 \u003cstrong>전환 실패\u003c/strong>에 해당하는 문제로 읽을 수 있다.\u003c/p>\n\u003cp>한국은 정부·민간 R&amp;D 투자가 세계 수위권으로, 시장 실패 처방(R&amp;D 투입)은 이미 충분히 이루어지고 있다. 즉 &quot;돈이 모자라서&quot; 성과가 정체된 것이 아니다.\u003c/p>\n\u003cp>교수가 W02 토론에서 남긴 말이 이를 뒷받침한다 — &quot;국가가 R&amp;D에 돈을 집어넣을 줄은 알았지, 나오는 걸 어떻게 소화할지는 어떤 생각을 갖고 있느냐.&quot; 이는 투입 이후 \u003cstrong>방향성과 조율\u003c/strong>이 빠져 있다는 지적이다.\u003c/p>\n\u003cp>타다 사례에서 보듯, 새 서비스가 나와도 국가와 자본의 조율, 가치사슬에서 누구와 편을 먹을지의 판단이 없으면 좌초한다. 정부가 너무 중심에 서 있어 방향성을 정부에만 의존하고 시민·시장의 수요 표출이 약한 구조 자체가, 전환 실패가 진단하는 방향성 실패·수요 표출 실패에 정확히 대응한다.\u003c/p>\n","2":"\u003cp>시장 실패 처방인 R&amp;D 보조금만으로는 시스템 전환이 이루어지지 않는데, 그 이유는 시스템이 조직·기술·사용자 세 군데에서 동시에 \u003cstrong>고착(lock-in)\u003c/strong>되어 있기 때문이다.\u003c/p>\n\u003cp>R&amp;D 보조금은 새로운 지식이나 기술을 만드는 투입을 늘릴 뿐, 이미 깔린 인프라의 매몰비용(기술 고착), 성공 공식에 갇힌 조직 routine(조직 고착), 습관과 네트워크에 묶인 소비 행태(사용자 고착)를 풀지는 못한다.\u003c/p>\n\u003cp>세 고착이 서로 맞물려 있으므로, 이를 깨려면 돈을 더 넣는 것이 아니라 \u003cstrong>새로운 변이(Technology / User / Citizen variety)\u003c/strong>를 만들어야 한다. 즉 다른 기술적 시도, 다른 사용 방식, 그리고 방향을 요구하는 시민이 함께 있어야 고착이 풀린다.\u003c/p>\n\u003cp>따라서 시장 실패 처방은 시스템 전환의 필요조건이지만 충분조건은 아니며, 변이를 만드는 처방(전환 실패에 대한 대응)이 함께 있어야 시스템이 실제로 바뀐다.\u003c/p>\n"}},"W01/c07":{"title":"공공가치와 Civic Actor","en":"Public Value and the Civic Actor (Craig 2012)","week":"W01","href":"W01.html#c07","stars":5,"byIndex":{"0":"\u003cp>Craig(2012)의 그림에서 \u003cstrong>기회의 평등\u003c/strong>은 키가 다른 세 사람에게 똑같은 상자를 하나씩 주는 것이고, \u003cstrong>결과의 평등\u003c/strong>은 키에 맞춰 상자를 다르게 주는 것이다. 자유시장 자본주의는 전자를 공정(fairness)으로 본다.\u003c/p>\n\u003cp>그런데 이 수업은 그 상자를 살 돈이 어디서 오는가를 묻는다. \u003cstrong>Bank of Parents\u003c/strong>가 그 답이다 — 교육·의료·주거 같은 큰 일(Big Things)은 점점 비싸져 부모의 재력이 곧 해결책이 되며, 평소엔 비슷해 보이다가도 큰 일이 닥치면 격차가 확 벌어진다.\u003c/p>\n\u003cp>\u003cstrong>지역 격차\u003c/strong> 역시 같은 구조다. 문화자본(백화점·스타벅스 유무)과 사회간접자본이 지역마다 다르면, 애초에 상자를 구할 기회 자체가 사는 곳에 따라 갈린다.\u003c/p>\n\u003cp>이런 구조적인 박스는 능력주의 논리가 전제하는 &quot;기회는 평등하다&quot;는 출발선 자체가 이미 평등하지 않음을 드러내며, 능력주의를 결과의 정당화 논리로만 쓰는 것에 문제를 제기한다.\u003c/p>\n","1":"\u003cp>\u003cstrong>Social capital\u003c/strong>이란 사람들 사이의 사회적 연대·신뢰·상호성을 가리키는 자원이다.\u003c/p>\n\u003cp>Putnam(2000)은 동네·교회 모임에서 함께 볼링 치던 사람들이 점점 혼자 치게 된 현상(Bowling Alone)을 자료로 보여 준다. Bauman(2000)은 정규직이 사라지고 사람들이 여기저기 떠다니는 \u003cstrong>액체적 근대(Liquid Modernity)\u003c/strong>가 연대·신뢰를 깎아 낸다고 본다.\u003c/p>\n\u003cp>이것이 혁신의 문제인 이유는, W01/01에서 본 대로 혁신 역시 정치·경제와 마찬가지로 \u003cstrong>collective action problem\u003c/strong>을 푸는 활동이기 때문이다. 같이 움직이는 감각, 즉 social capital이 있어야 협력이 성립하는데, 그 자원이 줄면 협력의 비용이 높아진다.\u003c/p>\n\u003cp>한국의 IMF 금 모으기나 코로나 시민 협조는 이런 social capital이 살아 있던 사례로 볼 수 있다.\u003c/p>\n","2":"\u003cp>이 수업은 사람을 가치를 창출하는 entrepreneur로만 보지 말고, 가치의 창출과 함께 그 공정성을 묻는 \u003cstrong>civic actor\u003c/strong>로도 봐야 한다고 주장한다.\u003c/p>\n\u003cp>그 근거로 든 것이 GMO와 AI 데이터센터 사례다. 유럽은 GMO를 공격적으로 반대했고, 이제는 미국에서 \u003cstrong>AI 데이터센터 반대\u003c/strong>가 번지고 있다. 두 사례 모두 새 기술이 가치를 창출한다는 기업가적 논리만으로는 설명되지 않는, 그 기술을 받아들이는 쪽의 저항이다.\u003c/p>\n\u003cp>즉 가치 창출(value creation)이 일어나도 그것이 누구에게 어떻게 돌아가는지, 그리고 그 방향에 동의하는지는 별개의 문제이며, 이를 판단하고 목소리를 내는 것이 civic actor의 역할이다.\u003c/p>\n\u003cp>이런 civic actor의 존재는 앞서 본 구조적인 박스와 social capital의 문제의식과 맞물려, 혁신을 기업가 개인의 성취가 아니라 시민이 함께 판단하는 집단적 과정으로 다시 보게 만든다.\u003c/p>\n"}},"W01/c08":{"title":"시민성 — 사회계약과 네 가지 유형","en":"Citizenship as a Social Contract — Communitarian / Scientific / Digital / Ecological","week":"W01","href":"W01.html#c08","stars":4,"byIndex":{"0":"\u003cp>\u003cstrong>공동체적 시민성(Communitarian Citizenship)\u003c/strong>이란 &quot;이 정도는 우리가 해야지&quot;라는 규범 아래, 국가 위기에 시민이 알아서 희생하는 시민성이다.\u003c/p>\n\u003cp>이는 의병 정신부터 IMF 금 모으기, 코로나 시기 마스크 착용과 자영업자의 희생까지 이어진다. Etzioni(2020)는 공동체주의적인 나라들이 팬데믹을 잘 다뤘다고 평가한다. 한국의 추격(catch-up) 성공도 국가가 부르면 뛰는 이런 집단적 협력 없이는 설명되지 않는다.\u003c/p>\n\u003cp>그런데 &quot;달라지고 있다&quot;는 것은, 정부의 부실 대응을 시민의 희생으로 메우는 방식을 이제는 반기지 않는 흐름이 생겼다는 뜻이다. &quot;잼버리를 끝으로 작별하고 싶다&quot;는 슬라이드 인용 칼럼처럼, 무조건 희생을 떠안는 시민성에 의문이 제기되고 있다.\u003c/p>\n\u003cp>그 결과로 등장하는 것이 다음에 볼 Scientific·Digital·Ecological citizenship 같은, 희생이 아니라 \u003cstrong>참여와 요구\u003c/strong>를 앞세우는 새로운 시민성이다.\u003c/p>\n","1":"\u003cp>새로운 시민성은 세 유형으로 나타난다.\u003c/p>\n\u003cp>\u003cstrong>Scientific Citizenship\u003c/strong>은 국가·전문가의 안전 판정을 그대로 믿지 않고 직접 검증에 참여하려는 시민성이다. 신고리 원전 공론화와 방폐장(지하 처분 시설) 사례가 대표적으로, &quot;안심이 안 돼, 우리가 직접 하겠어&quot;라는 태도로 요약된다.\u003c/p>\n\u003cp>\u003cstrong>Digital Citizenship\u003c/strong>은 디지털 접근 수단과 학습 기회를 요구하는 시민성이다. 어르신의 \u003cstrong>키오스크\u003c/strong> 이용 어려움이 대표 사례로, 기술을 자꾸 바꾸려면 교육 기회도 함께 제공해야 한다는 요구다.\u003c/p>\n\u003cp>\u003cstrong>Ecological Citizenship\u003c/strong>은 기술이 나아갈 방향 자체에 리밋을 요구하는 시민성이다. \u003cstrong>기온 상승에 한계선을 두어야 한다\u003c/strong>는 주장이 그 예로, 새 기술이 나올 때 어느 방향으로 갈지 말하는 시민이 등장한 것이다.\u003c/p>\n\u003cp>세 유형 모두 시민이 결과를 받아들이는 데서 그치지 않고 과정과 방향에 참여하려 한다는 공통점을 갖는다.\u003c/p>\n","2":"\u003cp>\u003cstrong>Citizen variety\u003c/strong>란 새 기술이 나올 때 그것이 어느 방향으로 가야 하는지 말하는 시민들, 즉 시민 쪽에서 나오는 다양성을 가리킨다.\u003c/p>\n\u003cp>세 가지 고착(조직·기술·사용자)은 기존 시스템의 규범·기술·행태·인지가 서로 맞물려 유지되며, 이를 깨려면 Technology variety, User variety와 함께 \u003cstrong>Citizen variety\u003c/strong>가 필요하다.\u003c/p>\n\u003cp>특히 사용자 고착은 소비가 기술 기반의 사회적 관습으로 내재화되어 개인이 스스로 벗어나기 어려운 상태다. 이때 Scientific·Digital·Ecological citizenship처럼 기존 방향에 의문을 제기하고 다른 방향을 요구하는 시민이 있어야, 고착된 관습과 규범 자체에 균열이 생긴다.\u003c/p>\n\u003cp>즉 citizen variety는 세 고착을 깨는 세 변이 중 시민이 담당하는 몫이며, 전환 실패가 지적하는 방향성 실패·수요 표출 실패에 대한 실질적 답이 된다.\u003c/p>\n"}},"W01/c09":{"title":"혁신시스템 접근법의 계보","en":"Innovation System Approaches by Disciplinary Context","week":"W01","href":"W01.html#c09","stars":4,"byIndex":{"0":"\u003cp>이 학기의 이론들은 세 개의 다른 학문 동네에서 나왔으며, 같은 &quot;시스템&quot;이라는 말을 써도 출신에 따라 강조점이 다르다.\u003c/p>\n\u003cp>\u003cstrong>Innovation Studies\u003c/strong> 맥락에는 국가혁신시스템(NIS), 부문혁신시스템(SIS), 기술혁신시스템(TIS), 사회기술시스템(StS), Social Practice approach가 속한다. 국가 → 산업 부문 → 개별 기술 → 생산+소비로 분석 단위를 넓혀 왔다.\u003c/p>\n\u003cp>\u003cstrong>Political Economy\u003c/strong> 맥락에는 생산·혁신사회시스템(SSIP)이 속한다. 노동 문제와 자본주의의 국가별 제도적 차이를 다룬다.\u003c/p>\n\u003cp>\u003cstrong>Business Studies\u003c/strong> 맥락에는 비즈니스 시스템(BS), 비즈니스모델 혁신(BMI), 혁신 Ecosystem론이 속한다. 기업의 눈에서 파이낸스와 디지털 전환, 그리고 학기의 종착점인 생태계 전략을 다룬다.\u003c/p>\n","1":"\u003cp>NIS, SIS, TIS, StS는 같은 Innovation Studies 계보 안에서 분석 단위가 점점 넓어지는 순서로 이어진다.\u003c/p>\n\u003cp>\u003cstrong>NIS(국가혁신시스템)\u003c/strong>는 혁신을 집단 행동(collective action)으로 보는 출발점으로, 분석 단위는 \u003cstrong>국가\u003c/strong>다.\u003c/p>\n\u003cp>\u003cstrong>SIS(부문혁신시스템)\u003c/strong>는 기술적 속성에 따라 산업마다 혁신 방식이 어떻게 다른지를 보므로, 분석 단위는 \u003cstrong>산업 부문\u003c/strong>이다.\u003c/p>\n\u003cp>\u003cstrong>TIS(기술혁신시스템)\u003c/strong>는 신기술 하나가 등장·도입·성숙·안정화에 이르는 동태적 과정을 보므로, 분석 단위는 \u003cstrong>개별 기술\u003c/strong>이다.\u003c/p>\n\u003cp>\u003cstrong>StS(사회기술시스템)\u003c/strong>는 소비·사용 부문까지 시스템에 포함해 기술의 특성보다 사회적 기능에 초점을 두므로, 분석 단위는 \u003cstrong>생산과 소비 전체\u003c/strong>다. 이렇게 국가에서 개별 기술로 좁아졌다가 다시 소비까지 포함하며 넓어지는 것이 이 계보의 순서다.\u003c/p>\n"}},"W01/c10":{"title":"혁신시스템 유형 3분류 — 강의 지도","en":"Innovation System Types — Difference / Change / Mechanism of Change","week":"W01","href":"W01.html#c10","stars":4,"byIndex":{"0":"\u003cp>이 학기의 이론들은 무엇을 설명하려는가에 따라 \u003cstrong>구조의 차이 / 구조의 변화 / 구조 변화의 기작\u003c/strong> 세 묶음으로 나뉜다.\u003c/p>\n\u003cp>\u003cstrong>구조의 차이\u003c/strong>에는 NIS, SIS, SSIP, BizS가 속한다. &quot;한국과 일본이 왜 다른가, 조선·자동차·전자 산업이 왜 다른가, 미국·독일·영국 시스템이 왜 다른가&quot;라는 \u003cstrong>비교\u003c/strong>의 질문에 답한다.\u003c/p>\n\u003cp>\u003cstrong>구조의 변화\u003c/strong>에는 TS, TIS, StS와 Transition 이론이 속한다. &quot;새 기술이 어떻게 자리 잡는가&quot;라는 \u003cstrong>시간에 따른 변화\u003c/strong>의 질문에 답하며, 그중 StS는 기술보다 소비에 초점을 둔다.\u003c/p>\n\u003cp>\u003cstrong>구조 변화의 기작\u003c/strong>에는 BMI, SPT, MOIP, Ecosystem이 속한다. 앞의 두 묶음보다 더 미시적으로, &quot;구체적으로 무엇이 어떻게 바뀌게 만드는가&quot;라는 \u003cstrong>개입·메커니즘\u003c/strong>의 질문에 답한다.\u003c/p>\n","1":"\u003cp>&quot;구조의 차이&quot;를 보는 이론과 &quot;구조의 변화&quot;를 보는 이론은 같은 시스템을 보더라도 \u003cstrong>비교하는가, 시간을 따라가는가\u003c/strong>에서 갈린다.\u003c/p>\n\u003cp>\u003cstrong>구조의 차이\u003c/strong>(NIS, SIS, SSIP, BizS)는 서로 다른 두 대상을 나란히 놓고 왜 다른지를 설명한다. 한국 반도체 산업을 예로 들면, &quot;왜 한국은 메모리 반도체에 특화됐는가&quot;를 묻는 것이 SIS의 질문이다 — 어느 시점의 국가·산업 간 차이를 비교하는 것이다.\u003c/p>\n\u003cp>\u003cstrong>구조의 변화\u003c/strong>(TS, TIS, StS, Transition)는 하나의 대상이 시간이 지나며 어떻게 바뀌었는지를 추적한다. 같은 반도체 사례에서 &quot;DRAM 기술이 어떻게 자리 잡았는가&quot;를 묻는 것이 TIS의 질문이다 — 하나의 기술이 등장·성숙해 가는 과정을 본다.\u003c/p>\n\u003cp>즉 전자는 지도 두 장을 펴 놓고 비교하는 작업이고, 후자는 하나의 강줄기가 100년 동안 어떻게 옮겨 갔는지 시간축을 따라가는 작업이다.\u003c/p>\n","2":"\u003cp>BMI·SPT·MOIP·Ecosystem을 &quot;구조 변화의 기작&quot;으로 묶는 이유는, 이들이 구조가 바뀐다는 \u003cstrong>사실을 설명\u003c/strong>하는 데서 그치지 않고 구체적으로 \u003cstrong>누가 어떤 수단으로 바꾸는가\u003c/strong>를 다루기 때문이다.\u003c/p>\n\u003cp>앞의 두 묶음은 각각 국가·산업 단위(거시)와 하나의 기술·시스템이 겪는 시간(중간)을 보는 \u003cstrong>설명\u003c/strong>의 언어를 쓴다.\u003c/p>\n\u003cp>반면 이 묶음은 비즈니스 모델(BMI), 일상 관습(SPT), 정책의 임무 설계(MOIP), 생태계의 병목(Ecosystem)처럼 더 구체적인 작동 지점을 보는 \u003cstrong>개입\u003c/strong>의 언어를 쓴다. Ecosystem론이 &quot;병목을 짚어 내고 파트너들을 정렬시키는 도구&quot;로 설명되는 것이 그 예다.\u003c/p>\n\u003cp>그래서 이 묶음은 &quot;펌 레벨에서 어떻게 시스템을 만들 것인가&quot;라는 이 수업의 기본 입장과 가장 가깝고, term paper에서 개입·전략을 다루려는 케이스에 적합한 틀이 된다.\u003c/p>\n"}},"W01/c11":{"title":"Innovation Ecosystem — 병목·오케스트레이터·거버넌스","en":"Innovation Ecosystem (Adner; Adner & Kapoor; Jacobides et al.; Granstrand & Holgersson)","week":"W01","href":"W01.html#c11","stars":5,"byIndex":{"0":"\u003cp>혁신생태계에서 \u003cstrong>병목(bottleneck)\u003c/strong>이란 생태계 전체의 가치 창출을 가로막는, 아직 준비되지 않았거나 통제하기 어려운 핵심 지점을 가리킨다.\u003c/p>\n\u003cp>&quot;안전이 병목이 된다&quot;는 말은, 안전 그 자체가 기술적 성능이 아니라 생태계의 진입을 좌우하는 지점이 된다는 뜻이다. 드론은 무인화가 쉽지만 사람이 탑승한 기체의 무인 이착륙은 어렵고, 자동차 FSD도 계속 안전 문제에 걸리는 것이 그 예다.\u003c/p>\n\u003cp>병목을 쥔다는 것은 단순히 부품을 만드는 것이 아니라 \u003cstrong>안전한지 아닌지를 평가할 줄 알고, 어떤 규정을 써야 할지를 아는 시스템을 갖추는 것\u003c/strong>이다. 이런 역량은 전략적 자산이기 때문에, 교수는 이런 평가·규정 시스템을 웬만하면 남에게 넘기지 말라고 조언한다.\u003c/p>\n\u003cp>그 근거는 이 역량을 외주화하는 순간 생태계에서 통제권을 잃고, 안보에 민감한 영역일수록 최고 성능이 아니어도 직접 갖고 있어야 하는 전략적 이유가 생기기 때문이다.\u003c/p>\n","1":"\u003cp>\u003cstrong>오케스트레이터\u003c/strong>가 생태계 파트너를 움직이는 방식은 \u003cstrong>위계적 강제\u003c/strong>와 \u003cstrong>자발적 정렬(voluntary alignment)\u003c/strong> 두 가지다.\u003c/p>\n\u003cp>위계적 강제는 힘이 센 쪽이 규칙을 만들어 명령하는 방식이다. 그러나 생태계의 파트너들은 각자 독립성과 자율성을 갖고 있으므로, 병목이 자기 쪽에 있지 않은 오케스트레이터는 명령할 수 없고 대신 &quot;우리 다 같이 가는 거야&quot;라는 \u003cstrong>자발적 정렬\u003c/strong>을 이끌어 내야 한다.\u003c/p>\n\u003cp>자발적 정렬에서 \u003cstrong>social capital\u003c/strong>이 중요한 이유는, 통합하지 않고도 함께 갈 수 있게 하는 힘이 바로 신뢰와 믿음이기 때문이다. &quot;같이 하자&quot;는 신뢰가 있으면 상호의존을 법정으로 가지 않고도 맞춰 나갈 수 있다.\u003c/p>\n\u003cp>애플이 안드로이드처럼 API를 열지 않고도 하드웨어를 꽉 잡은 채 생태계를 이끌 수 있었던 것도, 이미 그 생태계에 속해 있던 로열한 소비자(팬덤)라는 신뢰 자산이 있었기 때문이라는 것이 교수의 해석이다.\u003c/p>\n","2":"\u003cp>\u003cstrong>상호의존성 리스크(interdependence risk)\u003c/strong>는 파트너 각각의 성공 확률의 \u003cstrong>곱\u003c/strong>으로 커지는 리스크다. 파트너 A, B, C가 각각 성공 확률 0.8이면 전체는 0.8³ ≈ 0.51로, 파트너가 늘수록 급격히 떨어진다.\u003c/p>\n\u003cp>\u003cstrong>통합 리스크(integration risk)\u003c/strong>는 각 단계의 지연이 쌓이는, 즉 지연의 \u003cstrong>합\u003c/strong>으로 커지는 리스크다. 단계마다 2개월씩 늦어지면 3단계를 거칠 때 총 6개월이 누적된다.\u003c/p>\n\u003cp>이 차이는 자원배분에 뚜렷한 시사점을 준다. 곱셈으로 커지는 상호의존성 리스크는 \u003cstrong>약한 고리 하나를 집중 보강\u003c/strong>하는 것이 효과적이다 — 한 파트너의 실패가 전체 확률을 크게 끌어내리기 때문이다. 반면 합으로 쌓이는 통합 리스크는 \u003cstrong>단계 수를 줄이거나 병렬화\u003c/strong>하는 것이 효과적이다.\u003c/p>\n\u003cp>따라서 같은 생태계 안에서도 어떤 종류의 리스크인지에 따라 자원을 어디에 어떻게 배분할지가 달라져야 한다.\u003c/p>\n"}},"W02-1/c01":{"title":"지식의 속성 — 암묵지와 형식지","en":"Tacit and Explicit (Codified) Knowledge","week":"W02-1","href":"W02-1.html#c01","stars":5,"byIndex":{"0":"\u003cp>지식은 \u003cstrong>형식지(explicit)\u003c/strong>와 \u003cstrong>암묵지(tacit)\u003c/strong>로 나뉜다. 형식지는 책·매뉴얼처럼 밖으로 꺼내 남에게 넘길 수 있는 지식이고, 암묵지는 몸과 경험에 붙어 있어 말로 설명되지 않는 지식이다.\u003c/p>\n\u003cp>Michael Polanyi의 &quot;\u003cstrong>We know more than we can tell\u003c/strong>&quot;은 우리가 말로 옮길 수 있는 것보다 훨씬 많이 안다는 뜻이다. 전체 지식 중 일부만 말할 수 있고, 일부만 쓸 수 있고, 일부만 넘겨줄 수 있다.\u003c/p>\n\u003cp>슬라이드의 예시가 이를 보여준다. \u003cstrong>자전거 부품 설명도\u003c/strong>(형식지)를 다 외워도 자전거를 탈 수는 없고, \u003cstrong>뒤에서 잡아 주며 타 보는 것\u003c/strong>(암묵지)이 있어야 실제로 탄다. 반대로 자전거를 잘 타는 사람도 그 감각을 글로 옮기기는 어렵다.\u003c/p>\n\u003cp>이 구분은 과학기술 지식만이 아니라 사회·철학 지식에도 걸쳐 있으며, 이 경계를 넘나드는 활동 자체가 과학이라는 것이 교수의 요지다.\u003c/p>\n","1":"\u003cp>교수는 혁신을 한마디로 줄이면 &quot;\u003cstrong>해 봐야 안다\u003c/strong>&quot;라고 말했다. 혁신에서 가장 값어치 있는 지식은 텍스트로 미리 다 전달되는 형식지가 아니라, 직접 부딪혀야 몸에 쌓이는 암묵지이기 때문이다.\u003c/p>\n\u003cp>그런데 교수는 한 걸음 더 나아가 \u003cstrong>형식지조차 해 봐야 안다\u003c/strong>고 말한다. 알파폴드나 AI 같은 최신 형식지 도구도 프롬프트를 직접 써 보고 자기 것으로 만들어야 실제로 쓸 수 있다는 뜻이다. 매뉴얼을 읽는 것과 그것을 현장에 적용하는 것 사이에는 여전히 암묵지의 간극이 있다.\u003c/p>\n\u003cp>즉 형식지와 암묵지는 완전히 분리된 두 지식이 아니라, 형식지를 활용하는 능력 자체가 다시 암묵지로 축적된다는 것이다. 이것이 &quot;해 봐야 안다&quot;가 혁신 전체를 관통하는 이유다.\u003c/p>\n","2":"\u003cp>암묵지는 사람에게 붙어 있는 지식이기 때문에, \u003cstrong>그 사람이 사라지면 지식도 함께 사라진다.\u003c/strong> 숙련자가 은퇴했는데 이어받을 사람이 없으면 그 일 자체가 더 이상 존재하지 않게 된다.\u003c/p>\n\u003cp>\u003cstrong>원자력\u003c/strong>이 대표 사례다. 미국은 원자력을 처음부터 직접 만들었지만, 지금은 산업 생태계가 무너져 다시 지을 수 없다. \u003cstrong>조선\u003c/strong>도 마찬가지로, 배를 잘 만드는 나라는 이제 중국과 한국 정도만 남았다. 두 사례 모두 기술 자체가 없어진 것이 아니라, 그 기술을 몸으로 아는 사람들의 연쇄가 끊긴 것이다.\u003c/p>\n\u003cp>이는 AX(AI 전환) 시대에 특히 위험하다. 신규 직원을 뽑지 않고 자동화로 대체하면, 사람에게서 사람으로 이어지던 암묵지의 계승 고리가 끊긴다. 어프렌티스십처럼 암묵지를 이어 갈 시스템이 없으면, 자동화가 오히려 산업의 기반을 갉아먹을 수 있다.\u003c/p>\n"}},"W02-1/c02":{"title":"학습 — 지식생산의 미시적 기초","en":"Learning as the Micro-foundation of Knowledge Production","week":"W02-1","href":"W02-1.html#c02","stars":3,"byIndex":{"0":"\u003cp>학습이 지식 생산의 미시적 기초라는 말은, 새로운 지식이 \u003cstrong>혼자 머리를 쥐어짜서\u003c/strong> 나오는 것이 아니라 \u003cstrong>주고받는 상호작용(interaction)\u003c/strong>에서 나온다는 뜻이다. Lundvall의 핵심 발견이 바로 혁신이 interactive process라는 것이다.\u003c/p>\n\u003cp>강의를 듣는 것만으로는 지식이 &quot;새롭네&quot; 정도로 그친다. 그것이 진짜 자기 것이 되는 순간은 뒤풀이에서 친구가 &quot;그건 아닌 것 같은데&quot; 하고, 내가 반박하며 되받아치는 인터랙션의 순간이다.\u003c/p>\n\u003cp>이 상호작용은 질문자-응답자, 사용자-생산자, 소비자-공급자 사이에서 일상적으로 일어나며, 사실 이것이 \u003cstrong>시장에서 벌어지는 일\u003c/strong>이기도 하다. 이를 생산자-사용자 관계로 확장한 것이 국가혁신체제(NIS) 논의다.\u003c/p>\n\u003cp>즉 지식 생산의 출발점은 개인의 통찰이 아니라 관계 속의 주고받음이며, 이것이 학습을 &quot;미시적 기초&quot;라 부르는 이유다.\u003c/p>\n","1":"\u003cp>학습이 \u003cstrong>축적 행위\u003c/strong>라는 것은 세 가지 함의를 갖는다.\u003c/p>\n\u003cp>첫째, \u003cstrong>시간이 걸린다.\u003c/strong> 학습은 한 번에 되는 것이 아니라 쭉 쌓이는 것으로, &quot;만 시간의 법칙&quot;이 이를 상징한다.\u003c/p>\n\u003cp>둘째, \u003cstrong>구매만으로 역량이 되지 않는다.\u003c/strong> 기계나 인력을 사 온다고 곧바로 학습된 역량이 생기는 것은 아니다. 이는 W02-1/08의 생산 능력과 기술 역량 구분으로 곧장 이어진다.\u003c/p>\n\u003cp>셋째, \u003cstrong>unlearning(탈학습)이 어렵다.\u003c/strong> 몸에 익숙한 것은 잘 바뀌지 않기 때문에, 쌓인 학습을 버리고 새로 배우는 것이 오히려 힘든 일이 된다.\u003c/p>\n\u003cp>이 세 가지 함의는 학습이 근육처럼 시간·투자·관성을 동반하는 과정임을 보여주며, 왜 학습이 개인의 재능이 아니라 축적의 문제인지를 설명한다.\u003c/p>\n","2":"\u003cp>학습의 축적과 고착(lock-in)은 \u003cstrong>같은 메커니즘의 양면\u003c/strong>이다. 학습이 쌓인다는 것 자체가, 몸에 익은 방식에서 벗어나기 어려워진다는 것을 뜻하기 때문이다.\u003c/p>\n\u003cp>학습은 쌓일수록 더 잘하게 된다는 점에서 장점이지만, 동시에 그 쌓인 방식에 붙들려 새로운 시도를 못 하게 만든다는 점에서 단점이다. 교수는 이를 &quot;몸에 익숙한 게 잘 안 바뀐다, unlearning이 어렵다, 고착이 되는 거죠&quot;라고 정리했다.\u003c/p>\n\u003cp>이는 W01의 세 가지 고착(조직·기술·사용자) 논의와 직결된다. 학습의 축적 없이는 역량도 없지만, 그 축적이 곧 고착의 씨앗이 되는 이 긴장이 이후 STI/DUI 결합과 lock-in 돌파 논의(W02-1/12)로 이어지는 출발점이다.\u003c/p>\n"}},"W02-1/c03":{"title":"STI mode vs DUI mode","en":"Science-Technology-Innovation mode vs Doing-Using-Interacting mode (Jensen et al. 2007)","week":"W02-1","href":"W02-1.html#c03","stars":5,"byIndex":{"0":"\u003cp>STI mode(Science-Technology-Innovation)와 DUI mode(Doing-Using-Interacting)는 네 기준에서 대비된다.\u003c/p>\n\u003cp>\u003cstrong>지식 형태\u003c/strong>에서 STI는 코드화된 \u003cstrong>형식지\u003c/strong>(know-why)이고, DUI는 사람에게 체화된 \u003cstrong>암묵지\u003c/strong>(know-how)다.\u003c/p>\n\u003cp>\u003cstrong>주체\u003c/strong>는 STI가 과학자·전문가이고, DUI는 장인·엔지니어·실제 행위자다. \u003cstrong>장소\u003c/strong>는 STI가 학교·연구기관 같은 공식 기관이고, DUI는 생산현장·문제발생현장이다. \u003cstrong>학습 방식\u003c/strong>은 STI가 강의와 텍스트, 시뮬레이션과 기획 중심이고, DUI는 현장활동 중심의 &quot;해 봐야 안다&quot;다.\u003c/p>\n\u003cp>정리하면 STI는 보편적 원리 규명에, DUI는 현장 문제 해결과 비공식적 상호작용에 집중한다는 것이 Jensen et al.(2007)의 구분이다.\u003c/p>\n","1":"\u003cp>STI와 DUI는 서로 다른 종류의 혁신을 발견한다. DUI는 &quot;써 보니 문제가 있네, 어떻게 해결하지&quot;에서 출발하는 \u003cstrong>점진적(incremental)\u003c/strong> 혁신, 즉 프로세스·문제해결형 혁신을 낳는다. STI는 &quot;이런 기술이 발견됐네, 이걸로 뭘 해결하지&quot;에서 출발하는 \u003cstrong>급진적(radical)\u003c/strong> 혁신을 낳는다.\u003c/p>\n\u003cp>교수는 STI의 가장 혁혁한 모습으로 \u003cstrong>원자폭탄\u003c/strong>을 든다. 과학자에게 맡겼더니 원자를 쪼개 폭발력을 쓴다는, 현장에서는 생각도 못 할 단절적 혁신을 가져왔다는 것이다.\u003c/p>\n\u003cp>이는 우열의 문제가 아니라 \u003cstrong>다른 종류\u003c/strong>의 문제다. 현장은 발견하지 못하는 것을 연구실이 발견하고, 연구실은 발견하지 못하는 것을 현장이 발견한다는 점에서 두 모드는 상호보완적이다.\u003c/p>\n","2":"\u003cp>현장과 연구실이 계속 얘기하는 것이 중요한 이유는 \u003cstrong>전파 가능성\u003c/strong> 때문이다. 현장의 문제를 연구실이 들으면 그것을 \u003cstrong>프레임워크로 번역\u003c/strong>하게 되고, 일반화된 프레임워크는 다른 현장에도 옮겨 줄 수 있다.\u003c/p>\n\u003cp>DUI 혼자서는 그 현장에 갇힌다. 한 공장에서 애써 터득한 노하우가 다른 공장으로 이전되지 않으면, 같은 문제를 다른 곳에서 처음부터 다시 겪어야 한다.\u003c/p>\n\u003cp>STI가 이를 일반화하면 전파가 가능해지고, 전파된 곳에서 다시 새로운 문제가 발견되어 연구실로 돌아온다. 이 순환이 돌기 시작하는 것이 결합 모드의 정체다.\u003c/p>\n\u003cp>즉 DUI는 문제를 발견하고 STI는 그것을 일반화해 이전 가능하게 만든다 — 두 모드의 결합이 단순한 합 이상의 시너지를 내는 이유가 바로 이 전파 가능성에 있다.\u003c/p>\n"}},"W02-1/c04":{"title":"Jensen et al. (2007) 실증 연구 — DISKO 데이터와 4개 클러스터","en":"Empirical Evidence — DISKO data, Latent Class Analysis, Logistic Regression","week":"W02-1","href":"W02-1.html#c04","stars":4,"byIndex":{"0":"\u003cp>Jensen et al.(2007)은 DUI와 STI를 지표로 세어 측정했다. \u003cstrong>DUI 지표\u003c/strong>는 다학제 워크그룹, 품질 분임조, 제안 수집·활용 제도, 자율 작업 그룹, 부서 간 기능 통합, 직무 경계의 유연화, 고객과의 협력 등 \u003cstrong>7개 학습 조직 관행\u003c/strong>이다. \u003cstrong>STI 지표\u003c/strong>는 R&amp;D 지출 유무, 연구자와의 협력 유무, 과학기술 전공 인력 고용 등 \u003cstrong>3개 과학·기술 역량\u003c/strong>이다.\u003c/p>\n\u003cp>두 지표군의 성격은 근본적으로 다르다. DUI 지표는 모두 \u003cstrong>조직 관행(how we work)\u003c/strong>이고, STI 지표는 모두 \u003cstrong>투입 자원(what we have)\u003c/strong>이다.\u003c/p>\n\u003cp>즉 암묵지는 조직이 일하는 방식으로 측정되고, 형식지는 조직이 보유한 자원으로 측정된다는 것이 이 설계의 핵심이며, &quot;시장에서는 명시지밖에 카운팅이 안 된다&quot;는 문제에 대한 실증적 대답이다.\u003c/p>\n","1":"\u003cp>잠재집단분석(LCA)으로 덴마크 692개 기업을 4개 클러스터로 나눴다. \u003cstrong>저학습(Low-learning)\u003c/strong>이 40.5%로 DUI·STI 모두 희소하고, \u003cstrong>DUI 단독\u003c/strong>이 29.7%로 제안제도·다학제그룹 등 현장 학습이 우수하며, \u003cstrong>STI 단독\u003c/strong>이 11.0%로 R&amp;D 지출·연구자 협력이 매우 높은 반면 DUI 관행은 거의 없고, \u003cstrong>DUI/STI 결합\u003c/strong>이 18.8%로 두 모드를 높은 수준으로 함께 갖췄다.\u003c/p>\n\u003cp>신제품·신서비스 출시 성공 승산(저학습 기준 odds ratio, 무통제 모델)은 DUI 단독 2.49배, STI 단독 3.53배, \u003cstrong>DUI/STI 결합 7.84배\u003c/strong>다.\u003c/p>\n\u003cp>결합 클러스터의 승산이 단독 클러스터보다 압도적으로 높다는 것이 이 연구의 핵심 발견이며, 두 모드가 대체재가 아니라 보완재임을 보여준다.\u003c/p>\n","2":"\u003cp>통제변수(산업, 규모 등)를 반영하면 \u003cstrong>STI 단독의 승산은 3.53배에서 2.36배로 크게 감소\u003c/strong>한다. 반면 DUI 단독은 2.49배에서 2.22배로 소폭만 줄고, \u003cstrong>DUI/STI 결합은 7.84배에서도 5.06배\u003c/strong>로 여전히 강력하게 유지된다.\u003c/p>\n\u003cp>이는 \u003cstrong>STI 단독의 성과 상당 부분이 하이테크 업종이라는 특성 자체에 기인\u003c/strong>했음을 시사한다. R&amp;D 지출이 많은 기업이 원래 잘나가는 업종에 속해 있었을 뿐, STI 투자 자체의 순효과는 통념보다 작다는 것이다.\u003c/p>\n\u003cp>반면 결합 전략은 업종·규모를 감안하고도 5배 이상의 승산을 유지해 강력한 시너지를 입증한다. &quot;R&amp;D만 하면 된다&quot;는 통념을 데이터로 흔든 결과이며, W02-1/06 Lundvall의 경고와 직결되는 발견이다.\u003c/p>\n"}},"W02-1/c05":{"title":"Mokyr의 지식 프레임 — Ω와 λ","en":"Propositional (Ω) and Prescriptive (λ) Knowledge; Access Costs (Mokyr)","week":"W02-1","href":"W02-1.html#c05","stars":5,"byIndex":{"0":"\u003cp>Joel Mokyr는 지식을 둘로 나눈다. \u003cstrong>λ(람다, 처방적 지식)\u003c/strong>는 장인의 노하우, &quot;이렇게 하면 된다&quot;는 know-how이고, \u003cstrong>Ω(오메가, 명제적 지식)\u003c/strong>는 과학자의 원리 지식, &quot;왜 그렇게 되는가&quot;라는 know-why다.\u003c/p>\n\u003cp>산업혁명이 영국에서 일어난 이유는 \u003cstrong>과학자들이 장인의 노하우(λ)를 코드화(codify)\u003c/strong>해서, 그 지식을 배우는 데 드는 \u003cstrong>접근 비용(access cost)이 급격히 낮아졌기\u003c/strong> 때문이다. 옛날에는 장인의 지식을 배우려면 옆에서 오래 보고 배워야 했고 안 가르쳐 주기도 했지만, 원리가 코드화되어 책으로 남자 훨씬 적은 비용으로 배울 수 있게 됐다.\u003c/p>\n\u003cp>교수는 이를 &quot;과학자들이 얘네들의 지식을 코디파이 하니까 이걸 배우면 훨씬 코스트가 싸졌다&quot;로 요약했다. Ω와 λ의 결합이 곧 지속적 기술 진보의 시작이었다.\u003c/p>\n","1":"\u003cp>코드화(codification)는 암묵지 상태로 흩어져 있던 노하우를 \u003cstrong>명시적 원리로 정리\u003c/strong>하는 작업이다. 원리가 문서로 남으면 다음 사람은 시행착오를 반복하지 않고 그 문서를 읽는 것만으로 지식에 접근할 수 있어 \u003cstrong>접근 비용이 낮아진다.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>특허 제도\u003c/strong>도 같은 논리를 구현한다. 발명자가 기술을 코드화해 공개하는 대신, 사회는 한시적 독점을 보장해 준다. 안 가르쳐 주던 지식을 코드화해 공개하고 몇 년간 보호해 주는 거래라는 점에서, 코드화-접근비용 논리가 제도화된 형태다.\u003c/p>\n\u003cp>즉 코드화는 지식을 개인의 몸에서 떼어내 사회 전체가 공유할 수 있는 자산으로 바꾸는 장치이며, 특허는 그 과정에 대가를 지불하는 방식이다.\u003c/p>\n","2":"\u003cp>Ω/λ 구분은 형식지/암묵지, STI/DUI 구분과 \u003cstrong>일대일로 대응\u003c/strong>한다. \u003cstrong>λ(처방적 지식)\u003c/strong>는 장인의 노하우로 \u003cstrong>암묵지\u003c/strong>에, 학습 방식으로는 \u003cstrong>DUI\u003c/strong>에 대응한다. \u003cstrong>Ω(명제적 지식)\u003c/strong>는 과학자의 원리 지식으로 \u003cstrong>형식지\u003c/strong>에, 학습 방식으로는 \u003cstrong>STI\u003c/strong>에 대응한다.\u003c/p>\n\u003cp>세 구분 모두 &quot;몸에 붙은 경험적 지식&quot;과 &quot;코드화된 원리 지식&quot;이라는 같은 축을, 각기 다른 학자가 다른 맥락(경제사, 지식철학, 혁신연구)에서 재발견한 것이다.\u003c/p>\n\u003cp>이 대응 관계를 알면 산업혁명 서사(Mokyr)와 현대 기업 혁신 서사(Jensen et al.)가 결국 같은 구조를 다루고 있음이 드러나며, 이는 이 주차 전체가 하나의 프레임으로 수렴하는 이유이기도 하다.\u003c/p>\n"}},"W02-1/c06":{"title":"불만족스러운 혁신 — Lundvall의 경고","en":"Unsatisfactory Innovation (Lundvall)","week":"W02-1","href":"W02-1.html#c06","stars":5,"byIndex":{"0":"\u003cp>\u003cstrong>불만족스러운 혁신(unsatisfactory innovation)\u003c/strong>이란 현장 사용자의 맥락과 역량을 무시한 채 R&amp;D를 밀어붙여, 아무도 쓰지 않는 혁신이 빠르게 만들어지는 현상이다.\u003c/p>\n\u003cp>구조적 원인은 세 단계로 이어진다. ① \u003cstrong>생산자 지배·정보 비대칭\u003c/strong>: 생산자가 재무적·기술적 역량을 독점하고 사용자의 역량은 낮은 상태. ② \u003cstrong>기술 궤적의 괴리\u003c/strong>: 기술 혁신이 시장의 실제 니즈를 무시한 채 생산자의 R&amp;D 논리대로만 고착화됨. ③ \u003cstrong>dead end\u003c/strong>: 결국 불만족스러운 혁신에 도달.\u003c/p>\n\u003cp>슬라이드가 든 사례는 낙농 공정의 과도한 자동화다. 엔지니어링 기업이 사용자의 비용 구조와 운영 습관을 무시하고 자본집약적 설비를 공급했지만 현장에서 외면당했다. 해법은 사용자의 기술 수용성·피드백 역량을 강화해 정보 균형을 맞추는 것이다.\u003c/p>\n","1":"\u003cp>Mokyr는 지식의 코드화로 접근 비용이 낮아지는 것을 좋은 일로만 봤다(W02-1/05). 반면 Lundvall은 \u003cstrong>&quot;사용자의 수용성 변동 없이 지식 접근 비용만 낮아지는 것은 위험하다&quot;\u003c/strong>고 경고한다.\u003c/p>\n\u003cp>접근 비용이 낮아지면 새로운 기술을 훨씬 빠르고 싸게 만들 수 있다. 그런데 현장 사용자의 역량과 수용 태도가 그 속도를 따라가지 못하면, 기술은 빠르게 만들어지지만 아무도 못 쓰거나 안 쓰는 결과로 이어진다. 교수는 이를 &quot;현장 능력이 부재한 상태에서 STI를 추진하면 잘못된 수를 빨리 두게 된다&quot;고 표현했다.\u003c/p>\n\u003cp>즉 Mokyr와 Lundvall은 같은 메커니즘(코드화 → 접근비용 하락)을 반대 방향에서 본다 — 하나는 가능성으로, 하나는 위험으로.\u003c/p>\n","2":"\u003cp>Lundvall은 사용자 입장에서 기술 수용이 &quot;유용/무용&quot;이 아니라 \u003cstrong>&quot;좋다/싫다&quot;\u003c/strong>의 문제가 된다고 말한다. GMO나 AI 데이터센터처럼, 기술적으로 유용해도 사용자가 &quot;이거 싫어&quot;라고 하면 받아들여지지 않는다.\u003c/p>\n\u003cp>\u003cstrong>유럽의 에어컨 논쟁\u003c/strong>이 이를 보여준다. 원래 여름이 덥지 않던 유럽은 에어컨이 없었는데 기후변화로 폭염이 오자, 한국인은 &quot;당연히 달아야지&quot;라고 여기지만 유럽에서는 &quot;왜 달아야 하느냐&quot;는 논쟁이 벌어진다.\u003c/p>\n\u003cp>이는 라이프스타일 자체가 선택의 대상이 되고, 기술도 그 라이프스타일 안에서 선택된다는 뜻이다. 효용 계산만으로는 기술 수용을 예측할 수 없으며, 이 문제의식은 이후 사회적 실천 접근(Social Practice)의 예고편이 된다.\u003c/p>\n"}},"W02-1/c07":{"title":"사용자–생산자 상호작용과 조직화된 시장","en":"User-Producer Interaction and the Organized Market (Lundvall)","week":"W02-1","href":"W02-1.html#c07","stars":5,"byIndex":{"0":"\u003cp>\u003cstrong>순수 시장(pure market)\u003c/strong>은 신고전파 경제학이 상정하는 시장으로, \u003cstrong>가격이라는 신호만\u003c/strong> 오간다. 사용자 니즈나 기술적 가능성 같은 복잡한 암묵적 지식은 가격 하나에 담을 수 없기 때문에 전달되지 못한다.\u003c/p>\n\u003cp>반면 \u003cstrong>조직화된 시장(organized market)\u003c/strong>은 신뢰, 관행, 비공식 소통이 결합된 현실의 시장이다. 생산자와 사용자 사이에 긴밀한 정보 채널이 형성되어, &quot;이거 써 보니 여기가 불편하더라&quot; 같은 말이 오간다.\u003c/p>\n\u003cp>순수 시장에서 혁신에 필요한 지식이 전달되지 못하는 이유는, 혁신에 필요한 지식 대부분이 암묵지이고 암묵지는 가격 신호라는 단일 변수로 압축될 수 없기 때문이다. 그래서 혁신은 자판기가 아니라 단골 관계에서 나온다.\u003c/p>\n","1":"\u003cp>\u003cstrong>learning by interacting\u003c/strong>에서 생산자와 사용자는 서로 다른 것을 배운다. \u003cstrong>생산자\u003c/strong>는 사용자의 현장 병목현상을 파악하고, &#39;사용을 통한 학습(learning-by-using)&#39; 노하우를 습득하며, 공정 혁신 아이디어를 흡수한다.\u003c/p>\n\u003cp>\u003cstrong>사용자\u003c/strong>는 추상적인 기술을 구체적인 시장 가치로 변환하는 맥락(context)을 제공하면서, 동시에 새로운 장비·기술의 특성을 경험으로 습득한다.\u003c/p>\n\u003cp>즉 생산자는 사용자로부터 &quot;무엇이 문제인가&quot;를 배우고, 사용자는 생산자로부터 &quot;이 기술을 어떻게 다루는가&quot;를 배운다. 이 양방향 학습이 DUI 모드의 Interacting(I) 축을 구성하며, 혼자서는 나올 수 없는 지식이 관계 속에서 만들어진다는 것을 보여준다.\u003c/p>\n","2":"\u003cp>조직화된 시장이 불만족스러운 혁신(W02-1/06)의 처방이 되는 이유는, 불만족스러운 혁신의 구조적 원인이 바로 \u003cstrong>정보 비대칭\u003c/strong>이었기 때문이다. 생산자가 재무적·기술적 역량을 독점하고 사용자 역량이 낮을 때 기술 궤적이 시장 니즈에서 벗어난다.\u003c/p>\n\u003cp>조직화된 시장은 신뢰와 비공식 소통에 기반한 \u003cstrong>정보 채널\u003c/strong>을 만들어 이 비대칭을 메운다. 생산자는 사용자의 현장을 지속적으로 확인하고, 사용자는 기술을 이해하며 피드백할 역량을 키우게 된다.\u003c/p>\n\u003cp>즉 조직화된 시장은 현실 시장을 묘사하는 개념이자, 불만족스러운 혁신을 막기 위한 처방이기도 하다 — 사용자의 기술 수용성과 피드백 역량을 강화해 정보의 균형을 맞추는 것이 핵심이다.\u003c/p>\n"}},"W02-1/c08":{"title":"생산 능력 vs 기술 역량","en":"Production Capacity vs Technological Capabilities (Bell & Pavitt 1993)","week":"W02-1","href":"W02-1.html#c08","stars":5,"byIndex":{"0":"\u003cp>Bell &amp; Pavitt(1993)는 \u003cstrong>생산 능력\u003c/strong>과 \u003cstrong>기술 역량\u003c/strong>을 구분한다. 생산 능력은 주어진 효율 수준에서 기존 공정을 운영하고 제품을 생산하는 자원 체계로, 설비·작업 숙련·운영 노하우로 구성된다. 기술 역량은 기술적 변화를 스스로 창출·관리·대응하는 지식·숙련·경험의 체계로, 암묵지·조직적 구조·혁신 관리 능력으로 구성된다.\u003c/p>\n\u003cp>전자가 구매 가능한 이유는 설비(자본체화 기술)처럼 시장에서 쉽게 구매·이전할 수 있기 때문이다. 후자가 불가능한 이유는 \u003cstrong>의도적이고 누적적인 학습 투자(technological accumulation)\u003c/strong>로만 형성되기 때문이다 — &quot;구매만으로 역량이 안 된다&quot;(W02-1/02)는 원리가 여기서 구체화된다.\u003c/p>\n\u003cp>단순히 공장을 운영하는 능력만 쌓아서는 기술적 변화를 스스로 만들어내지 못한다는 것이 핵심이다.\u003c/p>\n","1":"\u003cp>기술 역량은 3단계로 축적된다. \u003cstrong>1단계\u003c/strong>는 운영 및 소폭 점진 개선으로, 기업은 기존 공정을 돌리며 작은 개선을 반복한다. \u003cstrong>2단계\u003c/strong>는 공정·제품의 개조 및 창의적 응용으로, 기업은 수입 기술을 자기 조건에 맞게 바꾸고 엔지니어링 역량을 축적한다. \u003cstrong>3단계\u003c/strong>는 자체 R&amp;D 및 독자 혁신 창출로, 기업은 부설 연구소를 세워 독자적인 제품 혁신을 시도한다.\u003c/p>\n\u003cp>각 단계에서 기업이 다루는 지식의 성격은 현장 노하우 중심에서 점차 자체 연구 중심으로 이동한다. 이 3단계는 W02-1/09의 후발국 역방향 궤적 3단계와 그대로 대응하는데, 두 모델이 같은 시기 같은 계보(Bell &amp; Pavitt, Linsu Kim)에서 나왔기 때문이다.\u003c/p>\n","2":"\u003cp>한국은 조선시대에 경제 개념, 즉 잉여의 축적이랄 것이 거의 없던 나라였고 상업은 격이 낮은 것으로 취급받았다. 그런 나라가 짧은 시간에 산업을 일으켰다는 사실은, Bell &amp; Pavitt와 Linsu Kim이 강조한 \u003cstrong>암묵지 축적이 산업 역량의 핵심\u003c/strong>이라는 논리를 실증적으로 보여준다.\u003c/p>\n\u003cp>즉 처음부터 뛰어난 과학자 집단이 있어서 성공한 것이 아니라, \u003cstrong>매일 열심히 일하며 현장에서 쌓은 학습\u003c/strong>이 생산 능력을 기술 역량으로 전환시켰다는 것이다.\u003c/p>\n\u003cp>이는 기술 역량이 자본이나 제도만으로 이식되지 않고, 반드시 현장의 누적적 학습을 거쳐야 형성된다는 이론의 예측과 정확히 부합하는 사례로 읽힌다. 일본처럼 개항이 이르고 경제 개념이 먼저 자리 잡은 나라의 성공보다, 아무것도 없던 나라의 성공이 이 논리를 더 강하게 증명한다.\u003c/p>\n"}},"W02-1/c09":{"title":"후발국의 역방향 기술 궤적","en":"Reverse Technological Trajectory of Latecomers","week":"W02-1","href":"W02-1.html#c09","stars":3,"byIndex":{"0":"\u003cp>선진국은 \u003cstrong>정방향 궤적\u003c/strong>을 밟는다. 기초과학·기초연구(STI, Ω)에서 출발해 응용개발과 신산업 창출을 거쳐 기술 성숙화로 내려간다. 후발국은 \u003cstrong>역방향 궤적\u003c/strong>을 밟는다. 이미 성숙한 해외 기술의 도입·복제(λ)에서 출발해 기술 공고화를 거쳐, 마지막에야 자체 R&amp;D(STI 결합)로 올라간다.\u003c/p>\n\u003cp>후발국의 3단계는 다음과 같다. \u003cstrong>1단계 성숙 기술 흡수\u003c/strong>는 자본재 수입, 역공학, 해외 OEM 구매자의 기술 지도, 현장 작업 숙련 중심으로 진행된다. \u003cstrong>2단계 기술 공고화\u003c/strong>는 수입 기술의 개조·국산화, 공정 개선, 엔지니어링 역량 축적으로, OEM에서 ODM으로 전환된다. \u003cstrong>3단계 자체 R&amp;D 및 STI 결합\u003c/strong>은 선진국의 견제와 IPR 강화에 대응해 부설 연구소를 세우고 독자적 제품 혁신에 진입하는 단계다.\u003c/p>\n\u003cp>한국은 이 역방향 경로를 그대로 밟았다.\u003c/p>\n","1":"\u003cp>역방향 궤적의 1단계에서 DUI가 중심이 되는 이유는, 이 단계에 원리(Ω)가 아니라 \u003cstrong>완제품과 현장 경험(λ)\u003c/strong>만 존재하기 때문이다.\u003c/p>\n\u003cp>\u003cstrong>역공학(reverse engineering)\u003c/strong>은 이미 만들어진 남의 제품을 뜯어 보며 작동 원리를 스스로 파악하는 과정으로, 말 그대로 해 보면서 배우는 DUI 학습이다. \u003cstrong>해외 OEM 구매자의 기술 지도\u003c/strong>는 주문자가 요구 사항을 전달하며 현장에서 직접 만드는 법을 가르쳐 주는 형태로, 역시 문서화된 이론이 아니라 현장 지도다. \u003cstrong>현장 작업 숙련\u003c/strong>은 반복 생산을 통해 몸에 붙는 지식으로, 과학적 원리 이해와 무관하게 축적된다.\u003c/p>\n\u003cp>즉 이 단계에는 아직 자체 연구 인프라(STI)가 없고, 오직 뜯어 보고 만들어 보는 경험만이 유일한 학습 경로이기 때문에 DUI가 압도적으로 중심이 된다.\u003c/p>\n"}},"W02-1/c10":{"title":"수요–공급–연계 기술정책 프레임","en":"Demand / Supply / Linkage Policy Framework (Kim & Dahlman 1992)","week":"W02-1","href":"W02-1.html#c10","stars":3,"byIndex":{"0":"\u003cp>Kim &amp; Dahlman(1992)은 정부의 기술정책을 셋으로 나눈다. \u003cstrong>수요 정책\u003c/strong>은 시장 내 기술 변화·혁신을 시도하게 만드는 시장 니즈를 창출하는 정책이고, \u003cstrong>공급 정책\u003c/strong>은 기술 역량·연구 인프라·인적 자원을 직접 강화·공급하는 정책이며, \u003cstrong>연계 정책\u003c/strong>은 수요와 공급이 유기적으로 만나도록 촉매 역할을 하는 제도다.\u003c/p>\n\u003cp>\u003cstrong>60–70년대\u003c/strong>에는 수요 측면에서 보호관세·수입 대체·수출 진흥을, 공급 측면에서 자본재 수입·KIST 설립·정규교육을, 연계 측면에서 자본재 수입 관세면제·신용을 썼다.\u003c/p>\n\u003cp>\u003cstrong>80년대\u003c/strong>에는 수요 측면에서 공공조달 사전고지·국산화 지정을, 공급 측면에서 DFI/FL 자유화·민간 R&amp;D 장려를, 연계 측면에서 R&amp;D 세제(준비금)·우대금융을 썼다. 60–70년대는 국가가 직접 만들어 주는 단계였고, 80년대는 민간이 스스로 하도록 유인하는 단계였다.\u003c/p>\n","1":"\u003cp>\u003cstrong>Embedded autonomy(배태된 자율성)\u003c/strong>는 Peter Evans가 제시한 개념으로, 국가 관료제가 산업계와 긴밀히 연결되어(embedded) 무엇이 필요한지 알면서도, 특정 기업에 포획되지 않는 자율성(autonomy)을 함께 갖춘 상태를 뜻한다.\u003c/p>\n\u003cp>한국 관료제가 사적 이익에 포획되지 않았다는 평가의 근거는, 박정희 정권의 철권통치에도 불구하고 관료들이 남미의 일부 사례처럼 딴짓을 하지 않고 \u003cstrong>철저하게 경쟁을 통해 자원을 배분\u003c/strong>했다는 점이다. IMF 이후 정경유착 문제도 있었지만, 상당 기간 공정에 대한 감수성이 높았다는 것이 교수의 평가다.\u003c/p>\n\u003cp>이는 서구가 국가를 신뢰하지 않는 것과 대비된다 — 사적 이익에 캡처된다는 것은 가장 잘하는 곳이 아니라 친분이나 뇌물에 따라 자금을 배분하는 것인데, 한국은 그렇지 않았다는 것이다.\u003c/p>\n","2":"\u003cp>정책 수단은 시기에 따라 \u003cstrong>국가가 직접 만들어 주기에서 민간이 하도록 유인하기로\u003c/strong> 이동했고, 이는 기술 역량 단계와 대응한다.\u003c/p>\n\u003cp>60–70년대의 KIST 설립·자본재 수입은 기술 역량 1단계(운영 및 소폭 개선)에 필요한 최소한의 인프라와 설비를 국가가 직접 공급하는 것에 대응한다. 이 시기 기업은 아직 스스로 연구할 역량이 없었기 때문에 국가가 그 자리를 대신 채웠다.\u003c/p>\n\u003cp>80년대의 민간 R&amp;D 장려·R&amp;D 세제는 기술 역량 2–3단계(공정 개조에서 자체 R&amp;D로)에서, 이미 역량을 쌓은 민간이 스스로 투자를 결정하도록 유인하는 방식이다. 즉 정책 수단의 변화는 기업의 역량이 성숙해감에 따라 국가의 역할이 생산자에서 촉매·설계자로 옮겨간 궤적을 보여준다.\u003c/p>\n"}},"W02-1/c11":{"title":"민간 R&D 수요 창출 4대 동인","en":"Four Determinants of Private R&D Demand in Korea","week":"W02-1","href":"W02-1.html#c11","stars":3,"byIndex":{"0":"\u003cp>민간 R&amp;D 수요를 창출한 4대 동인은 다음과 같다. ① \u003cstrong>치열한 시장 경쟁 압력과 환경 변화\u003c/strong>: 1980년대 임금 상승, 저임금 후발국의 추격, 선진국의 견제로 단순 모방 가격경쟁이 한계에 도달하며 기업이 R&amp;D로 내몰렸다. ② \u003cstrong>IPR 보호 강화를 통한 역공학 차단\u003c/strong>: 물질특허 도입 등으로 단순 역공학·모방이 불가능해지자 자체 R&amp;D 투자로 전환했다. ③ \u003cstrong>공공 조달 및 국산화 목표 지정(demand-pull)\u003c/strong>: 학교용 PC 대량 구매, 1,555개 주요 기계·부품 국산화 타겟 지정 등이 R&amp;D 수요를 만들었다. ④ \u003cstrong>연계 정책(세제·금융)의 촉매 작용\u003c/strong>: 기술개발준비금, R&amp;D 세액공제, 우대금융이 시장 수요가 형성된 상태에서 투자를 폭발시켰다.\u003c/p>\n\u003cp>①②③이 수요를 만들고, ④는 그 위에서 촉매로 작동했다.\u003c/p>\n","1":"\u003cp>공급이나 세제 지원 이전에 시장 경쟁 압력이 핵심이라는 주장의 근거는, ①②③의 동인이 먼저 기업을 &quot;혁신하지 않으면 죽는다&quot;는 상황으로 몰아넣었고, 그 이후에야 ④번 세제·금융이 그 결정을 가속하는 촉매로 작동했다는 순서에 있다.\u003c/p>\n\u003cp>세제 지원을 먼저 하면 효과가 없는 이유는, 시장의 생존 압력이 없는 상태에서는 세금 혜택만으로 기업이 굳이 위험한 R&amp;D 투자를 감행할 이유가 없기 때문이다. 세금은 깎이지만 R&amp;D는 늘지 않는 결과가 된다.\u003c/p>\n\u003cp>즉 연계 정책은 수요가 이미 형성된 상태에서 투자를 증폭시키는 도구이지, 수요 자체를 만들어내는 도구가 아니라는 것이 이 프레임의 핵심 주장이다. &quot;R&amp;D 세액공제를 늘렸는데 왜 효과가 없나&quot;라는 정책 논쟁의 답이 이 순서 착오에 있다.\u003c/p>\n","2":"\u003cp>IPR 강화가 후발국의 자체 R&amp;D를 촉발한 메커니즘은 \u003cstrong>역설적\u003c/strong>이다. 후발국 1단계(W02-1/09)의 핵심 전략은 역공학이었는데, 물질특허 같은 IPR 강화는 그 역공학의 수단 자체를 봉쇄해 버린다.\u003c/p>\n\u003cp>역공학이 막히자 기업은 시장 지분을 지키기 위해 더 이상 모방할 수 없는 상태에서 \u003cstrong>스스로 R&amp;D를 하는 것 외에 선택지가 없어졌다.\u003c/strong> 대표적으로 물질특허 도입 이후 국내 제약사들이 신약 개발로 방향을 튼 것이 이 전환을 보여준다.\u003c/p>\n\u003cp>이 패턴은 오늘날에도 반복된다. IPR 강화가 후발국을 저지하려는 의도였더라도, 결과적으로 그 국가의 독자 기술 개발을 앞당기는 촉매가 될 수 있다는 것이 이 사례가 주는 함의다.\u003c/p>\n"}},"W02-1/c12":{"title":"종합 — 지식 모드의 결합과 수요 중심 정책","en":"Synthesis — Complementary Combination of STI/DUI and Demand-oriented Policy","week":"W02-1","href":"W02-1.html#c12","stars":4,"byIndex":{"0":"\u003cp>하이테크 산업과 전통 제조업은 서로 반대 방향의 보완이 필요하다. \u003cstrong>하이테크 산업\u003c/strong>은 R&amp;D(STI)를 갖추고 있지만 현장 자율팀·부서 통합·사용자 상호작용 같은 \u003cstrong>DUI\u003c/strong>를 결합해야 한다. \u003cstrong>전통 제조업\u003c/strong>은 현장 노하우(DUI)를 갖추고 있지만 외부 과학 지식, 즉 \u003cstrong>STI\u003c/strong>를 고도화해야 한다.\u003c/p>\n\u003cp>이때 \u003cstrong>KIBS(Knowledge-Intensive Business Services, 지식집약 비즈니스 서비스)\u003c/strong>가 중요한 통로가 된다. 엔지니어링·설계·IT·컨설팅처럼 다른 기업에 지식을 공급하는 서비스업으로, 자체 R&amp;D 조직을 갖추기 어려운 중소 제조업체가 외부에서 STI를 빌려 오는 경로 역할을 한다.\u003c/p>\n\u003cp>즉 부족한 쪽 모드를 채우는 것이 결론이며, 전통 제조업에게는 KIBS 연계가 현실적인 해법으로 제시된다.\u003c/p>\n","1":"\u003cp>&quot;지식 모드의 결합&quot;과 &quot;수요 중심 정책&quot;은 결국 \u003cstrong>같은 구조를 다른 층위에서 말하는 것\u003c/strong>이다. STI만 밀어붙이면 W02-1/06의 불만족스러운 혁신이 되고, 공급 정책만 밀어붙이면 W02-1/11에서 본 것처럼 정책이 불발된다.\u003c/p>\n\u003cp>두 실패는 같은 원인에서 나온다 — \u003cstrong>&quot;쓰는 쪽을 보지 않았다&quot;\u003c/strong>는 것이다. 현장 사용자(DUI)를 보라는 요구와, 시장의 수요(demand)를 보라는 요구는 기업 층위와 정책 층위로 대상만 다를 뿐 동일한 주장이다.\u003c/p>\n\u003cp>따라서 두 결론은 이 주차 전체를 관통하는 하나의 명제 — 공급자·과학 중심의 논리만으로는 혁신이 완성되지 않으며 반드시 사용 현장과 시장의 신호로 되먹임을 받아야 한다는 것 — 의 두 표현이다.\u003c/p>\n","2":"\u003cp>DUI mode의 lock-in을 돌파하는 방안은 세 가지 이상 제시된다.\u003c/p>\n\u003cp>첫째, \u003cstrong>외부 지식 유입\u003c/strong>이다. KIBS나 연구기관과의 협력을 통해 현장 바깥의 STI를 끌어들이면, 한 현장의 경로에 갇히지 않고 새로운 프레임워크를 접할 수 있다.\u003c/p>\n\u003cp>둘째, \u003cstrong>메타 인지\u003c/strong>다. 교수는 &quot;해 봐야 아는 것만 가지고 가면 안 된다&quot;며, 현장 경험을 성찰적으로 돌아보는 능력이 필요하다고 강조했다 — 학교에 와서 배우는 이유가 바로 이 메타 인지를 얻기 위해서다.\u003c/p>\n\u003cp>셋째, \u003cstrong>조직 바깥의 태스크포스\u003c/strong>다. DARPA 방식처럼 기존 조직 내부에 계속 두지 않고 별도 조직으로 떼어 내면, 조직 관행에 붙들리지 않고 새로운 시도를 할 수 있다. 여기에 인력 순환을 더하면 lock-in을 완화하는 복수의 경로가 확보된다.\u003c/p>\n"}},"W02-2/c01":{"title":"고전적 공공재 논리와 그 한계","en":"The Classical Public Good Argument and Its Limits","week":"W02-2","href":"W02-2.html#c01","stars":2,"byIndex":{"0":"\u003cp>지식을 공공재로 보는 고전 논리는 \u003cstrong>비배제성\u003c/strong>과 \u003cstrong>비경합성\u003c/strong> 두 속성에서 출발해, 민간이 지식에 과소투자하므로 정부가 기초연구에 투자해야 한다는 정책 결론으로 이어진다.\u003c/p>\n\u003cp>\u003cstrong>비배제성\u003c/strong>(non-excludability)은 일단 공개된 지식을 다른 사람이 쓰지 못하게 막기 어렵다는 속성이다. 가로등을 세우면 지나가는 사람 모두가 그 빛을 공짜로 쓰는 것과 같은 이치다.\u003c/p>\n\u003cp>\u003cstrong>비경합성\u003c/strong>(non-rivalry)은 한 사람이 지식을 써도 다른 사람 몫이 줄지 않는다는 속성이다. 빵은 내가 먹으면 없어지지만 공식은 아무리 써도 그대로 남는다.\u003c/p>\n\u003cp>두 속성이 겹치면 기업은 기초연구에 돈을 쓸 유인이 사라지므로, \u003cstrong>Nelson(1959)\u003c/strong>과 \u003cstrong>Arrow(1962)\u003c/strong>는 정부가 대신 투자해야 한다고 정식화했다. Arrow는 여기에 지식을 팔려면 내용을 먼저 보여줘야 하는데 보여주는 순간 상대가 이미 그것을 갖게 되어 거래가 성립하지 않는다는 \u003cstrong>정보의 역설\u003c/strong>을 덧붙였다.\u003c/p>\n\u003cp>이 논리는 정부 R&amp;D 예산의 표준 근거이며, W01/06이 말하는 세 가지 실패(시장 실패 → 시스템 실패 → 전환 실패) 중 첫 단계인 시장 실패 처방에 정확히 대응한다.\u003c/p>\n","1":"\u003cp>고전 공공재 논리가 생략한 것은 \u003cstrong>지식이 실제로 쓰이기 위한 조건\u003c/strong>이다 — 지식은 공개된다고 저절로 활용되지 않는다.\u003c/p>\n\u003cp>가로등은 세우는 순간 바로 불이 켜져 누구나 그 빛을 쓸 수 있지만, 논문은 공개해도 저절로 읽히고 재현되지 않는다. 그 내용을 읽고 재현할 사람, 장비, 표준이 갖춰져 있어야 비로소 지식이 된다.\u003c/p>\n\u003cp>슬라이드의 결정적 한 줄이 이 지점을 정확히 짚는다 — \u003cstrong>&quot;그러나 이 논리는 지식이 실제로 쓰이기 위한 조건을 생략한다.&quot;\u003c/strong> 고전 논리는 공개를 종착점으로 다루지만, 실제로는 공개 이후에 재현·활용의 문제가 남는다.\u003c/p>\n\u003cp>이 빈틈이 W02-2/03의 Callon 논의로 이어지는 지점이며, 이번 강의 전체가 공공재 논리를 반박해 나가는 출발점이 된다.\u003c/p>\n","2":"\u003cp>공공재 논리는 W01/06이 제시한 세 가지 실패(시장 실패 → 시스템 실패 → 전환 실패) 중 \u003cstrong>첫 단계인 시장 실패 처방\u003c/strong>에 정확히 대응한다.\u003c/p>\n\u003cp>비배제성·비경합성 때문에 민간이 과소투자한다는 진단은 시장이 스스로 최적의 자원배분을 못 한다는 시장 실패 논리 그대로이며, 처방도 정부가 개입해 투자를 늘린다는 시장 실패 프레임의 표준 해법과 같다.\u003c/p>\n\u003cp>이 대응은 Schot &amp; Steinmueller(2018)가 정리한 세 프레임 중 \u003cstrong>Frame 1(R&amp;D 정책)\u003c/strong>에 해당하며, 공공재 논리는 그 경제학적 근거다.\u003c/p>\n\u003cp>다만 이 강의의 흐름은 공공재 논리(시장 실패)에서 멈추지 않고 시스템 실패·전환 실패로 나아가므로, 이 관계를 아는 것은 이후 SIS·TIS·전환론이 왜 시장 실패 틀을 넘어서려 하는지를 이해하는 출발점이 된다.\u003c/p>\n"}},"W02-2/c02":{"title":"Kealey의 도전 — 선형모형 뒤집기","en":"Kealey's Challenge to the Linear Model","week":"W02-2","href":"W02-2.html#c02","stars":2,"byIndex":{"0":"\u003cp>\u003cstrong>선형모형\u003c/strong>은 정부가 과학에 투자하면 기술이 발전하고 경제가 성장한다고 보지만, \u003cstrong>Kealey\u003c/strong>는 이 인과의 방향이 반대라고 반박한다.\u003c/p>\n\u003cp>선형모형에서는 정부의 과학 투자가 원인이고 경제성장이 결과다. Kealey는 반대로 \u003cstrong>성장했기 때문에 과학 활동이 늘어난 것\u003c/strong>이며, 과학에 투자해서 성장한 것은 아니라고 본다.\u003c/p>\n\u003cp>이는 &quot;헬스장이 많은 동네 사람들이 건강하다&quot;는 관찰과 같다. 선형모형식으로는 헬스장을 지으면 사람들이 건강해진다고 해석하지만, Kealey식으로는 \u003cstrong>잘사는 동네라서\u003c/strong> 헬스장도 많고 사람들도 건강한 것이다 — 헬스장은 원인이 아니라 결과다.\u003c/p>\n\u003cp>더 나아가 Kealey는 \u003cstrong>과학 지식은 사유재\u003c/strong>이며 사람들은 돈이 될 줄 알고 투자하는 것이지 남과 나눌 생각이 없다고까지 주장해, 인과 반박과 성격 반박 두 갈래로 선형모형을 공격한다.\u003c/p>\n","1":"\u003cp>Kealey의 결론은 과학이 쓸모없다는 것이 아니라, \u003cstrong>성장을 위한 투자라는 정당화의 근거가 약하다\u003c/strong>는 것이다.\u003c/p>\n\u003cp>슬라이드의 정책적 함의는 온건하다 — 지식·문화로서의 가치는 인정하되 성장 효과는 단정하지 않는다. Kealey를 반과학주의자로 요약하면 틀린 답이 된다.\u003c/p>\n\u003cp>근거는 \u003cstrong>Kealey(1996)\u003c/strong> 『The Economic Laws of Scientific Research』다. 그는 산업혁명기 영국이 정부 과학 지원 없이 기술 진보를 이뤘고, 정부 R&amp;D가 오히려 민간 R&amp;D를 밀어내는 \u003cstrong>crowding out\u003c/strong> 효과가 있다는 점을 든다.\u003c/p>\n\u003cp>즉 그의 주장은 &quot;정부 지원이 늘 무용하다&quot;가 아니라 &quot;성장 효과가 자동은 아니다&quot;로 읽는 것이 공정하다.\u003c/p>\n","2":"\u003cp>세 입장은 \u003cstrong>지식의 성격\u003c/strong>과 \u003cstrong>정부의 역할\u003c/strong>에 대한 답이 각각 다르다.\u003c/p>\n\u003cp>\u003cstrong>고전 공공재론\u003c/strong>(Arrow, Nelson)은 지식을 공공재로 보고, 시장 실패를 보정하기 위해 정부가 투자해야 한다고 본다.\u003c/p>\n\u003cp>\u003cstrong>Kealey\u003c/strong>는 지식을 \u003cstrong>사유재\u003c/strong>로 보고, 정부의 투자 근거가 약하다고 본다 — 성장이 과학을 낳는 것이지 과학이 성장을 낳는 것은 아니라는 인과 반박이 그 바탕이다.\u003c/p>\n\u003cp>\u003cstrong>Callon\u003c/strong>은 지식을 공공재도 사유재도 아닌, \u003cstrong>재현·활용·탐색의 조건에 달린 것\u003c/strong>으로 본다. 그래서 정부 역할에 대한 질문도 &quot;투자하느냐 마느냐&quot;가 아니라 &quot;그 조건을 지키느냐&quot;로 바뀐다.\u003c/p>\n\u003cp>이 자료는 결국 세 번째 입장, 즉 Callon 쪽으로 논의를 이끌어가며 Kealey를 고전 논리를 흔드는 지렛대로 배치한다.\u003c/p>\n"}},"W03/c01":{"title":"Kondratieff 장기파동과 범용기술 (GPT / GDT)","en":"Kondratieff Long Waves; General Purpose Technology / General Dimension Technology","week":"W03","href":"W03.html#c01","stars":3,"byIndex":{"0":"\u003cp>Kondratieff 장기파동은 경제가 50년 안팎의 긴 파동을 타고 움직인다는 이론이며, 그 파동을 만드는 핵심이 \u003cstrong>범용기술(GPT)\u003c/strong>이다.\u003c/p>\n\u003cp>\u003cstrong>메커니즘\u003c/strong>은 새 기술 등장 → 이득을 기대한 투자가 몰림 → 경제 활성화 → 피크 도달 → 다시 탐색이라는 순환이다. 투자자가 모두 성공하는 것은 아니지만 이 투자 몰림이 파동을 만든다.\u003c/p>\n\u003cp>\u003cstrong>GPT의 역할\u003c/strong>은 증기기관, 철도, 전기화, 자동차, 디지털처럼 모든 분야에 쓰이는 기술이 등장해 경제 전반에 영향을 주며 파동의 추진력이 되는 것이다. ICT는 온라인화와 AI로 두 차례 이 역할을 했다.\u003c/p>\n\u003cp>이 틀은 3차·4차 산업혁명 논의의 근거로 쓰이지만, 교수는 이 관점이 상당히 기술결정론적이라는 단서를 단다. 이 단서가 이 주차 전체의 구성을 예고한다.\u003c/p>\n","1":"\u003cp>GPT와 GDT는 둘 다 경제에 큰 영향을 주는 기술이지만 작동 방식이 다르다. \u003cstrong>GPT\u003c/strong>는 기존 경제 전반으로 퍼져 나가는 기술이고, \u003cstrong>GDT\u003c/strong>는 아예 독립된 차원을 새로 여는 기술이다.\u003c/p>\n\u003cp>전기나 컴퓨터, AI가 GPT의 예다. 전기가 발명되자 공장·가정·병원·교통 어디에나 들어가 기존 세계 전체가 전기를 쓰게 됐다. 기존 질서를 업그레이드하는 방식이다.\u003c/p>\n\u003cp>\u003cstrong>블록체인\u003c/strong>은 GDT의 대표 사례다. 블록체인 자체가 신뢰 구조를 새로 만들어 국경도 중앙은행도 없는 독립적 생태계를 만들어 버렸다. 교수의 말로는 &quot;새로운 독자적인, 내지는 독립적 세계를 만들 수 있다&quot;는 주장이다.\u003c/p>\n\u003cp>다만 현실에서는 국가가 스테이블코인으로 블록체인을 기존 금융 질서 안으로 포섭해, GDT가 완전히 독립적 차원으로 남지 못하고 제도가 기술을 테이크오버하는 상호구성이 나타났다.\u003c/p>\n","2":"\u003cp>GPT 논의는 모든 분야에 쓰이는 기술이 등장하면 경제 전체가 그에 따라 바뀐다고 설명하기 때문에 \u003cstrong>기술결정론적\u003c/strong>이라는 비판을 받는다. 기술이 먼저 있고 사회가 그것을 따라간다는 인과의 방향이 고정되어 있다.\u003c/p>\n\u003cp>이런 설명은 왜 좋은 기술이 현장에서 안 퍼지는지, 왜 누군가는 저항하는지를 설명하지 못한다. 기술이 등장하면 자동으로 확산된다고 가정하기 때문이다.\u003c/p>\n\u003cp>이 주차는 \u003cstrong>TEN(기술경제적 네트워크)\u003c/strong>에서 이 결정론을 교정한다. 혁신은 정해진 궤도를 따라가는 것이 아니라 과학자·엔지니어·사용자·규제자 같은 이질적 행위자들이 연합해 네트워크를 구축하는 과정이라고 본다.\u003c/p>\n\u003cp>최종적으로 W03/09의 \u003cstrong>사회·기술적 동시 형성\u003c/strong>에서 기술결정론도 사회결정론도 아닌, 기술과 사회가 번역·각인을 거치며 함께 자라난다는 종합으로 교정된다.\u003c/p>\n"}},"W03/c02":{"title":"기술경제패러다임(TEP)과 혁신의 네 층위","en":"Techno-economic Paradigm (Freeman & Perez 1988); Four Levels of Innovation","week":"W03","href":"W03.html#c02","stars":4,"byIndex":{"0":"\u003cp>기술경제패러다임(TEP)은 한 시대를 지배하는 상식의 묶음이며, 그 중심에는 값싸고 어디에나 쓰이는 \u003cstrong>핵심 요소(key factor)\u003c/strong>가 있다.\u003c/p>\n\u003cp>패러다임은 핵심 요소가 바뀔 때마다 통째로 전환됐다. 면방직의 수력, 증기력의 석탄, 중공업의 철, 대량생산의 석유, 정보통신의 반도체 칩이 차례로 그 자리를 차지했다. 핵심 요소가 바뀌면 공장 배치·조직 구조·교육·금융 관행까지 줄줄이 바뀐다.\u003c/p>\n\u003cp>지금의 핵심 요소는 반도체 칩이 아니라 \u003cstrong>GPU\u003c/strong>다. AI가 오면서 NVIDIA가 그 자리를 차지했고, 거기 들어가는 HBM 때문에 하이닉스가 따라붙었다.\u003c/p>\n\u003cp>핵심 요소를 쥔 기업이 패러다임 전체의 병목이 된다는 점에서, 이는 W01/11의 병목 개념과 겹치며 NVIDIA의 가격 결정력에 대한 구조적 설명이 된다.\u003c/p>\n","1":"\u003cp>혁신에는 네 층위가 있다. ①\u003cstrong>점진적 혁신\u003c/strong>은 기존 제품·공정의 개선이고 ②\u003cstrong>급진적 혁신\u003c/strong>은 불연속적인 새 제품·공정이며 ③\u003cstrong>기술시스템 변화\u003c/strong>는 여러 혁신이 묶여 산업 전반에 영향을 주는 것, ④\u003cstrong>기술경제패러다임 전환\u003c/strong>은 경제 전체의 상식 자체가 바뀌는 것이다.\u003c/p>\n\u003cp>&quot;우리 생산라인&quot; 비유로 보면 점진적 혁신은 \u003cstrong>DUI 스타일로 우리 생산라인에서 그대로 할 수 있는\u003c/strong> 개선이다. 급진적 혁신은 \u003cstrong>우리 생산라인에서 나오지 않는다\u003c/strong> — AI도 우리 라인이 아니라 딴 데서 온 것이다.\u003c/p>\n\u003cp>즉 점진적 혁신은 현장이 스스로 만드는 것이고 급진적 혁신은 외부에서 들어오는 것이라는 차이가 이 비유의 핵심이다.\u003c/p>\n\u003cp>이 구분은 ①과 ②가 각각 STI/DUI 학습 모드와 대응한다는 점에서 이 수업 전체의 분석 단위 지도로 쓰인다.\u003c/p>\n","2":"\u003cp>혁신의 네 층위 중 ①점진적 혁신과 ②급진적 혁신은 각각 W02-1의 \u003cstrong>DUI\u003c/strong>와 \u003cstrong>STI\u003c/strong> 학습 모드와 대응한다.\u003c/p>\n\u003cp>점진적 혁신은 &quot;DUI 스타일로 우리 생산라인에서 그대로 할 수 있다&quot;는 설명대로, 현장에서 일하며 쌓은 경험(Doing, Using, Interacting)으로 기존 공정을 조금씩 개선하는 것이다.\u003c/p>\n\u003cp>급진적 혁신은 &quot;우리 생산라인에서 안 나온다&quot;는 설명대로, 과학·기술 지식(Science, Technology, Innovation)을 외부에서 들여와 불연속적인 전환을 만드는 것이다. W02 토론에서 나온 원자폭탄 예시가 급진적 혁신의 전형이다.\u003c/p>\n\u003cp>③기술시스템 변화와 ④패러다임 전환은 이 두 학습 모드가 결합·누적되며 올라가는 상위 층위로, W02-1/12의 지식모드 결합 종합론과 같은 방향에서 읽을 수 있다.\u003c/p>\n"}},"W03/c03":{"title":"파도형 혁신 vs 동심원형 혁신","en":"Wave-type vs Concentric-circle Innovation (교수 coining)","week":"W03","href":"W03.html#c03","stars":5,"byIndex":{"0":"\u003cp>교수가 직접 만든 구분으로, 혁신에는 \u003cstrong>파도형\u003c/strong>과 \u003cstrong>동심원형\u003c/strong> 두 종류가 있다.\u003c/p>\n\u003cp>\u003cstrong>파도형 혁신\u003c/strong>은 새로운 과학기술로 원래 없던 것이 생기는 것이다. 컴퓨터, 인터넷, AI, 블록체인이 그 예로, 신산업·신성장동력에 해당하며 학습 모드로는 STI 중심이다.\u003c/p>\n\u003cp>\u003cstrong>동심원형 혁신\u003c/strong>은 기존 산업이 새 기술로 탈바꿈·업그레이드하는 것이다. 스마트 팩토리, RPA, 스마트 시티, Digital Transformation이 그 예로, 현장 학습·적용 지원이 중심이며 DUI에 STI를 결합한다.\u003c/p>\n\u003cp>비유로 파도형은 바다에 밀려오는 새 파도이고 동심원형은 잔잔한 물에 돌을 던져 중심에서 바깥으로 퍼지는 파문이다. 대부분의 조직에 필요한 것은 파도를 만드는 일이 아니라 파문을 일으키는 일이라는 것이 이 구분의 함의다.\u003c/p>\n","1":"\u003cp>이 말은 우리가 보통 혁신을 &quot;AI 만들어야 된다, 로봇 만들어야 된다&quot;는 \u003cstrong>파도형\u003c/strong>으로만 이야기하지만, 실제로 대부분의 조직에 필요한 것은 \u003cstrong>동심원형\u003c/strong>(업그레이드)이라는 함의를 담고 있다.\u003c/p>\n\u003cp>공군도 업그레이드해야 하고 석유화학도 업그레이드해야 한다. 그러나 공군이 직접 AI를 만들 일은 아니다 — 그 영역은 전문 기업의 몫이고, 공군이 할 일은 이미 있는 AI로 자기 업무를 바꾸는 것이다.\u003c/p>\n\u003cp>산업정책이 &quot;새 기술을 만드는 쪽&quot;에만 자원을 쏠리게 하면, 파도형에만 R&amp;D 자금과 인재를 몰아주고 동심원형에 필요한 현장 학습 지원·컨설팅·조직 변화 관리는 소외된다.\u003c/p>\n\u003cp>즉 이 말은 정책 자원이 두 혁신 유형에 맞게 다른 집행 방식으로 나뉘어야 한다는 것을 지적한다.\u003c/p>\n","2":"\u003cp>일본이 뒤처진 이유는 \u003cstrong>동심원형 혁신의 실패\u003c/strong>다. 일본은 자기들끼리 파고들어 점진적 혁신은 잘하지만 판을 바꾸는 일을 잘 못한다.\u003c/p>\n\u003cp>점진적 혁신(카이젠)은 기존 생산라인 안에서 조금씩 개선하는 DUI 중심 혁신으로, 일본이 세계적으로 가장 잘하는 것으로 꼽혔다. 그러나 이 강점이 오히려 \u003cstrong>업그레이드(동심원형)를 막는 고착\u003c/strong>으로 작용했다.\u003c/p>\n\u003cp>기존 방식을 점진적으로 다듬는 데 익숙해질수록 판 자체를 바꾸는 탈바꿈에는 둔감해진다. 이는 W02-1의 DUI lock-in, W01의 조직 고착이 국가 수준에서 나타난 사례로 읽을 수 있다.\u003c/p>\n\u003cp>반면 한국은 IMF라는 외부 충격으로 국가가 꽉 쥐고 있던 것을 못 쥐게 되면서 네이버·카카오 같은 동심원형 전환의 계기를 얻었다는 대비가 이 설명을 보강한다.\u003c/p>\n"}},"W03/c04":{"title":"디지털 기술혁명의 3단계","en":"Digitization / Digitalization / Digital Transformation (Savic 2019)","week":"W03","href":"W03.html#c04","stars":4,"byIndex":{"0":"\u003cp>디지털 전환은 \u003cstrong>Digitization → Digitalization → Digital Transformation\u003c/strong>의 세 단계를 거친다.\u003c/p>\n\u003cp>\u003cstrong>Digitization\u003c/strong>은 아날로그를 디지털로 바꾸는 데이터 변환 단계로, 고문서를 스캐닝하는 것이 그 예다. 종이가 파일이 된 것뿐이다.\u003c/p>\n\u003cp>\u003cstrong>Digitalization\u003c/strong>은 그 디지털 데이터로 업무를 자동화하는 정보 처리 단계로, PDF로 만들어 도서관에서 대출자에게 제공하는 것이 그 예다. 빌려주는 과정이 편해진 것이다.\u003c/p>\n\u003cp>\u003cstrong>Digital Transformation\u003c/strong>은 일하는 방식과 문화 자체가 바뀌는 지식 활용 단계로, AI가 한자 고문서를 읽어 한글로 번역하고 소설로 만들어 주는 것이 그 예다. 전에 없던 일이 비로소 가능해지며, 지금 AI가 하는 일이 바로 이 3단계라는 것이 교수의 설명이다.\u003c/p>\n","1":"\u003cp>많은 조직이 DX를 표방하면서도 \u003cstrong>Digitalization\u003c/strong>에 머무는 이유는, Digitalization은 기존 업무를 그대로 둔 채 빠르게 처리하는 것이라 조직 개편이 필요 없기 때문이다.\u003c/p>\n\u003cp>반면 Digital Transformation은 일하는 방식 자체를 바꾸므로 권한과 조직도가 흔들린다. 그래서 변화에 대한 저항이 생기고, 저항을 피하려면 자연스럽게 2단계에 머물게 된다.\u003c/p>\n\u003cp>실제로 석유화학 현장에서 24시간 모니터링하던 인력을 모델이 대체하게 되자 &quot;맞는지부터 완전 불신&quot;하는 반응이 나와 만들어 놓은 시스템이 사장된 사례가 있다. 교수는 &quot;첫 이미지가 굉장히 중요하다&quot;고 평가했다.\u003c/p>\n\u003cp>즉 DX가 2단계로 축소되는 현상은 기술 수준의 문제가 아니라 권한 구조와 저항 같은 조직 변화의 문제다.\u003c/p>\n","2":"\u003cp>교수가 제시한 \u003cstrong>DX 판별 세 기준\u003c/strong>은 ① 그 비즈니스에서 데이터가 의사결정에 얼마나 중요한가, ② 의사결정에 중요한 데이터를 모으는 시스템이 갖춰져 있는가, ③ 미션이 진짜 문제 해결인가 아니면 관리·프로세스 운영인가이다.\u003c/p>\n\u003cp>\u003cstrong>병원\u003c/strong>은 전부 데이터 사업이다. 의료 영상을 잘 읽고 편집해 주면 의사의 문제 해결에 딱 필요한 정보가 되므로 DX가 가능하다.\u003c/p>\n\u003cp>\u003cstrong>은행\u003c/strong>은 다르다. 신용도 평가에 소비 데이터를 써도 고객이 그 판단에 동의할지가 더 결정적이라 그 프로세스 자체를 받아들이지 않을 수 있어, Digitalization에서 멈출 수 있다.\u003c/p>\n\u003cp>이 기준의 핵심은 DX냐 아니냐를 기술 수준이 아니라 의사결정 구조와 미션으로 판별한다는 점이다.\u003c/p>\n"}},"W03/c05":{"title":"기술경제적 네트워크(TEN) — 세 개의 극","en":"Techno-Economic Networks (Callon) — Scientific / Technical / Market Poles","week":"W03","href":"W03.html#c05","stars":4,"byIndex":{"0":"\u003cp>Callon의 \u003cstrong>기술경제적 네트워크(TEN)\u003c/strong>는 혁신이 \u003cstrong>과학적 극·기술적 극·시장 극\u003c/strong>이라는 세 개의 극으로 이뤄진다고 본다.\u003c/p>\n\u003cp>\u003cstrong>과학적 극\u003c/strong>은 대학·연구소가 원리와 지식을 생산하는 자리다. \u003cstrong>기술적 극\u003c/strong>은 엔지니어·프로토타입이 구현과 시제품을 만드는 자리다. \u003cstrong>시장 극\u003c/strong>은 사용자·규제자가 수용과 제도화를 담당하는 자리다.\u003c/p>\n\u003cp>세 극이 모두 있어야 하고 서로 번역으로 연결되어야 혁신이 완성된다. 하나라도 비면 기술은 실험실이나 창고에 머문다.\u003c/p>\n\u003cp>&quot;정해진 궤도를 따라가는 것이 아니다&quot;라는 말은, 혁신이 미리 정해진 경로를 따라 자동으로 퍼지는 것이 아니라 현장의 이질적 행위자들이 연합해 네트워크를 구축해 가는 과정이라는 뜻이다.\u003c/p>\n","1":"\u003cp>TEP(기술경제패러다임)가 &quot;큰 흐름이 이렇게 간다&quot;는 거시 이론이라면, \u003cstrong>TEN\u003c/strong>은 &quot;그런데 현장에서는 왜 안 되지?&quot;를 보는 미시 이론이다.\u003c/p>\n\u003cp>TEP는 핵심 요소가 바뀌면 패러다임이 통째로 전환된다고 설명하지만, 정책·제도가 아무리 치밀해도 현장의 이질적 복잡성을 통제하지 못하면 혁신은 정체된다는 사실은 설명하지 못한다.\u003c/p>\n\u003cp>TEN은 범용 기술이 확산될 때 생기는 \u003cstrong>제도적 저항\u003c/strong>을 구체적으로 본다. 저항을 비합리적이라 치부하지 않고 변화에서 누가 무엇을 잃는지를 정확히 분석한다.\u003c/p>\n\u003cp>즉 TEN은 TEP의 결정론적 거시 설명에 사람·제도·사물이 뒤엉킨 현장의 저항과 복잡성이라는 미시적 보완을 더한다.\u003c/p>\n","2":"\u003cp>\u003cstrong>타다 사례\u003c/strong>는 TEN이 말하는 제도적 저항의 대표 예다. 새로운 플랫폼 기술이 등장했을 때 과학적 극·기술적 극은 준비됐지만 시장 극(기존 택시업계·규제자)의 저항으로 네트워크가 무너졌다.\u003c/p>\n\u003cp>타다는 자본과 국가의 싸움이었고, 미국 택시는 고급 서비스·한국 택시는 대중 서비스라는 부문적 성격의 충돌이 있었다.\u003c/p>\n\u003cp>TEN의 관점에서 보면 기존 택시 기사들은 생계와 면허 가치를 잃을 위험에 놓였고, 그 저항이 결국 규제라는 시장 극에서 네트워크 등록을 막았다.\u003c/p>\n\u003cp>이는 변화에는 이기는 사람과 잃는 사람이 있고, 무엇을 잃는지 구체적으로 따져 봐야 한다는 TEN의 실천적 핵심을 보여 주는 사례다.\u003c/p>\n"}},"W03/c06":{"title":"비인간의 행위성 — actant","en":"Agency of Non-humans; Actant (Actor-Network Theory)","week":"W03","href":"W03.html#c06","stars":4,"byIndex":{"0":"\u003cp>\u003cstrong>비인간의 행위성(agency)\u003c/strong>이란 기술·사물·알고리즘도 그 존재 자체로 뭔가를 한다는 뜻이다. 보통 &quot;기술은 쓰기 나름&quot;이라 생각하지만 행위자-네트워크 이론은 이를 뒤집는다.\u003c/p>\n\u003cp>교수의 \u003cstrong>반려견 비유\u003c/strong>가 이를 설명한다. 반려견을 키우면 산책 시간, 식사 시간, 여행 계획이 개에 맞춰 바뀐다. 주인이 일방적으로 명령하는 관계가 아니라 개가 내 일상을 재배치한다.\u003c/p>\n\u003cp>이처럼 기술도 스마트폰 알림이 울리면 하던 일을 멈추게 하듯 사람을 이끈다. 인간과 비인간을 구분하지 않고 네트워크 안의 동등한 \u003cstrong>작용자(actant)\u003c/strong>로 부르는 이유가 여기 있다.\u003c/p>\n\u003cp>즉 행위성은 능동적 의도가 아니라 네트워크 안에서 다른 존재의 행동을 실제로 좌우하는 힘을 가리킨다.\u003c/p>\n","1":"\u003cp>이 말은 원자력 발전이 집에서 인터넷 쓰듯 분산적으로 운영될 수 없고, 안전 규제·전문 인력·중앙 통제·보안·폐기물 관리 같은 \u003cstrong>위계적 구조를 기술 안에 이미 요구\u003c/strong>하고 있다는 뜻이다.\u003c/p>\n\u003cp>즉 &quot;원자력을 민주적으로 분산 운영하자&quot;는 기술적으로 불가능에 가깝다. 반대로 태양광은 분산형 구조와 잘 맞는다.\u003c/p>\n\u003cp>이것이 기술 선택에 주는 함의는, \u003cstrong>에너지원의 선택이 곧 사회 구조의 선택\u003c/strong>이라는 것이다. 어떤 기술을 고르느냐에 따라 그 사회가 중앙집권적이 될지 분산적이 될지가 사실상 함께 정해진다.\u003c/p>\n\u003cp>이는 Langdon Winner의 &quot;인공물은 정치를 갖는다&quot;는 주장 중에서도 본질적으로 정치적인 기술이라는 더 강한 버전에 해당한다.\u003c/p>\n","2":"\u003cp>기술에 행위성을 부여하는 ANT의 접근은 설명력이 높지만, \u003cstrong>책임의 소재를 흐린다\u003c/strong>는 비판을 받는다.\u003c/p>\n\u003cp>알고리즘이 차별적 결과를 냈을 때, 책임이 알고리즘 자체에 있는지 설계자에게 있는지가 모호해진다는 것이 그 비판이다. 좋은 것을 보고 훈련받은 알고리즘과 나쁜 것을 보고 훈련받은 알고리즘이 다르다는 점은 설계자의 역할을 완전히 지울 수 없음을 보여준다.\u003c/p>\n\u003cp>ANT는 비인간과 인간을 대칭적으로 다루며 네트워크의 \u003cstrong>작동 메커니즘\u003c/strong>을 설명하는 데는 강하지만, 규제와 처벌 같은 \u003cstrong>규범적 판단에는 약하다\u003c/strong>는 한계가 있다.\u003c/p>\n\u003cp>따라서 행위성 개념은 기술의 영향력을 드러내는 분석 도구로는 유효하되, 책임 배분은 별도의 규범적 틀로 보완해야 한다.\u003c/p>\n"}},"W03/c07":{"title":"번역과 스크립트","en":"Translation and Script (Inscription)","week":"W03","href":"W03.html#c07","stars":3,"byIndex":{"0":"\u003cp>\u003cstrong>스크립트\u003c/strong>는 기술 안에 이미 쓰여 있는 대본이다. 어떤 기술을 쓰려면 사용자가 이렇게 행동하고, 제도가 이렇게 바뀌고, 다른 사물이 이렇게 배치되어야 한다는 지시가 설계 단계부터 새겨져 있다.\u003c/p>\n\u003cp>새 기술이 등장했을 때 사람들 마음대로 되는 게 아니라, 그것을 쓰려면 어쩔 수 없이 따라야 하는 것들이 있다는 것이 이 개념의 핵심이다.\u003c/p>\n\u003cp>&quot;기술 선택이 곧 사회 네트워크 설계&quot;라는 말은, 어떤 기술을 채택하면 그에 맞는 사회 구조가 따라오므로 기술을 고르는 일이 사실상 사회를 고르는 일이 된다는 뜻이다.\u003c/p>\n\u003cp>따라서 기술 선택은 중립적 공학 결정이 아니라 설계된 정치적 선택이 된다.\u003c/p>\n","1":"\u003cp>전기차 확산은 엔진을 배터리로 바꾸는 선형적 과정이 아니라, \u003cstrong>번역\u003c/strong>을 통해 여러 작용자를 네트워크에 \u003cstrong>등록\u003c/strong>시켜야 하는 과정이다.\u003c/p>\n\u003cp>테슬라가 차를 많이 팔아도 충전망, 보조금, 배출가스 규제 같은 국가적 제도 조정이 함께 와야 한다. 충전 플러그 규격, 배터리 화학물질, 국가 전력망, 주행 습관, 보조금 정책 같은 비인간 작용자들이 인간과 동등하게 네트워크에 등록되어야 비로소 자동차가 작동한다.\u003c/p>\n\u003cp>배터리 기술은 오래전에 준비됐는데도 보급이 더뎠던 이유는 충전 규격 전쟁, 아파트 주차장 설치 갈등, 전력망 부하, 주행거리 불안처럼 다른 노드들에 있었다.\u003c/p>\n\u003cp>하나의 노드라도 번역에 실패하면 네트워크는 붕괴한다는 것이 이 사례의 핵심이다.\u003c/p>\n","2":"\u003cp>두 틀은 모두 \u003cstrong>파트너 중 하나라도 실패하면 전체가 실패한다\u003c/strong>는 점에서 같은 현상을 가리킨다. ANT의 번역 실패는 하나의 노드라도 네트워크 등록에 실패하면 전체 네트워크가 붕괴한다고 설명하고, Adner의 상호의존성 리스크는 이를 확률의 곱으로 정식화해 파트너가 많을수록 전체 성공 확률이 낮아진다고 본다.\u003c/p>\n\u003cp>차이는 다루는 행위자의 범위다. Adner의 틀은 주로 기업·파트너 같은 \u003cstrong>인간 행위자\u003c/strong>들의 조율을 본다.\u003c/p>\n\u003cp>반면 ANT는 충전 규격·전력망·주행 습관 같은 \u003cstrong>비인간 작용자까지 노드로 센다\u003c/strong>는 점에서 더 넓다.\u003c/p>\n\u003cp>따라서 ANT는 Adner의 상호의존성 리스크를 비인간까지 포함해 확장한 버전으로 읽을 수 있다.\u003c/p>\n"}},"W03/c08":{"title":"구성적 기술평가(CTA)","en":"Constructive Technology Assessment","week":"W03","href":"W03.html#c08","stars":3,"byIndex":{"0":"\u003cp>\u003cstrong>구성적 기술평가(CTA)\u003c/strong>는 기술이 다 만들어진 뒤 평가하는 것이 아니라 개발 과정 안으로 사회적 고려를 미리 집어넣는 접근으로, 세 가지 개입 전략을 쓴다.\u003c/p>\n\u003cp>① \u003cstrong>변이 창출\u003c/strong>은 대안적 기술 네트워크 형성을 촉진해 하나의 경로만 남지 않도록 대안을 복수로 키우는 것이다.\u003c/p>\n\u003cp>② \u003cstrong>선택 환경 수정\u003c/strong>은 보조금·세제·규제로 외부 조건을 재구성해 어떤 기술이 살아남을지를 결정하는 운동장의 기울기를 바꾸는 것이다.\u003c/p>\n\u003cp>③ \u003cstrong>기술적 넥서스 활용\u003c/strong>은 미시 개발자와 거시 규제자를 잇는 번역자를 배치하는 것이다. ①②는 진화론의 변이와 선택 구조를 그대로 가져온 것으로, W01의 &quot;고착을 깨려면 새로운 변이를 만들어야 한다&quot;는 논리와 같다.\u003c/p>\n","1":"\u003cp>이 평가는 CTA가 \u003cstrong>규범적으로 옳지만 속도의 대가를 치른다\u003c/strong>는 함의를 담고 있다. 프랑스 환경청의 가정 폐기물 처리 R&amp;D 프로젝트처럼 사용자·지자체·법규가 함께 준비되도록 사회적 합의를 충분히 거치면, 그 과정에서 기술 자체의 진도는 느려진다.\u003c/p>\n\u003cp>그러는 사이 사회적 합의 절차가 상대적으로 약한 미국·중국 같은 경쟁자가 먼저 시장을 가져가 버렸다는 것이 교수의 냉정한 진단이다.\u003c/p>\n\u003cp>이는 혁신 거버넌스의 근본 딜레마를 보여준다. 기술이 초기에는 바꾸기 쉽지만 영향을 알 수 없고, 영향이 드러날 때쯤에는 이미 고착되어 바꾸기 어렵다는 Collingridge 딜레마가 그 배경이다.\u003c/p>\n\u003cp>따라서 CTA는 완벽한 예측이 아니라 계속 피드백을 받으며 방향을 트는 학습과 조정으로 이 딜레마에 대응해야 한다.\u003c/p>\n","2":"\u003cp>CTA와 혁신 공유지는 모두 \u003cstrong>기술 발전의 초기 단계에 개입한다\u003c/strong>는 문제의식을 공유하지만, 개입의 주체가 다르다.\u003c/p>\n\u003cp>CTA는 \u003cstrong>위로부터의 설계\u003c/strong>다. 정부나 평가 기구가 대안을 만들고(변이 창출) 선택 환경을 바꾸며(보조금·세제·규제) 넥서스를 배치해 기술 경로를 조정한다.\u003c/p>\n\u003cp>Potts의 혁신 공유지는 \u003cstrong>아래로부터의 자발적 거버넌스\u003c/strong>다. 참여자들이 스스로 정보를 풀링하고 무임승차를 막는 규칙을 직접 만들어 간다.\u003c/p>\n\u003cp>따라서 둘은 같은 문제, 즉 기술이 사회적으로 받아들여지는 경로를 어떻게 조정할지를 각각 하향식 제도 설계와 상향식 자발적 협력이라는 다른 방향에서 풀려는 시도로 대비된다.\u003c/p>\n"}},"W03/c09":{"title":"TEP vs TEN과 사회–기술적 동시 형성","en":"TEP vs TEN; Socio-technical Co-construction","week":"W03","href":"W03.html#c09","stars":5,"byIndex":{"0":"\u003cp>\u003cstrong>TEP\u003c/strong>와 \u003cstrong>TEN\u003c/strong>은 네 차원에서 대비된다.\u003c/p>\n\u003cp>기원에서 TEP는 \u003cstrong>진화경제학과 마르크스 정치경제학\u003c/strong>에서, TEN은 \u003cstrong>기술사회학(ANT)\u003c/strong>에서 나왔다.\u003c/p>\n\u003cp>포커스에서 TEP는 범용 기술의 \u003cstrong>장기 확산 패턴\u003c/strong>을, TEN은 개별 혁신의 \u003cstrong>발현과 국지적 안정화\u003c/strong>를 본다.\u003c/p>\n\u003cp>행위자에서 TEP는 혁신 기업과 거대 국가 제도를, TEN은 인간과 비인간이 혼재된 이질적 연결망을 본다.\u003c/p>\n\u003cp>맹점에서 TEP는 현장의 유연성 결여라는 \u003cstrong>결정론적 함정\u003c/strong>에 빠지고, TEN은 거시적 방향성 부재라는 \u003cstrong>지나친 미시성\u003c/strong>에 빠진다. 이 맹점이 서로를 보완해야 하는 이유다.\u003c/p>\n","1":"\u003cp>\u003cstrong>사회·기술적 동시 형성(co-construction)\u003c/strong>은 기술이 사회를 일방적으로 결정하는 것도, 사회가 기술을 마음대로 빚어내는 것도 아니라는 입장이다.\u003c/p>\n\u003cp>\u003cstrong>기술결정론\u003c/strong>은 기술이 사회를 바꾼다고 보지만 인간의 선택 여지를 지운다. GPT·TEP 논의가 빠지기 쉬운 함정이다.\u003c/p>\n\u003cp>\u003cstrong>사회결정론\u003c/strong>은 사회가 기술을 만든다고 보지만 비인간의 행위성 같은 기술의 물질적 제약을 무시한다.\u003c/p>\n\u003cp>동시 형성은 기술적 제약과 사회적 가치가 끊임없이 서로를 \u003cstrong>번역(translation)\u003c/strong>하고 \u003cstrong>각인(inscription)\u003c/strong>하며 함께 자라난다고 본다. 성공적이고 지속가능한 혁신은 이 두 극단 사이의 상호작용의 결과물이라는 것이 이 개념의 핵심이다.\u003c/p>\n","2":"\u003cp>수업노트가 직접 명시하듯, 이 구도는 \u003cstrong>같은 주장의 두 버전\u003c/strong>이다.\u003c/p>\n\u003cp>Geels(2004)는 규칙·제도, 인간·조직, 사회기술시스템이라는 세 축이 서로를 구성한다고 본다. ANT의 동시 형성은 과학적 극·기술적 극·시장 극과 비인간 작용자들이 기술과 사회를 함께 형성한다고 본다.\u003c/p>\n\u003cp>두 틀의 강조점은 다르다. Geels는 \u003cstrong>구조\u003c/strong>, 즉 어떤 관계들이 있는지를 본다. ANT는 \u003cstrong>과정\u003c/strong>, 즉 번역·등록을 통해 어떻게 연결되는지를 본다.\u003c/p>\n\u003cp>따라서 두 틀을 비교할 때는 &quot;같은 주장의 두 버전이되 하나는 구조를, 하나는 과정을 강조한다&quot;고 쓰는 것이 정확하며, 이는 W09의 다층적 관점(MLP)에서 하나의 모형으로 통합된다.\u003c/p>\n"}},"W03/c10":{"title":"Adam Smith — 분업과 생산성","en":"Adam Smith — Division of Labour and Productivity","week":"W03","href":"W03.html#c10","stars":4,"byIndex":{"0":"\u003cp>Smith의 답은 \u003cstrong>분업(division of labour)\u003c/strong>이 경제 성장의 핵심이라는 것이다.\u003c/p>\n\u003cp>일을 나누면 생산성이 오르고, 생산성이 오르면 싸게 팔 수 있고, 싸지면 시장이 커지고, 시장이 커지면 다시 더 나눌 수 있다. 분업 → 생산성 향상 → 더 싸게 판매 → 시장 확대 → 다시 더 싸게라는 선순환이다.\u003c/p>\n\u003cp>핀 공장 사례에서 혼자 만들면 하루 20개도 못 만들지만 18개 공정으로 나누면 10명이 48,000개를 만든다. Smith는 분업의 효과로 숙련 향상, 전환 시간 절약, 기계 발명(혁신) 세 가지를 꼽았다.\u003c/p>\n\u003cp>다만 이 선순환은 \u003cstrong>시장의 크기(extent of the market)\u003c/strong>에 의해 제한된다는 한계가 있다는 점도 함께 기억해야 한다.\u003c/p>\n","1":"\u003cp>교수는 1776년 국부론에 이미 DUI와 STI 두 학습 모드가 다 들어 있다고 강조한다.\u003c/p>\n\u003cp>\u003cstrong>DUI\u003c/strong>는 &quot;하다 보면 요령이 생긴다&quot;는 것으로, 증기기관의 밸브에 끈을 묶어 자동화한 \u003cstrong>소년의 일화\u003c/strong>가 그 예다. 직접 일하는 사람이 반복 속에서 효율화 방법을 발견하는 현장 학습이다.\u003c/p>\n\u003cp>\u003cstrong>STI\u003c/strong>는 직접 생산하지 않고 모든 것을 관찰하며 서로 멀리 떨어진 이질적 지식을 결합하는 \u003cstrong>사색가·철학자\u003c/strong>의 역할로 나타난다.\u003c/p>\n\u003cp>즉 Jensen et al.(2007)이 발견한 두 학습 모드의 구분을, Smith는 이미 1776년에 서술했다는 것이 이 말의 의미이며, 다시 발견된 것에 가깝다는 평가다.\u003c/p>\n","2":"\u003cp>Smith의 명제는 분업을 고도화하려면 그만큼 큰 시장이 있어야 한다는 것이다. 작은 마을에는 전문 대장장이가 없고 잡화상만 있는 것이 그 예다.\u003c/p>\n\u003cp>이는 W02-1의 &quot;시장이 없으면 못 한다&quot;는 지적과 같은 논리다. 내수 시장이 작은 나라는 수출로 시장을 키워야 분업을 고도화할 수 있다.\u003c/p>\n\u003cp>한국의 추격형 R&amp;D가 바로 이 논리였다. 냉전 맥락에서 미국이 시장을 잡아 줬고, 가치와 제품 목표가 이미 알려진 반도체·디스플레이 영역에서 우수 주체에 자원을 집적해 분업을 고도화하고 규모의 경제를 만든 것이 20세기 한국이 한 일이다.\u003c/p>\n\u003cp>지금은 그 시장 접근 자체가 막히는 국면이라는 것이 이 명제가 현재 한국에 주는 함의다.\u003c/p>\n"}},"W03/c11":{"title":"Hayek — 분산된 지식과 발견 절차로서의 경쟁","en":"Dispersed Knowledge; Competition as a Discovery Procedure","week":"W03","href":"W03.html#c11","stars":5,"byIndex":{"0":"\u003cp>Hayek는 경쟁을 승자를 가리는 \u003cstrong>선별 장치\u003c/strong>가 아니라 아무도 모르는 것을 찾아내는 \u003cstrong>탐색 장치\u003c/strong>로 본다. 이것이 &quot;\u003cstrong>발견 절차로서의 경쟁\u003c/strong>&quot;이다.\u003c/p>\n\u003cp>&quot;누가 이길지 알기에 경쟁하는 것이 아니라 모르기 때문에 경쟁하는 것이다&quot;라는 명제는, 결과를 미리 알면 경쟁할 이유가 없다는 뜻이다. 모르기 때문에 여러 시도를 해 보는 것이고, 그 과정 자체가 지식을 만든다.\u003c/p>\n\u003cp>가격은 이미 세팅된 것이 아니라 주고받으면서 형성되므로, 제대로 된 가격과 방식을 찾아가는 과정이 곧 발견이며 시장의 모든 플레이어와 소통해야 한다.\u003c/p>\n\u003cp>이 논리는 누가 이길지 미리 알 수 있다면 경쟁이 낭비지만, 알 수 없으므로 국가가 미리 지정하는 것은 오류라는 결론으로 이어진다.\u003c/p>\n","1":"\u003cp>\u003cstrong>중앙계획가 모델\u003c/strong>과 \u003cstrong>하이에크적 시장\u003c/strong>은 세 차원에서 대비된다.\u003c/p>\n\u003cp>지식의 성격·위치에서 중앙계획가 모델은 통계화·중앙 집계가 가능한 정형 지식을 가정해 상부 평가위원회가 기술 가치를 안다고 본다. 하이에크적 시장은 특정 시공간의 구체적·파편화된 \u003cstrong>man on the spot\u003c/strong> 지식을 전제해 본질적으로 중앙 집계가 불가능하다고 본다.\u003c/p>\n\u003cp>핵심 문제에서 전자는 주어진 예산을 누구에게 줄지의 \u003cstrong>자원 배분 문제\u003c/strong>이고, 후자는 사전에 알 수 없는 기술 가치와 시장 기회를 찾는 \u003cstrong>지식 발견·조정 문제\u003c/strong>다.\u003c/p>\n\u003cp>작동 방식에서 전자는 탑다운 기술 지정과 서류 심사로 \u003cstrong>감사 회피를 위한 안전한 성공 과제 쏠림\u003c/strong>을 낳고, 후자는 가격 신호와 경쟁으로 미지의 사실을 발견한다.\u003c/p>\n","2":"\u003cp>Hayek와 Lundvall은 시장을 다르게 본다.\u003c/p>\n\u003cp>\u003cstrong>Hayek\u003c/strong>는 가격이 방대한 정보를 한 숫자로 압축해 전달한다고 본다. 주석 가격이 오르면 왜 올랐는지 몰라도 전 세계 사용자가 절약하거나 대체재를 찾는다는 식으로, \u003cstrong>가격 신호만으로도\u003c/strong> 분산된 지식이 조정된다는 입장이다.\u003c/p>\n\u003cp>\u003cstrong>Lundvall\u003c/strong>은 이와 달리 순수 시장은 가격 신호만으로는 부족하다고 본다. 사용자와 생산자가 직접 상호작용하며 조직화되어야 혁신에 필요한 암묵적 정보까지 전달된다는 \u003cstrong>조직화된 시장\u003c/strong>을 강조한다.\u003c/p>\n\u003cp>즉 Hayek는 가격이 많은 것을 전달한다고 보고, Lundvall은 가격만으로는 부족해 사용자·생산자 간의 직접적 상호작용이 더해져야 한다고 본다는 점이 둘의 핵심 차이다.\u003c/p>\n"}},"W03/c12":{"title":"Ostrom의 공유지와 Potts의 혁신 공유지 (Phase 0)","en":"Commons (Ostrom); Innovation Commons (Potts) — Phase 0","week":"W03","href":"W03.html#c12","stars":5,"byIndex":{"0":"\u003cp>\u003cstrong>혁신 공유지(Innovation Commons)\u003c/strong>는 기업과 시장이 형성되기 이전, 극심한 불확실성 속에서 사람들이 정보를 모아 기회의 윤곽을 그리는 단계다.\u003c/p>\n\u003cp>Hayek는 가격을 찾기 위해 소통해야 한다고 했다. Potts는 묻는다 — \u003cstrong>그 가격조차 매길 수 없을 때\u003c/strong>는 어떻게 하는가. 경쟁할 수 없으므로 이때는 모여서 얘기하는 것이다.\u003c/p>\n\u003cp>핵심 문장은 &quot;혁신의 진정한 기원은 기업가의 상상력이 아니라, 기업가가 기회를 발견할 수 있도록 정보를 풀링하는 공유지의 창출에 있다&quot;는 것이다.\u003c/p>\n\u003cp>즉 혁신 공유지는 Hayek의 발견 절차보다 한 단계 앞선, 경쟁조차 불가능한 단계에서의 협력적 발견을 설명하는 개념이다.\u003c/p>\n","1":"\u003cp>\u003cstrong>Phase 0\u003c/strong>의 세 요소는 극단적 불확실성, 정보의 풀링, 자발적 협력 제도다.\u003c/p>\n\u003cp>\u003cstrong>극단적 불확실성\u003c/strong>은 가격 신호조차 없는 상태에서의 맹목적 지식 탐색을 뜻한다.\u003c/p>\n\u003cp>\u003cstrong>정보의 풀링(pooling)\u003c/strong>은 파편화된 지식을 무상으로 공유해 기업가적 기회의 윤곽을 구체화하는 것이다. 홈브루 컴퓨터 클럽처럼 칩을 가져와 &quot;이걸로 뭐가 되지?&quot; 하며 사람들이 모여서 해 본 것이 그 예다.\u003c/p>\n\u003cp>\u003cstrong>자발적 협력 제도\u003c/strong>는 시장이 아니라 애호가·연구자·개발자 커뮤니티 형태의 집합적 행동이다. 이때 무임승차와 기회주의 문제가 생기므로 거버넌스 규칙이 필요해지는데, 규칙이 먼저 있어서 공유가 되는 게 아니라 공유하려다 보니 규칙이 필요해진다는 순서가 중요하다.\u003c/p>\n","2":"\u003cp>\u003cstrong>공유지의 비극\u003c/strong>은 주인 없는 목초지에서 소를 마음대로 방목하게 했더니 목초지가 망가졌다는 가설이다.\u003c/p>\n\u003cp>Elinor Ostrom은 반드시 그렇지는 않다고 반박했다. 사람들이 규칙을 정해 관리하더라는 것이다. 한국의 두레·향약이 마을 관개 수로를 공동 관리한 것처럼, 스스로 만든 규칙으로 공유자원을 장기간 유지한 사례가 많다.\u003c/p>\n\u003cp>다만 이런 규칙이 세지면 대단히 배타적이 되기도 한다는 단서가 따라온다.\u003c/p>\n\u003cp>Ostrom과 제자 Charlotte Hess가 이를 자연자원을 넘어 지식 공유지(knowledge commons)로 확장했고, Potts가 여기에 Hayek의 발견 절차 논의를 결합해 \u003cstrong>혁신 공유지\u003c/strong>라는 이름을 붙이며 혁신 논의로 확장됐다.\u003c/p>\n"}},"W03/c13":{"title":"시장 실패 vs 발견 실패","en":"Market Failure vs Discovery Failure","week":"W03","href":"W03.html#c13","stars":5,"byIndex":{"0":"\u003cp>\u003cstrong>시장 실패\u003c/strong>와 \u003cstrong>발견 실패\u003c/strong>는 네 차원에서 대비된다.\u003c/p>\n\u003cp>발생 원인에서 시장 실패는 고정비용·모방·취약한 투자 인센티브에서 오고, 발견 실패는 \u003cstrong>불확실성과 분산된 지식\u003c/strong>에서 온다.\u003c/p>\n\u003cp>희소 자원에서 시장 실패는 자본이 희소하다고 보고, 발견 실패는 \u003cstrong>신기술 기회에 대한 정보\u003c/strong>가 희소하다고 본다.\u003c/p>\n\u003cp>경제 문제 종류에서 시장 실패는 \u003cstrong>배분/할당(allocation)\u003c/strong> 문제, 즉 누구에게 얼마를 줄지의 문제이고, 발견 실패는 \u003cstrong>조정(coordination)\u003c/strong> 문제, 즉 누가 무엇을 아는지 모르는 상태에서 서로 맞추는 문제다.\u003c/p>\n\u003cp>해법에서 시장 실패는 혁신정책·지출(투자)을, 발견 실패는 \u003cstrong>제도·거버넌스\u003c/strong>를 요구한다.\u003c/p>\n","1":"\u003cp>이 주장의 근거는, 기존 패러다임이 지식에 스필오버가 있어 투자해 봤자 옆으로 새니까 민간이 투자를 안 한다는 \u003cstrong>시장 실패\u003c/strong> 진단에 있었지만, Potts의 새 패러다임은 문제가 돈이 아니라 \u003cstrong>뭘 해야 할지 모른다는 것\u003c/strong>, 즉 발견 실패라고 재진단한다는 데 있다.\u003c/p>\n\u003cp>따라서 국가가 생산 비용을 보조해도 어디를 파야 할지 모르면 삽만 늘어날 뿐 소용이 없다.\u003c/p>\n\u003cp>구체적 정책 방향은 국가가 \u003cstrong>시장을 만들어주든지, 아니면 협력할 수 있는 시스템을 만들어 주든지\u003c/strong> 하는 것, 즉 커먼즈의 구성과 운영을 지원해 발견 비용을 줄이는 일이다.\u003c/p>\n\u003cp>이는 심사·평가·선정 중심의 picking winners에서 규칙·플랫폼·신뢰를 설계하는 거버넌스 중심으로 정책의 성격 자체를 바꾸라는 요구다.\u003c/p>\n","2":"\u003cp>W01의 \u003cstrong>시장 실패·시스템 실패·전환 실패\u003c/strong>는 혁신정책 정당화 논거가 역사적으로 확장되어 온 계보이며, &quot;어디로 갈지&quot;의 문제, 즉 방향성·수요 표출·조율·성찰의 문제를 다룬다.\u003c/p>\n\u003cp>W03의 \u003cstrong>발견 실패\u003c/strong>는 경제 문제의 종류(배분 vs 조정)를 재정의한 것으로, &quot;무엇이 가능한지조차 모른다&quot;는 문제를 다룬다.\u003c/p>\n\u003cp>굳이 겹쳐 보면 발견 실패는 전환 실패의 방향성 문제를 한 단계 더 앞으로 밀어 올린 것으로 읽을 수 있다. 전환 실패는 목표가 있는데 조율이 안 되는 상황이고, 발견 실패는 목표 자체가 안개 속인 상황이다.\u003c/p>\n\u003cp>따라서 두 틀을 비교할 때는 억지로 하나로 포개지 말고 층위가 다르다는 점을 분명히 하는 것이 안전하다.\u003c/p>\n"}},"W03/c14":{"title":"경제활동 비용의 3종류","en":"Transformation / Transaction / Discovery Cost","week":"W03","href":"W03.html#c14","stars":3,"byIndex":{"0":"\u003cp>경제활동 비용에는 세 종류가 있다.\u003c/p>\n\u003cp>\u003cstrong>전환 비용\u003c/strong>은 신고전파 경제학의 개념으로, 기업의 생산함수인 자본·노동·기술을 투입해 산출로 바꾸는 비용이며, 투입을 산출로 바꾸는 역할을 한다.\u003c/p>\n\u003cp>\u003cstrong>거래 비용\u003c/strong>은 신제도 경제학의 개념으로, 탐색/정보, 교섭/흥정, 점검/집행에 드는 비용이며, 교환·거래를 윤활하는 역할을 한다.\u003c/p>\n\u003cp>\u003cstrong>발굴(창출) 비용\u003c/strong>은 진화 경제학의 개념으로, 기술 발굴·창출과 R&amp;D, 혁신가적 발굴·실험에 드는 비용이며, 신규성을 창조하고 불확실성을 축소하는 역할을 한다. 세 비용은 각각 생산·조직·공유지가 존재하는 이유를 설명한다.\u003c/p>\n","1":"\u003cp>이 말은 거래 비용 개념이 전제하는 상황, 즉 \u003cstrong>거래할 대상이 무엇인지는 알고 그 거래를 성사시키는 데 드는 탐색·교섭·점검 비용만 계산하면 되는 상황\u003c/strong>조차 성립하지 않는 단계가 \u003cstrong>Phase 0\u003c/strong>라는 뜻이다.\u003c/p>\n\u003cp>거래 비용으로 풀 수 있는 것이 시장 시스템에서는 굉장히 많지만, Phase 0에서는 무엇을 거래할지, 심지어 거래할 대상이 존재하는지조차 모른다.\u003c/p>\n\u003cp>이 경우 전환 비용이나 거래 비용 같은 기존의 비용 계산 자체가 작동하지 않으므로, 애초에 거래 대상의 윤곽을 함께 그리는 \u003cstrong>발굴 비용\u003c/strong>의 논리로 접근해야 한다.\u003c/p>\n\u003cp>즉 이 말은 Phase 0가 거래 비용 경제학이 다루는 영역보다 한 단계 더 앞선 불확실성 단계임을 압축한 표현이다.\u003c/p>\n","2":"\u003cp>발굴 비용이 회계에서 제대로 인정받지 못하는 이유는, 예전에는 &quot;여기 뭐가 있으니 찾아내라&quot;는 R&amp;D였기에 &quot;그래서 뭐가 나왔어?&quot;를 물을 수 있었지만, 지금은 \u003cstrong>탐색적(exploratory)으로 이것저것 쳐 보는 활동\u003c/strong>이라 성과를 카운팅하기 어렵기 때문이다.\u003c/p>\n\u003cp>회계 기준상으로도 연구 단계 지출은 비용으로 처리되고 개발 단계의 일부만 자산화되므로, 탐색적 활동일수록 회계상 불리하다.\u003c/p>\n\u003cp>그 결과 조직에서는 실패가 \u003cstrong>그냥 버리는 비용\u003c/strong>으로 처리되어 사람들이 탐색적 시도를 위축시킨다.\u003c/p>\n\u003cp>교수는 이를 &#39;\u003cstrong>발견 비용\u003c/strong>&#39;이라는 개념으로 부르면 패러다임 전환에 도움이 되고, 여러 시도의 폭을 넓히는 방향으로 평가 체계를 바꿀 수 있다고 제안한다.\u003c/p>\n"}},"W03/c15":{"title":"새로운 혁신관 3단계 — Phase 0 / 1 / 2","en":"Innovation Commons → Hayekian Market Discovery → Smithian Scale-up","week":"W03","href":"W03.html#c15","stars":5,"byIndex":{"0":"\u003cp>\u003cstrong>Phase 0(혁신 공유지)\u003c/strong>는 가격 신호·시장이 부재하고 극심한 불확실성에 놓인 상황에서, 기회 발견 실패와 지식 파편화가 문제이며, 자발적 지식 풀링과 오스트롬식 공유지 거버넌스 규칙 구축이 해법이고, 무임승차 방지와 협력 거래비용 축소가 결과다.\u003c/p>\n\u003cp>\u003cstrong>Phase 1(하이에크적 시장 경쟁)\u003c/strong>은 기회의 윤곽이 잡힌 상황에서, 최적 가격·가치 발견이 문제이며, 가격 신호와 슘페터적 기업가 등장 및 발견 절차로서의 경쟁이 해법이고, 혁신 공유지의 자발적 와해가 결과다.\u003c/p>\n\u003cp>\u003cstrong>Phase 2(스미스적 스케일업)\u003c/strong>는 시장과 제품 가치가 완전히 확정된 상황에서, 생산성·수율 극대화가 문제이며, 분업과 전문화·공정 최적화·대규모 투입이 해법이고, 보편적 풍요 창출이 결과다.\u003c/p>\n","1":"\u003cp>이 비판은 한국이 저 위쪽(Phase 0)으로 풀었어야 할 문제들까지도 계속 Phase 2 방식, 즉 목표를 지정하고 대규모 투입으로 스케일업하는 방식으로만 다뤄왔다는 뜻이다.\u003c/p>\n\u003cp>그러나 교수는 Phase 2 방식이 늘 틀렸다고 말하지 않는다. \u003cstrong>아폴로 프로젝트, 맨해튼 프로젝트\u003c/strong>처럼 기술 자체를 개발하는 것이 목적이고 거기서 돈을 벌겠다는 의미가 아니었던 경우에는 그 방식이 맞다.\u003c/p>\n\u003cp>문제는 \u003cstrong>경제적 가치 창출이 목적인데도\u003c/strong> 같은 방식을 쓰는 것이다. 목표가 분명하지 않은 영역에서 Phase 2의 문법(과제 선정, 성과 평가)을 들이대면 발견 자체가 막힌다.\u003c/p>\n\u003cp>따라서 이 비판의 핵심은 미션이 분명한가에 따라 적절한 Phase를 구분해 적용해야 한다는 것이다.\u003c/p>\n","2":"\u003cp>공유지에서의 자발적 실험으로 기술적 가능성과 시장 기회의 윤곽이 드러나면 \u003cstrong>Phase 0의 목적은 달성\u003c/strong>되고, 공유지는 \u003cstrong>자발적으로 와해\u003c/strong>된다.\u003c/p>\n\u003cp>\u003cstrong>OpenAI\u003c/strong>가 그 실증 사례다. 가장 순수한 비영리 연구 공유지로 출발했지만, 사업 기회가 발견된 직후 거대 자본을 흡수하며 가장 강력한 폐쇄적 상업 기업으로 전환했다.\u003c/p>\n\u003cp>이 와해는 실패가 아니라 \u003cstrong>성공의 신호\u003c/strong>로 봐야 한다. 공유지는 영원히 유지할 대상이 아니라 다음 단계로 넘어가기 위한 장치이기 때문이다.\u003c/p>\n\u003cp>다만 OpenAI 사례는 공유지가 만든 성과를 누가 가져가는가, 그 전환이 공정한가에 대한 질문을 남긴다.\u003c/p>\n"}},"W03/c16":{"title":"혁신 주체로서 시민의 역할","en":"The Citizen as Innovation Actor across Smith / Hayek / Potts","week":"W03","href":"W03.html#c16","stars":3,"byIndex":{"0":"\u003cp>세 경제학자는 같은 &quot;사람&quot;을 다르게 본다.\u003c/p>\n\u003cp>\u003cstrong>Smith\u003c/strong>에게 시민은 분업 체계 안의 \u003cstrong>전문 노동자\u003c/strong>다. 분업 체계의 공급자·생산자이며, 현장을 개량하는 노동자이자 관찰하는 사색가로서 생산 공정과 기술 숙련 집적에 기여한다.\u003c/p>\n\u003cp>\u003cstrong>Hayek\u003c/strong>에게 시민은 현장 지식을 가진 \u003cstrong>정보 주체\u003c/strong>다. 특정 시공간 지식을 가진 man on the spot이며, 가격 신호로 선호를 표출하는 소비자·사용자로서 가격을 통한 지식 조정에 기여한다.\u003c/p>\n\u003cp>\u003cstrong>Potts와 McCloskey\u003c/strong>에게 시민은 Phase 0의 \u003cstrong>공동 창작자이자 civic actor\u003c/strong>다. 오픈소스·홈브루 클럽의 자유 혁신자이자 비가격적 가치를 논의·평가하는 공론장 주체로서, 사회적 허용 부여와 공유지 자발적 운용이라는 정치적 활동에 기여한다. 뒤로 갈수록 시민은 생산 요소에서 혁신의 주체로 올라간다.\u003c/p>\n","1":"\u003cp>\u003cstrong>Phase 2\u003c/strong>에서는 시민이 \u003cstrong>소비자\u003c/strong>다. 제품이 나온 뒤에 살지 말지 결정하며, 이때의 거부는 시장 실패로 나타난다.\u003c/p>\n\u003cp>\u003cstrong>Phase 0\u003c/strong>에서는 시민이 \u003cstrong>참여자\u003c/strong>다. 무엇을 만들지 정하는 단계 자체에 들어온다.\u003c/p>\n\u003cp>전자가 중요한 이유는, 나중에 거부하면 이미 돈과 시간이 다 들어간 뒤이기 때문이다. W02-1의 불만족스러운 혁신이나 W03/08 CTA의 Collingridge 딜레마가 같은 문제를 가리킨다.\u003c/p>\n\u003cp>시민을 Phase 0로 당겨 오는 것은 비가격적 가치(철학적 의미, 안전성 등)를 제품이 완성되기 전에 미리 논의할 수 있게 해, 나중에 치러야 할 사회적 비용을 줄이는 길이다.\u003c/p>\n","2":"\u003cp>W01의 \u003cstrong>citizen variety\u003c/strong>는 시민성의 네 유형(Communitarian·Scientific·Digital·Ecological)으로 시민이 다양한 방식으로 혁신에 관여할 수 있다는 \u003cstrong>문제의식\u003c/strong>으로 제시됐다.\u003c/p>\n\u003cp>W03의 \u003cstrong>Stage 0 공동 창작자\u003c/strong>는 이 문제의식을 Smith–Hayek–Potts라는 \u003cstrong>경제 이론의 계보 안에서 구체적 위치\u003c/strong>로 정식화한 것이다.\u003c/p>\n\u003cp>즉 W01에서 던져진 &quot;시민이 다양한 혁신 주체일 수 있다&quot;는 주장이, W03에서는 혁신 공유지라는 구체적 단계에
