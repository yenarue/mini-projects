n and the Organized Market (Lundvall)","week":"W02-1","href":"W02-1.html#c07","byIndex":{}},"W02-1/c08":{"title":"생산 능력 vs 기술 역량","en":"Production Capacity vs Technological Capabilities (Bell & Pavitt 1993)","week":"W02-1","href":"W02-1.html#c08","byIndex":{}},"W02-1/c09":{"title":"후발국의 역방향 기술 궤적","en":"Reverse Technological Trajectory of Latecomers","week":"W02-1","href":"W02-1.html#c09","byIndex":{}},"W02-1/c10":{"title":"수요–공급–연계 기술정책 프레임","en":"Demand / Supply / Linkage Policy Framework (Kim & Dahlman 1992)","week":"W02-1","href":"W02-1.html#c10","byIndex":{}},"W02-1/c11":{"title":"민간 R&D 수요 창출 4대 동인","en":"Four Determinants of Private R&D Demand in Korea","week":"W02-1","href":"W02-1.html#c11","byIndex":{}},"W02-1/c12":{"title":"종합 — 지식 모드의 결합과 수요 중심 정책","en":"Synthesis — Complementary Combination of STI/DUI and Demand-oriented Policy","week":"W02-1","href":"W02-1.html#c12","byIndex":{}},"W02-2/c01":{"title":"고전적 공공재 논리와 그 한계","en":"The Classical Public Good Argument and Its Limits","week":"W02-2","href":"W02-2.html#c01","byIndex":{"0":"\u003cp>지식을 공공재로 보는 고전 논리는 \u003cstrong>비배제성\u003c/strong>과 \u003cstrong>비경합성\u003c/strong> 두 속성에서 출발해, 민간이 지식에 과소투자하므로 정부가 기초연구에 투자해야 한다는 정책 결론으로 이어진다.\u003c/p>\n\u003cp>\u003cstrong>비배제성\u003c/strong>(non-excludability)은 일단 공개된 지식을 다른 사람이 쓰지 못하게 막기 어렵다는 속성이다. 가로등을 세우면 지나가는 사람 모두가 그 빛을 공짜로 쓰는 것과 같은 이치다.\u003c/p>\n\u003cp>\u003cstrong>비경합성\u003c/strong>(non-rivalry)은 한 사람이 지식을 써도 다른 사람 몫이 줄지 않는다는 속성이다. 빵은 내가 먹으면 없어지지만 공식은 아무리 써도 그대로 남는다.\u003c/p>\n\u003cp>두 속성이 겹치면 기업은 기초연구에 돈을 쓸 유인이 사라지므로, \u003cstrong>Nelson(1959)\u003c/strong>과 \u003cstrong>Arrow(1962)\u003c/strong>는 정부가 대신 투자해야 한다고 정식화했다. Arrow는 여기에 지식을 팔려면 내용을 먼저 보여줘야 하는데 보여주는 순간 상대가 이미 그것을 갖게 되어 거래가 성립하지 않는다는 \u003cstrong>정보의 역설\u003c/strong>을 덧붙였다.\u003c/p>\n\u003cp>이 논리는 정부 R&amp;D 예산의 표준 근거이며, W01/06이 말하는 세 가지 실패(시장 실패 → 시스템 실패 → 전환 실패) 중 첫 단계인 시장 실패 처방에 정확히 대응한다.\u003c/p>\n","1":"\u003cp>고전 공공재 논리가 생략한 것은 \u003cstrong>지식이 실제로 쓰이기 위한 조건\u003c/strong>이다 — 지식은 공개된다고 저절로 활용되지 않는다.\u003c/p>\n\u003cp>가로등은 세우는 순간 바로 불이 켜져 누구나 그 빛을 쓸 수 있지만, 논문은 공개해도 저절로 읽히고 재현되지 않는다. 그 내용을 읽고 재현할 사람, 장비, 표준이 갖춰져 있어야 비로소 지식이 된다.\u003c/p>\n\u003cp>슬라이드의 결정적 한 줄이 이 지점을 정확히 짚는다 — \u003cstrong>&quot;그러나 이 논리는 지식이 실제로 쓰이기 위한 조건을 생략한다.&quot;\u003c/strong> 고전 논리는 공개를 종착점으로 다루지만, 실제로는 공개 이후에 재현·활용의 문제가 남는다.\u003c/p>\n\u003cp>이 빈틈이 W02-2/03의 Callon 논의로 이어지는 지점이며, 이번 강의 전체가 공공재 논리를 반박해 나가는 출발점이 된다.\u003c/p>\n","2":"\u003cp>공공재 논리는 W01/06이 제시한 세 가지 실패(시장 실패 → 시스템 실패 → 전환 실패) 중 \u003cstrong>첫 단계인 시장 실패 처방\u003c/strong>에 정확히 대응한다.\u003c/p>\n\u003cp>비배제성·비경합성 때문에 민간이 과소투자한다는 진단은 시장이 스스로 최적의 자원배분을 못 한다는 시장 실패 논리 그대로이며, 처방도 정부가 개입해 투자를 늘린다는 시장 실패 프레임의 표준 해법과 같다.\u003c/p>\n\u003cp>이 대응은 Schot &amp; Steinmueller(2018)가 정리한 세 프레임 중 \u003cstrong>Frame 1(R&amp;D 정책)\u003c/strong>에 해당하며, 공공재 논리는 그 경제학적 근거다.\u003c/p>\n\u003cp>다만 이 강의의 흐름은 공공재 논리(시장 실패)에서 멈추지 않고 시스템 실패·전환 실패로 나아가므로, 이 관계를 아는 것은 이후 SIS·TIS·전환론이 왜 시장 실패 틀을 넘어서려 하는지를 이해하는 출발점이 된다.\u003c/p>\n"}},"W02-2/c02":{"title":"Kealey의 도전 — 선형모형 뒤집기","en":"Kealey's Challenge to the Linear Model","week":"W02-2","href":"W02-2.html#c02","byIndex":{"0":"\u003cp>\u003cstrong>선형모형\u003c/strong>은 정부가 과학에 투자하면 기술이 발전하고 경제가 성장한다고 보지만, \u003cstrong>Kealey\u003c/strong>는 이 인과의 방향이 반대라고 반박한다.\u003c/p>\n\u003cp>선형모형에서는 정부의 과학 투자가 원인이고 경제성장이 결과다. Kealey는 반대로 \u003cstrong>성장했기 때문에 과학 활동이 늘어난 것\u003c/strong>이며, 과학에 투자해서 성장한 것은 아니라고 본다.\u003c/p>\n\u003cp>이는 &quot;헬스장이 많은 동네 사람들이 건강하다&quot;는 관찰과 같다. 선형모형식으로는 헬스장을 지으면 사람들이 건강해진다고 해석하지만, Kealey식으로는 \u003cstrong>잘사는 동네라서\u003c/strong> 헬스장도 많고 사람들도 건강한 것이다 — 헬스장은 원인이 아니라 결과다.\u003c/p>\n\u003cp>더 나아가 Kealey는 \u003cstrong>과학 지식은 사유재\u003c/strong>이며 사람들은 돈이 될 줄 알고 투자하는 것이지 남과 나눌 생각이 없다고까지 주장해, 인과 반박과 성격 반박 두 갈래로 선형모형을 공격한다.\u003c/p>\n","1":"\u003cp>Kealey의 결론은 과학이 쓸모없다는 것이 아니라, \u003cstrong>성장을 위한 투자라는 정당화의 근거가 약하다\u003c/strong>는 것이다.\u003c/p>\n\u003cp>슬라이드의 정책적 함의는 온건하다 — 지식·문화로서의 가치는 인정하되 성장 효과는 단정하지 않는다. Kealey를 반과학주의자로 요약하면 틀린 답이 된다.\u003c/p>\n\u003cp>근거는 \u003cstrong>Kealey(1996)\u003c/strong> 『The Economic Laws of Scientific Research』다. 그는 산업혁명기 영국이 정부 과학 지원 없이 기술 진보를 이뤘고, 정부 R&amp;D가 오히려 민간 R&amp;D를 밀어내는 \u003cstrong>crowding out\u003c/strong> 효과가 있다는 점을 든다.\u003c/p>\n\u003cp>즉 그의 주장은 &quot;정부 지원이 늘 무용하다&quot;가 아니라 &quot;성장 효과가 자동은 아니다&quot;로 읽는 것이 공정하다.\u003c/p>\n","2":"\u003cp>세 입장은 \u003cstrong>지식의 성격\u003c/strong>과 \u003cstrong>정부의 역할\u003c/strong>에 대한 답이 각각 다르다.\u003c/p>\n\u003cp>\u003cstrong>고전 공공재론\u003c/strong>(Arrow, Nelson)은 지식을 공공재로 보고, 시장 실패를 보정하기 위해 정부가 투자해야 한다고 본다.\u003c/p>\n\u003cp>\u003cstrong>Kealey\u003c/strong>는 지식을 \u003cstrong>사유재\u003c/strong>로 보고, 정부의 투자 근거가 약하다고 본다 — 성장이 과학을 낳는 것이지 과학이 성장을 낳는 것은 아니라는 인과 반박이 그 바탕이다.\u003c/p>\n\u003cp>\u003cstrong>Callon\u003c/strong>은 지식을 공공재도 사유재도 아닌, \u003cstrong>재현·활용·탐색의 조건에 달린 것\u003c/strong>으로 본다. 그래서 정부 역할에 대한 질문도 &quot;투자하느냐 마느냐&quot;가 아니라 &quot;그 조건을 지키느냐&quot;로 바뀐다.\u003c/p>\n\u003cp>이 자료는 결국 세 번째 입장, 즉 Callon 쪽으로 논의를 이끌어가며 Kealey를 고전 논리를 흔드는 지렛대로 배치한다.\u003c/p>\n"}}},"quizSchedule":[{"n":1,"date":"2026-09-19","weeks":["W01","W02-1"]},{"n":2,"date":"2026-10-17","weeks":["W01","W02-1","W02-2","W03","W04","W05"]},{"n":3,"date":"2026-10-31","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07"]},{"n":4,"date":"2026-11-14","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09"]},{"n":5,"date":"2026-11-28","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09","W10","W11"]},{"n":6,"date":"2026-12-12","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09","W10","W11","W12","W13"]}]}</script>
