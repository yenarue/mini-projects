pproaches\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p13 Innovation System approaches\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-1-innovation-studies-맥락\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">Innovation Studies 맥락\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>이론\u003c/th>\n\u003cth>📄 슬라이드의 설명\u003c/th>\n\u003cth>🗣 수업 언급\u003c/th>\n\u003cth>주차\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>국가혁신시스템 (NIS)\u003c/strong>\u003c/td>\n\u003ctd>Innovation as a system activity (collective action) / Mission-oriented Innovation policy approach\u003c/td>\n\u003ctd>혁신을 집단 행동으로 보는 출발점\u003c/td>\n\u003ctd>(W13 MOIP로 이어짐)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>부문혁신시스템 (SIS)\u003c/strong>\u003c/td>\n\u003ctd>기술적 속성에 따른 혁신의 차이 분석 / Material Constraints\u003c/td>\n\u003ctd>산업마다 혁신 방식이 다르다\u003c/td>\n\u003ctd>W05 (10/10)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>기술혁신시스템 (TIS)\u003c/strong>\u003c/td>\n\u003ctd>신기술의 등장·도입·성숙·안정화에 이르는 \u003cstrong>동태적 과정\u003c/strong> 분석\u003c/td>\n\u003ctd>새 기술이 어떻게 자리 잡는가\u003c/td>\n\u003ctd>W06 (10/17)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>사회기술시스템 (StS)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>소비/사용 부문까지\u003c/strong> 시스템에 포함하여 분석 / 기술의 특성보다 \u003cstrong>사회적 기능\u003c/strong>에 초점\u003c/td>\n\u003ctd>생산과 소비를 아우름\u003c/td>\n\u003ctd>W09 (10/31)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Social Practice approach\u003c/strong>\u003c/td>\n\u003ctd>to consumption\u003c/td>\n\u003ctd>소비를 관습으로 분석\u003c/td>\n\u003ctd>W12 (11/21)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">이 계보의 순서가 곧 \u003cstrong>분석 단위의 확장 순서\u003c/strong>다. 국가 → 산업 부문 → 개별 기술 → 생산+소비 전체 → 일상의 실천.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-2-political-economy-맥락\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">Political Economy 맥락\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>생산·혁신사회시스템 (SSIP, Social System of Production &amp; Innovation)\u003c/strong>\u003c/li>\n\u003cli>🗣 \u003cstrong>노동 문제 등\u003c/strong>이 여기에 들어간다.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>자본주의의 국가별 차이(미국형 vs 독일·일본형)와 제도적 보완성(institutional complementarity)을 다룬다. W07 리딩이 Amable(2000), Casper &amp; Whitley(2004)인 이유.\u003c/li>\n\u003cli>주차: W07 (10/24)\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-3-business-studies-맥락\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">Business Studies 맥락\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>이론\u003c/th>\n\u003cth>📄 슬라이드\u003c/th>\n\u003cth>🗣 수업 언급\u003c/th>\n\u003cth>주차\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>비즈니스 시스템 (BS)\u003c/strong>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003cstrong>파이낸스가 강하게 들어감\u003c/strong>\u003c/td>\n\u003ctd>W07 (10/24)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>비즈니스모델 혁신 (BMI)\u003c/strong>\u003c/td>\n\u003ctd>비즈니스 가치사슬(Value Chain) 분석이 놓쳤던 \u003cstrong>사용자의 역할\u003c/strong> 분석 / Digital 기술의 영향, 디지털 전환이 비즈니스에 구현되는 형태\u003c/td>\n\u003ctd>디지털 전환\u003c/td>\n\u003ctd>W11 (11/14)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>혁신 Ecosystem론\u003c/strong>\u003c/td>\n\u003ctd>(굵게 강조된 항목)\u003c/td>\n\u003ctd>이번 주 다룰 주제\u003c/td>\n\u003ctd>W01 §9, 학기 전체의 종착점\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-4-읽는-법-왜-계보를-먼저-보나\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 읽는 법 — 왜 계보를 먼저 보나\u003c/p>\n\u003cul>\n\u003cli>이 슬라이드는 \u003cstrong>강의 전체의 목차이자 지도\u003c/strong>다. 매주 새 이론이 나올 때 &quot;이건 어느 동네에서 온 이론인가&quot;를 이 표에서 찾으면 위치가 잡힌다.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>슬라이드에서 \u003cstrong>혁신 Ecosystem론만 굵게\u003c/strong> 표시되어 있다 — 학기의 종착점이자 W01에서 미리 맛보는 주제.\u003c/li>\n\u003cli>🗣 (W02) 이 수업의 기본 입장은 \u003cstrong>펌(firm) 레벨에서 어떻게 시스템을 만들 것인가\u003c/strong>이고, 마지막 주제인 혁신생태계론이 이를 펌 단위로 다룬다. → 즉 Business Studies 쪽 끝에서 다시 만나는 구조.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c10":{"title":"혁신시스템 유형 3분류 — 강의 지도","en":"Innovation System Types — Difference / Change / Mechanism of Change","week":"W01","href":"W01.html#c10","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>한 학기의 이론들을 \u003cstrong>무엇을 설명하려는가\u003c/strong>로 세 묶음으로 나눈 지도. ① \u003cstrong>구조의 차이\u003c/strong> — 나라·산업마다 혁신 방식이 왜 다른가(NIS, SIS, SSIP, BizS). ② \u003cstrong>구조의 변화\u003c/strong> — 그 구조가 어떻게 바뀌는가(TS, TIS, StS + Transition). ③ \u003cstrong>구조 변화의 기작\u003c/strong> — 바뀔 때 구체적으로 무슨 메커니즘이 작동하는가(BMI, SPT, MOIP, Ecosystem). 뒤로 갈수록 \u003cstrong>더 미시적이고 더 실천적\u003c/strong>이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>강을 연구하는 세 가지 방법에 가깝다.\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">구조의 차이\u003c/th>\u003ctd class=\"deflist-desc\">한강과 낙동강은 왜 다르게 생겼나. 지도 두 장을 펴 놓고 비교한다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">구조의 변화\u003c/th>\u003ctd class=\"deflist-desc\">이 강줄기가 100년 동안 어떻게 옮겨 갔나. 시간축을 본다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">구조 변화의 기작\u003c/th>\u003ctd class=\"deflist-desc\">물이 어느 지점에서 어떻게 흙을 깎아 물길을 바꾸는가. 삽을 들고 현장에 간다.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>앞의 둘은 &quot;설명&quot;이고 셋째는 &quot;\u003cstrong>개입\u003c/strong>&quot;에 가깝다. 그래서 term paper를 쓰거나 실무에 적용할 때는 셋째 묶음이 쓸모가 크다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c10-h-슬라이드-w01-p14\">📄 슬라이드 (W01 p14)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 330\" role=\"img\" aria-labelledby=\"w01c10-title\">\n  \u003ctitle id=\"ans-w01c10-title\">혁신시스템 이론을 구조의 차이·구조의 변화·구조 변화의 기작 세 열로 나누고, 거시에서 미시로 갈수록 더 실천적이 됨을 보여주는 지도\u003c/title>\n  \u003cdefs>\n    \u003cmarker id=\"ans-w01c10-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--muted)\">\u003c/path>\n    \u003c/marker>\n  \u003c/defs>\n\n  \u003c!-- 1열: 구조의 차이 -->\n  \u003crect x=\"8\" y=\"10\" width=\"116\" height=\"252\" rx=\"10\" fill=\"var(--brand-soft)\" stroke=\"var(--brand)\" stroke-width=\"1.3\">\u003c/rect>\n  \u003ctext x=\"66\" y=\"34\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--brand)\">구조의 차이\u003c/text>\n  \u003ctext x=\"66\" y=\"58\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink-soft)\">NIS · SIS\u003c/text>\n  \u003ctext x=\"66\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink-soft)\">SSIP · BizS\u003c/text>\n  \u003cline x1=\"20\" y1=\"90\" x2=\"112\" y2=\"90\" stroke=\"var(--brand)\" stroke-opacity=\"0.4\">\u003c/line>\n  \u003ctext x=\"66\" y=\"112\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">나라·산업마다\u003c/text>\n  \u003ctext x=\"66\" y=\"128\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">왜 다른가?\u003c/text>\n  \u003ctext x=\"66\" y=\"152\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">(거시 · 비교)\u003c/text>\n\n  \u003c!-- 2열: 구조의 변화 -->\n  \u003crect x=\"132\" y=\"10\" width=\"116\" height=\"252\" rx=\"10\" fill=\"var(--term-soft)\" stroke=\"var(--term)\" stroke-width=\"1.3\">\u003c/rect>\n  \u003ctext x=\"190\" y=\"34\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--term)\">구조의 변화\u003c/text>\n  \u003ctext x=\"190\" y=\"58\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink-soft)\">TS · TIS\u003c/text>\n  \u003ctext x=\"190\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink-soft)\">StS + Transition\u003c/text>\n  \u003cline x1=\"144\" y1=\"90\" x2=\"236\" y2=\"90\" stroke=\"var(--term)\" stroke-opacity=\"0.4\">\u003c/line>\n  \u003ctext x=\"190\" y=\"112\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">기술·시스템이\u003c/text>\n  \u003ctext x=\"190\" y=\"128\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">어떻게 바뀌나?\u003c/text>\n  \u003ctext x=\"190\" y=\"152\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">(중간 · 시간축)\u003c/text>\n\n  \u003c!-- 3열: 구조 변화의 기작 -->\n  \u003crect x=\"256\" y=\"10\" width=\"116\" height=\"252\" rx=\"10\" fill=\"var(--note-soft)\" stroke=\"var(--note)\" stroke-width=\"1.3\">\u003c/rect>\n  \u003ctext x=\"314\" y=\"34\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--note)\">구조 변화의 기작\u003c/text>\n  \u003ctext x=\"314\" y=\"58\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink-soft)\">BMI · SPT\u003c/text>\n  \u003ctext x=\"314\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--ink-soft)\">MOIP · Ecosystem\u003c/text>\n  \u003cline x1=\"268\" y1=\"90\" x2=\"360\" y2=\"90\" stroke=\"var(--note)\" stroke-opacity=\"0.4\">\u003c/line>\n  \u003ctext x=\"314\" y=\"112\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">누가 어떤 수단으로\u003c/text>\n  \u003ctext x=\"314\" y=\"128\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">바꾸나?\u003c/text>\n  \u003ctext x=\"314\" y=\"152\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">(미시 · 개입)\u003c/text>\n\n  \u003cpath d=\"M20,300 L360,300\" stroke=\"var(--muted)\" stroke-width=\"1.6\" marker-end=\"url(#w01c10-arrow)\">\u003c/path>\n  \u003ctext x=\"190\" y=\"320\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">뒤로 갈수록 더 미시적이고 더 실천적\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p14.jpg\" alt=\"W01 p14 Innovation System Types\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p14 Innovation System Types\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c10-h-1-세-유형-교수-설명과-함께\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">세 유형 — 🗣 교수 설명과 함께\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>유형\u003c/th>\n\u003cth>포함 이론\u003c/th>\n\u003cth>🗣 무엇을 보나\u003c/th>\n\u003cth>주차\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>구조의 차이\u003c/strong>\u003c/td>\n\u003ctd>NIS, SIS, SSIP, BizS\u003c/td>\n\u003ctd>\u003cstrong>한국과 일본이 다르다. 조선·자동차·전자 산업이 다르다. 미국·독일·영국 시스템이 다르다.\u003c/strong>\u003c/td>\n\u003ctd>W05, W07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>구조의 변화\u003c/strong>\u003c/td>\n\u003ctd>TS, TIS, StS + Transition\u003c/td>\n\u003ctd>\u003cstrong>새 기술이 어떻게 자리 잡는가.\u003c/strong> StS는 기술보다 \u003cstrong>소비\u003c/strong>에 집중\u003c/td>\n\u003ctd>W06, W09, W10~\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>구조 변화의 기작\u003c/strong>\u003c/td>\n\u003ctd>BMI, SPT, MOIP, \u003cstrong>Ecosystem\u003c/strong>\u003c/td>\n\u003ctd>앞의 것보다 \u003cstrong>더 미시적으로 메커니즘을 봄\u003c/strong>\u003c/td>\n\u003ctd>W11~W13, 종착점\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>🗣 \u003cstrong>TS(기술시스템)\u003c/strong>의 고전은 \u003cstrong>Hughes의 미국 전력시스템 역사\u003c/strong> 연구. TIS는 스웨덴 학파 등.\u003c/li>\n\u003cli>🗣 오늘(W01) 다룰 Ecosystem 부분은 \u003cstrong>Adner 등 5편 정도의 논문\u003c/strong>(2006, 2010, 2016, 2017, 2018, 2020년대)을 정리한 것.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c10-h-2-세-유형과-문제의식의-대응\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">세 유형과 문제의식의 대응 💡\u003c/p>\n\u003cp>이 분류는 W01의 세 문제의식과 이렇게 맞물린다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>유형\u003c/th>\n\u003cth>대응하는 문제의식\u003c/th>\n\u003cth>핵심 질문\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>구조의 차이\u003c/td>\n\u003ctd>문제의식 1 (인간–제도–과학기술)\u003c/td>\n\u003ctd>세 축의 배합이 나라·산업마다 어떻게 다른가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>구조의 변화\u003c/td>\n\u003ctd>문제의식 2 (시스템 혁신)\u003c/td>\n\u003ctd>고착된 시스템이 어떻게 바뀌는가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>구조 변화의 기작\u003c/td>\n\u003ctd>문제의식 3 (공공가치·시민) + 실무\u003c/td>\n\u003ctd>누가 어떤 수단으로 바꾸는가 (기업·시민·국가)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c10-h-3-왜-뒤로-갈수록-미시적인가\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">왜 뒤로 갈수록 미시적인가\u003c/p>\n\u003cul>\n\u003cli>구조의 차이는 \u003cstrong>국가·산업 단위\u003c/strong>에서 비교한다(거시).\u003c/li>\n\u003cli>구조의 변화는 \u003cstrong>하나의 기술·시스템이 겪는 시간\u003c/strong>을 본다(중간).\u003c/li>\n\u003cli>구조 변화의 기작은 \u003cstrong>기업의 비즈니스 모델, 개인의 일상 관습, 정책의 임무 설계, 생태계의 병목\u003c/strong> 같은 구체적 작동 지점을 본다(미시).\u003c/li>\n\u003cli>🗣 그래서 마지막 묶음은 &quot;펌 레벨에서 어떻게 시스템을 만들 것인가&quot;라는 이 수업의 기본 입장(W02 §1-1)과 가장 가깝다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c11":{"title":"Innovation Ecosystem — 병목·오케스트레이터·거버넌스","en":"Innovation Ecosystem (Adner; Adner & Kapoor; Jacobides et al.; Granstrand & Holgersson)","week":"W01","href":"W01.html#c11","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>내 제품이 아무리 좋아도, \u003cstrong>남들이 제 몫을 해 주지 않으면 가치가 만들어지지 않는다.\u003c/strong> 혁신생태계론은 이 상호의존을 정면으로 다루는 이론이다. 핵심 질문 세 개: ① \u003cstrong>병목(bottleneck)\u003c/strong>이 어디 있는가, ② 누가 \u003cstrong>오케스트레이터\u003c/strong>로서 판을 짜는가, ③ 명령할 권한이 없는 파트너들을 어떻게 \u003cstrong>정렬(alignment)\u003c/strong>시키는가.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>오케스트라를 떠올리면 된다. 지휘자(오케스트레이터)는 단원을 해고할 권한이 없다 — 다들 독립 연주자다. 그래도 곡이 되려면 모두가 같은 박자로 가야 한다. 이때 지휘자가 할 일은 두 가지다. \u003cstrong>어느 파트가 곡 전체를 망칠 수 있는지(병목)\u003c/strong> 알아 두는 것, 그리고 \u003cstrong>&quot;이 곡이 되면 다 같이 좋다&quot;는 그림(가치 제안)으로 자발적으로 맞추게\u003c/strong> 하는 것.\u003c/p>\n\u003cp>교수의 표현으로는 이렇다. 🗣 &quot;내가 힘이 세면 내가 규칙을 만들어 버리면 된다. 힘이 세지 않고 병목이 저쪽에 있으면 \u003cstrong>제일 잘 꼬셔야\u003c/strong> 하는데, 그때는 규칙을 만드는 커뮤니티를 같이 꾸려 나가는 작업이 필요하다.&quot;\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c11-h-슬라이드-w01-p15-이론의-출처가-된-논문들\">📄 슬라이드 (W01 p15) — 이론의 출처가 된 논문들\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 280\" role=\"img\" aria-labelledby=\"w01c11-title\">\n  \u003ctitle id=\"ans-w01c11-title\">상류 컴포넌트에서 초점 기업(오케스트레이터)을 거쳐 하류 컴플리먼트로 가치가 흐르며, 두 연결부에 병목이 있을 수 있음을 보여주는 그림\u003c/title>\n  \u003cdefs>\n    \u003cmarker id=\"ans-w01c11-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--ink-soft)\">\u003c/path>\n    \u003c/marker>\n  \u003c/defs>\n\n  \u003crect x=\"8\" y=\"96\" width=\"100\" height=\"70\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\">\u003c/rect>\n  \u003ctext x=\"58\" y=\"122\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">상류\u003c/text>\n  \u003ctext x=\"58\" y=\"138\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">컴포넌트\u003c/text>\n  \u003ctext x=\"58\" y=\"154\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">부품·소재\u003c/text>\n\n  \u003crect x=\"140\" y=\"82\" width=\"100\" height=\"98\" rx=\"10\" fill=\"var(--brand-soft)\" stroke=\"var(--brand)\" stroke-width=\"1.6\">\u003c/rect>\n  \u003ctext x=\"190\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--brand)\">초점 기업\u003c/text>\n  \u003ctext x=\"190\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--brand)\">오케스트레이터\u003c/text>\n  \u003ctext x=\"190\" y=\"146\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">병목 매핑 ·\u003c/text>\n  \u003ctext x=\"190\" y=\"160\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">자발적 정렬\u003c/text>\n\n  \u003crect x=\"272\" y=\"96\" width=\"100\" height=\"70\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1.4\">\u003c/rect>\n  \u003ctext x=\"322\" y=\"122\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">하류\u003c/text>\n  \u003ctext x=\"322\" y=\"138\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">컴플리먼트\u003c/text>\n  \u003ctext x=\"322\" y=\"154\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">보완재·서비스\u003c/text>\n\n  \u003cline x1=\"108\" y1=\"131\" x2=\"140\" y2=\"131\" stroke=\"var(--ink-soft)\" stroke-width=\"1.8\" marker-end=\"url(#w01c11-arrow)\">\u003c/line>\n  \u003cline x1=\"240\" y1=\"131\" x2=\"272\" y2=\"131\" stroke=\"var(--ink-soft)\" stroke-width=\"1.8\" marker-end=\"url(#w01c11-arrow)\">\u003c/line>\n\n  \u003c!-- 병목 표시(모래시계 형태) -->\n  \u003cpath d=\"M112,116 L124,131 L112,146 M136,116 L124,131 L136,146\" stroke=\"var(--note)\" stroke-width=\"1.6\" fill=\"none\">\u003c/path>\n  \u003cpath d=\"M244,116 L256,131 L244,146 M268,116 L256,131 L268,146\" stroke=\"var(--note)\" stroke-width=\"1.6\" fill=\"none\">\u003c/path>\n  \u003ctext x=\"124\" y=\"102\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--note)\">병목?\u003c/text>\n  \u003ctext x=\"256\" y=\"102\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--note)\">병목?\u003c/text>\n\n  \u003cg font-size=\"10\" fill=\"var(--ink-soft)\">\n    \u003ctext x=\"12\" y=\"210\">상류(컴포넌트) 병목 → 선도자에게 유리\u003c/text>\n    \u003ctext x=\"12\" y=\"226\">경쟁자도 같이 겪는 진입장벽\u003c/text>\n    \u003ctext x=\"12\" y=\"250\">하류(컴플리먼트) 병목 → 선도자에게 불리\u003c/text>\n    \u003ctext x=\"12\" y=\"266\">가치 실현이 늦어져 시장을 잃음\u003c/text>\n  \u003c/g>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p15.jpg\" alt=\"W01 p15 Innovation Ecosystem\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p15 Innovation Ecosystem\u003c/figcaption>\u003c/figure>\n\u003cp>🗣 이 부분은 \u003cstrong>Adner 등 5편 정도의 논문\u003c/strong>(2006, 2010, 2016, 2017, 2018, 2020년대)을 정리한 것이다.\u003c/p>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-1-병목-bottleneck-생태계-분석의-출발점\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">병목(bottleneck) — 생태계 분석의 출발점\u003c/p>\n\u003cp>🗣 \u003cstrong>안전이 병목이 될 수 있다.\u003c/strong> 공군 참석자와의 대화에서: 드론은 무인이 되지만 \u003cstrong>사람이 탑승한 기체의 무인 이착륙은 어렵다.\u003c/strong> 자동차 FSD도 안전 문제에 계속 걸린다.\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;안전이 병목이 된다는 얘기는 안전한지 안 한지를 평가할 줄 알아야 되고 어떤 규정을 써야 될지를 알아야 됩니다. 그 시스템을 갖추고 있어야 돼요. 그리고 그 시스템은 웬만하면 넘기지 말아요. 전략적인 움직임이.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:11:38\u003c/span>\u003c/blockquote>\n\u003cp>→ 병목을 쥔다는 것은 단순히 부품을 만드는 것이 아니라 \u003cstrong>평가할 줄 알고 규정을 쓸 줄 아는 것\u003c/strong>이다. 그 역량은 \u003cstrong>전략적 자산이므로 외주화하지 말라\u003c/strong>는 실무 조언.\u003c/p>\n\u003cp>🗣 AI 파운데이션 모델에서도 같은 논리: 군사·전력 등 안보에 민감한 곳은 성능이 최고가 아니어도 우리 것을 써야 한다. 나머지는 비교우위로 간다. → \u003cstrong>병목(안전이 걸린 곳)을 노리는 작전.\u003c/strong>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-2-컴포넌트-vs-컴플리먼트-병목의-두-방향\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">컴포넌트 vs 컴플리먼트 — 병목의 두 방향 ★\u003c/p>\n\u003cp>이 구분이 \u003cstrong>Adner &amp; Kapoor(2010)의 핵심\u003c/strong>이고 퀴즈·토론 질문에도 나온다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>컴포넌트 (component, 상류)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>컴플리먼트 (complement, 하류)\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>뜻\u003c/td>\n\u003ctd>나에게 \u003cstrong>납품하는\u003c/strong> 쪽 (부품·소재·장비)\u003c/td>\n\u003ctd>옆·뒤에서 \u003cstrong>지원하는\u003c/strong> 보완재 (앱, 서비스, 인프라)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>병목이 클 때 선도자는\u003c/td>\n\u003ctd>\u003cstrong>유리하다\u003c/strong> — 경쟁자가 쉽게 못 들어온다\u003c/td>\n\u003ctd>\u003cstrong>불리하다\u003c/strong> — 다른 회사가 기존 기술로 따라와 시장을 먹는다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🗣 수업 설명\u003c/td>\n\u003ctd>상류 부품 병목이 높으면 진입장벽이 된다\u003c/td>\n\u003ctd>\u003cstrong>하류 보완재에 병목이 생기면 선도자는 오히려 시장을 잃는다\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>🗣 \u003cstrong>ASML 노광장비 생태계\u003c/strong>: 리소그래피 기업들이 상류 부품 업체(감광액 등)와 함께 기술을 개발해 왔다. 고도의 engineering-intensive, science-intensive 부품 쪽에서 강력한 진입장벽 — \u003cstrong>쉽게 학습되지 않는다.\u003c/strong> Adner &amp; Kapoor가 이를 데이터로 측정해 보여 줬다.\u003c/p>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">왜 비대칭인가(토론 질문 4번의 답을 만들 실마리): 상류 병목은 \u003cstrong>경쟁자도 똑같이 겪는 장벽\u003c/strong>이라 선도자의 시간 우위를 지켜 준다. 반면 하류 병목은 \u003cstrong>선도 기술의 가치 실현 자체를 늦춘다\u003c/strong> — 내 신기술이 아무리 좋아도 보완재가 준비 안 되면 고객은 성능을 체감하지 못하고, 그 사이 기존 기술이 개선되어 따라잡는다. (HDTV가 방송 표준·콘텐츠를 기다리는 동안 아날로그 TV가 계속 팔린 것이 Adner의 대표 예시)\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-3-수직-통합-vs-외부-조달의-딜레마-그리고-social-capital\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">수직 통합 vs 외부 조달의 딜레마 — 그리고 social capital\u003c/p>\n\u003cul>\n\u003cli>🗣 아날로그·물리적 기술 생태계에는 \u003cstrong>물질적 단절성과 지연(delay)\u003c/strong>이 존재한다.\u003c/li>\n\u003cli>🗣 딜레마: 저 회사 제품이 나와 잘 맞는데 \u003cstrong>밖에 두면 말을 안 들을지 모른다(hold-up).\u003c/strong> 그렇다고 안으로 들이면 유연성을 잃는다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;쟤가 파는 게 나한테 되게 맞아. 근데 밖에다 두니까 내 말을 안 들을지 모르겠어. … 그 홀드업 하는 것도 있잖아. 요소수 이런 거 꼭 필요한데, 그럼 우리가 하는 수밖에 없어.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:12:xx\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 일본의 수출 규제, \u003cstrong>요소수 사태\u003c/strong>처럼 꼭 필요한데 병목이 밖에 있으면 결국 우리가 할 수밖에 없다.\u003c/li>\n\u003cli>🗣 \u003cstrong>밖에 두면서도 같이 갈 수 있게 하는 힘 = Social Capital.\u003c/strong> &quot;같이 하자&quot;는 신뢰가 있으면 법정(court)으로 가지 않고 상호의존을 맞춰 나갈 수 있다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;꼭 (통합)하지 않더라도 &#39;야 같이 하자&#39;라는 그런 신뢰와 믿음이 있으면, 그때의 힘이 이제 소셜 캐피탈. 이거 없으면 다 법정으로 가야 되는 거죠.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:13:17\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 \u003cstrong>캐나다 잠수함 수주 사례\u003c/strong>: 납기·가격 같은 프로그램적 요소에서는 우리가 훨씬 나은데, \u003cstrong>서로 죽이 맞느냐 같은 관계 요소에서 밀린다.\u003c/strong> 그런 것까지 다 살려야 한다.\n→ W01/07의 social capital이 생태계 전략의 \u003cstrong>실무 자원\u003c/strong>으로 재등장하는 대목.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-4-오케스트레이터-orchestrator-전략\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">오케스트레이터(Orchestrator) 전략\u003c/p>\n\u003cul>\n\u003cli>🗣 새로운 생태계·사업을 만들 때 전략가가 그림을 그리는 역할.\u003c/li>\n\u003cli>🗣 생태계 통제 방식은 \u003cstrong>위계에 의한 강제 vs 자발적 정렬(voluntary alignment)\u003c/strong> 둘로 나뉜다. 파트너들은 각자 독립성과 자율성을 가지므로, 강제가 아니라 &quot;\u003cstrong>우리 다 같이 가는 거야\u003c/strong>&quot;가 필요하다. 여기서 social capital이 중요해진다.\u003c/li>\n\u003cli>🗣 박정희식 개발국가는 국가가 동원한 사례: &quot;잘 살아 보세, 가난 탈출하자&quot;라는 국가에 대한 믿음 — 학계는 이를 \u003cstrong>종족적 민족주의(ethnic nationalism)\u003c/strong>로 표현한다. 그러나 이제 한국도 다문화 가정이 많아 \u003cstrong>같은 동원 논리가 계속 통하지 않는다.\u003c/strong>\u003c/li>\n\u003cli>🗣 누가 룰을 정하고 역사를 쓸 것인가 — 통제권 경쟁이 치열하다. \u003cstrong>이 거버넌스를 어떻게 잘할 것인가가 숙제.\u003c/strong> 경영이 자기 회사만 보는 것이 아니다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-5-사례들\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">사례들 🗣\u003c/p>\n\u003cp>\u003cstrong>(a) Apple iTunes — 오케스트레이션의 교과서\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>90년대 중반부터 온라인 음악 시장이 커지며 불법 다운로드가 난무했고 저작권 문제로 모두가 병목에 갇혀 있었다.\u003c/li>\n\u003cli>애플은 \u003cstrong>DRM 기술이 등장할 때까지 기다렸다가\u003c/strong> iPod(기기) + iTunes(플랫폼)로 생태계를 만들었다. 음원사들도 동의했다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;MP3 플레이어는 다른 데서 다 했어. 음원사들도 다 동의를 하고. 스티브 잡스가 한 일은 아마도 그 일이 굉장히 클 겁니다. 오케스트레이터 역할을 한 것이지, 새로운 신기술을 만들겠다기보다는 오케스트레이터를.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:18:37\u003c/span>\u003c/blockquote>\n\u003cp>→ \u003cstrong>병목(저작권)이 풀리는 시점을 기다렸다가 진입\u003c/strong>한 것. 9-6의 &quot;완벽한 시점에 진입해 마지막 퍼즐이 된다&quot;는 전략의 실례.\u003c/p>\n\u003cp>\u003cstrong>(b) VCR 표준 전쟁\u003c/strong>: 소니(베타) vs JVC(VHS). JVC가 \u003cstrong>거버넌스를 개방해\u003c/strong> 파트너 참여를 이끌어 내며 생태계 우위를 형성.\u003c/p>\n\u003cp>\u003cstrong>(c) 스마트폰 생태계 패권 이동\u003c/strong>: 노키아(심비안)는 외부 유입을 차단하고 자기 것만 했다. 구글 안드로이드는 오픈 + 모듈러 기술로 \u003cstrong>초모듈성(hyper-modularity)\u003c/strong>을 만들어 연합군을 모았다. \u003cstrong>네트워크가 생기면 스위칭이 잘 안 된다\u003c/strong>(→ W01/05 사용자 고착). 🗣 \u003cstrong>피지컬 AI 전쟁에서 이것을 어떻게 할지가 표준적 질문\u003c/strong>이며, 중국이 사실상 이 오픈 작전을 쓰고 있다. 다만 아프리카 등에서 AI를 쓰려면 \u003cstrong>전력 인프라가 먼저\u003c/strong> — 여기서는 전력 시스템이 병목.\u003c/p>\n\u003cp>\u003cstrong>(d) AI 파운데이션 모델\u003c/strong>: 미국 팀(Claude, ChatGPT, Gemini)은 폐쇄형, 중국(Qwen 등)은 오픈 웨이트. 미국 스타트업도 중국 모델을 많이 쓴다고 한다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-6-분석틀-generic-vs-unique-시장으로-갈까-생태계로-갈까\">\u003cspan class=\"step-no\" aria-hidden=\"true\">6\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">분석틀: Generic vs Unique — 시장으로 갈까 생태계로 갈까\u003c/p>\n\u003cp>🗣 컴포넌트든 컴플리먼트든:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Generic한 것\u003c/strong>은 시장에서 구할 수 있으니 \u003cstrong>생태계를 굳이 만들 필요가 없다.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Unique한 것\u003c/strong>은 ① 직접 만들거나(수직통합) ② 생태계로 가거나 ③ 플랫폼을 더 오픈하게 만들어야 한다.\u003c/li>\n\u003c/ul>\n\u003cp>🗣 추가 고려:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>소비자도 complementor로 등장한다\u003c/strong> — 생산만 있는 게 아니다. 소비자가 \u003cstrong>최종 시스템 통합자(system integrator)\u003c/strong> 역할을 할 수 있다.\u003c/li>\n\u003cli>병목이 어디 있는가: 상류인가 하류인가, 디지털 모듈인가, 기업 자체인가 지역인가, 소비자의 통합자 역할인가.\u003c/li>\n\u003cli>\u003cstrong>거버넌스 판단\u003c/strong>: 내가 힘이 세면 내가 규칙을 만든다. 힘이 세지 않고 병목이 저쪽에 있으면 \u003cstrong>제일 잘 꼬셔야\u003c/strong> 하고, 그때는 \u003cstrong>규칙을 만드는 커뮤니티를 같이 꾸려 나가는 작업\u003c/strong>이 필요하다. 커먼스(commons)도 마찬가지 — 모두가 동의하고 정렬되어야 한다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;내가 힘이 세면 내가 규칙을 만들어버리면 돼요. 내가 힘이 그렇게 안 세고 병목이 저쪽에 있어, 그럼 제일 잘 꼬셔야 되는데. 그럴 때는 규칙을 만드는 커뮤니티, 그걸 같이 잘 꾸려나가는 그런 작업이 필요하다. 이거는 다른 일에도 다 마찬가지.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:26:30\u003c/span>\u003c/blockquote>\n\u003cp>🗣 인용(교수: &quot;말 잘 썼네&quot;): &quot;생태계 전략은 단순히 네트워킹을 늘리는 것이 아니다. \u003cstrong>외부의 병목을 정확히 짚어 내고, 가치 제안(value proposition)이라는 중력을 통해 자율적인 파트너들을 구조적으로 정렬시키는 도구\u003c/strong>다.&quot;\u003c/p>\n\u003cp>🗣 단, 오케스트레이터가 머리를 잘 써서 끌고 가는 solo act처럼 들리지만, 실제로는 처음에 당기는 사람·못 따라오는 사람이 있고 &quot;\u003cstrong>으샤으샤 기세\u003c/strong>&quot; 같은 것도 크게 작용한다. → W01/01의 &quot;혁신은 solo act가 아니다&quot;가 생태계 이론 안에서도 반복된다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-7-두-가지-리스크와-매핑\">\u003cspan class=\"step-no\" aria-hidden=\"true\">7\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 가지 리스크와 매핑\u003c/p>\n\u003cul>\n\u003cli>🗣 병목 매핑 절차(슬라이드): 중개자 색출 → 동반자 색출 → 지연 추정 → 채택 및 처리 시간 추정 → 중개자 선정·이전성 비용 조정 → 시장 진입 시간 산출 → 전략 재평가·실행. ※녹취 불명확, 단계명은 근사치.\u003c/li>\n\u003cli>📄 Discussion 질문에 나오는 두 리스크 (→ 아래 8번):\u003cul>\n\u003cli>\u003cstrong>상호의존성 리스크(interdependence risk) = 확률의 곱.\u003c/strong> 💡 파트너 A가 성공할 확률 0.8, B도 0.8, C도 0.8이면 전체 성공 확률은 0.8³ ≈ 0.51. 파트너가 늘수록 \u003cstrong>급격히\u003c/strong> 떨어진다.\u003c/li>\n\u003cli>\u003cstrong>통합 리스크(integration risk) = 지연의 합.\u003c/strong> 💡 각 단계가 2개월씩 늦으면 3단계면 6개월. \u003cstrong>누적\u003c/strong>된다.\u003c/li>\n\u003cli>→ 자원배분 시사점: 곱셈 리스크는 \u003cstrong>약한 고리 하나를 집중 보강\u003c/strong>하는 것이 효과적이고, 덧셈 리스크는 \u003cstrong>단계 수 자체를 줄이거나 병렬화\u003c/strong>하는 것이 효과적이다.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-8-기술적-불확실성-vs-행동주의적-불확실성\">\u003cspan class=\"step-no\" aria-hidden=\"true\">8\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">기술적 불확실성 vs 행동주의적 불확실성\u003c/p>\n\u003cul>\n\u003cli>🗣 경제학·정책결정자는 &quot;기술은 하면 되는 것&quot;, &quot;전문가에게 맡기면 되는 것&quot;으로 이해하는 경향(기술을 자본과 노동의 조합으로 설명). \u003cstrong>사실은 그렇지 않다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;기술은 하면 되는 거냐, 혹은 전문가를 동원하면 되는 걸로 이해하는데. 경제학에서는 기술을 자본과 노동의 조합으로 다 설명하고 있기 때문에. 사실은 그렇지가 않아. 시간이 지난다고 그냥 학습 곡선이 쭉 되는 거 아니에요. 계속 부딪히고 고민을 해야 됩니다.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:30:01\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 \u003cstrong>수직적 통합은 기술적 난점보다 행동주의적 기회주의를 통제하는 데 효과적\u003c/strong>이다. 기술이 초기 단계일 때는 내재화(수직 통합)가 맞다.\u003c/li>\n\u003cli>🗣 클러스터·사이언스파크가 왜 되는가: 집적(agglomeration)도 있지만 \u003cstrong>오랫동안 같이 일하며 쌓인 신뢰 = social capital이 살아 있기 때문.\u003c/strong>\u003c/li>\n\u003cli>🗣 MBA에서는 기술이 성숙하면 끊고 외부 조달로 가라고 하지만, 실제로는 \u003cstrong>long friendship을 계속 가져가는 게 나을 수 있다.\u003c/strong> 컨텍스트에 따라 다르다. \u003cstrong>그래서 팀워크가 어렵다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;MBA에서는 성숙한 단계에 접어들 때는 그냥 끊고 부품 외주로 가라고 얘기를 하지만, 실제에서는 안 그럴 수도 있다. 오히려 계속해서 그렇게 관계를 가져가는 게, 롱 프렌드십을 가지고 가는 거죠.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:32:18\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 결론: 생태계를 \u003cstrong>전체 구조적 관점에서 체계적으로 분석하면 기업이나 시장을 넘어서는 압력과 혁신적 기회를 제대로 분석할 수 있다.\u003c/strong> 🗣 &quot;그게 이제 우리가 공부하는 까닭이긴 하죠.&quot;\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c01":{"title":"지식의 속성 — 암묵지와 형식지","en":"Tacit and Explicit (Codified) Knowledge","week":"W02-1","href":"W02-1.html#c01","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>우리가 아는 것 전부를 말로 옮길 수는 없다. \u003cstrong>형식지(explicit)\u003c/strong>는 책·매뉴얼·논문처럼 \u003cstrong>밖으로 꺼내 남에게 넘길 수 있는 지식\u003c/strong>이고, \u003cstrong>암묵지(tacit)\u003c/strong>는 몸과 경험에 붙어 있어 \u003cstrong>말로 다 설명되지 않는 지식\u003c/strong>이다. Michael Polanyi의 한 문장으로 요약된다. \u003cstrong>&quot;We know more than we can tell.&quot;\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">슬라이드가 쓴 비유가 그대로 정답이다. \u003cstrong>자전거 부품 설명도\u003c/strong>(형식지)를 다 외워도 자전거를 탈 수는 없다. \u003cstrong>뒤에서 잡아 주며 타 보는 것\u003c/strong>(암묵지)이 있어야 탄다. 반대로 자전거를 아무리 잘 타도, 그 감각을 글로 써서 남에게 넘기기는 어렵다.\u003c/span>\u003c/p>\n\u003cp>🗣 교수의 표현: 전체 지식이 이만큼 있으면 \u003cstrong>그중 일부만 말할 수 있고, 그중 일부만 쓸 수 있고, 그중 일부만 남에게 넘겨줄 수 있다.\u003c/strong> 이 경계를 넘어갈 때마다 \u003cstrong>사이언스라는 활동이 작동\u003c/strong>한다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c01-h-슬라이드-w02-p10-11\">📄 슬라이드 (W02 p10–11)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 320\" role=\"img\" aria-labelledby=\"w0201c01-title\">\n  \u003ctitle id=\"ans-w0201c01-title\">전달 가능성과 체화 정도 두 축 위에서 암묵지는 체화 높고 전달 어려운 쪽에, 형식지는 전달 쉽고 체화 낮은 쪽에 놓이는 그림\u003c/title>\n  \u003cdefs>\n    \u003cmarker id=\"ans-w0201c01-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--muted)\">\u003c/path>\n    \u003c/marker>\n  \u003c/defs>\n\n  \u003c!-- 축 -->\n  \u003cline x1=\"58\" y1=\"270\" x2=\"358\" y2=\"270\" stroke=\"var(--line)\" stroke-width=\"1.6\" marker-end=\"url(#w0201c01-arrow)\">\u003c/line>\n  \u003cline x1=\"58\" y1=\"270\" x2=\"58\" y2=\"24\" stroke=\"var(--line)\" stroke-width=\"1.6\" marker-end=\"url(#w0201c01-arrow)\">\u003c/line>\n  \u003ctext x=\"358\" y=\"288\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">전달 가능성(codifiability) →\u003c/text>\n  \u003ctext x=\"18\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\" transform=\"rotate(-90 18 150)\">체화 정도(embodiment) ↑\u003c/text>\n\n  \u003c!-- 암묵지: 체화 높음·전달 어려움 -->\n  \u003ccircle cx=\"132\" cy=\"98\" r=\"62\" fill=\"var(--term-soft)\" stroke=\"var(--term)\" stroke-width=\"1.6\">\u003c/circle>\n  \u003ctext x=\"132\" y=\"84\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--term)\">암묵지\u003c/text>\n  \u003ctext x=\"132\" y=\"100\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--term)\">Tacit\u003c/text>\n  \u003ctext x=\"132\" y=\"118\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">몸에 체화 · 말로 안 됨\u003c/text>\n\n  \u003c!-- 형식지: 체화 낮음·전달 쉬움 -->\n  \u003ccircle cx=\"274\" cy=\"216\" r=\"62\" fill=\"var(--brand-soft)\" stroke=\"var(--brand)\" stroke-width=\"1.6\">\u003c/circle>\n  \u003ctext x=\"274\" y=\"202\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--brand)\">형식지\u003c/text>\n  \u003ctext x=\"274\" y=\"218\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--brand)\">Explicit\u003c/text>\n  \u003ctext x=\"274\" y=\"236\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">책·매뉴얼로 전달\u003c/text>\n\n  \u003cpath d=\"M182,132 C210,150 232,168 244,184\" stroke=\"var(--ink-soft)\" stroke-width=\"1.6\" fill=\"none\" stroke-dasharray=\"1,6\" stroke-linecap=\"round\" marker-end=\"url(#w0201c01-arrow)\">\u003c/path>\n  \u003ctext x=\"228\" y=\"150\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ink-soft)\">명시화(codify)\u003c/text>\n\n  \u003ctext x=\"60\" y=\"308\" font-size=\"10.5\" fill=\"var(--muted)\">\"We know more than we can tell.\" — Polanyi\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p10.jpg\" alt=\"W02 p10 암묵지와 형식지 I\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p10 암묵지와 형식지 I\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p11.jpg\" alt=\"W02 p11 암묵지와 형식지 II\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p11 암묵지와 형식지 II\u003c/figcaption>\u003c/figure>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">p10은 Polanyi의 문장과 자전거 부품도, p11은 자전거를 실제로 타는 사진을 나란히 놓는다. 하단에 \u003cstrong>&lt;과학 지식/기술 지식, 사회 지식, 철학 지식&gt;\u003c/strong> — 암묵지·형식지의 구분이 과학기술 지식에만 해당하는 게 아니라는 뜻.\u003c/span>\u003c/p>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-1-polanyi-형제-한-쌍으로-소개된-이유\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">Polanyi 형제 — 🗣 한 쌍으로 소개된 이유\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>Karl Polanyi\u003c/strong> (형, 사회학자)\u003c/th>\n\u003cth>\u003cstrong>Michael Polanyi\u003c/strong> (동생, 물리화학자)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>대표작\u003c/td>\n\u003ctd>\u003cem>The Great Transformation\u003c/em>\u003c/td>\n\u003ctd>암묵지(tacit knowledge) 개념\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🗣 요지\u003c/td>\n\u003ctd>19–20세기 서구가 \u003cstrong>시장 사회\u003c/strong>(임금노동 사회)로 변해 가는 과정. 경쟁에서 떨어지는 사람들이 생기면 사람들이 다시 \u003cstrong>롤백\u003c/strong>한다\u003c/td>\n\u003ctd>실험 도구를 다루는 \u003cstrong>장인적 지식\u003c/strong> — 말로 설명 못 하지만 &quot;이렇게 하면 이렇게 된다&quot;는 것이 있다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🗣 현재적 함의\u003c/td>\n\u003ctd>세계화에서 탈락한 사람들의 &quot;이건 아닌데&quot; → 정치적 반동(트럼프). \u003cstrong>글로벌 시장화의 위험성\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>&quot;We know more than we can tell.&quot;\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">형제가 같이 나오는 이유: 형은 \u003cstrong>시장이 사회에서 떨어져 나갈 때의 위험\u003c/strong>을, 동생은 \u003cstrong>시장이 셀 수 없는 지식이 있다는 것\u003c/strong>을 말했다. 둘 다 &quot;시장만으로는 안 된다&quot;는 이 수업의 문제의식과 닿는다. → W02-1/07 조직화된 시장.\u003c/span>\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;우리는 우리가 말할 수 있는 것보다 훨씬 많이 알고 있죠. 자전거를 어떻게 타는지를 무슨 역학 어쩌고 해서 설명할 수는 있죠. 타보면 알죠. … 토탈 놀리지가 이만큼 있으면 그중에 일부를 내가 말할 수 있는 거고, 그중에 일부를 쓸 수 있는 거고, 그중에 일부를 다른 사람들한테 넘겨줄 수 있는.&quot;\u003c/p>\u003cspan class=\"quote-time\">42:22\u003c/span>\u003c/blockquote>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-2-시장은-형식지만-센다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">시장은 형식지만 센다 ★\u003c/p>\n\u003cul>\n\u003cli>🗣 \u003cstrong>시장에서는 명시지밖에 카운팅이 안 된다.\u003c/strong> 그러나 실제 안에는 엄청나게 많은 암묵지가 있다. \u003cstrong>그럼 이걸 어떻게 카운팅할 것인가.\u003c/strong>\u003c/li>\n\u003cli>→ 이 질문이 W02-1/04 Jensen et al.(2007)의 \u003cstrong>DUI 지표 7개\u003c/strong>로 이어진다. 세지 못하던 것을 세려는 시도.\u003c/li>\n\u003cli>🗣 신앙도 마찬가지 — 책에 있는 것과 경험했을 때 생기는 마음은 다르다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-3-quot-해-봐야-안다-quot-교수가-꼽은-혁신의-한마디\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 &quot;해 봐야 안다&quot; — 교수가 꼽은 혁신의 한마디\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;제가 혁신이나 이런 거에 대해서 얘기를 했을 때, 눈 감고 그걸 한마디로 줄이라 한다면 저는 &#39;해봐야 안다&#39;, 한마디로 이걸로 줄일 겁니다. 해봐야 안다. 익스플리싯 놀리지 다 중요하죠. 근데 익스플리싯 놀리지도 해봐야 알아요. 지금 알파폴드도 나오고 AI도 나왔죠, 프롬프트 써봐요. 써보고 자기가 만들어 놔야 되는.&quot;\u003c/p>\u003cspan class=\"quote-time\">45:07\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>형식지조차 해 봐야 안다.\u003c/strong> AI 프롬프트도 써 보고 직접 만들어 봐야 한다. 암묵지는 계속 만들어지며 없어지지 않는다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-4-암묵지가-끊길-때-부울경의-위기\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">암묵지가 끊길 때 — 🗣 부울경의 위기\u003c/p>\n\u003cul>\n\u003cli>옛날에 깔아 놓은 산업 자산에 현장 숙련자들이 많은데, \u003cstrong>은퇴하면 밑에서 이어받을 사람이 없다 → 그 일은 사라진다.\u003c/strong>\u003c/li>\n\u003cli>미국은 원자력을 자기들이 다 만들었지만 이제 못 짓는다. 배 짓는 나라는 중국과 한국뿐.\u003c/li>\n\u003cli>\u003cstrong>AX 하면서 신규 직원을 안 뽑으면 암묵지가 끊길 수 있다.\u003c/strong> 어프렌티스십 등 암묵지를 이어 갈 시스템이 필요하다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;그럼 그 일은 사라져. 왜냐하면 해본 사람이 별로 없으니까. 사실 미국에서 원자력 관련해서 못 지어요. 걔들이 다 만들었지만 산업 생태계가 무너지면 못 지어요. … 그 지식을 만만히 보면 안 돼. 제일 문제가 AX 되면서 신규 직원들 잘 안 뽑으려고 그러잖아요. 근데 그 암묵지가 끊길 수도 있어요.&quot;\u003c/p>\u003cspan class=\"quote-time\">46:10\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 \u003cstrong>휴머노이드\u003c/strong>는 이 암묵지 전체를 통째로 대체하겠다는 것. 피지컬 AI의 제일 문제는 \u003cstrong>데이터가 고르지 않다\u003c/strong>는 것 — 그래도 암묵지는 계속 나온다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c02":{"title":"학습 — 지식생산의 미시적 기초","en":"Learning as the Micro-foundation of Knowledge Production","week":"W02-1","href":"W02-1.html#c02","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>혁신이 &quot;값어치 있는 지식을 만드는 일&quot;이라면, 그 지식은 어디서 오는가? \u003cstrong>학습\u003c/strong>에서 온다. 그리고 학습의 기본 메커니즘은 혼자 머리를 쥐어짜는 것이 아니라 \u003cstrong>주고받는 상호작용(interaction)\u003c/strong>이다. 게다가 학습은 \u003cstrong>쌓이는 것(축적)\u003c/strong>이라 시간이 걸리고 돈으로 살 수 없다. 그 대가로, 한 번 쌓인 것은 \u003cstrong>버리기도 어렵다(unlearning의 어려움 = 고착)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>🗣 교수가 쓴 비유가 최고다. 강의를 들으면 &quot;새롭네&quot; 할 수는 있다. 그런데 그게 \u003cstrong>진짜 내 것이 되는 순간은 뒤풀이\u003c/strong>에서다. 친구가 &quot;야 그건 아닌 것 같은데&quot; 하고, 내가 &quot;아니야 그거야&quot; 하고 받아치면서 지식이 내 것이 된다.\u003c/p>\n\u003cp>그리고 학습은 \u003cstrong>근육\u003c/strong>과 같다. 하루 만에 안 붙고(축적, 만 시간), 남의 근육을 사 올 수 없으며(구매로 안 됨), 한 번 붙은 자세는 고치기 어렵다(unlearning).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c02-h-슬라이드-w02-p9-p12\">📄 슬라이드 (W02 p9, p12)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p09.jpg\" alt=\"W02 p9 Micro-foundation 학습\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p9 Micro-foundation 학습\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p12.jpg\" alt=\"W02 p12 지식생산의 미시적 기초\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p12 지식생산의 미시적 기초\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-1-상호작용이-기본-메커니즘-lundvall\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">상호작용이 기본 메커니즘 — Lundvall\u003c/p>\n\u003cul>\n\u003cli>🗣 \u003cstrong>Lundvall\u003c/strong>(덴마크 Aalborg): 사회를 구조적으로 보는 입장. 핵심 발견은 \u003cstrong>innovation은 interactive process\u003c/strong>라는 것.\u003c/li>\n\u003cli>🗣 새 지식은 \u003cstrong>주고받는 상황에서\u003c/strong> 나오지 혼자 팍 나오는 게 아니다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;새로운 지식은 주고받는 상황에서 나오는 것이지 혼자 팍팍 나오는 게 아니에요. 제 말을 듣고 &#39;이거 새롭네&#39; 할 수도 있어요. 근데 그게 진짜 자기 거가 되는 순간은, 뒤풀이에서 헛소리하는 친구가 &#39;야 그건 아닌 것 같은데&#39; 하고, &#39;아니야 그거야&#39; 하고, 그렇게 인터랙션 할 때.&quot;\u003c/p>\u003cspan class=\"quote-time\">31:48\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>질문자–응답자, 사용자–생산자, 소비자–공급자 사이의 상호작용이 새 지식 생산의 기본 메커니즘.\u003c/li>\n\u003cli>🗣 그리고 \u003cstrong>사실 이것이 시장에서 벌어지는 일\u003c/strong>이다. → 이를 경제활동의 \u003cstrong>생산자–사용자 관계\u003c/strong>로 확장한 것이 \u003cstrong>국가혁신체제(NIS)\u003c/strong> 논의. → W02-1/07.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-2-학습경제-learning-economy-와-learnfare\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">학습경제(learning economy)와 learnfare\u003c/p>\n\u003cul>\n\u003cli>🗣 1990–2000년대 유럽에서 \u003cstrong>학습경제\u003c/strong>로 크게 유행. 제3의 길도 결국 이 얘기.\u003c/li>\n\u003cli>🗣 실업급여를 그냥 주는 대신 \u003cstrong>배움과 연결해 돈을 주자\u003c/strong> → welfare에서 \u003cstrong>learnfare\u003c/strong>(학습 복지).\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>즉 학습은 개인의 미덕이 아니라 \u003cstrong>경제·복지 정책의 설계 원리\u003c/strong>가 된다. Lundvall(2016) \u003cem>The Learning Economy and the Economics of Hope\u003c/em>가 \u003ccode>참고자료/\u003c/code>에 있다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-3-학습은-축적-행위\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">학습은 축적 행위 ★\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>지식은 시장 선택 행위와 더불어 \u003cstrong>학습이라는 축적 행위의 산물\u003c/strong>.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>시간이 걸린다. \u003cstrong>구매(기계, 인력)만으로 역량 획득이 되는 것은 아니다.\u003c/strong> Entry barrier: 10,000시간의 법칙.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;학습은 축적이 됩니다. 쌓이는 겁니다. 한 번 해서 되는 게 아니라 어큐뮬레이션이 쭉 되는 거. 시간이 걸리고, 구매만으로는 역량이 되는 것이 아니고. 만 시간 뭐 이런 것들 있죠. 그러니까 거꾸로, 따라서 언러닝이 어려운 거죠. 몸에 익숙한 게 잘 안 바뀝니다. 언러닝이, 고착이 되는 거죠.&quot;\u003c/p>\u003cspan class=\"quote-time\">48:54\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>→ \u003cstrong>&quot;구매만으로는 역량이 안 된다&quot;\u003c/strong>는 W02-1/08 Bell &amp; Pavitt의 생산 능력 vs 기술 역량으로 곧장 이어진다. 설비는 사 올 수 있지만 역량은 못 산다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-4-unlearning의-어려움-고착\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">unlearning의 어려움 = 고착 ★\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>Unlearning의 어려움.\u003c/li>\n\u003cli>🗣 몸에 익은 것이 잘 안 바뀐다 → \u003cstrong>학습이 곧 고착이 된다.\u003c/strong>\u003c/li>\n\u003cli>→ W01/05의 세 가지 고착과 직결. 학습의 장점(축적)과 단점(고착)은 \u003cstrong>같은 성질의 양면\u003c/strong>이다.\u003c/li>\n\u003cli>→ W02-1/12 Discussion: &quot;DUI mode는 path-dependency로 lock-in될 가능성이 높다 — 돌파 방안은?&quot;\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-5-학습의-2가지-방식\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">📄 학습의 2가지 방식\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>STI mode\u003c/strong> (Science-Technology-Innovation): 형식지 중심\u003c/li>\n\u003cli>\u003cstrong>DUI mode\u003c/strong> (Doing-Using-Interacting): 암묵지 중심\n→ W02-1/03에서 상세히.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c03":{"title":"STI mode vs DUI mode","en":"Science-Technology-Innovation mode vs Doing-Using-Interacting mode (Jensen et al. 2007)","week":"W02-1","href":"W02-1.html#c03","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>배우는 방식은 크게 둘이다. \u003cstrong>STI 모드\u003c/strong>는 \u003cstrong>과학의 원리로 배우는 것\u003c/strong>(강의·논문·R&amp;D, 형식지, 과학자 중심)이고, \u003cstrong>DUI 모드\u003c/strong>는 \u003cstrong>해 보면서 배우는 것\u003c/strong>(현장·토론·고객과의 협업, 암묵지, 장인·엔지니어 중심)이다. 둘 중 하나가 옳은 게 아니라, \u003cstrong>둘을 결합한 기업이 압도적으로 혁신을 잘한다\u003c/strong>는 것이 이 이론의 결론이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>요리를 배우는 두 가지 길이다.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>STI\u003c/strong>: 조리 과학 책을 읽고 &quot;마이야르 반응은 140도 이상에서 일어난다&quot;를 안다. 왜 그런지(know-why)를 안다.\u003c/li>\n\u003cli>\u003cstrong>DUI\u003c/strong>: 주방에서 3년 굽는다. 고기 냄새와 소리로 뒤집을 때를 안다. 어떻게 하는지(know-how)를 안다.\u003c/li>\n\u003c/ul>\n\u003cp>책만 읽은 사람은 실제로 태워 먹고, 주방에만 있던 사람은 \u003cstrong>새 재료가 오면 응용을 못 한다.\u003c/strong> 둘 다 한 사람이 제일 세다 — 그게 Jensen et al.의 실증 결과다.\u003c/p>\n\u003cp>🗣 교수의 표현: \u003cstrong>&quot;현장에서 일하는 사람들하고 연구실에서 일하는 사람들하고 계속 얘기를 하는 거야.&quot;\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c03-h-슬라이드-w02-p13-14\">📄 슬라이드 (W02 p13–14)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 330\" role=\"img\" aria-labelledby=\"w0201c03-title\">\n  \u003ctitle id=\"ans-w0201c03-title\">STI mode와 DUI mode를 지식 형태·주체·장소·학습 방식 네 줄로 대비하고, 두 모드를 결합한 기업이 혁신을 더 잘한다는 것을 보여주는 그림\u003c/title>\n\n  \u003c!-- 헤더 -->\n  \u003crect x=\"12\" y=\"10\" width=\"168\" height=\"36\" rx=\"8\" fill=\"var(--brand)\">\u003c/rect>\n  \u003ctext x=\"96\" y=\"33\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--surface)\">STI mode\u003c/text>\n  \u003crect x=\"200\" y=\"10\" width=\"168\" height=\"36\" rx=\"8\" fill=\"var(--term)\">\u003c/rect>\n  \u003ctext x=\"284\" y=\"33\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--surface)\">DUI mode\u003c/text>\n\n  \u003c!-- 표 본문 -->\n  \u003crect x=\"12\" y=\"50\" width=\"356\" height=\"220\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"1\">\u003c/rect>\n  \u003cline x1=\"190\" y1=\"50\" x2=\"190\" y2=\"270\" stroke=\"var(--line)\" stroke-width=\"1\">\u003c/line>\n  \u003cline x1=\"12\" y1=\"105\" x2=\"368\" y2=\"105\" stroke=\"var(--line)\" stroke-width=\"1\">\u003c/line>\n  \u003cline x1=\"12\" y1=\"150\" x2=\"368\" y2=\"150\" stroke=\"var(--line)\" stroke-width=\"1\">\u003c/line>\n  \u003cline x1=\"12\" y1=\"195\" x2=\"368\" y2=\"195\" stroke=\"var(--line)\" stroke-width=\"1\">\u003c/line>\n\n  \u003cg font-size=\"9.5\" fill=\"var(--muted)\">\n    \u003ctext x=\"20\" y=\"64\">지식 형태\u003c/text>\n    \u003ctext x=\"20\" y=\"118\">주체\u003c/text>\n    \u003ctext x=\"20\" y=\"163\">장소\u003c/text>\n    \u003ctext x=\"20\" y=\"208\">학습 방식\u003c/text>\n    \u003ctext x=\"20\" y=\"253\">한마디\u003c/text>\n  \u003c/g>\n\n  \u003cg font-size=\"11\" font-weight=\"600\" fill=\"var(--ink)\">\n    \u003ctext x=\"96\" y=\"80\" text-anchor=\"middle\">형식지(Explicit)\u003c/text>\n    \u003ctext x=\"96\" y=\"132\" text-anchor=\"middle\">과학자·전문가\u003c/text>\n    \u003ctext x=\"96\" y=\"176\" text-anchor=\"middle\">학교·연구기관\u003c/text>\n    \u003ctext x=\"96\" y=\"220\" text-anchor=\"middle\">강의·텍스트·시뮬레이션\u003c/text>\n    \u003ctext x=\"96\" y=\"260\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink-soft)\">이론과 프레임워크\u003c/text>\n\n    \u003ctext x=\"284\" y=\"80\" text-anchor=\"middle\">암묵지(Tacit)\u003c/text>\n    \u003ctext x=\"284\" y=\"132\" text-anchor=\"middle\">장인·Engineer\u003c/text>\n    \u003ctext x=\"284\" y=\"176\" text-anchor=\"middle\">생산·문제발생 현장\u003c/text>\n    \u003ctext x=\"284\" y=\"220\" text-anchor=\"middle\">\"해 봐야 안다\"\u003c/text>\n    \u003ctext x=\"284\" y=\"260\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink-soft)\">떠들고 토론하고 뒤풀이\u003c/text>\n  \u003c/g>\n\n  \u003ctext x=\"190\" y=\"298\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">↔ 결합한 기업이 압도적으로 혁신을 잘한다\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p13.jpg\" alt=\"W02 p13 학습의 방식 STI &amp; DUI\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p13 학습의 방식 STI &amp; DUI\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p14.jpg\" alt=\"W02 p14 STI vs DUI 정리\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p14 STI vs DUI 정리\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-1-두-모드-비교-퀴즈-핵심\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 모드 비교 ★ (퀴즈 핵심)\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>STI mode\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>DUI mode\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>풀네임\u003c/td>\n\u003ctd>\u003cstrong>S\u003c/strong>cience–\u003cstrong>T\u003c/strong>echnology–\u003cstrong>I\u003c/strong>nnovation\u003c/td>\n\u003ctd>\u003cstrong>D\u003c/strong>oing–\u003cstrong>U\u003c/strong>sing–\u003cstrong>I\u003c/strong>nteracting\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>지식 형태\u003c/td>\n\u003ctd>\u003cstrong>형식지\u003c/strong> (Explicit, Tangible, Artefact-embodied), Codified, \u003cstrong>Know-why\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>암묵지\u003c/strong> (Tacit, Implicit, Intangible, \u003cstrong>Human\u003c/strong>-embodied), \u003cstrong>Know-how\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>주요 활동\u003c/td>\n\u003ctd>공식적 R&amp;D, 과학기술 인력 고용, 연구기관과의 협력\u003c/td>\n\u003ctd>다학제 태스크포스, 품질 분임조, 부서 간 경계 허물기\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학습 방식\u003c/td>\n\u003ctd>강의와 텍스트 중심, \u003cstrong>시뮬레이션과 기획\u003c/strong>\u003c/td>\n\u003ctd>현장활동 중심, \u003cstrong>&quot;해 봐야 안다&quot;\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>주체\u003c/td>\n\u003ctd>과학자·전문가\u003c/td>\n\u003ctd>장인, Engineer, Practitioner, 실제 행위자\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>장소\u003c/td>\n\u003ctd>학교, 연구기관 등 공식 교육·연구기관\u003c/td>\n\u003ctd>생산현장, 문제발생현장\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>특징\u003c/td>\n\u003ctd>\u003cstrong>보편적 원리 규명\u003c/strong>에 집중\u003c/td>\n\u003ctd>\u003cstrong>현장의 문제 해결 및 비공식적 상호작용\u003c/strong>에 집중\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🗣 한마디\u003c/td>\n\u003ctd>이론과 프레임워크\u003c/td>\n\u003ctd>떠들고 토론하고 뒤풀이\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-2-두-모드를-잇는-것이-핵심\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 두 모드를 잇는 것이 핵심\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;아주 쉽게 얘기하면 현장에서 일하는 사람들하고 연구실에서 일하는 사람들하고 계속 얘기를 하는 거야. &#39;야 이거 뭐가 문제냐&#39; 그랬더니 연구실에서 일하는 사람들은 그걸 프레임워크로 볼 거 아니에요. 그래서 어떻게 벌어지는지를 막 모색을 할 거잖아요. 그러면 다른 현장에도 얘기해 줄 수 있죠.&quot;\u003c/p>\u003cspan class=\"quote-time\">53:29\u003c/span>\u003c/blockquote>\n\u003cp>→ 핵심은 \u003cstrong>전파 가능성\u003c/strong>이다. 현장의 문제를 연구실이 \u003cstrong>프레임워크로 번역\u003c/strong>하면, 그 해법을 \u003cstrong>다른 현장에도 옮길 수 있다.\u003c/strong> DUI 혼자서는 그 현장에 갇힌다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-3-두-모드가-발견하는-혁신의-종류가-다르다-w02-토론에서-정리\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 모드가 발견하는 혁신의 종류가 다르다 (W02 토론에서 정리)\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>삼성 DX 참석자\u003c/strong>: DUI는 &quot;써 보니 문제가 있네, 어떻게 해결하지&quot; → \u003cstrong>프로세스·문제해결 혁신\u003c/strong>. STI는 &quot;이런 기술이 발견됐네, 이걸로 뭘 해결하지&quot; → \u003cstrong>기술 주도 혁신\u003c/strong>. 우열이 아니라 \u003cstrong>다른 종류\u003c/strong>.\u003c/li>\n\u003cli>🗣 그것이 명시지·STI의 장점. STI의 가장 혁혁한 모습은 \u003cstrong>원자폭탄\u003c/strong> — 과학자에게 맡겼더니 원자를 쪼개 폭발력을 쓰는, \u003cstrong>현장에서는 생각도 못 할 단절적(radical) 혁신\u003c/strong>을 가져왔다.\u003c/li>\n\u003cli>→ \u003cstrong>점진적(incremental) vs 급진적(radical)\u003c/strong> 혁신의 구분과 대응한다.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>DUI\u003c/th>\n\u003cth>STI\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>혁신의 종류\u003c/td>\n\u003ctd>점진적(incremental), 프로세스·문제해결\u003c/td>\n\u003ctd>급진적(radical), 기술 주도\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>출발점\u003c/td>\n\u003ctd>&quot;써 보니 문제가 있다&quot;\u003c/td>\n\u003ctd>&quot;이런 기술이 발견됐다&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>대표 예\u003c/td>\n\u003ctd>현장 공정 개선\u003c/td>\n\u003ctd>원자폭탄\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-4-dui의-약점-lock-in\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">DUI의 약점 — 🗣 lock-in\u003c/p>\n\u003cul>\n\u003cli>🗣 (W02 Discussion) \u003cstrong>DUI mode는 path-dependency로 lock-in될 가능성이 높다\u003c/strong> — 새로운 세계를 못 볼 수 있다. 돌파 방안은?\u003c/li>\n\u003cli>W02-1/02에서 본 대로 학습은 축적이자 고착이다. 현장 학습은 \u003cstrong>그 현장의 방식\u003c/strong>을 강화한다.\u003c/li>\n\u003cli>🗣 그래서 \u003cstrong>메타 인지\u003c/strong>가 필요하고, 그것을 얻으려고 학교에 온다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-5-sti의-약점-산업이-과학을-끌고-가야-한다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">STI의 약점 — 🗣 산업이 과학을 끌고 가야 한다\u003c/p>\n\u003cul>\n\u003cli>🗣 사람들이 &quot;그럼 STI에 투자하면 되겠네&quot;라고 생각하는 것이 문제. \u003cstrong>산업이 과학을 끌고 가야지, 무조건 과학기술을 푸시한다고 산업이 되는 게 아니다.\u003c/strong>\u003c/li>\n\u003cli>→ W02-1/06 불만족스러운 혁신으로 이어짐.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c04":{"title":"Jensen et al. (2007) 실증 연구 — DISKO 데이터와 4개 클러스터","en":"Empirical Evidence — DISKO data, Latent Class Analysis, Logistic Regression","week":"W02-1","href":"W02-1.html#c04","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>STI와 DUI가 말만 그럴듯한 게 아니라는 것을 \u003cstrong>덴마크 기업 692개 데이터로 증명한 연구\u003c/strong>다. 각 모드를 \u003cstrong>지표로 세어\u003c/strong>(DUI 7개, STI 3개) 기업을 네 유형으로 나눴더니, \u003cstrong>두 모드를 함께 쓰는 기업이 신제품 출시에 성공할 확률이 압도적으로 높았다.\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>&quot;책도 보고 주방에도 서는 요리사가 제일 낫다&quot;는 말을 \u003cstrong>숫자로 증명한 것\u003c/strong>이다.\u003c/p>\n\u003cp>아무것도 안 하는 식당을 기준(1배)으로 놓으면,\u003c/p>\n\u003cul>\n\u003cli>주방 경험만 쌓은 식당: 약 2배\u003c/li>\n\u003cli>조리 과학만 공부한 식당: 약 3배\u003c/li>\n\u003cli>\u003cstrong>둘 다 하는 식당: 약 8배\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>그런데 여기서 반전이 있다. 식당의 업종과 규모를 감안해서 다시 계산하니 &quot;과학만 공부한 식당&quot;의 3배가 2.4배로 \u003cstrong>확 줄었다.\u003c/strong> 알고 보니 그 식당들은 원래 고급 레스토랑(하이테크 업종)이라 잘했던 것. 반면 \u003cstrong>둘 다 하는 식당은 감안 후에도 5배\u003c/strong>로 살아남았다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c04-h-슬라이드-w02-p15-18\">📄 슬라이드 (W02 p15–18)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p15.jpg\" alt=\"W02 p15 지표 구성\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p15 지표 구성\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p16.jpg\" alt=\"W02 p16 4대 클러스터\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p16 4대 클러스터\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-1-데이터와-방법\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">데이터와 방법\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>덴마크 \u003cstrong>DISKO 데이터\u003c/strong>, \u003cstrong>692개 기업\u003c/strong> 설문.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>잠재집단분석(Latent Class Analysis, LCA)\u003c/strong>으로 10개 지표의 활용 확률 패턴에 따라 기업을 4개 클러스터로 분류.\u003c/li>\n\u003cli>🗣 핵심은 \u003cstrong>현장에서 일어나는 학습의 모습을 지표화한 것.\u003c/strong> → W02-1/01의 &quot;시장에서는 명시지밖에 카운팅이 안 된다&quot;는 문제에 대한 대답.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-2-지표-교수가-quot-일부러-이-슬라이드를-넣었다-quot-고-한-부분\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">지표 ★ (🗣 교수가 &quot;일부러 이 슬라이드를 넣었다&quot;고 한 부분)\u003c/p>\n\u003cp>\u003cstrong>DUI 모드 측정 지표 — 7개 학습 조직 관행\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>다학제 워크그룹 활용 (Interdisciplinary workgroups)\u003c/li>\n\u003cli>품질 분임조 운영 (Quality circles)\u003c/li>\n\u003cli>제안 수집 및 활용 제도 (Systems for collecting proposals)\u003c/li>\n\u003cli>자율 작업 그룹 도입 (Autonomous groups)\u003c/li>\n\u003cli>부서 간 기능 통합 (Integration of functions)\u003c/li>\n\u003cli>직무 경계의 유연화 (Softened/indistinct demarcations)\u003c/li>\n\u003cli>고객과의 긴밀한 협력 (Cooperation with customers)\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>STI 모드 측정 지표 — 3개 과학·기술 역량\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>R&amp;D 지출 유무 (Positive R&amp;D expenditures)\u003c/li>\n\u003cli>대학/공공연구기관 연구자와의 협력 유무\u003c/li>\n\u003cli>과학기술 전공 정규 인력 고용 (Scientifically trained personnel)\u003c/li>\n\u003c/ol>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">DUI 지표는 전부 \u003cstrong>조직 관행(how we work)\u003c/strong>이고, STI 지표는 전부 \u003cstrong>투입 자원(what we have)\u003c/strong>이다. 암묵지는 관행으로, 형식지는 자원으로 측정된다는 점이 설계의 핵심.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-3-4개-클러스터\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">4개 클러스터 📄\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>클러스터\u003c/th>\n\u003cth>비중\u003c/th>\n\u003cth>특징\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>저학습 (Low-learning)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>40.5%\u003c/strong>\u003c/td>\n\u003ctd>DUI·STI 모두 매우 희소. 50인 미만 소기업, 건설·도소매·기타 서비스업 비중 높음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DUI 단독\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>29.7%\u003c/strong>\u003c/td>\n\u003ctd>제안제도 62.5%, 다학제그룹 54.5% 등 현장 학습 우수. R&amp;D·연구기관 협력 낮음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>STI 단독\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>11.0%\u003c/strong>\u003c/td>\n\u003ctd>R&amp;D 지출 98.8%, 연구자 협력 85.9%로 매우 높음. 반면 다학제그룹 1.4%로 DUI 관행 거의 미도입\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DUI/STI 결합\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>18.8%\u003c/strong>\u003c/td>\n\u003ctd>다학제그룹 98.9%, R&amp;D 지출 87.4%, 연구자 협력 95.5% — 두 모드를 높은 수준으로 동시 결합\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">주목할 점: \u003cstrong>기업의 40%는 아무 학습도 안 한다.\u003c/strong> 그리고 STI 단독(11%)이 DUI 단독(29.7%)보다 훨씬 드물다 — 현장 학습이 더 흔하고 과학 역량이 더 희소하다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-4-로지스틱-회귀-결과-퀴즈-숫자\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">로지스틱 회귀 결과 ★ (퀴즈 숫자)\u003c/p>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p17.jpg\" alt=\"W02 p17 로지스틱 회귀\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p17 로지스틱 회귀\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p18.jpg\" alt=\"W02 p18 결합 전략의 시너지\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p18 결합 전략의 시너지\u003c/figcaption>\u003c/figure>\n\u003cp>신제품·신서비스 출시 성공 확률 (Odds Ratio, 저학습 클러스터 기준)\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>클러스터\u003c/th>\n\u003cth>Model 1 (무통제)\u003c/th>\n\u003cth>Model 2 (통제변수 반영)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DUI 단독\u003c/td>\n\u003ctd>2.49배\u003c/td>\n\u003ctd>2.22배\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>STI 단독\u003c/td>\n\u003ctd>\u003cstrong>3.53배\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>2.36배\u003c/strong> (크게 감소)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DUI/STI 결합\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>7.84배\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>5.06배\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>핵심 시사점\u003c/strong>\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>통제변수(산업, 규모 등) 반영 시 \u003cstrong>STI 단독의 우위가 크게 감소\u003c/strong>한다.\u003c/li>\n\u003cli>이는 \u003cstrong>STI 단독의 성과 일부가 하이테크 업종 특성에 기인\u003c/strong>했음을 시사한다.\u003c/li>\n\u003cli>반면 \u003cstrong>결합 전략은 통제 후에도 5배 이상\u003c/strong>을 기록해 강력한 시너지를 입증했다.\u003c/li>\n\u003c/ul>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">이 &quot;통제 후 STI 단독의 하락&quot;이 이 논문에서 가장 중요한 발견이다. \u003cstrong>&quot;R&amp;D만 하면 된다&quot;는 통념을 데이터로 흔든 것\u003c/strong> — W02-1/06 Lundvall의 경고와 직결된다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-5-지표의-한계와-quot-치고-들어가기-quot-w02-q4\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 지표의 한계와 &quot;치고 들어가기&quot; — W02 Q4\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>김예나 질문\u003c/strong>: DUI 지표가 리스트업은 되어 있는데 실제 조직에서 어떻게 취합·측정하나? 실무에서는 레인지가 넓어 같은 &quot;예스&quot;라도 사람마다 파악 정도가 다르고, O/X 설문이 현실적이지 않은 경우를 많이 봤다.\u003c/li>\n\u003cli>🗣 교수: 대부분 지표는 \u003cstrong>O/X\u003c/strong>이고 몇 회 활용하는지까지는 안 들어갔을 것. 그런데 \u003cstrong>그걸 보고 더 치고 들어갈 수 있다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;그러면 그거 보시고서 여기 더 치고 들어갈 수 있어요. 예를 들어서 워크그룹 활용을 일주일에 한 번 했냐 한 달에 한 번 했냐. 그런 식으로 이걸 더 치고 들어가서 질문을 만들어서 그걸 가지고 물어보고 그걸 찾아내는 게 논문이 되는 거죠. 근데 이거 가지고는 현상을 설명할 수가 없다, 그러면 그 인디케이터를 더 만들면 되죠. … 그냥 DUI 모드가 좋다는 얘기만 하지 말고 실제로 어떻게 했는지 찾아야 돼.&quot;\u003c/p>\u003cspan class=\"quote-time\">2:22:37\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 2007년 논문이니 2000년대 중반 설문. 한국은 워낙 빨리·열심히 일해서 현장(삼성 등)에서 이런 것을 더 많이 할 것.\u003c/li>\n\u003cli>🗣 결론: \u003cstrong>암묵지가 충만한 환경에서 이것을 어떻게 명시화(codify)하고 핸들할 것인가.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>★ \u003cstrong>Term paper 후보\u003c/strong>: 🗣 교수가 이 대목에서 &quot;그게 논문이 된다&quot;고 직접 말했다. DUI 지표를 한국 기업 현장에 맞게 재구성·측정하는 연구. (수업노트 정제 노트에도 term paper 후보로 표시됨)\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c05":{"title":"Mokyr의 지식 프레임 — Ω와 λ","en":"Propositional (Ω) and Prescriptive (λ) Knowledge; Access Costs (Mokyr)","week":"W02-1","href":"W02-1.html#c05","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>경제사학자 Joel Mokyr는 지식을 둘로 나눈다. \u003cstrong>λ(람다) = 처방적 지식\u003c/strong>, 장인의 노하우(&quot;이렇게 하면 된다&quot;, know-how). \u003cstrong>Ω(오메가) = 명제적 지식\u003c/strong>, 과학자의 원리 지식(&quot;왜 그렇게 되는가&quot;, know-why). 산업혁명이 영국에서 일어난 이유는 \u003cstrong>과학자들이 장인의 노하우를 코드화(codify)해서, 그 지식을 배우는 비용(access cost)이 급격히 싸졌기\u003c/strong> 때문이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>옛날에 김치 담그는 법을 배우려면 \u003cstrong>할머니 옆에 몇 년을 붙어 있어야\u003c/strong> 했다. 게다가 안 가르쳐 주신다. 이것이 \u003cstrong>λ, 그리고 높은 접근 비용\u003c/strong>이다.\u003c/p>\n\u003cp>그런데 누군가 &quot;배추의 삼투압과 유산균 발효는 이런 원리다&quot;라고 \u003cstrong>원리를 밝혀 책으로 쓰면\u003c/strong>(Ω), 이제는 책 한 권으로 배울 수 있다. 접근 비용이 급락한다. 게다가 원리를 알면 \u003cstrong>배추가 아닌 다른 재료에도 응용\u003c/strong>할 수 있다.\u003c/p>\n\u003cp>🗣 교수: &quot;그 코스트가 엄청 높았는데, 과학자들이 얘네들의 지식을 코디파이 하니까 이걸 배우면 훨씬 코스트가 싸졌다는 얘기예요. 그래서 산업혁명이 일어났다.&quot;\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c05-h-슬라이드-w02-p19-20\">📄 슬라이드 (W02 p19–20)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p19.jpg\" alt=\"W02 p19 Mokyr vs Lundvall\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p19 Mokyr vs Lundvall\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p20.jpg\" alt=\"W02 p20 지식 융합의 딜레마\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p20 지식 융합의 딜레마\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-1-두-종류의-지식\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 종류의 지식 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>λ (람다) 처방적 지식\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>Ω (오메가) 명제적 지식\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>영어\u003c/td>\n\u003ctd>Prescriptive knowledge\u003c/td>\n\u003ctd>Propositional knowledge\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>내용\u003c/td>\n\u003ctd>현장의 노하우, 경험적 기술 수칙\u003c/td>\n\u003ctd>기술의 원리를 설명하는 과학적 지식\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>질문\u003c/td>\n\u003ctd>\u003cstrong>Know-how\u003c/strong> (&quot;이렇게 이렇게 하면 됩니다&quot;)\u003c/td>\n\u003ctd>\u003cstrong>Know-why\u003c/strong> (왜 그렇게 되는가)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>주체\u003c/td>\n\u003ctd>장인\u003c/td>\n\u003ctd>과학자\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>대응\u003c/td>\n\u003ctd>암묵지, DUI\u003c/td>\n\u003ctd>형식지, STI\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-2-코드화-접근-비용-감소-산업혁명\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">코드화 → 접근 비용 감소 → 산업혁명 ★\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;옛날에 장인들이 하는 지식을 알려면 옆에 가서 보고 배워야 되잖아요. 그럼 안 가르쳐 주지. 그 코스트가 엄청 높았는데, 과학자들이 얘네들의 지식을 코디파이 하니까 이걸 배우면 훨씬 코스트가 싸졌다는 얘기예요. 그래서 산업혁명이 일어났다.&quot;\u003c/p>\u003cspan class=\"quote-time\">36:39\u003c/span>\u003c/blockquote>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">슬라이드 정리: 과학적 이해(Ω)가 현장 노하우(λ)의 원리를 규명하고 부호화할 때, 기술 탐색 시 발생하는 \u003cstrong>무수한 시행착오 및 접근 비용(access costs)이 급격히 감소\u003c/strong>한다.\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>🗣 \u003cstrong>특허도 같은 논리\u003c/strong>: 안 가르쳐 주는 대신 \u003cstrong>코드화해서 공개하고 몇 년간 보호\u003c/strong>해 준다. Newton 등이 코드화의 역할을 했다.\u003c/li>\n\u003cli>🗣 즉 Mokyr는 \u003cstrong>명시적 지식을 만드는 그룹\u003c/strong>에 무게를 둔다. \u003cstrong>성장의 문화(A Culture of Growth) = 코드화하는 사람들이 많이 생기는 것.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-3-영국의-지리적-산업적-조건-w02-4-1\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 영국의 지리적·산업적 조건 (W02 §4-1)\u003c/p>\n\u003cp>Mokyr의 설명에 교수가 덧붙인 현장 배경:\u003c/p>\n\u003cul>\n\u003cli>영국 북부(맨체스터·리버풀·셰필드)는 \u003cstrong>우리로 치면 부산·경남\u003c/strong> 같은 곳.\u003c/li>\n\u003cli>\u003cstrong>Peak District\u003c/strong>의 선상지에 비가 많이 와 \u003cstrong>수차(물레방아) 공장\u003c/strong>이 많았다.\u003c/li>\n\u003cli>면직물 원료는 미국 식민지 조지아의 \u003cstrong>목화\u003c/strong> → 리버풀로 → 면직물로 만들어 수출. 맨체스터엔 아직도 그 공장 건물들이 있다.\u003c/li>\n\u003cli>\u003cstrong>석탄\u003c/strong>도 많아 \u003cstrong>증기기관\u003c/strong>으로 이어짐.\u003c/li>\n\u003cli>🗣 결론: \u003cstrong>산업이 있고, 거기에 과학을 끌어다 쓴 것.\u003c/strong> 산업은 계속 있었지만 명시적 지식을 만드는 그룹이 없었는데, 이들이 등장하면서 산업혁명이 시작됐다.\u003c/li>\n\u003c/ul>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">이 마지막 문장이 중요하다. \u003cstrong>Ω가 먼저가 아니라 λ(산업)가 먼저 있었다.\u003c/strong> 그래서 다음 개념(W02-1/06 Lundvall의 경고)으로 자연스럽게 넘어간다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-4-이-논리를-한국에-적용한-사람들\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 이 논리를 한국에 적용한 사람들\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Martin Bell &amp; Keith Pavitt\u003c/strong> (SPRU, 교수의 유학처. 제자 중 한국인이 많음) → W02-1/08.\u003c/li>\n\u003cli>\u003cstrong>Linsu Kim(김인수)\u003c/strong> (고려대, \u003cem>Imitation to Innovation\u003c/em>) — 한국이 왜 성공했는지를 세계에 알림 → W02-1/09, W02-1/10.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-5-mokyr-소개-여담이지만-기억에-남는-대목\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 Mokyr 소개 (여담이지만 기억에 남는 대목)\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Joel Mokyr\u003c/strong>: 2025년 노벨 경제학상. 역사학자로 산업혁명부터 풀어 감. \u003cem>A Culture of Growth\u003c/em>.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;Mokyr 들어보셨어요? 안 들어보셨어요? 아, 교양이 없어. 노벨 경제학상 수상자 정도는 알아야지.&quot;\u003c/p>\u003cspan class=\"quote-time\">34:xx\u003c/span>\u003c/blockquote>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c06":{"title":"불만족스러운 혁신 — Lundvall의 경고","en":"Unsatisfactory Innovation (Lundvall)","week":"W02-1","href":"W02-1.html#c06","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>과학에 투자하면 혁신이 나온다는 생각은 틀렸다. \u003cstrong>현장 사용자의 맥락과 역량을 무시한 채 R&amp;D만 밀어붙이면\u003c/strong>, 아무도 쓰지 않는 혁신이 빠르게 만들어진다. 이것이 \u003cstrong>불만족스러운 혁신\u003c/strong>이다. 🗣 교수의 한마디로는 \u003cstrong>&quot;산업이 과학을 끌고 가야지, 무조건 과학기술을 푸시한다고 산업이 되는 게 아니다.&quot;\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>동네 국밥집에 정부가 \u003cstrong>최신 자동조리 로봇\u003c/strong>을 지원해 줬다고 하자. 기술적으로는 완벽하다. 그런데 사장님은 혼자 일하고, 손님은 &quot;손맛&quot;을 보러 오고, 전기요금은 감당이 안 된다. 로봇은 구석에서 먼지가 쌓인다.\u003c/p>\n\u003cp>기술이 나빠서가 아니다. \u003cstrong>쓰는 사람의 사정을 안 물어봤기 때문\u003c/strong>이다. 더 무서운 것은, Ω(과학 지식)가 발달한 덕분에 이 로봇을 \u003cstrong>아주 빠르고 싸게\u003c/strong> 만들 수 있었다는 점이다. 🗣 &quot;현장 능력이 부재한 상태에서 STI를 추진하면 \u003cstrong>잘못된 수를 빨리 두게\u003c/strong> 된다.&quot;\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c06-h-슬라이드-w02-p19-p21\">📄 슬라이드 (W02 p19, p21)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p19.jpg\" alt=\"W02 p19 Mokyr vs Lundvall\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p19 Mokyr vs Lundvall\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p21.jpg\" alt=\"W02 p21 불만족스러운 혁신의 구조적 원인\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p21 불만족스러운 혁신의 구조적 원인\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-1-문제의-출발-quot-그럼-sti에-투자하면-되겠네-quot\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 문제의 출발: &quot;그럼 STI에 투자하면 되겠네&quot;\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;무게의 문제가 뭐냐 하면, &#39;그래 그러면 STI한테 투자하면 되겠네&#39;라는 생각을 사람들이 하는 거예요. 과학기술자한테 투자하면 당연히 성과가 나오겠다라고 생각을 하는 거. 그게 아니야. \u003cstrong>산업이 과학을 끌고 가야 돼.\u003c/strong> 산업이 과학기술에 가서 자기가 필요한 거 갖다 써먹어야지, 무조건 과학기술 푸시한다고 산업이 되는 게 아니야.&quot;\u003c/p>\u003cspan class=\"quote-time\">56:58\u003c/span>\u003c/blockquote>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;나라 입장에서는 그게 편하지. 연구자하고 하는 게 국장님도 그게 편하지. 현장에서는 우리가 그 바보 같은 짓을 계속하고 있는지도 몰라.&quot;\u003c/p>\u003cspan class=\"quote-time\">58:07\u003c/span>\u003c/blockquote>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">왜 정책은 자꾸 STI로 기우는가 — \u003cstrong>측정하기 쉽고 상대하기 쉽기 때문\u003c/strong>이다. R&amp;D 예산, 논문 수, 특허 수는 세기 쉽다. 반면 &quot;현장 역량&quot;은 세기 어렵다(→ W02-1/04가 그것을 세려 한 시도).\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-2-구조적-원인-3단계-슬라이드-p21\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">구조적 원인 3단계 📄 (슬라이드 p21)\u003c/p>\n\u003cpre>\u003ccode>1. 생산자 지배 (Producer Dominance) / 정보 비대칭 (Info Asymmetry)\n              ↓\n2. 기술 궤적의 괴리 (Diverging Technological Trajectory)\n              ↓\n3. 불만족스러운 혁신 (Dead End / Unsatisfactory Innovation)\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>단계\u003c/th>\n\u003cth>📄 내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>① 생산자 지배·정보 비대칭\u003c/td>\n\u003ctd>생산자가 재무적·기술적 역량을 독점하고 \u003cstrong>사용자의 역량이 낮을 때\u003c/strong> 발생 (예: 초기 소비재, 미세전자산업)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>② 기술 궤적의 괴리\u003c/td>\n\u003ctd>기술 혁신의 궤적이 \u003cstrong>실제 시장의 니즈를 무시한 채 생산자의 R&amp;D 논리대로만\u003c/strong> 고착화됨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>③ 불만족스러운 혁신\u003c/td>\n\u003ctd>Dead End\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>해결책\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>사용자의 기술 수용성 및 피드백 역량을 강화\u003c/strong>하여 시장 내 정보의 균형을 맞춰야 함\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-3-사례\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">사례\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>낙농 공정(Dairy Processing)의 과도한 자동화\u003c/strong>: 엔지니어링 기업이 사용자의 실제 비용 구조와 운영 습관을 무시하고 과도하게 자본집약적·자동화된 설비를 공급 → 현장에서 비효율과 외면.\u003c/li>\n\u003cli>🗣 \u003cstrong>한국의 디지털 전환(DX)\u003c/strong>: 정부가 돈을 많이 썼지만 잘 안 됐다. 현장에서는 \u003cstrong>왜 하는지 모르고, 소화할 역량이 없기\u003c/strong> 때문. 중견기업은 하지만 \u003cstrong>영세기업은 여력이 없다.\u003c/strong> \u003cstrong>AX도 같은 길을 갈 수 있다.\u003c/strong>\u003c/li>\n\u003cli>🗣 미국은 원래 &quot;시장이 알아서 할 텐데 왜 정부가 R&amp;D를 하냐&quot;는 입장이었고, 하다 보니 \u003cstrong>의미 없는 특허만 만드는 사람들\u003c/strong>도 나왔다.\u003c/li>\n\u003cli>🗣 \u003cstrong>지금 한국·중국 시스템은 다 technology push, 공급 중심이다.\u003c/strong> ★\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-4-쓰는-사람의-관점-유용-무용이-아니라-좋다-싫다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 쓰는 사람의 관점: 유용/무용이 아니라 좋다/싫다 ★\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;사용자 입장에서는 결국 &#39;이거 아닌데&#39;, &#39;이거 잘 모르겠는데&#39;, 심지어 GMO나 이런 것들은 &#39;이거 싫어&#39;. AI 데이터센터 &#39;싫어&#39;. 그러니까 이게 유용하고 안 유용하고가 아니고 \u003cstrong>좋다 싫다\u003c/strong>가 돼버리는 거예요. 이게 우리 라이프스타일 아니야.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:00:43\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 \u003cstrong>유럽의 에어컨
