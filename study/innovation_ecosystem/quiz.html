ref":"W02-1.html#c11","html":"\u003cp>★ &quot;공급이나 세제 지원 이전에 시장 경쟁 압력이 핵심&quot;이라는 주장의 근거를 서술하라. 세제 지원을 먼저 하면 왜 효과가 없는가?\u003c/p>","text":"★ \"공급이나 세제 지원 이전에 시장 경쟁 압력이 핵심\"이라는 주장의 근거를 서술하라. 세제 지원을 먼저 하면 왜 효과가 없는가?","isComparison":false},{"id":"W02-1/c11/2","conceptId":"W02-1/c11","index":2,"week":"W02-1","no":11,"href":"W02-1.html#c11","html":"\u003cp>IPR 강화가 후발국의 자체 R&amp;D를 촉발한 메커니즘을 설명하라. (역공학 차단의 역설)\u003c/p>","text":"IPR 강화가 후발국의 자체 R&D를 촉발한 메커니즘을 설명하라. (역공학 차단의 역설)","isComparison":false},{"id":"W02-1/c11/3","conceptId":"W02-1/c11","index":3,"week":"W02-1","no":11,"href":"W02-1.html#c11","html":"\u003cp>응용: 이 4대 동인 프레임으로 현재 한국의 AI·반도체 상황을 진단하면 무엇이 부족한가? (Korea Paradox와 연결)\u003c/p>","text":"응용: 이 4대 동인 프레임으로 현재 한국의 AI·반도체 상황을 진단하면 무엇이 부족한가? (Korea Paradox와 연결)","isComparison":false},{"id":"W02-1/c12/0","conceptId":"W02-1/c12","index":0,"week":"W02-1","no":12,"href":"W02-1.html#c12","html":"\u003cp>★ 하이테크 산업과 전통 제조업이 각각 어떤 지식 모드를 보완해야 하는지 설명하라. KIBS의 역할은?\u003c/p>","text":"★ 하이테크 산업과 전통 제조업이 각각 어떤 지식 모드를 보완해야 하는지 설명하라. KIBS의 역할은?","isComparison":false},{"id":"W02-1/c12/1","conceptId":"W02-1/c12","index":1,"week":"W02-1","no":12,"href":"W02-1.html#c12","html":"\u003cp>★ &quot;지식 모드의 결합&quot;과 &quot;수요 중심 정책&quot;이 결국 같은 주장인 이유를 설명하라.\u003c/p>","text":"★ \"지식 모드의 결합\"과 \"수요 중심 정책\"이 결국 같은 주장인 이유를 설명하라.","isComparison":false},{"id":"W02-1/c12/2","conceptId":"W02-1/c12","index":2,"week":"W02-1","no":12,"href":"W02-1.html#c12","html":"\u003cp>★ DUI mode의 lock-in을 돌파하는 방안을 세 가지 이상 제시하고 근거를 서술하라. (Discussion Q1)\u003c/p>","text":"★ DUI mode의 lock-in을 돌파하는 방안을 세 가지 이상 제시하고 근거를 서술하라. (Discussion Q1)","isComparison":false},{"id":"W02-2/c01/0","conceptId":"W02-2/c01","index":0,"week":"W02-2","no":1,"href":"W02-2.html#c01","html":"★ 지식을 공공재로 보는 논리(비배제성·비경합성)와 그 정책 결론을 설명하라.","text":"★ 지식을 공공재로 보는 논리(비배제성·비경합성)와 그 정책 결론을 설명하라.","isComparison":false},{"id":"W02-2/c01/1","conceptId":"W02-2/c01","index":1,"week":"W02-2","no":1,"href":"W02-2.html#c01","html":"★ 이 논리가 생략한 것은 무엇인가? (&quot;지식이 실제로 쓰이기 위한 조건&quot;)","text":"★ 이 논리가 생략한 것은 무엇인가? (\"지식이 실제로 쓰이기 위한 조건\")","isComparison":false},{"id":"W02-2/c01/2","conceptId":"W02-2/c01","index":2,"week":"W02-2","no":1,"href":"W02-2.html#c01","html":"비교형: 공공재 논리와 W01/06의 시장 실패 프레임의 관계를 설명하라.","text":"비교형: 공공재 논리와 W01/06의 시장 실패 프레임의 관계를 설명하라.","isComparison":true},{"id":"W02-2/c02/0","conceptId":"W02-2/c02","index":0,"week":"W02-2","no":2,"href":"W02-2.html#c02","html":"★ 선형모형과 Kealey의 반문을 대비해 설명하라. 인과의 방향이 어떻게 뒤집히는가?","text":"★ 선형모형과 Kealey의 반문을 대비해 설명하라. 인과의 방향이 어떻게 뒤집히는가?","isComparison":true},{"id":"W02-2/c02/1","conceptId":"W02-2/c02","index":1,"week":"W02-2","no":2,"href":"W02-2.html#c02","html":"Kealey의 정책적 함의가 &quot;과학은 쓸모없다&quot;가 아닌 이유를 설명하라.","text":"Kealey의 정책적 함의가 \"과학은 쓸모없다\"가 아닌 이유를 설명하라.","isComparison":false},{"id":"W02-2/c02/2","conceptId":"W02-2/c02","index":2,"week":"W02-2","no":2,"href":"W02-2.html#c02","html":"비교형: 공공재론·Kealey·Callon의 세 입장을 &quot;지식의 성격&quot;과 &quot;정부의 역할&quot;로 비교하라.","text":"비교형: 공공재론·Kealey·Callon의 세 입장을 \"지식의 성격\"과 \"정부의 역할\"로 비교하라.","isComparison":true}],"answers":{"W01/c01":{"title":"사회 속의 시스템 — 정치·경제·혁신 활동","en":"System in a Society — Political / Economic / Innovation Activity","week":"W01","href":"W01.html#c01","byIndex":{"0":"\u003cp>정치·경제·혁신 활동은 모두 사람이 혼자 살 수 없어 생기는 \u003cstrong>집단행동문제(collective action problem)\u003c/strong>를 푸는 서로 다른 방식이다.\u003c/p>\n\u003cp>\u003cstrong>정치활동\u003c/strong>은 가치를 \u003cstrong>권위적으로 배분\u003c/strong>한다. 대통령·국회에 권위를 위임해 대신 정하게 하는 집단적 결정(collective decision-making) 방식이다(Easton, 1953).\u003c/p>\n\u003cp>\u003cstrong>경제활동\u003c/strong>은 가치를 \u003cstrong>시장적으로 배분\u003c/strong>한다. 희소자원을 가격으로 나누지만, 실은 동등한 두 당사자의 \u003cstrong>1:1 계약\u003c/strong>들이 모인 것이라 집단적 결정이라 부르기는 애매하다.\u003c/p>\n\u003cp>\u003cstrong>혁신활동\u003c/strong>은 나누는 것이 아니라 \u003cstrong>값어치 있는 새 지식을 창출\u003c/strong>하는 활동이다. Schumpeter식 기업가의 solo act처럼 보이지만 실은 여럿이 얽힌 집단적 활동이다.\u003c/p>\n\u003cp>셋을 묶는 것은 결국 &quot;함께&quot; 문제를 풀어야 한다는 collective action problem이며, 이것이 이 수업이 혁신을 시스템으로 보는 출발점이다.\u003c/p>\n","1":"\u003cp>이 수업의 입장은 혁신이 solo act가 아니라 \u003cstrong>collective한 활동\u003c/strong>이라는 것이다.\u003c/p>\n\u003cp>교수는 잡스·게이츠를 예로 들며, 겉보기에는 천재 한 명이 이룬 일 같지만 &quot;\u003cstrong>이미 누군가 하고 있었던\u003c/strong>&quot; 일을 이들이 &quot;이거 되겠다&quot; 하며 치고 나온 것일 뿐이라고 설명한다.\u003c/p>\n\u003cp>그리고 그 판단이 성공으로 이어진 결정적 이유는 \u003cstrong>시장이 그것을 당겨 줬기 때문\u003c/strong>이다 — 같은 판단을 한 사람 중에는 망한 사람도 있었지만, 시장의 수요가 잡스·게이츠의 시도를 끌어올렸다.\u003c/p>\n\u003cp>즉 혁신은 한 개인의 통찰만으로 완성되지 않고, 선행하는 시도와 그것을 받아들이는 시장(수요자)이라는 여러 행위자가 얽혀야 일어난다. 그래서 이 수업은 혁신을 개인이 아니라 \u003cstrong>혁신시스템\u003c/strong>으로 다룬다.\u003c/p>\n","2":"\u003cp>교수는 혁신활동을 &quot;\u003cstrong>값어치 있는 지식을 만드는 활동\u003c/strong>&quot;이라고 정의한다.\u003c/p>\n\u003cp>여기서 핵심은 &quot;지식을 만든다&quot;는 것 자체가 아니라 그 지식에 \u003cstrong>값어치(가치)가 붙는지 여부\u003c/strong>다. 논문을 쓰는 것처럼 지식을 만들기만 하면 그것은 그냥 \u003cstrong>지식 활동\u003c/strong>이다.\u003c/p>\n\u003cp>반면 그 지식이 경제적(혹은 정치적) 가치를 인정받아 실제로 쓰이게 되면 비로소 \u003cstrong>혁신\u003c/strong>이라 부른다. 즉 지식 활동과 혁신의 차이는 지식이 존재하느냐가 아니라 그 지식이 \u003cstrong>가치를 창출하느냐\u003c/strong>에 있다.\u003c/p>\n\u003cp>이 정의는 앞선 비교표의 &quot;혁신활동 = 경제(·정치) 가치의 창출&quot;이라는 슬라이드 표현과 정확히 대응하며, 혁신을 정치·경제와 나란히 놓고 시스템으로 보는 이 수업 전체의 틀을 이룬다.\u003c/p>\n"}},"W01/c02":{"title":"인간–제도–과학기술의 상호구성","en":"Co-constitution of Actors, Institutions and Socio-technical Systems (Geels 2004)","week":"W01","href":"W01.html#c02","byIndex":{"0":"\u003cp>Geels(2004)는 사회를 \u003cstrong>규칙·제도\u003c/strong>, \u003cstrong>인간·조직\u003c/strong>, \u003cstrong>사회기술시스템(물질세계)\u003c/strong> 세 축의 상호구성으로 본다.\u003c/p>\n\u003cp>\u003cstrong>규칙·제도\u003c/strong>는 도덕·공공정책·법 등이고, \u003cstrong>인간·조직\u003c/strong>은 lifestyle·관행·조직 routine이다. 이 두 축만 보는 것이 기존 사회과학의 범위다 — Adam Smith도 분업·전문화는 얘기했지만 과학기술 자체는 다루지 않았다.\u003c/p>\n\u003cp>Geels의 프레임은 여기에 지구·생태계·원자력·디지털 같은 \u003cstrong>사회기술시스템\u003c/strong> 축을 세 번째로 더한다. 기술은 사람이 만들지만, 일단 깔리면 사람의 행동 범위와 제도까지 거꾸로 바꾼다고 보는 것이다.\u003c/p>\n\u003cp>따라서 기존 사회과학과 다른 점은 \u003cstrong>물질세계(과학기술)를 사회 설명의 독립적 축으로 넣었다는 것\u003c/strong>이며, 세 축이 일방적 인과가 아니라 서로를 만들어 가는 \u003cstrong>상호구성\u003c/strong> 관계라는 점이다.\u003c/p>\n","1":"\u003cp>④와 ⑤는 방향이 반대인 관계다. ④는 시스템이 인간을 규정하고, ⑤는 규칙이 시스템에 새겨진다.\u003c/p>\n\u003cp>\u003cstrong>④(시스템 → 인간·조직)\u003c/strong>는 인공물·물질조건이 행동의 가능성과 한계, 즉 맥락을 구성한다는 것이다. 교수는 서울 사람과 부산 사람의 24시간이 다르다는 예를 든다 — 서울은 뒷골목까지 전철이 들어가지만 부산은 그렇지 않아, 같은 하루도 전혀 다른 삶이 된다.\u003c/p>\n\u003cp>\u003cstrong>⑤(규칙 → 시스템)\u003c/strong>는 규칙이 인공물의 디자인 목적과 기능에 새겨진다(inscribe)는 것이다. AI 챗봇 \u003cstrong>이루다\u003c/strong>는 어떻게 교육시키느냐에 따라 결과가 달라졌고, 이는 기술이 중립적이지 않다는 Winner(1980)의 논지와 같다.\u003c/p>\n\u003cp>\u003cstrong>전력망\u003c/strong> 사례는 이 둘이 맞물리는 지점을 보여 준다. 원전·화력 집중 발전이라는 시스템(④)이 송전망 건설을 &quot;당연한 효율&quot;로 만들고, 동시에 그 전체 효율의 논리라는 규칙이 반대 주민을 &quot;이상한 사람&quot;으로 만드는 방식으로 시스템에 새겨진다(⑤).\u003c/p>\n","2":"\u003cp>\u003cstrong>역적응(reverse adaptation)\u003c/strong>이란 사람이 편하려고 만든 수단에 오히려 사람이 맞춰 가는 현상, 즉 수단이 목적을 가려 버리는 것이다.\u003c/p>\n\u003cp>전력망 사례에서 이는 다음과 같이 나타난다. 원전·화력 집중 발전 시스템에서는 송전망 건설이 전체 효율에 맞다고 전제된다. 지역 주민이 반대하면 &quot;전체 시스템을 위해 왜 고집이냐&quot;는 시각이 나오는데, 이것이 바로 \u003cstrong>효율성을 위해 사람을 시스템에 맞추라는 역적응 논리\u003c/strong>다.\u003c/p>\n\u003cp>원래 전력망은 사람을 편하게 하려는 수단이었지만, 논의의 무게중심이 &quot;시스템 효율&quot;로 옮겨 가면서 그 수단 자체가 목적처럼 다뤄지고 주민의 요구는 시스템에 대한 비합리적 저항으로 취급된다.\u003c/p>\n\u003cp>이런 역적응이 분산형 태양광 같은 대안이 나오는 배경이며, W01/05의 사용자 고착에서 기술 고착이 사회적 관습으로 내재화되는 메커니즘으로 다시 등장한다.\u003c/p>\n"}},"W01/c03":{"title":"인간에 대한 4가지 기본 이해","en":"Four Views of the Human — Rational / Social / Tool-using / Learning","week":"W01","href":"W01.html#c03","byIndex":{"0":"\u003cp>이 수업은 경제학의 합리적 행위자 가정을 넘어 인간을 네 겹으로 본다. ① \u003cstrong>합리적으로 선택하는 인간\u003c/strong>, ② \u003cstrong>사회적 관계 속의 인간\u003c/strong>, ③ \u003cstrong>도구를 사용하는 인간\u003c/strong>, ④ \u003cstrong>학습하는 인간\u003c/strong>이다.\u003c/p>\n\u003cp>①은 유틸리티를 계산하는 Entrepreneur의 원형이고, ②는 가족·학연·국가 같은 관계 속의 Civic Actor의 원형이며, ③은 도구·SOC 속에서 살아가는, 기술화(technologization)된 존재다.\u003c/p>\n\u003cp>혁신학이 가장 강조하는 것은 ④ \u003cstrong>학습하는 인간\u003c/strong>이다. 혁신활동의 정의 자체가 &quot;값어치 있는 지식을 만드는 것&quot;이므로, 지식을 습득·축적·창출하는 학습 역량이 곧 혁신 역량과 직결되기 때문이다.\u003c/p>\n\u003cp>그래서 이 인간관은 나머지 셋을 배제하지 않으면서도, 혁신을 다루는 이 수업의 중심 렌즈로 기능한다.\u003c/p>\n","1":"\u003cp>\u003cstrong>동태적 효율성(dynamic efficiency)\u003c/strong>이란 시간이 갈수록 더 잘하게 되는 능력, 즉 &quot;어제보다 오늘이 낫고 내일이 더 나은&quot; 상태를 가리키는 개념이다.\u003c/p>\n\u003cp>이는 주어진 자원을 지금 최적으로 배분하는 정태적 효율성과 대비된다. 동태적 효율성의 핵심은 배분의 최적화가 아니라 \u003cstrong>역량 자체가 시간에 따라 향상되는 것\u003c/strong>에 있다.\u003c/p>\n\u003cp>이것이 학습하는 인간과 직결되는 이유는, 혁신학이 말하는 학습(learning by doing/using/interacting)이 바로 이런 시간에 따른 역량 향상의 과정이기 때문이다. 교수는 한국이 이런 학습 DNA를 조선 성리학의 \u003cstrong>수기치인(修己治人)\u003c/strong>적 자기 수양 전통에서 찾으며, 과학기술 역량뿐 아니라 봉준호·박찬욱 같은 문화적 역량도 여기서 나온다고 본다.\u003c/p>\n\u003cp>즉 동태적 효율성은 학습하는 인간관을 &quot;시간이 지나면 더 잘한다&quot;는 명제로 구체화한 개념이며, 혁신 역량은 결국 이 동태적 효율성을 얼마나 쌓았는가의 문제다.\u003c/p>\n","2":"\u003cp>\u003cstrong>전문가 인식론\u003c/strong>은 안전(safety)을 과학적 판정의 문제로 다루지만, \u003cstrong>시민 인식론\u003c/strong>은 그 판정을 믿는 안심(assurance)의 문제를 따로 요구한다 — 안전과 안심은 다르다.\u003c/p>\n\u003cp>후쿠시마 사례에서 정부는 농산물에 대해 공식적으로 안전 판정을 내렸다. 그러나 협동조합의 엄마들은 그 판정을 그대로 받아들이지 않고 \u003cstrong>직접 방사능 검사를 했다.\u003c/strong>\u003c/p>\n\u003cp>이는 전문가가 &quot;안전하다&quot;고 말하는 것과 일반인이 &quot;안심&quot;을 느끼는 것이 서로 다른 메커니즘으로 만들어짐을 보여 준다. 전문가 인식론은 검증된 절차와 권위에 근거하지만, 시민 인식론은 스스로 확인하는 과정을 통해서만 안심이라는 결과에 도달한다.\u003c/p>\n\u003cp>교수는 이런 태도를 단순한 &#39;선동&#39;으로 치부하는 시각을 경계하며, 안심이 어떻게 만들어지는가를 물어야 한다고 강조한다. 이 사례는 이후 Scientific Citizenship(신고리 공론화)으로 이어진다.\u003c/p>\n"}},"W01/c04":{"title":"혁신 → 혁신시스템 → 시스템 혁신의 층위","en":"Innovation / Innovation System / System Innovation (Transition)","week":"W01","href":"W01.html#c04","byIndex":{"0":"\u003cp>혁신은 \u003cstrong>혁신\u003c/strong>(새 제품·서비스), \u003cstrong>혁신시스템\u003c/strong>(그것을 만드는 행위자 체제), \u003cstrong>시스템 혁신\u003c/strong>(생산과 소비를 아우르는 시스템 전체의 변화) 세 층위로 커진다.\u003c/p>\n\u003cp>혁신은 더 좋은 제품 하나를 만드는 층위이고, 혁신시스템은 그 제품을 만들어 내는 회사·연구소·정부·표준의 네트워크다. 시스템 혁신은 여기서 더 나아가 제품을 둘러싼 인프라·제도·습관까지 통째로 바뀌는 것을 뜻한다.\u003c/p>\n\u003cp>이 수업이 세 번째 층위에 주목하는 이유는 기후변화가 보여 주는 \u003cstrong>carbon lock-in\u003c/strong> 때문이다. 좋은 친환경 기술 하나를 만든다고 문제가 풀리지 않는다 — 시스템 자체가 화석연료에 고착되어 있어 잘 바뀌지 않는다.\u003c/p>\n\u003cp>반면 테슬라나 이를 캐치업한 BYD는 자동차 회사가 아니라 데이터·소프트웨어 중심의 \u003cstrong>테크 회사\u003c/strong>로 출발했기 때문에 내연기관 회사와 달리 이 고착에서 벗어날 수 있었다. 이처럼 기술 하나가 아니라 시스템 전체의 변화가 이 수업의 관심사다.\u003c/p>\n","1":"\u003cp>혁신시스템은 범위가 좁은 순서로 \u003cstrong>연구시스템 → 국가/산업 혁신시스템 → 사회기술시스템\u003c/strong>의 세 층위를 이룬다.\u003c/p>\n\u003cp>\u003cstrong>연구시스템\u003c/strong>은 연구자–중재/중개기관–정부(sponsor)로 이루어진 가장 좁은 시스템이다. \u003cstrong>국가/산업 혁신시스템\u003c/strong>은 기업과 그를 둘러싼 산업생태계·혁신생태계를 포함해 산업·기업 중심으로 확장된 범위다.\u003c/p>\n\u003cp>\u003cstrong>사회기술시스템\u003c/strong>은 여기서 한 단계 더 나아가 \u003cstrong>생산과 소비를 아우르는\u003c/strong> 시스템이다. 즉 국가혁신시스템이 만드는(생산) 쪽 행위자에 초점을 둔다면, 사회기술시스템은 그것을 쓰는(소비) 사용자까지 시스템의 구성원으로 포함한다는 점이 다르다.\u003c/p>\n\u003cp>이 확장은 W01/10의 &quot;구조의 차이&quot;(NIS 등)와 &quot;구조의 변화&quot;(StS 등) 구분과도 맞물리며, 소비자까지 포함해야 시스템이 실제로 바뀌는 과정을 설명할 수 있다는 이 수업의 입장을 뒷받침한다.\u003c/p>\n","2":"\u003cp>\u003cstrong>Korea Paradox\u003c/strong>란 정부·민간 R&amp;D 투자가 세계 최고 수준임에도 불구하고 그에 걸맞은 혁신 성과, 특히 &quot;우리는 왜 AI를 먼저 못 만들었을까&quot;라는 질문으로 대표되는 성과 정체가 나타나는 현상이다.\u003c/p>\n\u003cp>교수는 이 원인을 &quot;\u003cstrong>너무 정부가 중심에 서 있다\u003c/strong>&quot;는 데서 찾는다. 그 분야에 있던 사람들은 이미 가능성을 알고 있었을 텐데도 성과로 이어지지 못했다는 것이다.\u003c/p>\n\u003cp>이는 탈개발국가(post-developmental state) 논의와 연결된다. 한국은 국가가 나서서 주도하며 강한 관료 시스템을 발전시켰고, 이 \u003cstrong>탑다운\u003c/strong> 구조가 추격 단계에서는 성공의 동력이었다. 장경섭 교수가 지적하듯 이제는 이 탑다운을 어떻게 극복할 것인가, 즉 지방화·지역혁신으로의 전환이 21세기 한국의 과제로 남는다.\u003c/p>\n\u003cp>따라서 Korea Paradox는 투입의 문제가 아니라 정부 중심 구조라는 \u003cstrong>시스템의 문제\u003c/strong>로 읽어야 한다는 것이 교수의 진단이다.\u003c/p>\n"}},"W01/c05":{"title":"세 가지 고착 — 조직·기술·사용자 lock-in","en":"Lock-in — Organisational / Technological / User","week":"W01","href":"W01.html#c05","byIndex":{"0":"\u003cp>시스템이 잘 안 바뀌는 이유는 \u003cstrong>조직·기술·사용자\u003c/strong> 세 군데에서 동시에 고착(lock-in)되어 있기 때문이다.\u003c/p>\n\u003cp>\u003cstrong>조직 고착\u003c/strong>은 성공 공식에 갇혀 제도화된 조직 routine·inertia로 새 시도를 어렵게 만드는 것이다(Johnson 2010). \u003cstrong>개발국가 멘탈리티\u003c/strong>가 그 예다 — 정부 주도 성공 방식이 성공했기 때문에 오히려 그 틀에서 벗어나지 못한다.\u003c/p>\n\u003cp>\u003cstrong>기술 고착\u003c/strong>은 지배적 디자인이 최고가 아니어도 한 번 깔리면 바뀌지 않는 현상이다(David 1985, Arthur 1988). \u003cstrong>QWERTY 키보드\u003c/strong>가 대표 사례로, 더 나은 배열이 가능했지만 이미 익숙해진 표준을 바꿀 수 없었다.\u003c/p>\n\u003cp>\u003cstrong>사용자 고착\u003c/strong>은 소비가 기술 기반의 사회적 관습으로 내재화되는 것이다(Lim 2012). \u003cstrong>영국의 전기포트\u003c/strong>가 그 예로, 저녁 뉴스가 끝나는 시각에 모두가 차를 끓이며 전력 피크가 발생하는 것은 소비가 이미 기술에 깊이 의존함을 보여 준다.\u003c/p>\n","1":"\u003cp>기술 고착을 만드는 메커니즘은 \u003cstrong>한계 체증(increasing returns)\u003c/strong>이며, 다섯 요소가 있다: 규모의 경제(공급), 학습, 성장에 대한 기대, \u003cstrong>네트워크 경제\u003c/strong>(수요 측면 규모의 경제), 기술 연결성.\u003c/p>\n\u003cp>이 요소들은 먼저 채택된 기술일수록 더 유리해지도록 서로를 강화한다. 단가가 낮아지고(규모의 경제), 다루는 사람이 늘수록 익숙해지며(학습), 커질 거란 기대가 채택을 부르고(성장 기대), 사용자가 많을수록 가치가 커지며(네트워크 경제), 주변 기술이 거기에 맞춰 연결된다(기술 연결성).\u003c/p>\n\u003cp>그 결과 지배적 디자인을 지원하는 \u003cstrong>사회기술시스템 전체가 함께 자리 잡고\u003c/strong>, 인프라의 비용 무게(매몰비용) 때문에 더 나은 대안이 나와도 쉽게 바뀌지 않는다.\u003c/p>\n\u003cp>즉 지배적 디자인이 &quot;최고가 아니어도&quot; 유지되는 이유는 기술 자체의 우수성이 아니라, 먼저 자리 잡은 데서 오는 누적적 이점과 이미 깔린 인프라의 무게 때문이다.\u003c/p>\n","2":"\u003cp>정부 주도 R&amp;D의 기본 논리인 &quot;\u003cstrong>잘하는 애한테 몰아주면 뭔가 나온다\u003c/strong>&quot;는 추격(catch-up) 단계에서는 통했지만 프론티어에서는 통하지 않는다.\u003c/p>\n\u003cp>추격 단계에서는 따라잡아야 할 목표(선도국의 기술)가 이미 분명하므로, 자원을 검증된 소수에게 집중하는 것이 효율적이다. 한국·일본·중국의 성공이 이를 보여 준다 — 방향이 정해져 있을 때는 몰아주기가 곧 속도다.\u003c/p>\n\u003cp>그러나 프론티어에서는 가야 할 방향 자체가 정해져 있지 않다. 이때 소수에게만 자원을 몰아주는 것은 조직 고착의 국가 버전으로 작동해, 성공했던 방식을 반복하며 새로운 시도(변이, variety)의 씨앗을 없애 버린다.\u003c/p>\n\u003cp>즉 추격 단계는 고착을 활용하는 전략이 유효하지만, 프론티어에서는 고착을 깨는 다양성이 필요하다는 것이 비교의 핵심이며, 이는 세 고착을 깨기 위해 기술·사용자·시민 각각에서 새로운 변이를 만들어야 한다는 처방과 연결된다.\u003c/p>\n"}},"W01/c06":{"title":"시장 실패·시스템 실패·전환 실패","en":"Market Failure / System Failure / Transformational Failure","week":"W01","href":"W01.html#c06","byIndex":{"0":"\u003cp>정부가 혁신에 개입하는 근거는 \u003cstrong>시장 실패 → 시스템 실패 → 전환 실패\u003c/strong> 세 단계로 진화해 왔다.\u003c/p>\n\u003cp>\u003cstrong>시장 실패\u003c/strong>는 시장에 맡기면 지식이 공공재라 민간의 R&amp;D 투자가 과소해진다는 진단이다. \u003cstrong>시스템 실패\u003c/strong>는 돈은 있어도 행위자들 사이의 연결·제도·역량이 부족하다는 진단이다. \u003cstrong>전환 실패\u003c/strong>는 시스템이 어느 방향으로 가야 하는지, 수요는 누가 표출하는지, 정책은 조율되는지가 빠져 있다는 진단이다.\u003c/p>\n\u003cp>&quot;시스템 전환은 경제·사회·정치·문화 프로젝트&quot;라는 말은 이 중 \u003cstrong>전환 실패\u003c/strong>와 연결된다. 전환 실패가 다루는 방향성·수요 표출·조율의 문제는 기술 문제가 아니라 누가 방향을 정하고(정치), 누구의 수요를 듣고(사회·시민), 어떤 관습을 바꿀 것인가(문화)의 문제이기 때문이다.\u003c/p>\n\u003cp>그래서 시스템 전환은 단순한 R&amp;D 투자 확대로는 이루어지지 않고, 세 실패의 마지막 단계에 대한 답을 요구한다.\u003c/p>\n","1":"\u003cp>Korea Paradox는 세 실패 프레임에서 \u003cstrong>전환 실패\u003c/strong>에 해당하는 문제로 읽을 수 있다.\u003c/p>\n\u003cp>한국은 정부·민간 R&amp;D 투자가 세계 수위권으로, 시장 실패 처방(R&amp;D 투입)은 이미 충분히 이루어지고 있다. 즉 &quot;돈이 모자라서&quot; 성과가 정체된 것이 아니다.\u003c/p>\n\u003cp>교수가 W02 토론에서 남긴 말이 이를 뒷받침한다 — &quot;국가가 R&amp;D에 돈을 집어넣을 줄은 알았지, 나오는 걸 어떻게 소화할지는 어떤 생각을 갖고 있느냐.&quot; 이는 투입 이후 \u003cstrong>방향성과 조율\u003c/strong>이 빠져 있다는 지적이다.\u003c/p>\n\u003cp>타다 사례에서 보듯, 새 서비스가 나와도 국가와 자본의 조율, 가치사슬에서 누구와 편을 먹을지의 판단이 없으면 좌초한다. 정부가 너무 중심에 서 있어 방향성을 정부에만 의존하고 시민·시장의 수요 표출이 약한 구조 자체가, 전환 실패가 진단하는 방향성 실패·수요 표출 실패에 정확히 대응한다.\u003c/p>\n","2":"\u003cp>시장 실패 처방인 R&amp;D 보조금만으로는 시스템 전환이 이루어지지 않는데, 그 이유는 시스템이 조직·기술·사용자 세 군데에서 동시에 \u003cstrong>고착(lock-in)\u003c/strong>되어 있기 때문이다.\u003c/p>\n\u003cp>R&amp;D 보조금은 새로운 지식이나 기술을 만드는 투입을 늘릴 뿐, 이미 깔린 인프라의 매몰비용(기술 고착), 성공 공식에 갇힌 조직 routine(조직 고착), 습관과 네트워크에 묶인 소비 행태(사용자 고착)를 풀지는 못한다.\u003c/p>\n\u003cp>세 고착이 서로 맞물려 있으므로, 이를 깨려면 돈을 더 넣는 것이 아니라 \u003cstrong>새로운 변이(Technology / User / Citizen variety)\u003c/strong>를 만들어야 한다. 즉 다른 기술적 시도, 다른 사용 방식, 그리고 방향을 요구하는 시민이 함께 있어야 고착이 풀린다.\u003c/p>\n\u003cp>따라서 시장 실패 처방은 시스템 전환의 필요조건이지만 충분조건은 아니며, 변이를 만드는 처방(전환 실패에 대한 대응)이 함께 있어야 시스템이 실제로 바뀐다.\u003c/p>\n"}},"W01/c07":{"title":"공공가치와 Civic Actor","en":"Public Value and the Civic Actor (Craig 2012)","week":"W01","href":"W01.html#c07","byIndex":{"0":"\u003cp>Craig(2012)의 그림에서 \u003cstrong>기회의 평등\u003c/strong>은 키가 다른 세 사람에게 똑같은 상자를 하나씩 주는 것이고, \u003cstrong>결과의 평등\u003c/strong>은 키에 맞춰 상자를 다르게 주는 것이다. 자유시장 자본주의는 전자를 공정(fairness)으로 본다.\u003c/p>\n\u003cp>그런데 이 수업은 그 상자를 살 돈이 어디서 오는가를 묻는다. \u003cstrong>Bank of Parents\u003c/strong>가 그 답이다 — 교육·의료·주거 같은 큰 일(Big Things)은 점점 비싸져 부모의 재력이 곧 해결책이 되며, 평소엔 비슷해 보이다가도 큰 일이 닥치면 격차가 확 벌어진다.\u003c/p>\n\u003cp>\u003cstrong>지역 격차\u003c/strong> 역시 같은 구조다. 문화자본(백화점·스타벅스 유무)과 사회간접자본이 지역마다 다르면, 애초에 상자를 구할 기회 자체가 사는 곳에 따라 갈린다.\u003c/p>\n\u003cp>이런 구조적인 박스는 능력주의 논리가 전제하는 &quot;기회는 평등하다&quot;는 출발선 자체가 이미 평등하지 않음을 드러내며, 능력주의를 결과의 정당화 논리로만 쓰는 것에 문제를 제기한다.\u003c/p>\n","1":"\u003cp>\u003cstrong>Social capital\u003c/strong>이란 사람들 사이의 사회적 연대·신뢰·상호성을 가리키는 자원이다.\u003c/p>\n\u003cp>Putnam(2000)은 동네·교회 모임에서 함께 볼링 치던 사람들이 점점 혼자 치게 된 현상(Bowling Alone)을 자료로 보여 준다. Bauman(2000)은 정규직이 사라지고 사람들이 여기저기 떠다니는 \u003cstrong>액체적 근대(Liquid Modernity)\u003c/strong>가 연대·신뢰를 깎아 낸다고 본다.\u003c/p>\n\u003cp>이것이 혁신의 문제인 이유는, W01/01에서 본 대로 혁신 역시 정치·경제와 마찬가지로 \u003cstrong>collective action problem\u003c/strong>을 푸는 활동이기 때문이다. 같이 움직이는 감각, 즉 social capital이 있어야 협력이 성립하는데, 그 자원이 줄면 협력의 비용이 높아진다.\u003c/p>\n\u003cp>한국의 IMF 금 모으기나 코로나 시민 협조는 이런 social capital이 살아 있던 사례로 볼 수 있다.\u003c/p>\n","2":"\u003cp>이 수업은 사람을 가치를 창출하는 entrepreneur로만 보지 말고, 가치의 창출과 함께 그 공정성을 묻는 \u003cstrong>civic actor\u003c/strong>로도 봐야 한다고 주장한다.\u003c/p>\n\u003cp>그 근거로 든 것이 GMO와 AI 데이터센터 사례다. 유럽은 GMO를 공격적으로 반대했고, 이제는 미국에서 \u003cstrong>AI 데이터센터 반대\u003c/strong>가 번지고 있다. 두 사례 모두 새 기술이 가치를 창출한다는 기업가적 논리만으로는 설명되지 않는, 그 기술을 받아들이는 쪽의 저항이다.\u003c/p>\n\u003cp>즉 가치 창출(value creation)이 일어나도 그것이 누구에게 어떻게 돌아가는지, 그리고 그 방향에 동의하는지는 별개의 문제이며, 이를 판단하고 목소리를 내는 것이 civic actor의 역할이다.\u003c/p>\n\u003cp>이런 civic actor의 존재는 앞서 본 구조적인 박스와 social capital의 문제의식과 맞물려, 혁신을 기업가 개인의 성취가 아니라 시민이 함께 판단하는 집단적 과정으로 다시 보게 만든다.\u003c/p>\n"}},"W01/c08":{"title":"시민성 — 사회계약과 네 가지 유형","en":"Citizenship as a Social Contract — Communitarian / Scientific / Digital / Ecological","week":"W01","href":"W01.html#c08","byIndex":{"0":"\u003cp>\u003cstrong>공동체적 시민성(Communitarian Citizenship)\u003c/strong>이란 &quot;이 정도는 우리가 해야지&quot;라는 규범 아래, 국가 위기에 시민이 알아서 희생하는 시민성이다.\u003c/p>\n\u003cp>이는 의병 정신부터 IMF 금 모으기, 코로나 시기 마스크 착용과 자영업자의 희생까지 이어진다. Etzioni(2020)는 공동체주의적인 나라들이 팬데믹을 잘 다뤘다고 평가한다. 한국의 추격(catch-up) 성공도 국가가 부르면 뛰는 이런 집단적 협력 없이는 설명되지 않는다.\u003c/p>\n\u003cp>그런데 &quot;달라지고 있다&quot;는 것은, 정부의 부실 대응을 시민의 희생으로 메우는 방식을 이제는 반기지 않는 흐름이 생겼다는 뜻이다. &quot;잼버리를 끝으로 작별하고 싶다&quot;는 슬라이드 인용 칼럼처럼, 무조건 희생을 떠안는 시민성에 의문이 제기되고 있다.\u003c/p>\n\u003cp>그 결과로 등장하는 것이 다음에 볼 Scientific·Digital·Ecological citizenship 같은, 희생이 아니라 \u003cstrong>참여와 요구\u003c/strong>를 앞세우는 새로운 시민성이다.\u003c/p>\n","1":"\u003cp>새로운 시민성은 세 유형으로 나타난다.\u003c/p>\n\u003cp>\u003cstrong>Scientific Citizenship\u003c/strong>은 국가·전문가의 안전 판정을 그대로 믿지 않고 직접 검증에 참여하려는 시민성이다. 신고리 원전 공론화와 방폐장(지하 처분 시설) 사례가 대표적으로, &quot;안심이 안 돼, 우리가 직접 하겠어&quot;라는 태도로 요약된다.\u003c/p>\n\u003cp>\u003cstrong>Digital Citizenship\u003c/strong>은 디지털 접근 수단과 학습 기회를 요구하는 시민성이다. 어르신의 \u003cstrong>키오스크\u003c/strong> 이용 어려움이 대표 사례로, 기술을 자꾸 바꾸려면 교육 기회도 함께 제공해야 한다는 요구다.\u003c/p>\n\u003cp>\u003cstrong>Ecological Citizenship\u003c/strong>은 기술이 나아갈 방향 자체에 리밋을 요구하는 시민성이다. \u003cstrong>기온 상승에 한계선을 두어야 한다\u003c/strong>는 주장이 그 예로, 새 기술이 나올 때 어느 방향으로 갈지 말하는 시민이 등장한 것이다.\u003c/p>\n\u003cp>세 유형 모두 시민이 결과를 받아들이는 데서 그치지 않고 과정과 방향에 참여하려 한다는 공통점을 갖는다.\u003c/p>\n","2":"\u003cp>\u003cstrong>Citizen variety\u003c/strong>란 새 기술이 나올 때 그것이 어느 방향으로 가야 하는지 말하는 시민들, 즉 시민 쪽에서 나오는 다양성을 가리킨다.\u003c/p>\n\u003cp>세 가지 고착(조직·기술·사용자)은 기존 시스템의 규범·기술·행태·인지가 서로 맞물려 유지되며, 이를 깨려면 Technology variety, User variety와 함께 \u003cstrong>Citizen variety\u003c/strong>가 필요하다.\u003c/p>\n\u003cp>특히 사용자 고착은 소비가 기술 기반의 사회적 관습으로 내재화되어 개인이 스스로 벗어나기 어려운 상태다. 이때 Scientific·Digital·Ecological citizenship처럼 기존 방향에 의문을 제기하고 다른 방향을 요구하는 시민이 있어야, 고착된 관습과 규범 자체에 균열이 생긴다.\u003c/p>\n\u003cp>즉 citizen variety는 세 고착을 깨는 세 변이 중 시민이 담당하는 몫이며, 전환 실패가 지적하는 방향성 실패·수요 표출 실패에 대한 실질적 답이 된다.\u003c/p>\n"}},"W01/c09":{"title":"혁신시스템 접근법의 계보","en":"Innovation System Approaches by Disciplinary Context","week":"W01","href":"W01.html#c09","byIndex":{"0":"\u003cp>이 학기의 이론들은 세 개의 다른 학문 동네에서 나왔으며, 같은 &quot;시스템&quot;이라는 말을 써도 출신에 따라 강조점이 다르다.\u003c/p>\n\u003cp>\u003cstrong>Innovation Studies\u003c/strong> 맥락에는 국가혁신시스템(NIS), 부문혁신시스템(SIS), 기술혁신시스템(TIS), 사회기술시스템(StS), Social Practice approach가 속한다. 국가 → 산업 부문 → 개별 기술 → 생산+소비로 분석 단위를 넓혀 왔다.\u003c/p>\n\u003cp>\u003cstrong>Political Economy\u003c/strong> 맥락에는 생산·혁신사회시스템(SSIP)이 속한다. 노동 문제와 자본주의의 국가별 제도적 차이를 다룬다.\u003c/p>\n\u003cp>\u003cstrong>Business Studies\u003c/strong> 맥락에는 비즈니스 시스템(BS), 비즈니스모델 혁신(BMI), 혁신 Ecosystem론이 속한다. 기업의 눈에서 파이낸스와 디지털 전환, 그리고 학기의 종착점인 생태계 전략을 다룬다.\u003c/p>\n","1":"\u003cp>NIS, SIS, TIS, StS는 같은 Innovation Studies 계보 안에서 분석 단위가 점점 넓어지는 순서로 이어진다.\u003c/p>\n\u003cp>\u003cstrong>NIS(국가혁신시스템)\u003c/strong>는 혁신을 집단 행동(collective action)으로 보는 출발점으로, 분석 단위는 \u003cstrong>국가\u003c/strong>다.\u003c/p>\n\u003cp>\u003cstrong>SIS(부문혁신시스템)\u003c/strong>는 기술적 속성에 따라 산업마다 혁신 방식이 어떻게 다른지를 보므로, 분석 단위는 \u003cstrong>산업 부문\u003c/strong>이다.\u003c/p>\n\u003cp>\u003cstrong>TIS(기술혁신시스템)\u003c/strong>는 신기술 하나가 등장·도입·성숙·안정화에 이르는 동태적 과정을 보므로, 분석 단위는 \u003cstrong>개별 기술\u003c/strong>이다.\u003c/p>\n\u003cp>\u003cstrong>StS(사회기술시스템)\u003c/strong>는 소비·사용 부문까지 시스템에 포함해 기술의 특성보다 사회적 기능에 초점을 두므로, 분석 단위는 \u003cstrong>생산과 소비 전체\u003c/strong>다. 이렇게 국가에서 개별 기술로 좁아졌다가 다시 소비까지 포함하며 넓어지는 것이 이 계보의 순서다.\u003c/p>\n"}},"W01/c10":{"title":"혁신시스템 유형 3분류 — 강의 지도","en":"Innovation System Types — Difference / Change / Mechanism of Change","week":"W01","href":"W01.html#c10","byIndex":{"0":"\u003cp>이 학기의 이론들은 무엇을 설명하려는가에 따라 \u003cstrong>구조의 차이 / 구조의 변화 / 구조 변화의 기작\u003c/strong> 세 묶음으로 나뉜다.\u003c/p>\n\u003cp>\u003cstrong>구조의 차이\u003c/strong>에는 NIS, SIS, SSIP, BizS가 속한다. &quot;한국과 일본이 왜 다른가, 조선·자동차·전자 산업이 왜 다른가, 미국·독일·영국 시스템이 왜 다른가&quot;라는 \u003cstrong>비교\u003c/strong>의 질문에 답한다.\u003c/p>\n\u003cp>\u003cstrong>구조의 변화\u003c/strong>에는 TS, TIS, StS와 Transition 이론이 속한다. &quot;새 기술이 어떻게 자리 잡는가&quot;라는 \u003cstrong>시간에 따른 변화\u003c/strong>의 질문에 답하며, 그중 StS는 기술보다 소비에 초점을 둔다.\u003c/p>\n\u003cp>\u003cstrong>구조 변화의 기작\u003c/strong>에는 BMI, SPT, MOIP, Ecosystem이 속한다. 앞의 두 묶음보다 더 미시적으로, &quot;구체적으로 무엇이 어떻게 바뀌게 만드는가&quot;라는 \u003cstrong>개입·메커니즘\u003c/strong>의 질문에 답한다.\u003c/p>\n","1":"\u003cp>&quot;구조의 차이&quot;를 보는 이론과 &quot;구조의 변화&quot;를 보는 이론은 같은 시스템을 보더라도 \u003cstrong>비교하는가, 시간을 따라가는가\u003c/strong>에서 갈린다.\u003c/p>\n\u003cp>\u003cstrong>구조의 차이\u003c/strong>(NIS, SIS, SSIP, BizS)는 서로 다른 두 대상을 나란히 놓고 왜 다른지를 설명한다. 한국 반도체 산업을 예로 들면, &quot;왜 한국은 메모리 반도체에 특화됐는가&quot;를 묻는 것이 SIS의 질문이다 — 어느 시점의 국가·산업 간 차이를 비교하는 것이다.\u003c/p>\n\u003cp>\u003cstrong>구조의 변화\u003c/strong>(TS, TIS, StS, Transition)는 하나의 대상이 시간이 지나며 어떻게 바뀌었는지를 추적한다. 같은 반도체 사례에서 &quot;DRAM 기술이 어떻게 자리 잡았는가&quot;를 묻는 것이 TIS의 질문이다 — 하나의 기술이 등장·성숙해 가는 과정을 본다.\u003c/p>\n\u003cp>즉 전자는 지도 두 장을 펴 놓고 비교하는 작업이고, 후자는 하나의 강줄기가 100년 동안 어떻게 옮겨 갔는지 시간축을 따라가는 작업이다.\u003c/p>\n","2":"\u003cp>BMI·SPT·MOIP·Ecosystem을 &quot;구조 변화의 기작&quot;으로 묶는 이유는, 이들이 구조가 바뀐다는 \u003cstrong>사실을 설명\u003c/strong>하는 데서 그치지 않고 구체적으로 \u003cstrong>누가 어떤 수단으로 바꾸는가\u003c/strong>를 다루기 때문이다.\u003c/p>\n\u003cp>앞의 두 묶음은 각각 국가·산업 단위(거시)와 하나의 기술·시스템이 겪는 시간(중간)을 보는 \u003cstrong>설명\u003c/strong>의 언어를 쓴다.\u003c/p>\n\u003cp>반면 이 묶음은 비즈니스 모델(BMI), 일상 관습(SPT), 정책의 임무 설계(MOIP), 생태계의 병목(Ecosystem)처럼 더 구체적인 작동 지점을 보는 \u003cstrong>개입\u003c/strong>의 언어를 쓴다. Ecosystem론이 &quot;병목을 짚어 내고 파트너들을 정렬시키는 도구&quot;로 설명되는 것이 그 예다.\u003c/p>\n\u003cp>그래서 이 묶음은 &quot;펌 레벨에서 어떻게 시스템을 만들 것인가&quot;라는 이 수업의 기본 입장과 가장 가깝고, term paper에서 개입·전략을 다루려는 케이스에 적합한 틀이 된다.\u003c/p>\n"}},"W01/c11":{"title":"Innovation Ecosystem — 병목·오케스트레이터·거버넌스","en":"Innovation Ecosystem (Adner; Adner & Kapoor; Jacobides et al.; Granstrand & Holgersson)","week":"W01","href":"W01.html#c11","byIndex":{"0":"\u003cp>혁신생태계에서 \u003cstrong>병목(bottleneck)\u003c/strong>이란 생태계 전체의 가치 창출을 가로막는, 아직 준비되지 않았거나 통제하기 어려운 핵심 지점을 가리킨다.\u003c/p>\n\u003cp>&quot;안전이 병목이 된다&quot;는 말은, 안전 그 자체가 기술적 성능이 아니라 생태계의 진입을 좌우하는 지점이 된다는 뜻이다. 드론은 무인화가 쉽지만 사람이 탑승한 기체의 무인 이착륙은 어렵고, 자동차 FSD도 계속 안전 문제에 걸리는 것이 그 예다.\u003c/p>\n\u003cp>병목을 쥔다는 것은 단순히 부품을 만드는 것이 아니라 \u003cstrong>안전한지 아닌지를 평가할 줄 알고, 어떤 규정을 써야 할지를 아는 시스템을 갖추는 것\u003c/strong>이다. 이런 역량은 전략적 자산이기 때문에, 교수는 이런 평가·규정 시스템을 웬만하면 남에게 넘기지 말라고 조언한다.\u003c/p>\n\u003cp>그 근거는 이 역량을 외주화하는 순간 생태계에서 통제권을 잃고, 안보에 민감한 영역일수록 최고 성능이 아니어도 직접 갖고 있어야 하는 전략적 이유가 생기기 때문이다.\u003c/p>\n","1":"\u003cp>\u003cstrong>오케스트레이터\u003c/strong>가 생태계 파트너를 움직이는 방식은 \u003cstrong>위계적 강제\u003c/strong>와 \u003cstrong>자발적 정렬(voluntary alignment)\u003c/strong> 두 가지다.\u003c/p>\n\u003cp>위계적 강제는 힘이 센 쪽이 규칙을 만들어 명령하는 방식이다. 그러나 생태계의 파트너들은 각자 독립성과 자율성을 갖고 있으므로, 병목이 자기 쪽에 있지 않은 오케스트레이터는 명령할 수 없고 대신 &quot;우리 다 같이 가는 거야&quot;라는 \u003cstrong>자발적 정렬\u003c/strong>을 이끌어 내야 한다.\u003c/p>\n\u003cp>자발적 정렬에서 \u003cstrong>social capital\u003c/strong>이 중요한 이유는, 통합하지 않고도 함께 갈 수 있게 하는 힘이 바로 신뢰와 믿음이기 때문이다. &quot;같이 하자&quot;는 신뢰가 있으면 상호의존을 법정으로 가지 않고도 맞춰 나갈 수 있다.\u003c/p>\n\u003cp>애플이 안드로이드처럼 API를 열지 않고도 하드웨어를 꽉 잡은 채 생태계를 이끌 수 있었던 것도, 이미 그 생태계에 속해 있던 로열한 소비자(팬덤)라는 신뢰 자산이 있었기 때문이라는 것이 교수의 해석이다.\u003c/p>\n","2":"\u003cp>\u003cstrong>상호의존성 리스크(interdependence risk)\u003c/strong>는 파트너 각각의 성공 확률의 \u003cstrong>곱\u003c/strong>으로 커지는 리스크다. 파트너 A, B, C가 각각 성공 확률 0.8이면 전체는 0.8³ ≈ 0.51로, 파트너가 늘수록 급격히 떨어진다.\u003c/p>\n\u003cp>\u003cstrong>통합 리스크(integration risk)\u003c/strong>는 각 단계의 지연이 쌓이는, 즉 지연의 \u003cstrong>합\u003c/strong>으로 커지는 리스크다. 단계마다 2개월씩 늦어지면 3단계를 거칠 때 총 6개월이 누적된다.\u003c/p>\n\u003cp>이 차이는 자원배분에 뚜렷한 시사점을 준다. 곱셈으로 커지는 상호의존성 리스크는 \u003cstrong>약한 고리 하나를 집중 보강\u003c/strong>하는 것이 효과적이다 — 한 파트너의 실패가 전체 확률을 크게 끌어내리기 때문이다. 반면 합으로 쌓이는 통합 리스크는 \u003cstrong>단계 수를 줄이거나 병렬화\u003c/strong>하는 것이 효과적이다.\u003c/p>\n\u003cp>따라서 같은 생태계 안에서도 어떤 종류의 리스크인지에 따라 자원을 어디에 어떻게 배분할지가 달라져야 한다.\u003c/p>\n"}},"W02-1/c01":{"title":"지식의 속성 — 암묵지와 형식지","en":"Tacit and Explicit (Codified) Knowledge","week":"W02-1","href":"W02-1.html#c01","byIndex":{}},"W02-1/c02":{"title":"학습 — 지식생산의 미시적 기초","en":"Learning as the Micro-foundation of Knowledge Production","week":"W02-1","href":"W02-1.html#c02","byIndex":{}},"W02-1/c03":{"title":"STI mode vs DUI mode","en":"Science-Technology-Innovation mode vs Doing-Using-Interacting mode (Jensen et al. 2007)","week":"W02-1","href":"W02-1.html#c03","byIndex":{}},"W02-1/c04":{"title":"Jensen et al. (2007) 실증 연구 — DISKO 데이터와 4개 클러스터","en":"Empirical Evidence — DISKO data, Latent Class Analysis, Logistic Regression","week":"W02-1","href":"W02-1.html#c04","byIndex":{}},"W02-1/c05":{"title":"Mokyr의 지식 프레임 — Ω와 λ","en":"Propositional (Ω) and Prescriptive (λ) Knowledge; Access Costs (Mokyr)","week":"W02-1","href":"W02-1.html#c05","byIndex":{}},"W02-1/c06":{"title":"불만족스러운 혁신 — Lundvall의 경고","en":"Unsatisfactory Innovation (Lundvall)","week":"W02-1","href":"W02-1.html#c06","byIndex":{}},"W02-1/c07":{"title":"사용자–생산자 상호작용과 조직화된 시장","en":"User-Producer Interaction and the Organized Market (Lundvall)","week":"W02-1","href":"W02-1.html#c07","byIndex":{}},"W02-1/c08":{"title":"생산 능력 vs 기술 역량","en":"Production Capacity vs Technological Capabilities (Bell & Pavitt 1993)","week":"W02-1","href":"W02-1.html#c08","byIndex":{}},"W02-1/c09":{"title":"후발국의 역방향 기술 궤적","en":"Reverse Technological Trajectory of Latecomers","week":"W02-1","href":"W02-1.html#c09","byIndex":{}},"W02-1/c10":{"title":"수요–공급–연계 기술정책 프레임","en":"Demand / Supply / Linkage Policy Framework (Kim & Dahlman 1992)","week":"W02-1","href":"W02-1.html#c10","byIndex":{}},"W02-1/c11":{"title":"민간 R&D 수요 창출 4대 동인","en":"Four Determinants of Private R&D Demand in Korea","week":"W02-1","href":"W02-1.html#c11","byIndex":{}},"W02-1/c12":{"title":"종합 — 지식 모드의 결합과 수요 중심 정책","en":"Synthesis — Complementary Combination of STI/DUI and Demand-oriented Policy","week":"W02-1","href":"W02-1.html#c12","byIndex":{}},"W02-2/c01":{"title":"고전적 공공재 논리와 그 한계","en":"The Classical Public Good Argument and Its Limits","week":"W02-2","href":"W02-2.html#c01","byIndex":{"0":"\u003cp>지식을 공공재로 보는 고전 논리는 \u003cstrong>비배제성\u003c/strong>과 \u003cstrong>비경합성\u003c/strong> 두 속성에서 출발해, 민간이 지식에 과소투자하므로 정부가 기초연구에 투자해야 한다는 정책 결론으로 이어진다.\u003c/p>\n\u003cp>\u003cstrong>비배제성\u003c/strong>(non-excludability)은 일단 공개된 지식을 다른 사람이 쓰지 못하게 막기 어렵다는 속성이다. 가로등을 세우면 지나가는 사람 모두가 그 빛을 공짜로 쓰는 것과 같은 이치다.\u003c/p>\n\u003cp>\u003cstrong>비경합성\u003c/strong>(non-rivalry)은 한 사람이 지식을 써도 다른 사람 몫이 줄지 않는다는 속성이다. 빵은 내가 먹으면 없어지지만 공식은 아무리 써도 그대로 남는다.\u003c/p>\n\u003cp>두 속성이 겹치면 기업은 기초연구에 돈을 쓸 유인이 사라지므로, \u003cstrong>Nelson(1959)\u003c/strong>과 \u003cstrong>Arrow(1962)\u003c/strong>는 정부가 대신 투자해야 한다고 정식화했다. Arrow는 여기에 지식을 팔려면 내용을 먼저 보여줘야 하는데 보여주는 순간 상대가 이미 그것을 갖게 되어 거래가 성립하지 않는다는 \u003cstrong>정보의 역설\u003c/strong>을 덧붙였다.\u003c/p>\n\u003cp>이 논리는 정부 R&amp;D 예산의 표준 근거이며, W01/06이 말하는 세 가지 실패(시장 실패 → 시스템 실패 → 전환 실패) 중 첫 단계인 시장 실패 처방에 정확히 대응한다.\u003c/p>\n","1":"\u003cp>고전 공공재 논리가 생략한 것은 \u003cstrong>지식이 실제로 쓰이기 위한 조건\u003c/strong>이다 — 지식은 공개된다고 저절로 활용되지 않는다.\u003c/p>\n\u003cp>가로등은 세우는 순간 바로 불이 켜져 누구나 그 빛을 쓸 수 있지만, 논문은 공개해도 저절로 읽히고 재현되지 않는다. 그 내용을 읽고 재현할 사람, 장비, 표준이 갖춰져 있어야 비로소 지식이 된다.\u003c/p>\n\u003cp>슬라이드의 결정적 한 줄이 이 지점을 정확히 짚는다 — \u003cstrong>&quot;그러나 이 논리는 지식이 실제로 쓰이기 위한 조건을 생략한다.&quot;\u003c/strong> 고전 논리는 공개를 종착점으로 다루지만, 실제로는 공개 이후에 재현·활용의 문제가 남는다.\u003c/p>\n\u003cp>이 빈틈이 W02-2/03의 Callon 논의로 이어지는 지점이며, 이번 강의 전체가 공공재 논리를 반박해 나가는 출발점이 된다.\u003c/p>\n","2":"\u003cp>공공재 논리는 W01/06이 제시한 세 가지 실패(시장 실패 → 시스템 실패 → 전환 실패) 중 \u003cstrong>첫 단계인 시장 실패 처방\u003c/strong>에 정확히 대응한다.\u003c/p>\n\u003cp>비배제성·비경합성 때문에 민간이 과소투자한다는 진단은 시장이 스스로 최적의 자원배분을 못 한다는 시장 실패 논리 그대로이며, 처방도 정부가 개입해 투자를 늘린다는 시장 실패 프레임의 표준 해법과 같다.\u003c/p>\n\u003cp>이 대응은 Schot &amp; Steinmueller(2018)가 정리한 세 프레임 중 \u003cstrong>Frame 1(R&amp;D 정책)\u003c/strong>에 해당하며, 공공재 논리는 그 경제학적 근거다.\u003c/p>\n\u003cp>다만 이 강의의 흐름은 공공재 논리(시장 실패)에서 멈추지 않고 시스템 실패·전환 실패로 나아가므로, 이 관계를 아는 것은 이후 SIS·TIS·전환론이 왜 시장 실패 틀을 넘어서려 하는지를 이해하는 출발점이 된다.\u003c/p>\n"}},"W02-2/c02":{"title":"Kealey의 도전 — 선형모형 뒤집기","en":"Kealey's Challenge to the Linear Model","week":"W02-2","href":"W02-2.html#c02","byIndex":{"0":"\u003cp>\u003cstrong>선형모형\u003c/strong>은 정부가 과학에 투자하면 기술이 발전하고 경제가 성장한다고 보지만, \u003cstrong>Kealey\u003c/strong>는 이 인과의 방향이 반대라고 반박한다.\u003c/p>\n\u003cp>선형모형에서는 정부의 과학 투자가 원인이고 경제성장이 결과다. Kealey는 반대로 \u003cstrong>성장했기 때문에 과학 활동이 늘어난 것\u003c/strong>이며, 과학에 투자해서 성장한 것은 아니라고 본다.\u003c/p>\n\u003cp>이는 &quot;헬스장이 많은 동네 사람들이 건강하다&quot;는 관찰과 같다. 선형모형식으로는 헬스장을 지으면 사람들이 건강해진다고 해석하지만, Kealey식으로는 \u003cstrong>잘사는 동네라서\u003c/strong> 헬스장도 많고 사람들도 건강한 것이다 — 헬스장은 원인이 아니라 결과다.\u003c/p>\n\u003cp>더 나아가 Kealey는 \u003cstrong>과학 지식은 사유재\u003c/strong>이며 사람들은 돈이 될 줄 알고 투자하는 것이지 남과 나눌 생각이 없다고까지 주장해, 인과 반박과 성격 반박 두 갈래로 선형모형을 공격한다.\u003c/p>\n","1":"\u003cp>Kealey의 결론은 과학이 쓸모없다는 것이 아니라, \u003cstrong>성장을 위한 투자라는 정당화의 근거가 약하다\u003c/strong>는 것이다.\u003c/p>\n\u003cp>슬라이드의 정책적 함의는 온건하다 — 지식·문화로서의 가치는 인정하되 성장 효과는 단정하지 않는다. Kealey를 반과학주의자로 요약하면 틀린 답이 된다.\u003c/p>\n\u003cp>근거는 \u003cstrong>Kealey(1996)\u003c/strong> 『The Economic Laws of Scientific Research』다. 그는 산업혁명기 영국이 정부 과학 지원 없이 기술 진보를 이뤘고, 정부 R&amp;D가 오히려 민간 R&amp;D를 밀어내는 \u003cstrong>crowding out\u003c/strong> 효과가 있다는 점을 든다.\u003c/p>\n\u003cp>즉 그의 주장은 &quot;정부 지원이 늘 무용하다&quot;가 아니라 &quot;성장 효과가 자동은 아니다&quot;로 읽는 것이 공정하다.\u003c/p>\n","2":"\u003cp>세 입장은 \u003cstrong>지식의 성격\u003c/strong>과 \u003cstrong>정부의 역할\u003c/strong>에 대한 답이 각각 다르다.\u003c/p>\n\u003cp>\u003cstrong>고전 공공재론\u003c/strong>(Arrow, Nelson)은 지식을 공공재로 보고, 시장 실패를 보정하기 위해 정부가 투자해야 한다고 본다.\u003c/p>\n\u003cp>\u003cstrong>Kealey\u003c/strong>는 지식을 \u003cstrong>사유재\u003c/strong>로 보고, 정부의 투자 근거가 약하다고 본다 — 성장이 과학을 낳는 것이지 과학이 성장을 낳는 것은 아니라는 인과 반박이 그 바탕이다.\u003c/p>\n\u003cp>\u003cstrong>Callon\u003c/strong>은 지식을 공공재도 사유재도 아닌, \u003cstrong>재현·활용·탐색의 조건에 달린 것\u003c/strong>으로 본다. 그래서 정부 역할에 대한 질문도 &quot;투자하느냐 마느냐&quot;가 아니라 &quot;그 조건을 지키느냐&quot;로 바뀐다.\u003c/p>\n\u003cp>이 자료는 결국 세 번째 입장, 즉 Callon 쪽으로 논의를 이끌어가며 Kealey를 고전 논리를 흔드는 지렛대로 배치한다.\u003c/p>\n"}}},"quizSchedule":[{"n":1,"date":"2026-09-19","weeks":["W01","W02-1"]},{"n":2,"date":"2026-10-17","weeks":["W01","W02-1","W02-2","W03","W04","W05"]},{"n":3,"date":"2026-10-31","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07"]},{"n":4,"date":"2026-11-14","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09"]},{"n":5,"date":"2026-11-28","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09","W10","W11"]},{"n":6,"date":"2026-12-12","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09","W10","W11","W12","W13"]}]}</script>
