논쟁\u003c/strong>: 유럽은 여름이 덥지 않아 에어컨이 없었는데 기후변화로 폭염이 왔다. 한국인은 &quot;당연히 달아야지&quot; 하지만 유럽에선 \u003cstrong>&quot;왜 달아야 하냐&quot;\u003c/strong>는 논쟁이 있다.\u003c/li>\n\u003cli>🗣 \u003cstrong>Frugal innovation vs Responsible innovation\u003c/strong>: 태양광·재활용 물이 있으면 매일 샤워해도 되나(재생에너지니까 마음껏), 아니면 그럼에도 절제해야 하나(responsible)? 둘 중 뭐가 옳으냐가 아니라 — \u003cstrong>라이프스타일이 선택이 되고, 기술도 선택이 된다.\u003c/strong>\u003c/li>\n\u003cli>→ 이 대목이 W12 \u003cstrong>일상생활방식 접근(Social Practice)\u003c/strong>의 예고편이다. 소비는 효용 계산이 아니라 관습과 정체성의 문제.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-5-핵심-문장\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">핵심 문장 ★\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">🗣 \u003cstrong>&quot;사용자의 수용성 변동 없이 지식 접근 비용만 낮아지는 것은 위험하다.&quot;\u003c/strong>\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>Mokyr는 접근 비용이 낮아지는 것을 좋은 일로만 봤다(W02-1/05).\u003c/li>\n\u003cli>Lundvall은 \u003cstrong>그 속도가 사용자 역량을 앞지르면\u003c/strong> 오히려 dead end로 빨리 간다고 경고한다.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>즉 두 사람은 같은 메커니즘(코드화 → 접근 비용 하락)을 \u003cstrong>반대 방향에서\u003c/strong> 본다. 이 대비가 퀴즈 비교형의 최적 소재.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c07":{"title":"사용자–생산자 상호작용과 조직화된 시장","en":"User-Producer Interaction and the Organized Market (Lundvall)","week":"W02-1","href":"W02-1.html#c07","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>경제학 교과서의 시장은 \u003cstrong>가격이라는 숫자 하나만\u003c/strong> 오가는 곳이다. 그런데 현실의 시장에서는 &quot;이거 써 보니 여기가 불편하더라&quot;, &quot;그건 이렇게 쓰셔야 해요&quot; 같은 \u003cstrong>말이 오간다.\u003c/strong> 이렇게 \u003cstrong>신뢰·관행·비공식 소통이 얹힌 시장\u003c/strong>을 \u003cstrong>조직화된 시장\u003c/strong>이라 하고, 여기서 일어나는 배움이 \u003cstrong>상호작용을 통한 학습(learning by interacting)\u003c/strong> — DUI의 &#39;I&#39;다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>두 가지 단골집을 생각해 보자.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>순수 시장\u003c/strong>: 자판기. 돈을 넣고 물건이 나온다. 자판기는 내가 왜 그 음료를 골랐는지 모르고, 나는 그 음료가 어떻게 만들어졌는지 모른다. \u003cstrong>오가는 정보는 가격뿐.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>조직화된 시장\u003c/strong>: 10년 다닌 동네 정육점. &quot;오늘 뭐 해 드시게요?&quot; &quot;찌개요.&quot; &quot;그럼 이 부위가 나아요.&quot; 사장님은 내 취향을 배우고, 나는 고기를 배운다.\u003c/li>\n\u003c/ul>\n\u003cp>혁신은 자판기에서 안 나오고 \u003cstrong>정육점에서 나온다.\u003c/strong> 🗣 &quot;새로운 지식은 주고받는 상황에서 나오는 것이지 혼자 팍팍 나오는 게 아니에요.&quot;\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c07-h-슬라이드-w02-p22-23\">📄 슬라이드 (W02 p22–23)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p22.jpg\" alt=\"W02 p22 DUI의 핵심 확장\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p22 DUI의 핵심 확장\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p23.jpg\" alt=\"W02 p23 조직화된 시장\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p23 조직화된 시장\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-1-세-단계-논증\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">세 단계 논증 📄\u003c/p>\n\u003cp>\u003cstrong>① 순수 시장(Pure Market)의 한계\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>신고전파 경제학의 순수 시장은 \u003cstrong>가격 신호만 전달\u003c/strong>한다.\u003c/li>\n\u003cli>사용자 니즈(user needs)나 기술적 가능성 등 \u003cstrong>복잡한 암묵적 지식은 전달 불가능\u003c/strong>하다.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>② 조직화된 시장(Organized Market)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>현실의 시장은 \u003cstrong>신뢰, 관행, 비공식 소통\u003c/strong>이 결합된 형태.\u003c/li>\n\u003cli>생산자와 사용자 간 \u003cstrong>긴밀한 정보 채널\u003c/strong>이 형성된다.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>③ 상호작용 학습(Learning by Interacting)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>생산자\u003c/strong>: 사용자의 현장 문제와 노하우를 파악.\u003c/li>\n\u003cli>\u003cstrong>사용자\u003c/strong>: 새로운 장비·기술의 특성을 경험으로 습득.\u003c/li>\n\u003cli>\u003cstrong>DUI 모드의 &#39;Interacting&#39;의 핵심 축.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-2-슬라이드-p22가-말하는-세-가지\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">📄 슬라이드 p22가 말하는 세 가지\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>혁신의 성격\u003c/strong>\u003c/td>\n\u003ctd>혁신은 \u003cstrong>고립된 천재의 발명품이 아닌, 고도의 상호작용적 과정(Interactive Process)\u003c/strong>이다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>생산자의 필요\u003c/strong>\u003c/td>\n\u003ctd>사용자의 현장 병목현상 파악, \u003cstrong>&#39;사용을 통한 학습(Learning-by-using)&#39;\u003c/strong> 노하우 습득, 공정 혁신 아이디어 흡수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>사용자의 역할\u003c/strong>\u003c/td>\n\u003ctd>추상적인 기술(Technology)을 구체적인 \u003cstrong>시장 가치(Market Value)로 변환하는 맥락(Context) 제공\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">그림은 생산자 하나를 여러 사용자가 \u003cstrong>양방향 화살표\u003c/strong>로 둘러싼 형태다. 일방적 공급(technology push)이 아니라 \u003cstrong>다수의 양방향 채널\u003c/strong>이라는 점이 핵심.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-3-수업에서의-설명\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 수업에서의 설명\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">순수 시장은 \u003cstrong>가격 신호만\u003c/strong> 오간다고 보지만, 실제 시장은 그보다 훨씬 많이 주고받고 \u003cstrong>강한 네트워크와 관계 속\u003c/strong>에 있다 = 조직화된 시장.\u003c/p>\u003cspan class=\"quote-time\">1:04:16 전후\u003c/span>\u003c/blockquote>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;새로운 지식은 주고받는 상황에서 나오는 것이지 혼자 팍팍 나오는 게 아니에요. … 진짜 자기 거가 되는 순간은, 뒤풀이에서 헛소리하는 친구가 &#39;야 그건 아닌 것 같은데&#39; 하고, &#39;아니야 그거야&#39; 하고, 그렇게 인터랙션 할 때.&quot;\u003c/p>\u003cspan class=\"quote-time\">31:48\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 그리고 이것이 \u003cstrong>시장에서 벌어지는 일\u003c/strong>이다. 이를 경제활동의 생산자–사용자 관계로 확장한 것이 \u003cstrong>국가혁신체제(NIS)\u003c/strong> 논의. → W01/09 계보의 출발점.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-4-왜-이것이-w02-1-06의-처방인가\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">왜 이것이 W02-1/06의 처방인가 ★\u003c/p>\n\u003cul>\n\u003cli>불만족스러운 혁신의 원인은 \u003cstrong>생산자 지배와 정보 비대칭\u003c/strong>이었다.\u003c/li>\n\u003cli>조직화된 시장은 그 비대칭을 \u003cstrong>정보 채널\u003c/strong>로 메운다.\u003c/li>\n\u003cli>그래서 해결책이 &quot;\u003cstrong>사용자의 기술 수용성 및 피드백 역량을 강화\u003c/strong>하여 시장 내 정보의 균형을 맞추는 것&quot;이 된다.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>즉 조직화된 시장은 \u003cstrong>묘사\u003c/strong>이자 \u003cstrong>처방\u003c/strong>이다. &quot;현실 시장은 이렇다&quot;이면서 &quot;이렇게 만들어야 한다&quot;이기도 하다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c08":{"title":"생산 능력 vs 기술 역량","en":"Production Capacity vs Technological Capabilities (Bell & Pavitt 1993)","week":"W02-1","href":"W02-1.html#c08","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>공장을 돌려 물건을 만드는 힘(\u003cstrong>생산 능력\u003c/strong>)과, 기술을 스스로 바꾸고 새로 만드는 힘(\u003cstrong>기술 역량\u003c/strong>)은 \u003cstrong>전혀 다른 것\u003c/strong>이다. 생산 능력은 돈으로 사 올 수 있지만, 기술 역량은 \u003cstrong>의도적인 학습 투자\u003c/strong>로만 쌓인다. 개도국이 공장을 아무리 많이 지어도 자동으로 혁신국가가 되지 않는 이유가 여기 있다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">슬라이드가 \u003cstrong>빙산\u003c/strong>으로 그렸다.\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>수면 위 = 생산 능력\u003c/strong>: 눈에 보이는 설비, 기계, 운영 노하우. \u003cstrong>시장에서 사 올 수 있다.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>수면 아래 = 기술 역량\u003c/strong>: 암묵지, 조직 구조, 혁신 관리 능력. \u003cstrong>오직 의도적이고 누적적인 학습으로만 축적된다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>다른 비유로는, 최신 주방 설비를 통째로 사 온다고 미슐랭 셰프가 되지 않는 것과 같다. 설비는 돈이면 되지만, \u003cstrong>새 메뉴를 개발하는 능력\u003c/strong>은 몇 년을 쌓아야 생긴다.\u003c/p>\n\u003cp>🗣 교수의 한마디: \u003cstrong>&quot;capacity와 capability는 다르다.&quot;\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c08-h-슬라이드-w02-p25-26\">📄 슬라이드 (W02 p25–26)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 360\" role=\"img\" aria-labelledby=\"w0201c08-title\">\n  \u003ctitle id=\"ans-w0201c08-title\">수면 위는 구매 가능한 생산 능력, 수면 아래는 의도적 학습으로만 쌓이는 기술 역량 3단계임을 보여주는 빙산 그림\u003c/title>\n\n  \u003ctext x=\"190\" y=\"16\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--note)\">생산 능력 (구매 가능)\u003c/text>\n\n  \u003c!-- 수면 위: 생산 능력 -->\n  \u003cpath d=\"M190,32 L240,120 L140,120 Z\" fill=\"var(--note-soft)\" stroke=\"var(--note)\" stroke-width=\"1.4\">\u003c/path>\n\n  \u003c!-- 수면선 -->\n  \u003cline x1=\"16\" y1=\"120\" x2=\"364\" y2=\"120\" stroke=\"var(--muted)\" stroke-width=\"1.4\" stroke-dasharray=\"4,3\">\u003c/line>\n  \u003ctext x=\"16\" y=\"114\" font-size=\"9.5\" fill=\"var(--muted)\">수면\u003c/text>\n\n  \u003c!-- 수면 아래: 기술 역량 3단계 -->\n  \u003cpath d=\"M140,120 L240,120 L320,340 L60,340 Z\" fill=\"var(--brand-soft)\" stroke=\"var(--brand)\" stroke-width=\"1.4\">\u003c/path>\n  \u003cline x1=\"113\" y1=\"193\" x2=\"267\" y2=\"193\" stroke=\"var(--brand)\" stroke-opacity=\"0.45\" stroke-width=\"1\">\u003c/line>\n  \u003cline x1=\"87\" y1=\"267\" x2=\"293\" y2=\"267\" stroke=\"var(--brand)\" stroke-opacity=\"0.45\" stroke-width=\"1\">\u003c/line>\n\n  \u003ctext x=\"190\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--brand)\">1단계 — 운영·점진 개선\u003c/text>\n  \u003ctext x=\"190\" y=\"224\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--brand)\">2단계 — 개조·창의적 응용\u003c/text>\n  \u003ctext x=\"190\" y=\"298\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--brand)\">3단계 — 자체 R&amp;D·독자 혁신\u003c/text>\n  \u003ctext x=\"190\" y=\"352\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--brand)\">기술 역량 (의도적 학습으로만 축적)\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p25.jpg\" alt=\"W02 p25 생산능력과 기술역량\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p25 생산능력과 기술역량\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p26.jpg\" alt=\"W02 p26 산업화의 빙산\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p26 산업화의 빙산\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-1-두-개념-비교\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 개념 비교 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>생산 능력 (Production Capacity)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>기술 역량 (Technological Capabilities)\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>정의\u003c/td>\n\u003ctd>주어진 효율 수준 및 투입 조합에서 \u003cstrong>기존 공정을 운영하고 제품을 생산\u003c/strong>하는 자원 체계\u003c/td>\n\u003ctd>기술적 변화를 지속적으로 \u003cstrong>창출·관리·대응\u003c/strong>하는 지식·숙련·경험의 자원 체계\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>구성\u003c/td>\n\u003ctd>설비(자본체화 기술), 작업 숙련, 운영 노하우\u003c/td>\n\u003ctd>암묵지, 조직적 구조, 혁신 관리 능력\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>획득 방법\u003c/td>\n\u003ctd>\u003cstrong>시장에서 쉽게 구매 및 이전 가능\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>의도적 학습 투자(technological accumulation)\u003c/strong>로만 형성\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>한계\u003c/td>\n\u003ctd>단순 공장 운영 능력 축적만으로는 \u003cstrong>기술적 변화를 스스로 만들어내지 못한다\u003c/strong>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-2-기술-역량의-3단계-축적\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">기술 역량의 3단계 축적 📄\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">1단계\u003c/th>\u003ctd class=\"deflist-desc\">운영 및 소폭 점진 개선\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">2단계\u003c/th>\u003ctd class=\"deflist-desc\">공정/제품 개조 및 창의적 응용\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">3단계\u003c/th>\u003ctd class=\"deflist-desc\">자체 R&amp;D 및 독자 혁신 창출\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>→ W02-1/09의 후발국 역방향 궤적 3단계와 그대로 대응한다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-3-왜-이-개념이-한국-이야기의-출발점인가\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 왜 이 개념이 한국 이야기의 출발점인가\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;미시적 기초는 &#39;해봐야 안다&#39;이기 때문에 분명히 작동하는 것 같아. 그 아주 대표적인 예야, 한국의 경제. 얘네들 도대체 뭐야, 아무것도 없는데 도대체 어떻게 한 거야? … 우리는 조선시대는 경제 개념이 별로 없어요. 잉여의 축적. 사농공상, 상은 제일 격이 떨어지는 사람으로 취급받았을 사람이야. 그랬던 애들이 어떻게 이렇게 치고 올라온 거야, 놀라운 거지.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:06:49\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 일본은 우리보다 100년 넘게 먼저 개항했고, 영주 시스템에서 늘 싸우느라 경제 개념이 있었다. \u003cstrong>조선은 경제 개념(잉여의 축적)이 별로 없었다.\u003c/strong> 그런 나라가 치고 올라온 것.\u003c/li>\n\u003cli>🗣 암묵지의 축적이 산업 역량에 중요하다고 보는 사람들(Bell &amp; Pavitt, Linsu Kim)에게 \u003cstrong>한국 케이스는 그 논리를 잘 증명해 주는 사례\u003c/strong> — 과학자가 있어서가 아니라 \u003cstrong>매일 열심히 하니까 된다\u003c/strong>는 것.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-4-울산과-부울경-capacity는-있는데-capability가-없다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 울산과 부울경 — capacity는 있는데 capability가 없다 ★\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;프로덕션 캐퍼시티가 있죠. 근데 그거를 케이퍼빌리티로 만드는 게 또 달라요. 그걸 업그레이드 시키는 거예요.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:10:57\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 \u003cstrong>울산\u003c/strong>: 미야자키 만화(미래소년 코난)의 인더스트리아 같은 장관의 플랜트들. \u003cstrong>생산 능력은 다 있다.\u003c/strong> 그런데 이를 capability로 업그레이드하는 것은 다른 일이며, \u003cstrong>시설을 돌릴 사람·연구할 사람이 서울로 가 버린다.\u003c/strong> (UNIST가 앵커 역할 가능)\u003c/li>\n\u003cli>🗣 지역 구조 비교:\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">천안·아산·평택\u003c/th>\u003ctd class=\"deflist-desc\">수도권 규제로 서울 대학 분교가 생기고 인력 공급을 받으며 삼성·현대가 내려와 \u003cstrong>같은 생활권\u003c/strong>이 됨.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">대전\u003c/th>\u003ctd class=\"deflist-desc\">40–50년 국가가 돈을 쏟아 겨우 바이오 성과. 오송·오창 산업단지 → \u003cstrong>경부고속도로 코리도까지는 시장이 끌고 가는 힘\u003c/strong>이 있다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">부울경\u003c/th>\u003ctd class=\"deflist-desc\">\u003cstrong>생산 자산은 있는데 시장이 끌고 가는 동력이 없다.\u003c/strong>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-5-quot-시장이-없으면-못-한다-quot\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 &quot;시장이 없으면 못 한다&quot; ★\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;시장이 없으면 못 합니다. 시장이 있어야 합니다. 우리는 마치 시장 없어도 그냥 이거 개발하고 막 이러면 절대 안 돼요. \u003cstrong>시장이 있으니까 계속해서 수정을 하는 거예요.\u003c/strong> … 근데 그 와중에 봤더니 배 잘 만드는 나라가 몇 개 없어. 우리나라밖에 없는 거죠. 지금 부울경한테 기회가 왔다.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:13:36\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 한국은 1990년대 이후 \u003cstrong>중국의 성장 옆에서 같이 컸고\u003c/strong>(중국 WTO 가입 2001), 그 전엔 냉전기 미국이 열어 준 시장에서 컸다.\u003c/li>\n\u003cli>🗣 중국이 따라잡아 막히는 와중에 미국이 중국을 배제하며 다시 시장을 잡아 주는 형국 — \u003cstrong>배 만드는 나라가 우리밖에 없어 부울경에 기회가 왔다.\u003c/strong>\u003c/li>\n\u003cli>🗣 \u003cstrong>AX가 곧 기존 제조업 역량의 업그레이드 작업.\u003c/strong> 타겟을 잘 잡아야 한다.\u003c/li>\n\u003c/ul>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">&quot;시장이 있으니까 계속 수정을 한다&quot; — 시장은 판매처가 아니라 \u003cstrong>학습의 피드백 장치\u003c/strong>라는 뜻. W02-1/07의 조직화된 시장과 정확히 같은 논리.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-6-r-amp-d가-필요한-이유\">\u003cspan class=\"step-no\" aria-hidden=\"true\">6\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 R&amp;D가 필요한 이유\u003c/p>\n\u003cp>장인들도 현장에서 어떻게 하면 잘할지 고민하지만, \u003cstrong>그것을 더 체계적으로 하는 작업\u003c/strong>이 R&amp;D. 데이터가 있으면 더 정확히 할 방법도 생겼다(Transformer를 구글이 만들고 NVIDIA GPU로 돌아가는 식).\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c09":{"title":"후발국의 역방향 기술 궤적","en":"Reverse Technological Trajectory of Latecomers","week":"W02-1","href":"W02-1.html#c09","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>선진국은 \u003cstrong>기초과학에서 시작해 산업으로 내려온다\u003c/strong>(Ω → λ, 정방향). 후발국은 \u003cstrong>반대로 간다\u003c/strong> — 이미 성숙한 남의 기술을 뜯어 보며 만들어 보고(DUI), 그것을 다듬어 자기 것으로 만든 다음, 마지막에야 자체 R&amp;D를 붙인다(λ → Ω, 역방향). 한국이 바로 이 길로 갔다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>요리를 배우는 두 가지 순서다.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>선진국(정방향)\u003c/strong>: 조리 과학을 공부하고 → 레시피를 개발하고 → 식당을 연다.\u003c/li>\n\u003cli>\u003cstrong>후발국(역방향)\u003c/strong>: 잘되는 식당 음식을 사다 먹어 보고 → 흉내 내 만들어 보고 → 내 입맛에 맞게 고치고 → \u003cstrong>그제서야\u003c/strong> 왜 그런지 원리를 공부해 새 메뉴를 만든다.\u003c/li>\n\u003c/ul>\n\u003cp>역방향이 열등한 게 아니다. \u003cstrong>이미 답이 나와 있는 영역에서는 훨씬 빠르다.\u003c/strong> 다만 앞서가는 순간부터는 정방향 능력(Ω)이 없으면 더 못 간다 — 그래서 3단계에서 STI를 결합해야 한다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c09-h-슬라이드-w02-p27\">📄 슬라이드 (W02 p27)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 260\" role=\"img\" aria-labelledby=\"w0201c09-title\">\n  \u003ctitle id=\"ans-w0201c09-title\">선진국은 기초과학에서 산업으로 내려가는 정방향 화살표, 후발국은 성숙 기술 도입에서 자체 R&amp;D로 거슬러 올라가는 역방향 화살표로 나아감을 대비하는 그림\u003c/title>\n  \u003cdefs>\n    \u003cmarker id=\"ans-w0201c09-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--brand)\">\u003c/path>\n    \u003c/marker>\n    \u003cmarker id=\"ans-w0201c09-arrow-term\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--term)\">\u003c/path>\n    \u003c/marker>\n  \u003c/defs>\n\n  \u003c!-- 선진국: 정방향 (왼→오, Ω → λ) -->\n  \u003ctext x=\"20\" y=\"30\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--brand)\">선진국 — 정방향\u003c/text>\n  \u003cline x1=\"22\" y1=\"68\" x2=\"358\" y2=\"68\" stroke=\"var(--brand)\" stroke-width=\"2.2\" marker-end=\"url(#w0201c09-arrow)\">\u003c/line>\n  \u003cg font-size=\"9.5\" fill=\"var(--ink-soft)\" text-anchor=\"middle\">\n    \u003ctext x=\"55\" y=\"52\">Ω 기초과학\u003c/text>\n    \u003ctext x=\"155\" y=\"52\">응용개발\u003c/text>\n    \u003ctext x=\"255\" y=\"52\">신산업 창출\u003c/text>\n    \u003ctext x=\"335\" y=\"52\">기술 성숙화\u003c/text>\n  \u003c/g>\n\n  \u003ctext x=\"190\" y=\"112\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">↕ 같은 시간, 반대 출발점\u003c/text>\n\n  \u003c!-- 후발국: 역방향 (오→왼, λ → Ω) -->\n  \u003ctext x=\"360\" y=\"140\" text-anchor=\"end\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--term)\">후발국 — 역방향\u003c/text>\n  \u003cline x1=\"358\" y1=\"178\" x2=\"22\" y2=\"178\" stroke=\"var(--term)\" stroke-width=\"2.2\" marker-end=\"url(#w0201c09-arrow-term)\">\u003c/line>\n  \u003cg font-size=\"9.5\" fill=\"var(--ink-soft)\" text-anchor=\"middle\">\n    \u003ctext x=\"335\" y=\"198\">λ 성숙기술 도입\u003c/text>\n    \u003ctext x=\"335\" y=\"212\">(역공학)\u003c/text>\n    \u003ctext x=\"190\" y=\"198\">기술 공고화\u003c/text>\n    \u003ctext x=\"190\" y=\"212\">(OEM→ODM)\u003c/text>\n    \u003ctext x=\"55\" y=\"198\">자체 R&amp;D\u003c/text>\n    \u003ctext x=\"55\" y=\"212\">(Ω 결합)\u003c/text>\n  \u003c/g>\n\n  \u003ctext x=\"190\" y=\"244\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">한국 — 삼성 특허: 공정(process) 특허 → 제품(product) 특허\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p27.jpg\" alt=\"W02 p27 후발국의 역방향 기술 궤적\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p27 후발국의 역방향 기술 궤적\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-1-두-궤적-비교\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 궤적 비교 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>선진국 궤적 (정방향)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>후발국 궤적 (역방향)\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>순서\u003c/td>\n\u003ctd>기초과학·기초연구(STI) → 응용개발 → 신산업 창출 → 기술 성숙화\u003c/td>\n\u003ctd>해외 \u003cstrong>성숙 기술 도입/복제\u003c/strong> → 기술 공고화 → \u003cstrong>자체 R&amp;D(STI 결합)\u003c/strong> 고도화\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>출발 지식\u003c/td>\n\u003ctd>Ω (명제적 지식)\u003c/td>\n\u003ctd>λ (처방적 지식)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>주된 학습 모드\u003c/td>\n\u003ctd>STI\u003c/td>\n\u003ctd>DUI → 나중에 STI 결합\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-2-3단계\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">3단계 📄\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>단계\u003c/th>\n\u003cth>내용\u003c/th>\n\u003cth>🗣 수업 설명\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1단계: 성숙 기술 흡수 (DUI 중심)\u003c/strong>\u003c/td>\n\u003ctd>자본재 수입, \u003cstrong>역공학(Reverse Engineering)\u003c/strong>, 해외 OEM 구매자의 기술 지도, 현장 작업 숙련 중심\u003c/td>\n\u003ctd>\u003cstrong>선진국 자동차를 사다가 뜯어 보고 만들어 보는 것.\u003c/strong> 맨땅에 헤딩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2단계: 기술 공고화 (Assimilation &amp; Improvement)\u003c/strong>\u003c/td>\n\u003ctd>수입 기술의 개조 및 국산화, 공정 개선, 엔지니어링 역량 축적\u003c/td>\n\u003ctd>\u003cstrong>OEM\u003c/strong>(주문자 상표 부착)으로 시키는 대로만 하다가 → \u003cstrong>ODM\u003c/strong>(제조자 설계)으로 전환\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3단계: 자체 R&amp;D 및 STI 결합\u003c/strong>\u003c/td>\n\u003ctd>선진국 견제·IPR 강화 대응, 기업 부설 연구소 설립, 독자적 제품 혁신으로 진입\u003c/td>\n\u003ctd>기업 부설 연구소 설립, 독자 제품 혁신\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-3-삼성-특허의-변화-궤적의-증거\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 삼성 특허의 변화 — 궤적의 증거 ★\u003c/p>\n\u003cul>\n\u003cli>초기 특허 대부분은 \u003cstrong>공정(process) 특허\u003c/strong> — 남이 설계한 것을 \u003cstrong>어떻게 잘 만드느냐\u003c/strong>의 지식.\u003c/li>\n\u003cli>어느 정도 나온 뒤 \u003cstrong>제품(product) 특허\u003c/strong>로 이동 — \u003cstrong>무엇을 만드느냐\u003c/strong>를 스스로 정하는 지식.\u003c/li>\n\u003cli>→ 기업 부설 연구소 설립, 독자 제품 혁신(STI 단계) 진입.\u003c/li>\n\u003c/ul>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">이 지표가 좋은 이유: 역량 단계의 이동을 \u003cstrong>특허 데이터로 관찰\u003c/strong>할 수 있다. Term paper에서 쓸 만한 측정 아이디어.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c09-h-4-왜-3단계로-넘어가야-했나-밀려난-이유\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">왜 3단계로 넘어가야 했나 — 밀려난 이유\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">3단계의 배경으로 \u003cstrong>&quot;선진국 견제/IPR 강화 대응&quot;\u003c/strong>이 적혀 있다.\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>즉 후발국이 자발적으로 R&amp;D를 시작한 게 아니라, \u003cstrong>역공학이 막혀서\u003c/strong> 할 수밖에 없었던 측면이 있다.\u003c/li>\n\u003cli>→ W02-1/11의 &quot;민간 R&amp;D 수요 창출 4대 동인&quot; 중 ②번(IPR 강화로 역공학 차단)과 직결.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c10":{"title":"수요–공급–연계 기술정책 프레임","en":"Demand / Supply / Linkage Policy Framework (Kim & Dahlman 1992)","week":"W02-1","href":"W02-1.html#c10","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>정부의 기술정책을 세 가지로 나누는 틀이다. \u003cstrong>공급 정책\u003c/strong>은 역량·인력·연구소를 직접 만들어 주고, \u003cstrong>수요 정책\u003c/strong>은 &quot;이걸 만들면 팔린다&quot;는 시장 니즈를 만들어 주며, \u003cstrong>연계 정책\u003c/strong>은 둘이 만나도록 세제·금융으로 촉매 역할을 한다. 한국의 성공은 이 세 가지를 \u003cstrong>발전 단계에 따라 바꿔 가며\u003c/strong> 썼기 때문이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>농사에 비유하면,\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>공급 정책\u003c/strong> = 씨앗과 농기구를 대 준다 (KIST 설립, 인력 양성, 자본재 수입)\u003c/li>\n\u003cli>\u003cstrong>수요 정책\u003c/strong> = &quot;수확하면 내가 다 사 줄게&quot;라고 판로를 만들어 준다 (공공조달, 국산화 지정, 수출 진흥)\u003c/li>\n\u003cli>\u003cstrong>연계 정책\u003c/strong> = 농사짓는 데 필요한 돈을 싸게 빌려주고 세금을 깎아 준다 (R&amp;D 세액공제, 우대금융)\u003c/li>\n\u003c/ul>\n\u003cp>핵심은 순서다. \u003cstrong>씨앗만 나눠 주고 팔 곳이 없으면 아무도 농사를 안 짓는다.\u003c/strong> 그래서 W02-1/11의 결론이 &quot;공급·세제 이전에 수요&quot;가 된다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c10-h-슬라이드-w02-p28\">📄 슬라이드 (W02 p28)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p28.jpg\" alt=\"W02 p28 수요-공급-연계 정책\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p28 수요-공급-연계 정책\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c10-h-1-세-정책의-정의와-시기별-수단\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">세 정책의 정의와 시기별 수단 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>수요 측면 (Demand-side)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>공급 측면 (Supply-side)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>연계 (Linkage)\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>정의\u003c/td>\n\u003ctd>시장 내 기술 변화·혁신을 시도하게 만드는 \u003cstrong>시장 니즈(Need)를 창출\u003c/strong>하는 정책\u003c/td>\n\u003ctd>기술 역량, 연구 인프라, 인적 자원 및 확산 주체를 \u003cstrong>직접 강화·공급\u003c/strong>하는 정책\u003c/td>\n\u003ctd>수요와 공급이 유기적으로 만나도록 \u003cstrong>촉매/윤활유\u003c/strong> 역할을 하는 제도\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>60–70년대\u003c/strong>\u003c/td>\n\u003ctd>보호관세, 수입 대체, \u003cstrong>수출 진흥\u003c/strong>\u003c/td>\n\u003ctd>자본재 수입, \u003cstrong>KIST 설립\u003c/strong>, 정규교육\u003c/td>\n\u003ctd>자본재 수입 관세면제/신용\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>80년대\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>공공조달 사전고지, 국산화 지정\u003c/strong>\u003c/td>\n\u003ctd>DFI/FL 자유화, \u003cstrong>민간 R&amp;D 장려\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>R&amp;D 세제(준비금), 우대금융\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">시기별로 읽으면 흐름이 보인다. 60–70년대는 \u003cstrong>국가가 직접 만들어 주는\u003c/strong> 단계(KIST, 자본재), 80년대는 \u003cstrong>민간이 하도록 유인하는\u003c/strong> 단계(민간 R&amp;D 장려, 세제). 국가의 역할이 생산자에서 설계자로 이동한다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c10-h-2-핵심은-quot-경쟁을-시킨-것-quot\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 핵심은 &quot;경쟁을 시킨 것&quot; ★\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;결국은 경쟁을 시킨 거예요. \u003cstrong>우리 국내 시장은 보호해 줄게, 대신에 수출을 해서 성과를 내.\u003c/strong> 이게 왜 작동했느냐. 옛날에는 돈이 없었어요. … 정주영 회장이 영국의 바클레이 뱅크 찾아갔을 때 거북선 지폐 보여주고서 &#39;우리는 배 만들 줄 아니까 돈 달라&#39;고 얘기했어. 일단은 펀딩이 중요했는데 그 펀딩을 누가 해줬냐, 정부가. &#39;펀딩 해줄 테니까 이거 이거 해.&#39; 그게 개발국가의 잔재가 아직도 남았어. 모피아라는 얘기가 나왔어.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:18:35\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>\u003cstrong>보호 + 수출 성과 요구\u003c/strong>의 결합이 핵심. 보호만 하면 나태해지고, 개방만 하면 살아남지 못한다. 🗣 국내는 보호하되 \u003cstrong>국제 시장에서 성과를 증명하게\u003c/strong> 했다.\u003c/li>\n\u003cli>🗣 \u003cstrong>왜 정부가 필요했나: 돈이 없었기 때문.\u003c/strong> 벤처도 결국 펀딩 문제이고, 그 펀딩을 정부가 해 줬다. 그 잔재가 \u003cstrong>모피아\u003c/strong>(재경부가 펀딩을 다 쥐고 있었으니). 대신 수출 잘하면 법인세 등으로 돌아온다.\u003c/li>\n\u003cli>🗣 \u003cstrong>중국 버전\u003c/strong>: \u003cstrong>지방정부끼리 싸움을 붙인다.\u003c/strong> 공유자전거도 경쟁시켜 1·2등만 남기고 3·4·5등이 망하면서 자전거 쓰레기가 산더미.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c10-h-3-관료의-자율성과-embedded-autonomy\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 관료의 자율성과 embedded autonomy ★\u003c/p>\n\u003cul>\n\u003cli>🗣 박정희의 철권통치에도 불구하고, \u003cstrong>남미 같았으면 딴짓을 했을 텐데 관료들이 그렇게 딴짓을 안 했다.\u003c/strong>\u003c/li>\n\u003cli>🗣 IMF 이후 정경유착(crony capitalism)으로 욕을 먹었고 외환은행 매각 같은 건수도 있지만, 상당 기간 관료들은 \u003cstrong>철저하게 경쟁으로 배분\u003c/strong>했다 — \u003cstrong>공정에 대한 감수성이 높았다.\u003c/strong>\u003c/li>\n\u003cli>🗣 \u003cstrong>Peter Evans\u003c/strong>(버클리)는 이를 \u003cstrong>embedded autonomy(배태된 자율성)\u003c/strong>라 불렀다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;서구에서는 국가를 믿지 않아요. 저렇게 세금 내서 하면 다들 자기 삥땅 칠 거다. 그 때문에 국가 시스템이 작동 잘 안 한다. … 삥땅을 친다는 게 뭐냐 하면 \u003cstrong>사적 이익한테 캡처된다\u003c/strong>는 얘기. 펀딩을 제일 잘하는 애한테 주는 게 아니고 나랑 친한 애들, 아니면 나한테 돈을 많이 주는 사람한테 주는. 근데 우리는 그렇지는 않았단 말이죠. 철저하게 경쟁을 통해 했다는, 공정에 대한 감수성이 굉장히 높은 거죠.&quot;\u003c/p>\u003cspan class=\"quote-time\">1:22:59\u003c/span>\u003c/blockquote>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>embedded autonomy\u003c/strong>의 두 축: \u003cstrong>embedded\u003c/strong>(산업계와 긴밀히 연결되어 무엇이 필요한지 안다) + \u003cstrong>autonomy\u003c/strong>(그러면서도 특정 기업에 포획되지 않는다). 둘 중 하나만 있으면 실패한다 — 연결만 있으면 정실주의, 자율만 있으면 탁상행정.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c11":{"title":"민간 R&D 수요 창출 4대 동인","en":"Four Determinants of Private R&D Demand in Korea","week":"W02-1","href":"W02-1.html#c11","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>정부가 R&amp;D 보조금과 세금 혜택을 준다고 기업이 연구를 시작하지는 않는다. \u003cstrong>&quot;혁신하지 않으면 죽는다&quot;는 시장 압력\u003c/strong>이 먼저 생겨야 한다. 한국에서 민간 R&amp;D가 폭발한 이유는 ① 경쟁 압력, ② 역공학 차단, ③ 정부의 구매 약속, ④ 세제·금융의 촉매 — 이 순서였다. 📄 \u003cstrong>&quot;공급이나 세제 지원 이전에 &#39;혁신하지 않고는 생존할 수 없는&#39; 시장 경쟁 압력이 핵심.&quot;\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>헬스장 회원권을 공짜로 준다고 운동하지 않는다. 그런데 \u003cstrong>건강검진에서 위험 신호가 나오면\u003c/strong>(①), \u003cstrong>좋아하던 배달음식이 끊기면\u003c/strong>(②), \u003cstrong>회사가 체력검정을 예고하면\u003c/strong>(③) 운동을 시작한다. 이때 회원권 할인(④)이 마지막 한 방을 더한다.\u003c/p>\n\u003cp>한국 기업도 같았다. 80년대에 \u003cstrong>임금이 오르고\u003c/strong>, \u003cstrong>중국·동남아가 싸게 치고 올라오고\u003c/strong>, \u003cstrong>선진국이 기술을 안 주기 시작하자\u003c/strong> &quot;이대로는 죽는다&quot;가 됐다. 그때 정부의 세제 지원이 불을 붙였다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c11-h-슬라이드-w02-p29\">📄 슬라이드 (W02 p29)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p29.jpg\" alt=\"W02 p29 민간 R&amp;D 수요 창출 결정요인\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p29 민간 R&amp;D 수요 창출 결정요인\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-1-4대-동인\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">4대 동인 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>동인\u003c/th>\n\u003cth>📄 내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>①\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>치열한 시장 경쟁 압력과 환경 변화\u003c/strong>\u003c/td>\n\u003ctd>1980년대 \u003cstrong>임금 상승\u003c/strong>, \u003cstrong>저임금 후발국 추격\u003c/strong>, \u003cstrong>선진국 견제\u003c/strong>로 단순 모방 가격경쟁이 한계에 도달. 시장 개방 및 경쟁 정책이 기업에게 R&amp;D를 \u003cstrong>강제\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>②\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>지식재산권(IPR) 보호 강화를 통한 역공학 차단\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>물질특허 도입\u003c/strong> 등 IPR 강화로 단순 역공학·모방이 불가능해지자, 시장 지분을 지키기 위해 자체 R&amp;D 투자로 전환\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>③\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>공공 조달 및 국산화 목표 지정 (Demand-Pull)\u003c/strong>\u003c/td>\n\u003ctd>정부의 \u003cstrong>중기 구매 계획 사전 고지\u003c/strong>(학교용 PC 5,000대 대량 구매 등) 및 \u003cstrong>1,555개 주요 기계/부품 국산화 타겟 지정\u003c/strong>이 R&amp;D 수요 창출\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>④\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>연계 정책(세제·금융)의 촉매 작용\u003c/strong>\u003c/td>\n\u003ctd>기술개발준비금, R&amp;D 세액공제, 우대금융 등은 \u003cstrong>시장 수요가 형성된 상태에서\u003c/strong> R&amp;D 투자를 폭발시키는 결정적 유인으로 작동\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-2-핵심-논리-순서가-중요하다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">핵심 논리: 순서가 중요하다 ★\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>&quot;공급(R&amp;D)이나 연계(세제) 정책은 시장의 경쟁 압력과 수요(Demand) 없이는 불발.&quot;\u003c/strong>\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>①②③이 \u003cstrong>수요\u003c/strong>를 만들고, ④가 \u003cstrong>촉매\u003c/strong>로 작동한다.\u003c/li>\n\u003cli>④를 먼저 하면? → 세금은 깎이는데 R&amp;D는 안 늘어난다. 💡 &quot;R&amp;D 세액공제를 늘렸는데 왜 효과가 없나&quot;라는 정책 논쟁의 전형적 답이 여기 있다.\u003c/li>\n\u003cli>🗣 W02-1/08의 \u003cstrong>&quot;시장이 없으면 못 한다&quot;\u003c/strong>와 정확히 같은 주장.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-3-①번-동인을-뜯어보면-세-방향의-압박\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">①번 동인을 뜯어보면 — 세 방향의 압박\u003c/p>\n\u003cp>1980년대 한국 기업이 동시에 맞은 세 가지 압력:\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">위에서\u003c/th>\u003ctd class=\"deflist-desc\">선진국이 기술 이전을 막고 견제\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">아래에서\u003c/th>\u003ctd class=\"deflist-desc\">저임금 후발국이 가격으로 추격\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">안에서\u003c/th>\u003ctd class=\"deflist-desc\">임금 상승으로 원가 우위 상실\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>→ 💡 이 협공을 벗어나는 유일한 출구가 \u003cstrong>기술 차별화\u003c/strong>였다. 즉 R&amp;D는 선택이 아니라 생존 조건이 됐다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-4-②번이-역설적인-이유\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">②번이 역설적인 이유\u003c/p>\n\u003cul>\n\u003cli>W02-1/09에서 후발국 1단계의 핵심 수단이 \u003cstrong>역공학\u003c/strong>이었다.\u003c/li>\n\u003cli>IPR 강화는 그 수단을 \u003cstrong>막은 것\u003c/strong>이다.\u003c/li>\n\u003cli>즉 \u003cstrong>후발 전략을 봉쇄당한 것이 자체 R&amp;D의 계기\u003c/strong>가 됐다. 억압이 전환을 만든 셈.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>이는 오늘날에도 반복된다. 미국의 대중국 반도체 수출 통제가 중국의 자체 개발을 가속하는 구조와 같다. 🗣 W02 Q2에서 나온 중국 에틸렌 자립(2018–19년 60% 수입 → 거의 100% 자립)도 같은 패턴.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c11-h-5-③번-demand-pull의-구체성\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">③번 Demand-Pull의 구체성\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>학교용 PC 5,000대 대량 구매\u003c/strong>, \u003cstrong>1,555개 주요 기계/부품 국산화 타겟 지정\u003c/strong>.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>중요한 것은 \u003cstrong>사전 고지\u003c/strong>다. &quot;앞으로 몇 년간 이만큼 산다&quot;를 미리 알려 주면 기업이 투자 계산을 할 수 있다. 불확실성을 정부가 흡수해 준 것.\u003c/li>\n\u003cli>→ W13 \u003cstrong>임무지향형 혁신정책(MOIP)\u003c/strong>의 조달 기반 수요 창출과 같은 논리. 🗣 W02-1/10 참조.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-1/c12":{"title":"종합 — 지식 모드의 결합과 수요 중심 정책","en":"Synthesis — Complementary Combination of STI/DUI and Demand-oriented Policy","week":"W02-1","href":"W02-1.html#c12","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>이 주차의 결론은 두 문장이다. ① \u003cstrong>지식 모드는 결합해야 한다\u003c/strong> — 하이테크는 R&amp;D(STI)에 현장 학습(DUI)을 붙이고, 전통 제조업은 현장 노하우(DUI)에 과학 지식(STI)을 붙여야 한다. ② \u003cstrong>정책은 수요·공급·연계가 균형을 이뤄야 하고, 발전 단계에 따라 동적으로 바뀌어야 한다.\u003c/strong>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>이 주차 전체를 한 문장으로 줄이면 🗣 교수의 말이 된다. \u003cstrong>&quot;해 봐야 안다.&quot;\u003c/strong> 그런데 여기에 단서가 붙는다. \u003cstrong>해 보기만 해서는 그 자리에 갇힌다.\u003c/strong> 해 본 것을 말과 글로 옮겨야 남에게 전해지고, 그때 \u003cstrong>로직(과학)이 들어온다.\u003c/strong>\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;몸으로 알고 다 하는 것들을 다른 사람들하고 공유하려면 말로 해야 되고 글로 써야 되는데, 말로 하고 글로 쓸 때는 과학적인 지식이 들어오는 거죠. … \u003cstrong>지역에서 점 보는 사람들이 얘기하는 스타일을 옮길 수가 없잖아요. 로직이 있어야 되는 거잖아.\u003c/strong>&quot;\u003c/p>\u003cspan class=\"quote-time\">1:25:28\u003c/span>\u003c/blockquote>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c12-h-슬라이드-w02-p30-31\">📄 슬라이드 (W02 p30–31)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p30.jpg\" alt=\"W02 p30 종합 결론\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p30 종합 결론\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c12-h-1-결론-①-지식-모드의-상호보완적-결합\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">결론 ① 지식 모드의 상호보완적 결합 ★\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">STI 단독 또는 DUI 단독의 한계 극복이 핵심.\u003c/span>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>산업 유형\u003c/th>\n\u003cth>가진 것\u003c/th>\n\u003cth>붙여야 할 것\u003c/th>\n\u003cth>📄 구체적 방법\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>하이테크 산업\u003c/strong>\u003c/td>\n\u003ctd>R&amp;D (STI)\u003c/td>\n\u003ctd>\u003cstrong>DUI\u003c/strong>\u003c/td>\n\u003ctd>현장 자율팀·부서통합·사용자 상호작용 결합 필수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>전통 제조업\u003c/strong>\u003c/td>\n\u003ctd>현장 노하우 (DUI)\u003c/td>\n\u003ctd>\u003cstrong>STI\u003c/strong>\u003c/td>\n\u003ctd>외부 과학 지식 및 \u003cstrong>KIBS 연계\u003c/strong>를 통한 고도화\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>KIBS\u003c/strong> (Knowledge-Intensive Business Services, 지식집약 비즈니스 서비스) = 엔지니어링, 설계, IT, 컨설팅 등 다른 기업에 지식을 공급하는 서비스업. 중소 제조업체가 자체 R&amp;D 조직을 갖기 어려울 때 \u003cstrong>외부에서 STI를 빌려 오는 통로\u003c/strong>가 된다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c12-h-2-한국-현장에-대한-진단\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 한국 현장에 대한 진단\u003c/p>\n\u003cul>\n\u003cli>🗣 전통 제조업은 \u003cstrong>공정부터 배웠기 때문에 DUI가 발달\u003c/strong> — 현장을 꿰뚫고 있는 \u003cstrong>&#39;빠꼼이&#39;\u003c/strong>가 회사마다, 군대에도 있다. 그 사람들을 \u003cstrong>AX 등으로 업그레이드\u003c/strong>하는 작업이 필요하다.\u003c/li>\n\u003cli>🗣 국제 경쟁은 임금 경쟁(중국은 싸다) → 우리는 \u003cstrong>생산성을 높이고 새 제품을 만드는 경쟁\u003c/strong>을 해야 하며, 그때 \u003cstrong>DUI와 STI를 결합\u003c/strong>해야 한다.\u003c/li>\n\u003cli>🗣 (나중에 Lundvall 관련해 \u003cstrong>dynamic capability\u003c/strong> 같은 얘기도 할 것.)\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c12-h-3-결론-②-수요-공급-연계-정책의-균형\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">결론 ② 수요–공급–연계 정책의 균형 ★\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>공급(R&amp;D)이나 연계(세제) 정책은 시장의 경쟁 압력과 수요(Demand) 없이는 불발.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>발전 단계에 따른 동적 정책 전환\u003c/strong> (성숙 기술 흡수 → 자체 R&amp;D 및 IPR 강화).\u003c/li>\n\u003c/ul>\n\u003cp>→ W02-1/10, W02-1/11의 결론을 그대로 받는다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c12-h-4-두-결론이-사실-하나인-이유\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 결론이 사실 하나인 이유 💡\u003c/p>\n\u003cul>\n\u003cli>결합(①)과 수요(②)는 다른 얘기처럼 보이지만 같은 구조다.\u003c/li>\n\u003cli>\u003cstrong>STI만 밀면 불만족스러운 혁신\u003c/strong>(W02-1/06)이 되고, \u003cstrong>공급만 밀면 정책이 불발\u003c/strong>된다(W02-1/11).\u003c/li>\n\u003cli>양쪽 모두 \u003cstrong>&quot;쓰는 쪽을 보라&quot;\u003c/strong>는 하나의 주장이다. 현장 사용자(DUI)를 보라는 것과 시장 수요(demand)를 보라는 것은 층위만 다를 뿐 같은 말이다.\u003c/li>\n\u003cli>★ 퀴즈에서 이 연결을 쓸 수 있으면 답안의 수준이 올라간다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c12-h-5-discussion-p31\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">📄 Discussion (p31) ★\u003c/p>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02/p31.jpg\" alt=\"W02 p31 Discussion\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W02 p31 Discussion\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>Q1. STI mode 학습의 혁신에의 기여는? DUI mode는 Path-dependency로 Lock-in되는데 돌파 방안은?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>🗣 DUI는 path-dependency로 lock-in될 가능성이 높다 — \u003cstrong>새로운 세계를 못 볼 수 있다.\u003c/strong>\u003c/li>\n\u003cli>답을 만들 실마리:\u003cul>\n\u003cli>STI의 기여 = \u003cstrong>단절적(radical) 혁신\u003c/strong>과 \u003cstrong>전파 가능성\u003c/strong>(다른 현장으로 이전). W02 Q2에서 나온 원자폭탄 예시.\u003c/li>\n\u003cli>돌파 방안 = ① 외부 지식 유입(KIBS, 연구기관 협력) ② 🗣 \u003cstrong>메타 인지\u003c/strong>(&quot;해 봐야 아는 것만 가지고 가면 안 된다&quot;) ③ W01 Q5의 🗣 \u003cstrong>조직 바깥 태스크포스(DARPA 방식)\u003c/strong> ④ 인력 순환.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Q2. 20세기 한국의 전략은 추격전략(Catching-up), 21세기 전략은? STI mode와 DUI mode? Something else?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>🗣 W01 §5: &quot;잘하는 애한테 몰아주면 뭔가 나온다&quot;는 추격에는 먹혔지만 \u003cstrong>프론티어에서는 안 먹힌다. 다양성이 중요하다.\u003c/strong>\u003c/li>\n\u003cli>🗣 W02 Q6: &quot;\u003cstrong>우리는 왜 AI를 먼저 못 만들었을까?\u003c/strong>&quot; 거꾸로 생각하면 이 정도 하니까 지금 수준인지도 모른다. 그럼에도 질문은 해야 한다.\u003c/li>\n\u003cli>→ W01/04 Korea Paradox, W01/05 고착, W01/06 전환 실패와 모두 연결되는 열린 질문. \u003cstrong>Term paper 주제로도 유력.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-2/c01":{"title":"고전적 공공재 논리와 그 한계","en":"The Classical Public Good Argument and Its Limits","week":"W02-2","href":"W02-2.html#c01","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>경제학은 지식을 \u003cstrong>공공재\u003c/strong>로 본다. 남이 쓰는 것을 막기 어렵고(\u003cstrong>비배제성\u003c/strong>), 남이 써도 내 몫이 줄지 않기(\u003cstrong>비경합성\u003c/strong>) 때문이다. 그래서 &quot;민간은 지식에 과소투자하므로 정부가 대야 한다&quot;는 결론이 나온다. 이 논리는 \u003cstrong>정부 R&amp;D 예산의 근거\u003c/strong>이지만, 📄 \u003cstrong>&quot;지식이 실제로 쓰이기 위한 조건을 생략&quot;\u003c/strong>한다는 치명적 빈틈이 있다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>동네 가로등을 생각해 보자. 내가 돈을 들여 세우면 지나가는 사람 모두가 공짜로 쓰고(비배제성), 남이 그 빛을 쬔다고 내 빛이 줄지 않는다(비경합성). 그러니 \u003cstrong>아무도 자기 돈으로 세우지 않는다.\u003c/strong> 그래서 구청이 세운다.\u003c/p>\n\u003cp>지식도 같다는 것이 고전 논리다. 논문을 쓰면 누구나 읽고, 읽는다고 내 지식이 줄지 않는다. 그러니 기업은 기초연구에 돈을 안 쓰고, 정부가 대야 한다.\u003c/p>\n\u003cp>\u003cstrong>그런데 빈틈은 여기다.\u003c/strong> 가로등은 세우면 바로 불이 켜진다. 그런데 \u003cstrong>논문은 공개해도 저절로 쓰이지 않는다.\u003c/strong> 그 논문을 읽고 재현할 사람, 장비, 표준이 있어야 한다. 이것이 Callon의 출발점이다(W02-2/03).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c01-h-슬라이드-w02-2-p5\">📄 슬라이드 (W02-2 p5)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02-2/p05.jpg\" alt=\"W02-2 p5 고전적 공공재 논리\" loading=\"lazy\" decoding=\"async\" width=\"1600\" height=\"900\">\u003cfigcaption>W02-2 p5 고전적 공공재 논리\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-1-공공재의-두-조건\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">공공재의 두 조건 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>조건\u003c/th>\n\u003cth>📄 슬라이드 설명\u003c/th>\n\u003cth>💡 부연\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>비배제성\u003c/strong> (non-excludability)\u003c/td>\n\u003ctd>다른 사람의 이용을 막기 어렵다\u003c/td>\n\u003ctd>일단 공개된 지식은 울타리를 치기 어렵다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>비경합성\u003c/strong> (non-rivalry)\u003c/td>\n\u003ctd>한 사람이 써도 줄지 않는다\u003c/td>\n\u003ctd>빵은 내가 먹으면 없어지지만, 공식은 내가 써도 남아 있다\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-2-정책-결론\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">정책 결론\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>민간은 과소투자한다\u003c/strong> → 따라서 정부가 기초연구에 투자해야 한다.\u003c/span>\u003c/p>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">이 논증의 계보: \u003cstrong>Nelson(1959)\u003c/strong>과 \u003cstrong>Arrow(1962)\u003c/strong>가 정식화했다. Arrow는 여기에 \u003cstrong>정보의 역설\u003c/strong>을 덧붙였다 — 지식을 팔려면 그 내용을 보여 줘야 하는데, 보여 주는 순간 상대는 이미 그것을 갖게 되므로 살 이유가 없다. 그래서 지식은 시장에서 제대로 거래되지 않는다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-3-결정적-한-줄-이-슬라이드의-핵심\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">📄 결정적 한 줄 — 이 슬라이드의 핵심\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>&quot;그러나 이 논리는 지식이 실제로 쓰이기 위한 조건을 생략한다.&quot;\u003c/strong>\u003c/span>\u003c/p>\n\u003cul>\n\u003cli>고전 논리는 지식을 \u003cstrong>공개하면 끝나는 것\u003c/strong>으로 다룬다.\u003c/li>\n\u003cli>실제로는 공개 이후에 \u003cstrong>재현·활용의 문제\u003c/strong>가 남는다. → W02-2/03, W02-2/07.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>즉 이 슬라이드는 공공재 논리를 소개하면서 동시에 \u003cstrong>이번 강의 전체의 반론을 예고\u003c/strong>한다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-4-논쟁의-세-질문-p3\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">논쟁의 세 질문 📄 (p3)\u003c/p>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02-2/p03.jpg\" alt=\"W02-2 p3 오늘의 질문\" loading=\"lazy\" decoding=\"async\" width=\"1600\" height=\"900\">\u003cfigcaption>W02-2 p3 오늘의 질문\u003c/figcaption>\u003c/figure>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">이 자료 전체가 던지는 세 질문:\u003c/span>\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>지식은 공공재인가 사유재인가\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>공공성은 어떻게 제도적으로 확보되는가\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>누가 기술의 질문을 새롭게 정의하는가\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>→ ①이 이 파일, ②가 W02-2/06–07, ③이 W02-2/08.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-5-논증의-흐름-p4\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">논증의 흐름 📄 (p4)\u003c/p>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02-2/p04.jpg\" alt=\"W02-2 p4 논증의 흐름\" loading=\"lazy\" decoding=\"async\" width=\"1600\" height=\"900\">\u003cfigcaption>W02-2 p4 논증의 흐름\u003c/figcaption>\u003c/figure>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>지식의 성격(명시지와 암묵지) → 전유와 고착(시장과 enclosure) → 공동 탐색(Innovation Commons) → 시민 다양성(새로운 문제)\u003c/strong>\u003c/span>\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">결론 미리보기: \u003cstrong>&quot;공공성의 핵심은 새로운 탐색의 조건을 지키는 일이다.&quot;\u003c/strong>\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W02-2/c02":{"title":"Kealey의 도전 — 선형모형 뒤집기","en":"Kealey's Challenge to the Linear Model","week":"W02-2","href":"W02-2.html#c02","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>&quot;정부가 과학에 투자하면 기술이 발전하고 경제가 성장한다&quot;는 \u003cstrong>선형모형\u003c/strong>에 대한 정면 반박이다. Kealey는 \u003cstrong>인과가 반대\u003c/strong>라고 본다. \u003cstrong>성장했기 때문에 과학 활동이 늘어난 것\u003c/strong>이지, 과학에 투자해서 성장한 것이 아니라는 것이다. 더 나아가 🗣 \u003cstrong>과학 지식은 사유재\u003c/strong>이며, 사람들은 돈이 될 줄 알고 투자하는 것이지 남과 나눌 생각이 없다고 주장한다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>&quot;헬스장이 많은 동네 사람들이 건강하다&quot;는 관찰이 있다고 하자.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>선형모형식 해석\u003c/strong>: 헬스장을 지으면 사람들이 건강해진다. → 정부가 헬스장을 짓자.\u003c/li>\n\u003cli>\u003cstrong>Kealey식 반문\u003c/strong>: 아니다. \u003cstrong>잘사는 동네라서\u003c/strong> 헬스장이 많고 사람들도 건강한 것이다. 헬스장은 결과지 원인이 아니다.\u003c/li>\n\u003c/ul>\n\u003cp>Kealey가 과학과 성장에 대해 던진 질문이 정확히 이것이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c02-h-슬라이드-w02-2-p6\">📄 슬라이드 (W02-2 p6)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W02-2/p06.jpg\" alt=\"W02-2 p6 Kealey의 도전\" loading=\"lazy\" decoding=\"async\" width=\"1600\" height=\"900\">\u003cfigcaption>W02-2 p6 Kealey의 도전\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-1-두-인과의-대립\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">두 인과의 대립 ★\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>선형모형 (통설)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>Kealey의 반문\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>인과 방향\u003c/td>\n\u003ctd>정부 과학 → 기술발전 → 성장\u003c/td>\n\u003ctd>\u003cstrong>성장 → 더 많은 과학 활동\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>함의\u003c/td>\n\u003ctd>정부가 기초과학에 투자해야 한다\u003c/td>\n\u003ctd>투자해도 성장으로 이어진다고 단정할 수 없다\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-2-정책적-함의-온건한-결론\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">📄 정책적 함의 — 온건한 결론\u003c/p>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">\u003cstrong>지식·문화의 가치는 인정. 성장투자는 단정하지 않음.\u003c/strong>\u003c/span>\u003c/p>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">이 구분이 중요하다. Kealey는 &quot;과학이 쓸모없다&quot;고 말하지 않는다. 과학의 \u003cstrong>문화적·지적 가치는 인정\u003c/strong>하되, \u003cstrong>&quot;성장을 위한 투자&quot;라는 정당화는 근거가 약하다\u003c/strong>고 본다. 퀴즈에서 Kealey를 &quot;반과학주의자&quot;로 쓰면 틀린다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-3-교수의-소개-사유재-주장\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 교수의 소개 — 사유재 주장\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;Kealey 같은 사람은 \u003cstrong>과학 지식은 사유재다, 절대로 공공재가 아니다\u003c/strong>고 주장하는 사람. 되게 세게 주장하죠. \u003cstrong>돈 될 거 알고 사람들이 투자한다, 남들하고 나눌 그런 생각 없다.\u003c/strong>&quot;\u003c/p>\u003cspan class=\"quote-time\">2:40:44\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>즉 Kealey의 공격은 두 갈래다.\u003col>\n\u003cli>\u003cstrong>인과 반박\u003c/strong>: 과학이 성장을 만드는 게 아니다 (📄 슬라이드).\u003c/li>\n\u003cli>\u003cstrong>성격 반박\u003c/strong>: 지식은 애초에 공공재가 아니라 사유재다 (🗣).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>②는 W02-2/04(지식의 사유화 경로)로 이어진다. 💡 실제로 기업은 spillover가 있어도 연구를 계속하는데, 그 이유가 암묵지·보완자산·데이터 같은 \u003cstrong>전유 수단\u003c/strong>이 있기 때문이다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-4-논쟁-구도-안에서의-위치\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">논쟁 구도 안에서의 위치 💡\u003c/p>\n\u003cp>세 입장을 한 줄로 배열하면 이해가 쉽다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>입장\u003c/th>\n\u003cth>지식은?\u003c/th>\n\u003cth>정부는?\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>고전 공공재론\u003c/strong> (Arrow, Nelson)\u003c/td>\n\u003ctd>공공재\u003c/td>\n\u003ctd>투자해야 한다 (시장 실패 보정)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Kealey\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>사유재\u003c/strong>\u003c/td>\n\u003ctd>투자 근거가 약하다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Callon\u003c/strong>\u003c/td>\n\u003ctd>둘 다 아님 — \u003cstrong>조건에 달림\u003c/strong>\u003c/td>\n\u003ctd>투자 여부보다 \u003cstrong>재현·활용·탐색의 조건\u003c/strong>을 봐야 한다\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>→ 이 자료의 결론은 세 번째다. Kealey는 \u003cstrong>고전 논리를 흔드는 지렛대\u003c/strong>로 배치되어 있다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"}},"quizSchedule":[{"n":1,"date":"2026-09-19","weeks":["W01","W02-1"]},{"n":2,"date":"2026-10-17","weeks":["W01","W02-1","W02-2","W03","W04","W05"]},{"n":3,"date":"2026-10-31","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07"]},{"n":4,"date":"2026-11-14","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09"]},{"n":5,"date":"2026-11-28","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09","W10","W11"]},{"n":6,"date":"2026-12-12","weeks":["W01","W02-1","W02-2","W03","W04","W05","W06","W07","W08","W09","W10","W11","W12","W13"]}]}</script>
