<script type="application/json" id="quiz-data">{"items":[{"id":"W01/c01/0","conceptId":"W01/c01","week":"W01","no":1,"href":"W01.html#c01","html":"정치·경제·혁신 활동을 &quot;가치&quot;와 &quot;결정 방식&quot;을 기준으로 비교하고, 셋을 묶는 개념(collective action problem)을 설명하라.","text":"정치·경제·혁신 활동을 \"가치\"와 \"결정 방식\"을 기준으로 비교하고, 셋을 묶는 개념(collective action problem)을 설명하라.","isComparison":true},{"id":"W01/c01/1","conceptId":"W01/c01","week":"W01","no":1,"href":"W01.html#c01","html":"&quot;혁신은 solo act인가?&quot; — 이 수업의 입장과 근거를 교수의 잡스·게이츠 예시를 들어 서술하라. (시장이 당겨 줬다 / 이미 누군가 하고 있었다)","text":"\"혁신은 solo act인가?\" — 이 수업의 입장과 근거를 교수의 잡스·게이츠 예시를 들어 서술하라. (시장이 당겨 줬다 / 이미 누군가 하고 있었다)","isComparison":false},{"id":"W01/c01/2","conceptId":"W01/c01","week":"W01","no":1,"href":"W01.html#c01","html":"교수가 말한 혁신활동의 정의(&quot;값어치 있는 지식을 만드는 활동&quot;)를 쓰고, 지식 활동과 혁신의 차이를 설명하라.","text":"교수가 말한 혁신활동의 정의(\"값어치 있는 지식을 만드는 활동\")를 쓰고, 지식 활동과 혁신의 차이를 설명하라.","isComparison":true},{"id":"W01/c01/3","conceptId":"W01/c01","week":"W01","no":1,"href":"W01.html#c01","html":"응용: 투입–전환–산출–환류 모형을 한국 R&amp;D 시스템에 적용하면 Korea Paradox는 어느 단계의 문제인가? (스스로 답을 만들어 볼 것)","text":"응용: 투입–전환–산출–환류 모형을 한국 R&D 시스템에 적용하면 Korea Paradox는 어느 단계의 문제인가? (스스로 답을 만들어 볼 것)","isComparison":false},{"id":"W01/c02/0","conceptId":"W01/c02","week":"W01","no":2,"href":"W01.html#c02","html":"\u003cp>Geels(2004)의 세 축(규칙·제도 / 인간·조직 / 사회기술시스템)을 쓰고, 기존 사회과학과 다른 점이 무엇인지 설명하라.\u003c/p>","text":"Geels(2004)의 세 축(규칙·제도 / 인간·조직 / 사회기술시스템)을 쓰고, 기존 사회과학과 다른 점이 무엇인지 설명하라.","isComparison":false},{"id":"W01/c02/1","conceptId":"W01/c02","week":"W01","no":2,"href":"W01.html#c02","html":"\u003cp>여섯 관계 중 ④(시스템이 행동의 맥락을 구성)와 ⑤(규칙이 인공물에 새겨짐)를 수업의 예시(서울/부산의 24시간, 이루다·전력망)로 설명하라.\u003c/p>","text":"여섯 관계 중 ④(시스템이 행동의 맥락을 구성)와 ⑤(규칙이 인공물에 새겨짐)를 수업의 예시(서울/부산의 24시간, 이루다·전력망)로 설명하라.","isComparison":false},{"id":"W01/c02/2","conceptId":"W01/c02","week":"W01","no":2,"href":"W01.html#c02","html":"\u003cp>역적응(reverse adaptation)이란 무엇이며, 전력망 사례에서 어떻게 나타나는가?\u003c/p>","text":"역적응(reverse adaptation)이란 ":"W01.html#c05","html":"\u003cp>기술 고착의 메커니즘인 한계 체증(increasing returns)의 다섯 요소를 쓰고, 지배적 디자인이 &quot;최고가 아니어도&quot; 유지되는 이유를 설명하라.\u003c/p>","text":"기술 고착의 메커니즘인 한계 체증(increasing returns)의 다섯 요소를 쓰고, 지배적 디자인이 \"최고가 아니어도\" 유지되는 이유를 설명하라.","isComparison":false},{"id":"W01/c05/2","conceptId":"W01/c05","week":"W01","no":5,"href":"W01.html#c05","html":"\u003cp>비교형: &quot;잘하는 애한테 몰아주기&quot;가 추격 단계에서는 통하고 프론티어에서는 안 통하는 이유를 고착과 다양성의 관점에서 설명하라.\u003c/p>","text":"비교형: \"잘하는 애한테 몰아주기\"가 추격 단계에서는 통하고 프론티어에서는 안 통하는 이유를 고착과 다양성의 관점에서 설명하라.","isComparison":true},{"id":"W01/c06/0","conceptId":"W01/c06","week":"W01","no":6,"href":"W01.html#c06","html":"시장 실패·시스템 실패·전환 실패를 한 줄씩 정의하고, &quot;시스템 전환은 경제·사회·정치·문화 프로젝트&quot;라는 말이 어느 실패와 연결되는지 설명하라.","text":"시장 실패·시스템 실패·전환 실패를 한 줄씩 정의하고, \"시스템 전환은 경제·사회·정치·문화 프로젝트\"라는 말이 어느 실패와 연결되는지 설명하라.","isComparison":false},{"id":"W01/c06/1","conceptId":"W01/c06","week":"W01","no":6,"href":"W01.html#c06","html":"한국의 Korea Paradox를 세 실패 프레임으로 진단하면 어느 실패에 해당하는가? 근거를 들어 서술하라.","text":"한국의 Korea Paradox를 세 실패 프레임으로 진단하면 어느 실패에 해당하는가? 근거를 들어 서술하라.","isComparison":false},{"id":"W01/c06/2","conceptId":"W01/c06","week":"W01","no":6,"href":"W01.html#c06","html":"비교형: 시장 실패 처방(R&amp;D 보조금)만으로 시스템 전환이 안 되는 이유를 고착(lock-in)과 변이(variety) 개념으로 설명하라.","text":"비교형: 시장 실패 처방(R&D 보조금)만으로 시스템 전환이 안 되는 이유를 고착(lock-in)과 변이(variety) 개념으로 설명하라.","isComparison":true},{"id":"W01/c07/0","conceptId":"W01/c07","week":"W01","no":7,"href":"W01.html#c07","html":"\u003cp>기회의 평등과 결과의 평등의 차이를 설명하고, &quot;구조적인 박스&quot;(Bank of Parents, 지역 격차)가 능력주의 논리에 던지는 문제를 서술하라.\u003c/p>","text":"기회의 평등과 결과의 평등의 차이를 설명하고, \"구조적인 박스\"(Bank of Parents, 지역 격차)가 능력주의 논리에 던지는 문제를 서술하라.","isComparison":true},{"id":"W01/c07/1","conceptId":"W01/c07","week":"W01","no":7,"href":"W01.html#c07","html":"\u003cp>Social capital이란 무엇이며(Putnam, Bauman), 그것이 줄어드는 것이 왜 혁신(collective action)의 문제인가?\u003c/p>","text":"Social capital이란 무엇이며(Putnam, Bauman), 그것이 줄어드는 것이 왜 혁신(collective action)의 문제인가?","isComparison":false}, 스러운 혁신(W02-1/06)의 처방이 되는 이유를 정보 비대칭 개념으로 설명하라.","isComparison":true},{"id":"W02-1/c07/3","conceptId":"W02-1/c07","week":"W02-1","no":7,"href":"W02-1.html#c07","html":"\u003cp>응용: 조직화된 시장의 강점(신뢰)이 동시에 약점(고착)이 될 수 있다. 이 긴장을 논하라.\u003c/p>","text":"응용: 조직화된 시장의 강점(신뢰)이 동시에 약점(고착)이 될 수 있다. 이 긴장을 논하라.","isComparison":false},{"id":"W02-1/c08/0","conceptId":"W02-1/c08","week":"W02-1","no":8,"href":"W02-1.html#c08","html":"\u003cp>★ 생산 능력과 기술 역량을 정의하고 차이를 설명하라. 왜 전자는 구매 가능하고 후자는 불가능한가?\u003c/p>","text":"★ 생산 능력과 기술 역량을 정의하고 차이를 설명하라. 왜 전자는 구매 가능하고 후자는 불가능한가?","isComparison":true},{"id":"W02-1/c08/1","conceptId":"W02-1/c08","week":"W02-1","no":8,"href":"W02-1.html#c08","html":"\u003cp>기술 역량 축적의 3단계를 쓰고, 각 단계에서 기업이 하는 일을 설명하라.\u003c/p>","text":"기술 역량 축적의 3단계를 쓰고, 각 단계에서 기업이 하는 일을 설명하라.","isComparison":false},{"id":"W02-1/c08/2","conceptId":"W02-1/c08","week":"W02-1","no":8,"href":"W02-1.html#c08","html":"\u003cp>한국이 &quot;아무것도 없는 상태&quot;에서 성공한 것이 Bell &amp; Pavitt의 논리를 증명한다는 말의 뜻을 서술하라.\u003c/p>","text":"한국이 \"아무것도 없는 상태\"에서 성공한 것이 Bell & Pavitt의 논리를 증명한다는 말의 뜻을 서술하라.","isComparison":false},{"id":"W02-1/c08/3","conceptId":"W02-1/c08","week":"W02-1","no":8,"href":"W02-1.html#c08","html":"\u003cp>응용: 울산·부울경이 &quot;생산 능력은 있으나 기술 역량 업그레이드가 어렵다&quot;는 진단의 근거와, 그 해법으로 제시된 것을 논하라.\u003c/p>","text":"응용: 울산·부울경이 \"생산 능력은 있으나 기술 역량 업그레이드가 어렵다\"는 진단의 근거와, 그 해법으로 제시된 것을 논하라.","isComparison":false},{"id":"W02-1/c09/0","conceptId":"W02-1/c09","week":"W02-1","no":9,"href":"W02-1.html#c09","html":"\u003cp>★ 선진국의 정방향 궤적과 후발국의 역방향 궤적을 비교하고, 후발국 3단계를 설명하라.\u003c/p>","text":"★ 선진국의 정방향 궤적과 후발국의 역방향 궤적을 비교하고, 후발국 3단계를 설명하라.","isComparison":true},{"id":"W02-1/c09/1","conceptId":"W02-1/c09","week":"W02-1","no":9,"href":"W02-1.html#c09","html":"\u003cp>역방향 궤적의 1단계에서 DUI가 중심이 되는 이유는? (역공학, OEM 기술지도, 현장 숙련)\u003c/p>","text":"역방향 궤적의 1단계에서 DUI가 중심이 되는 이유는? (역공학, OEM 기술지도, 현장 숙련)","isComparison":false},{"id":"W02-1/c09/2","conceptId":"W02-1/c09","week":"W02-1","no":9,"href":"W02-1.html#c09","html":"\u003cp>응용: 20세기 추격 전략이 21세기에 통하지 않는 이유를 고착·다양성 개념으로 논하라. (Discussion 문제)\u003c/p>","text":"응용: 20세기 추격 전략이 21세기에 통하지 않는 이유를 고착·다양성 개념으로 논하라. (Discussion 문제)","isComparison":false},{"id":"W02-1/c10/0","conceptId":"W02-1/c10","week":"W02-1","no":10,"href":"W02-1.html#c10","html":"\u003cp>★ 수요·공급·연계 정책을 각각 정의하고, 한국의 60–70년대와 80년대 수단을 비교하라.\u003c/p>","text":"★ 수요·공급·연계 정책을 각각 정의하고, 한국의 60–70년대와 80년대 수단을 비교하라.","isComparison":true},{"id":"W02-1/c10/1","conceptId":"W02-1/c10","week":"W02-1","no":10,"href":"W02-1.html#c10","html":"\u003cp>★ Embedded autonomy란 무엇이며, 한국 관료제가 &quot;사적 이익에 포획되지 않았다&quot;는 평가의 근거는?\u003c/p>","text":"★ Embedded autonomy란 무엇이며, 한국 관료제가 \"사적 이익에 포획되지 않았다\"는 평가의 근거는?","isComparison":false},{"id":"W02-1/c10/2","conceptId":"W02-1/c10","week":"W02-1","no":10,"href":"W02-1.html#c10","html":"\u003cp>비교형: 시기별 정책 수단의 변화(국가가 직접 만들어 주기 → 민간이 하도록 유인하기)가 기술 역량 단계와 어떻게 대응하는가?\u003c/p>","text":"비교형: 시기별 정책 수단의 변화(국가가 직접 만들어 주기 → 민간이 하도록 유인하기)가 기술 역량 단계와 어떻게 대응하는가?","isComparison":true},{"id":"W02-1/c11/0","conceptId":"W02-1/c11","week":"W02-1","no":11,"href":"W02-1.html#c11","html":"\u003cp>★ 민간 R&amp;D 수요를 창출한 4대 동인을 쓰고, 각각을 설명하라.\u003c/p>","text":"★ 민간 R&D 수요를 창출한 4대 동인을 쓰고, 각각을 설명하라.","isComparison":false},{"id":"W02-1/c11/1","conceptId":"W02-1/c11","week":"W02-1","no":11,"href":"W02-1.html#c11","html":"\u003cp>★ &quot;공급이나 세제 지원 이전에 시장 경쟁 압력이 핵심&quot;이라는 주장의 근거를 서술하라. 세제 지원을 먼저 하면 왜 효과가 없는가?\u003c/p>","text":"★ \"공급이나 세제 지원 이전에 시장 경쟁 압력이 핵심\"이라는 주장의 근거를 서술하라. 세제 지원을 먼저 하면 왜 효과가 없는가?","isComparison":false},{"id":"W02-1/c11/2","conceptId":"W02-1/c11","week":"W02-1","no":11,"href":"W02-1.html#c11","html":"\u003cp>IPR 강화가 후발국의 자체 R&amp;D를 촉발한 메커니즘을 설명하라. (역공학 차단의 역설)\u003c/p>","text":"IPR 강화가 후발국의 자체 R&D를 촉발한 메커니즘을 설명하라. (역공학 차단의 역설)","isComparison":false},{"id":"W02-1/c11/3","conceptId":"W02-1/c11","week":"W02-1","no":11,"href":"W02-1.html#c11","html":"\u003cp>응용: 이 4대 동인 프레임으로 현재 한국의 AI·반도체 상황을 진단하면 무엇이 부족한가? (Korea Paradox와 연결)\u003c/p>","text":"응용: 이 4대 동인 프레임으로 현재 한국의 AI·반도체 상황을 진단하면 무엇이 부족한가? (Korea Paradox와 연결)","isComparison":false},{"id":"W02-1/c12/0","conceptId":"W02-1/c12","week":"W02-1","no":12,"href":"W02-1.html#c12","html":"\u003cp>★ 하이테크 산업과 전통 제조업이 각각 어떤 지식 모드를 보완해야 하는지 설명하라. KIBS의 역할은?\u003c/p>","text":"★ 하이테크 산업과 전통 제조업이 각각 어떤 지식 모드를 보완해야 하는지 설명하라. KIBS의 역할은?","isComparison":false},{"id":"W02-1/c12/1","conceptId":"W02-1/c12","week":"W02-1","no":12,"href":"W02-1.html#c12","html":"\u003cp>★ &quot;지식 모드의 결합&quot;과 &quot;수요 중심 정책&quot;이 결국 같은 주장인 이유를 설명하라.\u003c/p>","text":"★ \"지식 모드의 결합\"과 \"수요 중심 정책\"이 결국 같은 주장인 이유를 설명하라.","isComparison":false},{"id":"W02-1/c12/2","conceptId":"W02-1/c12","week":"W02-1","no":12,"href":"W02-1.html#c12","html":"\u003cp>★ DUI mode의 lock-in을 돌파하는 방안을 세 가지 이상 제시하고 근거를 서술하라. (Discussion Q1)\u003c/p>","text":"★ DUI mode의 lock-in을 돌파하는 방안을 세 가지 이상 제시하고 근거를 서술하라. (Discussion Q1)","isComparison":false},{"id":"W02-2/c01/0","conceptId":"W02-2/c01","week":"W02-2","no":1,"href":"W02-2.html#c01","html":"★ 지식을 공공재로 보는 논리(비배제성·비경합성)와 그 정책 결론을 설명하라.","text":"★ 지식을 공공재로 보는 논리(비배제성·비경합성)와 그 정책 결론을 설명하라.","isComparison":false},{"id":"W02-2/c01/1","conceptId":"W02-2/c01","week":"W02-2","no":1,"href":"W02-2.html#c01","html":"★ 이 논리가 생략한 것은 무엇인가? (&quot;지식이 실제로 쓰이기 위한 조건&quot;)","text":"★ 이 논리가 생략한 것은 무엇인가? (\"지식이 실제로 쓰이기 위한 조건\")","isComparison":false},{"id":"W02-2/c01/2","conceptId":"W02-2/c01","week":"W02-2","no":1,"href":"W02-2.html#c01","html":"비교형: 공공재 논리와 W01/06의 시장 실패 프레임의 관계를 설명하라.","text":"비교형: 공공재 논리와 W01/06의 시장 실패 프레임의 관계를 설명하라.","isComparison":true},{"id":"W02-2/c02/0","conceptId":"W02-2/c02","week":"W02-2","no":2,"href":"W02-2.html#c02","html":"★ 선형모형과 Kealey의 반문을 대비해 설명하라. 인과의 방향이 어떻게 뒤집히는가?","text":"★ 선형모형과 Kealey의 반문을 대비해 설명하라. 인과의 방향이 어떻게 뒤집히는가?","isComparison":true},{"id":"W02-2/c02/1","conceptId":"W02-2/c02","week":"W02-2","no":2,"href":"W02-2.html#c02","html":"Kealey의 정책적 함의가 &quot;과학은 쓸모없다&quot;가 아닌 이유를 설명하라.","text":"Kealey의 정책적 함의가 \"과학은 쓸모없다\"가 아닌 이유를 설명하라.","isComparison":false},{"id":"W02-2/c02/2","conceptId":"W02-2/c02","week":"W02-2","no":2,"href":"W02-2.html#c02","html":"비교형: 공공재론·Kealey·Callon의 세 입장을 &quot;지식의 성격&quot;과 &quot;정부의 역할&quot;로 비교하라.","text":"비교형: 공공재론·Kealey·Callon의 세 입장을 \"지식의 성격\"과 \"정부의 역할\"로 비교하라.","isComparison":true}],"answers":{"W01/c01":{"title":"사회 속의 시스템 — 정치·경제·혁신 활동","en":"System in a Society — Political / Economic / Innovation Activity","week":"W01","href":"W01.html#c01","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>사람은 혼자 살 수 없고, 여럿이 살면 &quot;누가 무엇을 가질지&quot;를 함께 정해야 하는 문제(collective action problem)가 생긴다. 이 문제를 푸는 방식이 세 가지다. \u003cstrong>정치는 권위로 나누고, 경제는 가격으로 나누며, 혁신은 값어치 있는 새 지식을 만든다.\u003c/strong> 혁신은 천재 한 명의 일(solo act)처럼 보이지만, 자세히 보면 여럿이 얽힌 집단적 활동이다. 그래서 이 수업은 혁신을 \u003cstrong>시스템\u003c/strong>으로 본다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>한 마을에 파이가 있다고 하자.\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">정치\u003c/th>\u003ctd class=\"deflist-desc\">촌장과 마을회의가 &quot;누가 몇 조각 갖는다&quot;를 정한다. 우리는 그 권위를 위임했다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">경제\u003c/th>\u003ctd class=\"deflist-desc\">장터에서 파이를 돈 주고 산다. 촌장 없이도 1:1 거래로 파이가 돌아간다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">혁신\u003c/th>\u003ctd class=\"deflist-desc\">지금까지 없던 새 파이를 굽는다. 그런데 &quot;천재 요리사 혼자 구웠다&quot;고 흔히 말하지만, 실은 밀가루 대주는 농부, 오븐 만든 대장장이, &quot;그거 맛있겠다&quot;고 먼저 사 주는 손님이 있어야 파이가 나온다.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>정치와 경제는 \u003cstrong>있는 것을 나누는\u003c/strong> 문제이고, 혁신은 \u003cstrong>없던 것을 만드는\u003c/strong> 문제다. 셋 다 &quot;여럿이 함께 사는 데서 생기는 문제&quot;를 푸는 방식이라는 점이 같다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c01-h-슬라이드-w01-p6\">📄 슬라이드 (W01 p6)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p06.jpg\" alt=\"W01 p6 System in a Society\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p6 System in a Society\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-1-위-그림-정치체계-모형\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">위 그림: 정치체계 모형\u003c/p>\n\u003cp>🗣 교수는 상단 그림을 &quot;\u003cstrong>정책학 개론의 정치체계 모형\u003c/strong>&quot;(Easton)이라고 소개했다. 요구(demand)와 지지(support)가 투입되면 정치체제가 처리해 정책(output)을 내고, 그 결과가 다시 환류(feedback)된다. 시스템은 사회 전체에 둘러싸여 있고, 목적이 있으면 그것을 달성하는 방식으로 돌아간다.\u003c/p>\n\u003cp>🗣 경영학에서는 \u003cstrong>Porter의 가치사슬(미시)과 다이아몬드 모델(거시)\u003c/strong>이 비슷한 고민을 해 왔다. 즉 &quot;시스템으로 보는 눈&quot;은 정치학·경영학 모두에 있었고, 이 수업은 그 눈을 혁신에 적용한다.\u003c/p>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">Easton(1953)의 정치 정의는 &quot;사회를 위한 가치의 권위적 배분(authoritative allocation of values for a society)&quot;. 슬라이드의 &quot;가치의 권위적 배분&quot;이라는 표현이 여기서 왔다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-2-세-활동의-비교-교수-설명-기준\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">세 활동의 비교 — 🗣 교수 설명 기준\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>정치활동\u003c/th>\n\u003cth>경제활동\u003c/th>\n\u003cth>혁신활동\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>슬라이드 📄\u003c/td>\n\u003ctd>가치의 \u003cstrong>권위적 배분\u003c/strong> (정치적 가치)\u003c/td>\n\u003ctd>가치의 \u003cstrong>시장적 배분\u003c/strong> (경제적 가치)\u003c/td>\n\u003ctd>경제(·정치) 가치의 \u003cstrong>창출\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>결정 방식 📄\u003c/td>\n\u003ctd>Collective decision-making\u003c/td>\n\u003ctd>Collective decision-making \u003cstrong>?\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Solo act or\u003c/strong> Collective \u003cstrong>?\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🗣 교수 설명 (W01)\u003c/td>\n\u003ctd>대통령·국회가 정하고, 우리가 권위를 \u003cstrong>위임\u003c/strong>한 것\u003c/td>\n\u003ctd>가격을 붙일 수 있는 것은 가격으로. 희소자원의 배분. 개인 문제가 아닌 전체의 문제\u003c/td>\n\u003ctd>잡스·게이츠를 떠올리지만 \u003cstrong>혼자 한 게 아니다\u003c/strong>. 이미 하던 것을 &quot;되겠다&quot; 하고 치고 나왔고, \u003cstrong>시장이 당겨 줬기\u003c/strong> 때문에 성공\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🗣 교수 설명 (W02 재설명)\u003c/td>\n\u003ctd>요구에 대응해 소화하는 시스템. 독재·민주주의 등 모습은 다양\u003c/td>\n\u003ctd>정치와 다른 점은 \u003cstrong>계약 관계\u003c/strong> — 이론상 당신과 나는 동등한 1:1 계약. 사람에게 가장 익숙한, 서로 동의한 방식\u003c/td>\n\u003ctd>\u003cstrong>지식을 만드는 것.\u003c/strong> 논문만 쓰면 지식 활동, \u003cstrong>값어치가 붙으면 혁신\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;근데 더 자세히 들여다보면 스티브 잡스나 빌 게이츠가 혼자 한 게 아니야. 그전에 하고 있었어. 하고 있다가 보니까 탁, &#39;이거 돈 되겠다&#39; 하고 치고 나온 거지. 물론 그렇게 판단하는 사람이 엄청 많죠. 망할 사람도 있고 되는 사람도 있지만, 왜냐, 시장이 그걸 당기니까.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 11:11\u003c/span>\u003cp class=\"quote-text\">&quot;혁신 활동은 뭐냐, 지식을 만드는 겁니다. 기본적으로 지식을 만드는데 이 지식이 값어치가 있는 것이죠. 그냥 논문 쓰는 거면 그건 그냥 지식 활동이고, 값어치가 있는 지식 활동은 혁신이라고 부릅니다.&quot;\u003c/p>\u003cspan class=\"quote-time\">W02 07:06\u003c/span>\u003c/blockquote>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-3-슬라이드의-두-물음표가-뜻하는-것\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">슬라이드의 두 물음표가 뜻하는 것\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>경제의 &quot;?&quot;\u003c/strong> — 🗣 정치는 권위를 위임한 집단 결정이지만, 경제는 \u003cstrong>1:1 계약\u003c/strong>의 모음이다. 전체의 문제(희소자원 배분)를 풀긴 하는데, 누가 모여서 결정한 것은 아니다. 그래서 &quot;집단적 결정&quot;이라 부르기 애매하다는 뜻의 물음표.\u003c/li>\n\u003cli>\u003cstrong>혁신의 &quot;?&quot;\u003c/strong> — 🗣 Schumpeter의 기업가(entrepreneur)처럼 \u003cstrong>solo act\u003c/strong>로 이해하기 쉽지만 실제로는 그렇지 않다. 그래서 이 수업은 \u003cstrong>collective한 체제, 즉 혁신시스템\u003c/strong>을 다룬다. → 📄 p13 &quot;Innovation as a system activity (collective action)&quot;.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-4-묶는-개념-collective-action-problem\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">묶는 개념: Collective Action Problem\u003c/p>\n\u003cp>🗣 교수가 이 슬라이드의 핵심으로 꼽은 개념. 사람은 혼자 살 수 없고, 여럿이 살 때 생기는 문제를 푸는 방식이 정치(권위)와 시장(가격)이다. 혁신도 같은 문제를 푸는 활동이다. 따라서 \u003cstrong>시스템 = 사회에서 발생하는 문제를 풀어 나가는 하나의 체제·방식\u003c/strong>이며, 여러 행위자(actor)와 네트워크로 이루어진다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c01-h-5-이-수업의-기본-입장-w02-재설명에서-추가\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 이 수업의 기본 입장 (W02 재설명에서 추가)\u003c/p>\n\u003cp>\u003cstrong>펌(firm) 레벨에서 어떻게 시스템을 만들 것인가.\u003c/strong> 새 비즈니스를 할 때 제품·서비스만이 아니라 생태계 전체를 만드는 고민. 이것이 혁신시스템론과 통하며, 마지막 주제인 \u003cstrong>혁신생태계론\u003c/strong>(W01/11)은 이를 펌 단위로 다룬다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c02":{"title":"인간–제도–과학기술의 상호구성","en":"Co-constitution of Actors, Institutions and Socio-technical Systems (Geels 2004)","week":"W01","href":"W01.html#c02","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>사회를 설명할 때 보통은 \u003cstrong>사람·조직\u003c/strong>과 \u003cstrong>규칙·제도\u003c/strong> 두 축만 본다. 이 수업은 여기에 \u003cstrong>물질세계(과학기술, 인공물, 자연)\u003c/strong>를 세 번째 축으로 넣고, 세 축이 \u003cstrong>서로를 만들어 간다(상호구성)\u003c/strong>고 본다. 기술은 사람이 만들지만, 일단 깔리면 사람의 행동 범위와 제도까지 바꾼다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>세 명이 한 집에 사는데, 한 명은 \u003cstrong>사람\u003c/strong>(습관, 성공 공식), 한 명은 \u003cstrong>규칙\u003c/strong>(집안 규칙, 법), 한 명은 \u003cstrong>집 자체\u003c/strong>(구조, 배선, 엘리베이터 유무)다. 규칙은 사람이 만들고 사람은 규칙을 따른다 — 여기까지는 보통 사회과학. 그런데 \u003cstrong>집이 5층인데 엘리베이터가 없으면\u003c/strong> 노인은 못 살고, &quot;무거운 짐은 1층에&quot; 같은 규칙이 생긴다. 집(기술)이 사람과 규칙을 바꾸는 것이다. 거꾸로 규칙이 &quot;엘리베이터 의무화&quot;를 정하면 집이 바뀐다. 셋은 서로를 끊임없이 고쳐 쓴다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c02-h-슬라이드-w01-p7\">📄 슬라이드 (W01 p7)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 460\" role=\"img\" aria-labelledby=\"w01c02-title\">\n  \u003ctitle id=\"ans-w01c02-title\">인간·조직, 규칙·제도, 사회기술시스템 세 축이 여섯 개의 화살표로 서로를 만들어 가는 상호구성 삼각 순환도\u003c/title>\n  \u003cdefs>\n    \u003cmarker id=\"ans-w01c02-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"3\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L7,3 L0,6 Z\" fill=\"var(--brand)\">\u003c/path>\n    \u003c/marker>\n  \u003c/defs>\n\n  \u003c!-- 세 꼭짓점 사이 여섯 화살표(각 변마다 왕복 2개, 살짝 벌려서 겹치지 않게) -->\n  \u003cg fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1.6\" marker-end=\"url(#w01c02-arrow)\">\n    \u003c!-- 상단(인간·조직, 190,58) - 좌하(규칙·제도, 66,264) : ①②-->\n    \u003cpath d=\"M175,78 C130,140 110,190 88,238\">\u003c/path>\n    \u003cpath d=\"M100,240 C118,192 138,140 178,84\">\u003c/path>\n    \u003c!-- 상단 - 우하(사회기술시스템, 314,264) : ③④ -->\n    \u003cpath d=\"M205,78 C250,140 270,190 292,238\">\u003c/path>\n    \u003cpath d=\"M280,240 C262,192 242,140 202,84\">\u003c/path>\n    \u003c!-- 좌하 - 우하 : ⑤⑥ -->\n    \u003cpath d=\"M108,272 C170,296 210,296 272,272\">\u003c/path>\n    \u003cpath d=\"M272,254 C210,230 170,230 108,254\">\u003c/path>\n  \u003c/g>\n\n  \u003c!-- 화살표 번호 배지 -->\n  \u003cg font-size=\"11\" font-weight=\"700\" fill=\"var(--surface)\" text-anchor=\"middle\">\n    \u003ccircle cx=\"118\" cy=\"152\" r=\"10\" fill=\"var(--brand)\">\u003c/circle>\n    \u003ctext x=\"118\" y=\"156\">①\u003c/text>\n    \u003ccircle cx=\"160\" cy=\"152\" r=\"10\" fill=\"var(--brand)\">\u003c/circle>\n    \u003ctext x=\"160\" y=\"156\">②\u003c/text>\n    \u003ccircle cx=\"262\" cy=\"152\" r=\"10\" fill=\"var(--brand)\">\u003c/circle>\n    \u003ctext x=\"262\" y=\"156\">③\u003c/text>\n    \u003ccircle cx=\"222\" cy=\"152\" r=\"10\" fill=\"var(--brand)\">\u003c/circle>\n    \u003ctext x=\"222\" y=\"156\">④\u003c/text>\n    \u003ccircle cx=\"190\" cy=\"298\" r=\"10\" fill=\"var(--brand)\">\u003c/circle>\n    \u003ctext x=\"190\" y=\"302\">⑤\u003c/text>\n    \u003ccircle cx=\"190\" cy=\"218\" r=\"10\" fill=\"var(--brand)\">\u003c/circle>\n    \u003ctext x=\"190\" y=\"222\">⑥\u003c/text>\n  \u003c/g>\n\n  \u003c!-- 세 꼭짓점 노드 -->\n  \u003cg>\n    \u003crect x=\"130\" y=\"30\" width=\"120\" height=\"48\" rx=\"10\" fill=\"var(--brand-soft)\" stroke=\"var(--brand)\" stroke-width=\"1.4\">\u003c/rect>\n    \u003ctext x=\"190\" y=\"49\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--brand)\">인간·조직\u003c/text>\n    \u003ctext x=\"190\" y=\"65\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">행위자·습관·routine\u003c/text>\n\n    \u003crect x=\"6\" y=\"238\" width=\"122\" height=\"48\" rx=\"10\" fill=\"var(--term-soft)\" stroke=\"var(--term)\" stroke-width=\"1.4\">\u003c/rect>\n    \u003ctext x=\"67\" y=\"257\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--term)\">규칙·제도\u003c/text>\n    \u003ctext x=\"67\" y=\"273\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">도덕·정책·법\u003c/text>\n\n    \u003crect x=\"252\" y=\"238\" width=\"122\" height=\"48\" rx=\"10\" fill=\"var(--note-soft)\" stroke=\"var(--note)\" stroke-width=\"1.4\">\u003c/rect>\n    \u003ctext x=\"313\" y=\"257\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--note)\">사회기술시스템\u003c/text>\n    \u003ctext x=\"313\" y=\"273\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Material · S&amp;T\u003c/text>\n  \u003c/g>\n\n  \u003c!-- 범례: 여섯 화살표의 뜻 -->\n  \u003cg font-size=\"11.5\" fill=\"var(--ink-soft)\">\n    \u003ctext x=\"6\" y=\"320\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--ink)\">여섯 관계\u003c/text>\n    \u003ctext x=\"6\" y=\"338\">① 인간·조직→규칙 — 규칙을 담지·재생산\u003c/text>\n    \u003ctext x=\"6\" y=\"356\">② 규칙→인간·조직 — 행동·인식을 가이드\u003c/text>\n    \u003ctext x=\"6\" y=\"374\">③ 인간·조직→시스템 — 인간을 통해서만 작동\u003c/text>\n    \u003ctext x=\"6\" y=\"392\">④ 시스템→인간·조직 — 행동의 맥락(가능성·한계) 구성\u003c/text>\n    \u003ctext x=\"6\" y=\"410\">⑤ 규칙→시스템 — 규칙이 인공물에 새겨짐(inscribe)\u003c/text>\n    \u003ctext x=\"6\" y=\"428\">⑥ 시스템→규칙 — 물질조건이 규칙·표준을 규제\u003c/text>\n  \u003c/g>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p07.jpg\" alt=\"W01 p7 인간-제도-과학기술\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p7 인간-제도-과학기술\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-1-세-축과-그림-읽는-법\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">세 축과 그림 읽는 법\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>슬라이드 예시\u003c/th>\n\u003cth>색\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>규칙·제도\u003c/strong>\u003c/td>\n\u003ctd>도덕, 공공정책, 산업정책, 고용정책, 복지정책, 법\u003c/td>\n\u003ctd>파랑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>인간·조직\u003c/strong>\u003c/td>\n\u003ctd>Lifestyle, 관행, 조직 routine, 성공 공식\u003c/td>\n\u003ctd>주황\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>사회기술시스템 (Material, S&amp;T)\u003c/strong>\u003c/td>\n\u003ctd>지구, 생태계, 우주, 원자력, Digital\u003c/td>\n\u003ctd>초록\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>🗣 초록 실선 원(규칙 + 인간·조직)이 \u003cstrong>기존 사회과학이 다루던 범위\u003c/strong>다. Adam Smith도 분업과 전문화는 얘기했지만 과학기술 자체는 다루지 않았다. 점선 타원들이 \u003cstrong>물질세계를 더한 것\u003c/strong>이고, 이 수업은 그 확장된 범위를 본다.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-2-여섯-개-화살표-교수의-예시와-함께\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">여섯 개 화살표 — 🗣 교수의 예시와 함께\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>방향\u003c/th>\n\u003cth>뜻\u003c/th>\n\u003cth>🗣 수업 예시\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>①\u003c/td>\n\u003ctd>인간·조직 → 규칙\u003c/td>\n\u003ctd>규칙·제도를 담지하고 재생산하는 주체\u003c/td>\n\u003ctd>(사람이 없으면 규칙도 없다)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>②\u003c/td>\n\u003ctd>규칙 → 인간·조직\u003c/td>\n\u003ctd>행위주체의 인식·행동·상호작용을 가이드\u003c/td>\n\u003ctd>(법·도덕이 행동을 이끈다)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>③\u003c/td>\n\u003ctd>인간·조직 → 시스템\u003c/td>\n\u003ctd>\u003cstrong>사회기술시스템은 인간과 조직을 통해서만 작동\u003c/strong>\u003c/td>\n\u003ctd>인간이 없으면 시스템은 안 움직인다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>④\u003c/td>\n\u003ctd>시스템 → 인간·조직\u003c/td>\n\u003ctd>인공물·물질조건이 \u003cstrong>행동의 맥락(가능성과 한계)\u003c/strong>을 구성\u003c/td>\n\u003ctd>\u003cstrong>서울 사람의 24시간과 부산 사람의 24시간은 다르다\u003c/strong> — 서울은 뒷골목까지 전철이 들어간다. 핸드폰 없는 시대로 돌아가면 전혀 다른 삶. 선진국 전력소비는 2005년경 피크 후 하락, 한국은 아직 상승\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>⑤\u003c/td>\n\u003ctd>규칙 → 시스템\u003c/td>\n\u003ctd>\u003cstrong>규칙은 인공물의 구성요소\u003c/strong> — 디자인의 목적과 기능에 새겨짐(inscribe)\u003c/td>\n\u003ctd>AI 챗봇 \u003cstrong>이루다\u003c/strong>: 어떻게 교육시키느냐에 따라 달라진다 → 기술은 중립적이지 않다. \u003cstrong>Langdon Winner &quot;Do Artifacts Have Politics?&quot;\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>⑥\u003c/td>\n\u003ctd>시스템 → 규칙\u003c/td>\n\u003ctd>물질조건이 규칙·프레임·표준을 규제 — 기술적/물질적 한계\u003c/td>\n\u003ctd>대전 공유자전거 \u003cstrong>타슈\u003c/strong>는 대전이 평평해서 20년 가까이 굴러갔다. 부산에서는 안 된다. 물리적 조건을 뛰어넘어 제도를 밀어붙이기는 어렵다\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;서울에서 사는 사람의 24시간과 부산에서 사는 사람의 24시간이 다르다. 왜 다르냐, 서울은 뒷골목까지 전철이 들어가 있어요. 여러분 지금 만약에 핸드폰이 없는 시대로 돌아가라, 돌아가긴 하겠지. 근데 전혀 다른 라이프를 시작해야지.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 14:36\u003c/span>\u003c/blockquote>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-3-역적응-reverse-adaptation-⑤번-화살표의-어두운-면\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">역적응(reverse adaptation) — ⑤번 화살표의 어두운 면\u003c/p>\n\u003cp>🗣 사람이 편하려고 수단을 만들었는데, 오히려 \u003cstrong>사람이 수단에 적응\u003c/strong>한다. 수단이 목적을 가려 버린다.\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;그러니까 사람들이 편하기 위해서 수단을 만들었는데 오히려 그 수단에 사람들이 적응하는 거죠. 거기에 맞춰서 하는 거.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 19:46\u003c/span>\u003c/blockquote>\n\u003cp>🗣 \u003cstrong>전력망 사례\u003c/strong>: 원전·화력 집중 발전 시스템에서는 송전망 건설이 전체 효율에 맞다. 지역 주민이 반대하면 &quot;전체 시스템을 위해 왜 고집이냐&quot;는 시각이 나오는데, 이것이 \u003cstrong>효율성을 위해 사람을 시스템에 맞추라는 역적응 논리\u003c/strong>다. 분산형 태양광 같은 대안이 나오는 이유.\u003c/p>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;전력망을 세우는 게 맞잖아요. 그게 전체 시스템의 효율성에 맞는 걸로 이해할 수 있잖아요. 근데 사람들이 반대해. &#39;우리 동네는 싫어, 하지 마.&#39; &#39;무슨 소리야, 전체 시스템을 위해서 그래야지. 이상한 사람들이 있네.&#39; 이렇게 되는 거죠. 그러니까 그런 수단이 목적을 오히려 가려버리는 것들이 있었다는 것이죠.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 20:10\u003c/span>\u003c/blockquote>\n\u003cp>→ 역적응은 W01/05 \u003cstrong>사용자 고착\u003c/strong>에서 다시 나온다 (기술 고착이 역적응을 통해 사회적 관습으로 내재화).\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-4-w02-재설명에서-추가된-것\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 W02 재설명에서 추가된 것\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">인간과 마카크 원숭이의 차이\u003c/th>\u003ctd class=\"deflist-desc\">원숭이 무리도 위계는 있지만 \u003cstrong>도구를 쓰지 않는다.\u003c/strong> 인간은 도구를 쓰고 이것이 문명화(civilization)로 발달했다. 이 관계를 보는 것이 STS의 고민.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">Ulrich Beck의 위험사회(Risk Society)\u003c/th>\u003ctd class=\"deflist-desc\">제1근대는 대량생산과 민주화였는데, \u003cstrong>제2근대\u003c/strong>에서는 \u003cstrong>사람이 만들어 낸 위험\u003c/strong>(원자력, 환경)이 등장했다. 나만 당하는 게 아니라 다 같이 당한다. 옛날엔 페어한 계약만 얘기했는데 이제 지구온난화·방사성 폐기물처럼 \u003cstrong>함께 결정해야 할 것이 하나 더\u003c/strong> 생겼다. → 물질 축이 왜 사회과학에 들어와야 하는지의 근거.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">비트코인 → 스테이블코인 사례\u003c/th>\u003ctd class=\"deflist-desc\">비트코인은 \u003cstrong>국경 없는 신뢰를 기술이 만든\u003c/strong> 것(정부 보증 없이 스스로 보증). 그런데 국가가 이를 \u003cstrong>스테이블코인으로 포섭\u003c/strong>해 달러·국채에 묶어 버렸다. 교훈: \u003cstrong>기술이 신뢰의 기반을 만들었지만 국가를 뛰어넘지는 못했다.\u003c/strong> 제도·법이 어떻게 테이크오버하느냐, 사람들이 어떻게 투입하느냐에 따라 달라지는 \u003cstrong>다이내믹스\u003c/strong>가 우리의 관심.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;그렇다고 해서 기술이 모든 걸 할 수 있는 건 아니란 말이에요. 분명히 신뢰를 제공하는 기술적 기반을 뒀지만 국가를 뛰어넘고 그런 게 안 되고. 제도·법이 어떻게 테이크오버하냐에 따라서 달라지고, 사람들이 어떻게 투입하냐에 따라서 달라지는 것이.&quot;\u003c/p>\u003cspan class=\"quote-time\">W02 15:31\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>삼국지·홍길동에는 기술 얘기가 없다. 적벽대전은 결국 화공(기술)으로 이긴 싸움인데 유비가 누구와 편을 먹었는지만 얘기한다. 실제로는 기술 부분이 훨씬 크다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c02-h-5-ai의-아이러니-④-⑥의-현재형\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">AI의 아이러니 (④·⑥의 현재형)\u003c/p>\n\u003cp>🗣 AI는 잘 작동하는데 \u003cstrong>왜 잘하는지 모른다.\u003c/strong> Anthropic 등으로 인재가 몰리는 것은 &quot;왜 되는지&quot;를 밝히러, 즉 사이언스를 하러 가는 것으로 보인다. NVIDIA·하이닉스·삼성이 이렇게 될 줄 누가 알았나 — \u003cstrong>기술이 어떤 의미를 갖는지 모르면 경영도 정책도 못 한다.\u003c/strong>\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c03":{"title":"인간에 대한 4가지 기본 이해","en":"Four Views of the Human — Rational / Social / Tool-using / Learning","week":"W01","href":"W01.html#c03","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>혁신을 시스템으로 보려면 &quot;사람이란 어떤 존재인가&quot;부터 정해야 한다. 경제학은 사람을 \u003cstrong>이익을 계산하는 합리적 개인\u003c/strong>으로만 보지만, 이 수업은 네 겹으로 본다: ① 합리적으로 선택하는 인간, ② 사회적 관계 속의 인간, ③ 도구를 쓰는 인간, ④ \u003cstrong>배우는 인간\u003c/strong>. 혁신학이 가장 강조하는 것은 ④다 — 혁신 역량은 곧 학습 역량이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>한 사람을 네 개의 렌즈로 본다고 하자.\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">계산기 렌즈\u003c/th>\u003ctd class=\"deflist-desc\">뭐가 이득인지 따진다. (경제학의 기본 렌즈)\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">관계 렌즈\u003c/th>\u003ctd class=\"deflist-desc\">가족·동문·국민으로서 행동한다. 혼자 결정하지 않는다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">도구 렌즈\u003c/th>\u003ctd class=\"deflist-desc\">스마트폰·전기·앰뷸런스 없이는 못 산다. 도구가 이미 삶의 일부다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">학습 렌즈\u003c/th>\u003ctd class=\"deflist-desc\">어제보다 오늘 더 잘한다. 해 보고, 써 보고, 남과 부딪히며 배운다.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>혁신은 네 렌즈가 다 필요하지만, &quot;새 지식을 만드는 활동&quot;이므로 \u003cstrong>학습 렌즈가 핵심\u003c/strong>이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c03-h-슬라이드-w01-p8\">📄 슬라이드 (W01 p8)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p08.jpg\" alt=\"W01 p8 인간에 대한 기본 이해\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p8 인간에 대한 기본 이해\u003c/figcaption>\u003c/figure>\n\u003cp>🗣 요지: \u003cstrong>경제학의 합리적 행위자(rational actor) 가정을 넘어서는 것.\u003c/strong>\u003c/p>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-1-합리적-활동을-하는-인간-entrepreneur의-원형\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">합리적 활동을 하는 인간 — Entrepreneur의 원형\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>개인의 자유로운 선택이 기본 활동. \u003c/li>\n\u003cli>🗣 유틸리티를 높이려는 존재. 그러나 &quot;나는 왜 존재할까&quot;, &quot;태양까지의 거리는 얼마일까&quot; 같은 \u003cstrong>근본적 질문도 하는 존재\u003c/strong>다. 계산만 하는 존재가 아니다.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>슬라이드 좌측의 \u003cstrong>Entrepreneur / Innovation: Creative Destruction\u003c/strong> 라벨이 이 인간관과 짝을 이룬다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-2-사회적-관계-속에서-살아가는-인간-civic-actor의-원형\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">사회적 관계 속에서 살아가는 인간 — Civic Actor의 원형\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>가족, 학연, 지연, 국가, Community, Polity. 전쟁·헌법·선거·조직생활·텃세·개방성에 대한 질문.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>여기서 \u003cstrong>Freedom/Liberty, 신자유주의, 개발주의, Citizenship\u003c/strong> 논의가 나온다.\u003c/li>\n\u003cli>🗣 슬라이드 좌측의 \u003cstrong>Civic Actors\u003c/strong> 라벨과 짝. → W01/07, W01/08로 이어짐.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-3-도구를-사용하는-인간-technologization\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">도구를 사용하는 인간 — Technologization\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>구석기~디지털혁명~바이오혁명(?). 불, 다리, 댐, 발전소, 드론, AI, SOC.\u003c/li>\n\u003cli>🗣 &quot;우리는 도구 속에 있다.&quot; 도구가 인간성을 규정할 수도 있다(Harari, \u003cem>Homo Deus\u003c/em>). 역사학자들은 \u003cstrong>에너지 획득 수단으로 시대를 구분\u003c/strong>한다.\u003c/li>\n\u003cli>🗣 \u003cstrong>SOC를 다시 봐야 한다\u003c/strong>: 예전엔 도로·항만이었다면, 이제는 \u003cstrong>기술화(technologization)된 인프라\u003c/strong> — 전력망, 디지털, AI.\u003cul>\n\u003cli>일본이 아직 팩스·동전을 쓰는 이유: 디지털로 가면 동전 세는 기계 회사들이 사라지므로 두려워한다는 해석. 반면 아프리카는 은행 없이 핸드폰으로 바로 금융에 접근.\u003c/li>\n\u003cli>대구 노인 무료 버스 논쟁: 공공이 접근 수단을 제공하느냐에 따라 사회 수준이 달라진다. 그 사회는 이미 그 기술을 &quot;다 쓰는 것&quot;으로 전제하기 때문.\u003c/li>\n\u003cli>\u003cstrong>응급실 &#39;뺑뺑이&#39; 사례\u003c/strong>: 아기를 잃은 아버지가 &quot;앰뷸런스를 타고 병원까지 가서 진찰이라도 받아 봤으면&quot; 했다는 말. → \u003cstrong>앰뷸런스로 병원 가는 것은 이미 &#39;기본&#39;\u003c/strong>으로 여겨진다.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;다시 얘기하면 앰뷸런스를 타고 진찰까지 가는 거는 기본으로 생각하는 거예요. &#39;이 정도는 해야 되는 거 아니야.&#39; 그러니까 우리가 그렇게, 기술이라는 게 무슨 비즈니스 하고 이런 개념이 아니고 우리 삶 속에 이렇게 들어와 있다.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 29:56\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>딜레마 질문: 지구온난화를 막으려면? 생산 효율을 위해 energy-intensive AI를 쓸까?\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-4-학습하는-인간-혁신학이-가장-강조\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">학습하는 인간 ★ 혁신학이 가장 강조\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>배우고 익히는 인간: 지식을 습득·축적·창출하는 존재 = \u003cstrong>혁신 역량\u003c/strong>. Learning by doing / using / interacting; learning through education.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>&quot;어제보다 오늘이 낫고 내일이 더 낫다(?)&quot; = \u003cstrong>동태적 효율성(dynamic efficiency)\u003c/strong>. 💡 정태적 효율성(주어진 자원의 최적 배분)과 대비되는 개념 — 시간이 갈수록 더 잘하게 되는 능력.\u003c/li>\n\u003cli>🗣 \u003cstrong>한국은 왜 잘하나\u003c/strong>: \u003cstrong>수기치인(修己治人)\u003c/strong> — 조선 성리학의 자기 수양·학습이 DNA처럼 들어 있다는 해석. 과학기술 역량뿐 아니라 봉준호·박찬욱·오징어 게임 같은 문화적 역량도.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>과학기술 역량 + \u003cstrong>인간 역량(Ethical, Experiential, Humane Faculty)\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c03-h-5-전문가-인식론-vs-시민-인식론-expert-vs-civic-epistemology\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">전문가 인식론 vs 시민 인식론 (Expert vs Civic Epistemology)\u003c/p>\n\u003cul>\n\u003cli>🗣 과학자가 &quot;안전하다&quot;고 하는 것과 일반인이 &quot;안전하다&quot;고 느끼는 것은 다르다. 그 차이는 어떻게 정해지는가? 한편에서는 이를 &#39;선동&#39;이라 치부하지만…\u003c/li>\n\u003cli>🗣 \u003cstrong>후쿠시마 사례\u003c/strong>: 정부가 농산물 안전 판정을 내렸어도 협동조합의 엄마들이 직접 방사능 검사를 했다. \u003cstrong>안전(safety)과 안심(assurance)은 다르다.\u003c/strong> 안심은 어떻게 만들어지는가.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;자기들이 직접 농산물의 방사능 검사도 하고 검토하고 다 했습니다. 그래서 안전하고 안심하고 다르죠. 안심이 어떻게 되는 거냐, 그걸 가지고 얘기하는.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 33:54\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>Mode I vs Mode II production\u003c/strong> — 💡 Gibbons et al.(1994): Mode 1은 학문 분과 안에서 전문가가 만드는 지식, Mode 2는 응용 맥락에서 여러 주체가 함께 만드는 지식. W04(거시적 접근 II) 리딩이라 그때 상세히.\u003c/li>\n\u003cli>🗣 Innovation = creative destruction으로 기업가를 많이 말하지만, \u003cstrong>일반 사람들(civic actors)은 무엇을 하는가\u003c/strong>가 이 수업의 관심.\u003c/li>\n\u003cli>🗣 의료 데이터: 개인 동의 없이는 못 쓴다. 중국이 앞서는 것은 개인 데이터를 그냥 가져가기 때문이지만 그러면 안 된다. → 학습(데이터)과 시민 권리의 충돌.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c04":{"title":"혁신 → 혁신시스템 → 시스템 혁신의 층위","en":"Innovation / Innovation System / System Innovation (Transition)","week":"W01","href":"W01.html#c04","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>&quot;혁신&quot;은 세 층위로 커진다. \u003cstrong>혁신\u003c/strong>(새 제품·서비스·행동) → \u003cstrong>혁신시스템\u003c/strong>(그것을 만들어 내는 행위자들의 체제) → \u003cstrong>시스템 혁신/전환\u003c/strong>(생산과 소비를 아우르는 시스템 전체가 바뀌는 것). 이 수업은 세 번째, 즉 \u003cstrong>제품 하나가 아니라 시스템 전체가 어떻게 바뀌는가\u003c/strong>에 관심이 있다. 기후변화, 수도권 집중, Korea Paradox가 모두 &quot;시스템이 안 바뀌는&quot; 문제다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>혁신\u003c/strong> = 더 좋은 전기차 한 대를 만드는 것.\u003c/li>\n\u003cli>\u003cstrong>혁신시스템\u003c/strong> = 그 차를 만들어 내는 회사·부품사·연구소·정부·표준의 네트워크.\u003c/li>\n\u003cli>\u003cstrong>시스템 혁신\u003c/strong> = 주유소가 충전소로, 정비소·전력망·세금·운전 습관까지 통째로 바뀌는 것.\u003c/li>\n\u003c/ul>\n\u003cp>전기차 한 대는 몇 년이면 나오지만, 시스템 전체가 바뀌는 데는 수십 년이 걸리고 자주 실패한다. 왜 실패하는지가 다음 개념(W01/05 고착)이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c04-h-슬라이드-w01-p9\">📄 슬라이드 (W01 p9)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 350\" role=\"img\" aria-labelledby=\"w01c04-title\">\n  \u003ctitle id=\"ans-w01c04-title\">연구시스템이 국가·산업 혁신시스템에 포함되고, 그것이 다시 사회기술시스템에 포함되는 3층 중첩 구조도\u003c/title>\n\n  \u003crect x=\"8\" y=\"8\" width=\"364\" height=\"268\" rx=\"16\" fill=\"var(--note-soft)\" stroke=\"var(--note)\" stroke-width=\"1.4\">\u003c/rect>\n  \u003ctext x=\"26\" y=\"32\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--note)\">③ 사회기술시스템\u003c/text>\n  \u003ctext x=\"26\" y=\"48\" font-size=\"10.5\" fill=\"var(--muted)\">생산 + 소비(사용자)까지 포함\u003c/text>\n\n  \u003crect x=\"34\" y=\"58\" width=\"312\" height=\"204\" rx=\"14\" fill=\"var(--brand-soft)\" stroke=\"var(--brand)\" stroke-width=\"1.4\">\u003c/rect>\n  \u003ctext x=\"52\" y=\"82\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--brand)\">② 국가·산업 혁신시스템\u003c/text>\n  \u003ctext x=\"52\" y=\"98\" font-size=\"10.5\" fill=\"var(--muted)\">기업 + 산업·지식 생태계 (NIS)\u003c/text>\n\n  \u003crect x=\"64\" y=\"110\" width=\"252\" height=\"104\" rx=\"12\" fill=\"var(--term-soft)\" stroke=\"var(--term)\" stroke-width=\"1.4\">\u003c/rect>\n  \u003ctext x=\"82\" y=\"136\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--term)\">① 연구시스템\u003c/text>\n  \u003ctext x=\"82\" y=\"153\" font-size=\"10.5\" fill=\"var(--muted)\">연구자 – 중개기관 – 정부(sponsor)\u003c/text>\n  \u003ctext x=\"82\" y=\"170\" font-size=\"10.5\" fill=\"var(--muted)\">가장 좁은 시스템\u003c/text>\n\n  \u003cg font-size=\"11\" fill=\"var(--ink-soft)\">\n    \u003ctext x=\"26\" y=\"300\">혁신 → 혁신시스템 → 시스템 혁신 —\u003c/text>\n    \u003ctext x=\"26\" y=\"316\">제품 하나가 아니라 시스템 전체가\u003c/text>\n    \u003ctext x=\"26\" y=\"332\">바뀌는가?\u003c/text>\n  \u003c/g>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p09.jpg\" alt=\"W01 p9 System Innovation\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p9 System Innovation\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-1-혁신의-정의와-두-관점\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">혁신의 정의와 두 관점\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>혁신 = 가치를 창출하는, 기존과 다른 새로운 제품·서비스·행동 그리고…. 제품혁신·서비스혁신·조직혁신은 technology management 영역.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>만드는 사람 입장의 혁신 vs 쓰는 사람 입장의 혁신.\u003c/strong>\u003c/li>\n\u003cli>🗣 기존 혁신론은 기업(만드는 쪽) 중심 — 노동자·연구자·엔지니어·조선소 용접공. 마케팅은 결국 쓰는 사람 입장을 생각하는 사람들.\u003c/li>\n\u003cli>🗣 (W02) 이제 쓰는 사람 입장 — AI 시대에 \u003cstrong>내 능력이 사라진다면 커리어를 어떻게 가져갈 것인가.\u003c/strong> 현장 노동자도 쓰는 사람으로 볼 수 있다.\u003c/li>\n\u003cli>🗣 (W02) \u003cstrong>프로슈머(prosumer)\u003c/strong>: Toffler의 1980년대 통찰. 디지털 시대에는 소비자가 자기 것을 자기가 만들어 쓴다. → 혁신시스템이 \u003cstrong>소비자까지 포함\u003c/strong>하는 시스템으로 확장.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-2-혁신시스템의-세-층위\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">혁신시스템의 세 층위\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>층위\u003c/th>\n\u003cth>구성\u003c/th>\n\u003cth>🗣 설명\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>연구시스템\u003c/strong>\u003c/td>\n\u003ctd>연구자 – 중재/중개기관 – 정부(sponsor)\u003c/td>\n\u003ctd>가장 좁은 시스템\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>국가/산업 혁신시스템\u003c/strong>\u003c/td>\n\u003ctd>기업과 그를 둘러싼 산업생태계, 혁신(지식)생태계\u003c/td>\n\u003ctd>산업·기업 중심 (NIS)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>사회기술시스템\u003c/strong>\u003c/td>\n\u003ctd>생산과 소비를 아우르는 혁신시스템\u003c/td>\n\u003ctd>소비자·사용자까지 포함 (StS)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>🗣 국가혁신시스템은 산업·기업 중심이지만 사회기술시스템은 \u003cstrong>생산과 소비를 아우른다.\u003c/strong> → W01/10의 &quot;구조의 차이 vs 구조의 변화&quot; 구분과 대응.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-3-시스템-혁신-시스템-전환-왜-필요한가\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">시스템 혁신 / 시스템 전환 — 왜 필요한가\u003c/p>\n\u003cul>\n\u003cli>🗣 제품 혁신·프로세스 혁신이 아니라 \u003cstrong>전체 시스템의 혁신이 어떻게 벌어지고 어떤 영향을 주는지\u003c/strong>를 보려 한다.\u003c/li>\n\u003cli>🗣 혁신생태계론이 주목받는 이유: Uber 같은 \u003cstrong>새로운 디지털 비즈니스는 생태계를 새로 만들어야 하고 게임의 룰을 다시 정하기\u003c/strong> 때문.\u003c/li>\n\u003cli>🗣 \u003cstrong>기후변화 — carbon lock-in\u003c/strong>: 해결하려면 시스템이 바뀌어야 하는데 잘 안 바뀐다. 좋은 기술만 만든다고 되는 게 아니라 \u003cstrong>시스템 자체가 변해야\u003c/strong> 한다.\u003c/li>\n\u003cli>🗣 테슬라, 그리고 테슬라를 캐치업한 BYD 등은 자동차 회사라기보다 \u003cstrong>테크 회사\u003c/strong>. 데이터·소프트웨어 중심이라 내연기관 회사와 달리 carbon lock-in에서 벗어났다.\u003c/li>\n\u003cli>🗣 (W02) AI: 세상에 없던 것이 생긴다(AGI 논쟁). &quot;AI가 인류를 wipe out할 확률 10%&quot;라는 말이 공식적으로 나오고, 미국에서는 데이터센터 반대가 번진다. → \u003cstrong>시스템 차원의 파워\u003c/strong>가 벌어지는 것.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c04-h-4-한국의-시스템-혁신-과제-교수의-세-가지\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">한국의 시스템 혁신 과제 — 🗣 교수의 세 가지\u003c/p>\n\u003cp>\u003cstrong>(a) 지역혁신 — 서울·수도권 공화국\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>경제성장 중심, 중앙부처 중심. 🗣 총리도 중앙부처 지역 이전을 언급.\u003c/li>\n\u003cli>🗣 (W02) 수도권 집중은 \u003cstrong>시장이 그렇게 흘러가면 막을 수 없다.\u003c/strong> 막을 수 없다는 것이 옳다는 뜻은 아니고 구조가 그렇다는 것. 그럼에도 어떻게 변화시킬 것인가가 목표.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;시장이 그렇게 흘러가는 거는 막을 수 없다는 얘기는, 그것이 옳다는 의미는 아니고. 구조가 그렇게 돼 있을 수밖에 없다는 거예요. 그럼에도 불구하고 그걸 어떻게 변화시킬 것이냐, 그런 것들이 목표가 되겠습니다.&quot;\u003c/p>\u003cspan class=\"quote-time\">W02 21:01\u003c/span>\u003c/blockquote>\n\u003cp>\u003cstrong>(b) Korea Paradox\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>정부 R&amp;D·민간 R&amp;D 모두 세계 수위 그룹, Yet? (R&amp;D 합리화, 구조조정, 차별화, 임무중심형 혁신, 시민…)\u003c/li>\n\u003cli>🗣 거칠게 말하면 &quot;\u003cstrong>우리는 왜 AI를 먼저 못 만들었을까?\u003c/strong>&quot; 그 분야 사람들은 다 알고 있었을 텐데. → \u003cstrong>정부가 너무 중심에 서 있다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;콕 집어서 얘기하면 우리는 왜 AI를 먼저 못 만들었을까. 저거 되는 건지는 그 분야에 있는 사람 다 알았을 텐데. 왜 그랬을까. … 너무 정부가 중심에 서 있어요. 너무 정부가.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 38:25\u003c/span>\u003c/blockquote>\n\u003cp>\u003cstrong>(c) 탈개발국가(Post-developmental State)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>🗣 (W02) 서울대 사회학과 \u003cstrong>장경섭\u003c/strong> 교수가 developmental state를 비판적 시각에서 영어로 많이 썼고 중국에서 베스트셀러.\u003c/li>\n\u003cli>🗣 동아시아 3국의 서구 수용 이데올로기: 일본 \u003cstrong>화혼양재(和魂洋才)\u003c/strong>, 한국 \u003cstrong>동도서기(東道西器)\u003c/strong>, 중국 \u003cstrong>중체서용(中體西用)\u003c/strong> — 다 비슷한 얘기. 그래서 국가가 나서서 주도했고 \u003cstrong>관료 시스템\u003c/strong>이 발달했다.\u003c/li>\n\u003cli>🗣 21세기의 과제: 일본은 잃어버린 30년. 한국은 \u003cstrong>탑다운이 너무 강해\u003c/strong> 이를 어떻게 극복하느냐(지방화·지역혁신). 중국은 내수 시장 등에서 어려울 것.\u003c/li>\n\u003cli>🗣 \u003cstrong>DX·AX\u003c/strong>: 자본의 흐름으로 밀고 들어온다. 기업이 스스로를 자본으로 보고 메타적으로 흐름을 보는 것 = \u003cstrong>성찰적 입장\u003c/strong>. 팔란티어처럼 &quot;그냥 가자&quot;는 회사도 있다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c05":{"title":"세 가지 고착 — 조직·기술·사용자 lock-in","en":"Lock-in — Organisational / Technological / User","week":"W01","href":"W01.html#c05","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>시스템이 잘 안 바뀌는 이유는 기존 시스템이 세 군데서 \u003cstrong>고착(lock-in)\u003c/strong>되어 있기 때문이다. \u003cstrong>조직\u003c/strong>은 성공 공식에 갇히고, \u003cstrong>기술\u003c/strong>은 최고가 아니어도 한 번 깔리면 못 바꾸며(QWERTY), \u003cstrong>사용자\u003c/strong>는 네트워크와 습관 때문에 못 떠난다. 셋이 겹쳐 있어서, 이를 깨려면 새로운 \u003cstrong>변이(variety)\u003c/strong>를 만들어야 한다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>오래된 동네에 새 길을 내려 한다고 하자.\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">조직 고착\u003c/th>\u003ctd class=\"deflist-desc\">구청은 &quot;지금까지 이 길로 잘 살았는데 왜?&quot;라며 기존 방식을 고수한다. 성공했기 때문에 못 바꾼다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">기술 고착\u003c/th>\u003ctd class=\"deflist-desc\">이미 깔린 전선·수도관·건물 때문에 더 좋은 길이 있어도 못 낸다. 매몰비용이 발목을 잡는다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">사용자 고착\u003c/th>\u003ctd class=\"deflist-desc\">주민들은 지금 길에 익숙하고, 단골 가게도 그 길에 있다. 새 길이 더 좋아도 안 옮긴다.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>세 개가 서로를 지탱하고 있어서 하나만 풀어서는 안 된다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c05-h-슬라이드-w01-p10\">📄 슬라이드 (W01 p10)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 420\" role=\"img\" aria-labelledby=\"w01c05-title\">\n  \u003ctitle id=\"ans-w01c05-title\">조직 고착·기술 고착·사용자 고착 세 원이 겹쳐 시스템을 가두고, 변이(variety) 화살표가 그 교집합을 뚫고 나가는 그림\u003c/title>\n  \u003cdefs>\n    \u003cmarker id=\"ans-w01c05-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      \u003cpath d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--ink)\">\u003c/path>\n    \u003c/marker>\n  \u003c/defs>\n\n  \u003ccircle cx=\"190\" cy=\"118\" r=\"95\" fill=\"var(--brand)\" fill-opacity=\"0.16\" stroke=\"var(--brand)\" stroke-width=\"1.6\">\u003c/circle>\n  \u003ccircle cx=\"138\" cy=\"212\" r=\"95\" fill=\"var(--term)\" fill-opacity=\"0.16\" stroke=\"var(--term)\" stroke-width=\"1.6\">\u003c/circle>\n  \u003ccircle cx=\"242\" cy=\"212\" r=\"95\" fill=\"var(--note)\" fill-opacity=\"0.16\" stroke=\"var(--note)\" stroke-width=\"1.6\">\u003c/circle>\n\n  \u003ctext x=\"190\" y=\"70\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--brand)\">조직 고착\u003c/text>\n  \u003ctext x=\"190\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">성공 공식에 갇힘\u003c/text>\n\n  \u003ctext x=\"88\" y=\"240\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--term)\">기술 고착\u003c/text>\n  \u003ctext x=\"88\" y=\"256\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">QWERTY, 매몰비용\u003c/text>\n\n  \u003ctext x=\"292\" y=\"240\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"var(--note)\">사용자 고착\u003c/text>\n  \u003ctext x=\"292\" y=\"256\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">네트워크·습관\u003c/text>\n\n  \u003ctext x=\"190\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">고착된\u003c/text>\n  \u003ctext x=\"190\" y=\"201\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">시스템\u003c/text>\n\n  \u003cpath d=\"M355,30 L45,378\" stroke=\"var(--ink)\" stroke-width=\"2.2\" stroke-dasharray=\"1,7\" stroke-linecap=\"round\" marker-end=\"url(#w01c05-arrow)\">\u003c/path>\n  \u003ctext x=\"352\" y=\"24\" text-anchor=\"end\" font-size=\"12\" font-weight=\"700\" fill=\"var(--ink)\">변이(variety)\u003c/text>\n  \u003ctext x=\"48\" y=\"400\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">Technology · User · Citizen variety\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p10.jpg\" alt=\"W01 p10 세 가지 고착\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p10 세 가지 고착\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-0-도입-개발국가-멘탈리티-조직-고착의-국가-버전\">\u003cspan class=\"step-no\" aria-hidden=\"true\">0\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 도입: 개발국가 멘탈리티 — 조직 고착의 국가 버전\u003c/p>\n\u003cul>\n\u003cli>개발국가(developmental state): 박정희 시대 정부 주도 경제개발. \u003cstrong>성공했기 때문에 그 멘탈리티에서 못 벗어난다.\u003c/strong>\u003c/li>\n\u003cli>정부 주도 R&amp;D의 기본 논리 = &quot;\u003cstrong>잘하는 애한테 몰아주면 뭔가 나온다\u003c/strong>&quot;. 추격(catch-up) 단계에서는 먹혔다(한국·일본·중국). 그러나 \u003cstrong>프론티어에서는 안 먹힌다. 다양성이 중요하다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;그 R&amp;D의 기본적인 거는 잘하는 애한테 몰아주면 뭔가 나온다는 거죠. 그러니까 추격할 만하지. 중국이 그래서 성공을 했고 일본이 그렇게 성공을 했고. 근데 아주 프론트에서는 그게 안 먹혔어요. 다양성이 중요한데.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 40:48\u003c/span>\u003c/blockquote>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-1-조직-고착-institutionalised-organisational-memory-johnson-2010\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">조직 고착 (Institutionalised Organisational Memory) — Johnson (2010)\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>성공 공식에의 고착으로 새 기술 도입이나 비즈니스 모델 변화가 어렵다. 기업 내부적으로 새 시도를 어렵게 하는 \u003cstrong>제도화된 조직 routine, inertia\u003c/strong>.\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>&quot;성공의 함정&quot;: 잘 됐던 방식이 조직 기억으로 굳어져 환경이 바뀌어도 반복된다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-2-기술-고착-technological-lock-in-david-1985-arthur-1988\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">기술 고착 (Technological lock-in) — David (1985), Arthur (1988)\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>지배적 디자인(dominant design)의 기술은 \u003cstrong>최고가 아니더라도 쉽게 바뀌지 않는다.\u003c/strong> \u003c/li>\n\u003cli>🗣 \u003cstrong>QWERTY 키보드\u003c/strong>: 더 나은 배열이 가능했지만 이미 나와 버렸고 모두가 익숙해져 못 바꾼다.\u003c/li>\n\u003cli>📄 메커니즘: \u003cstrong>한계 체증(increasing returns)\u003c/strong> → 지배적 디자인의 등장.\u003cul>\n\u003cli>규모의 경제(공급), 학습, 성장에 대한 기대, \u003cstrong>네트워크 경제(수요 측면 규모의 경제)\u003c/strong>, 기술 연결성.\u003c/li>\n\u003cli>지배적 디자인의 성립 = 그를 지원하는 \u003cstrong>사회기술시스템의 성립\u003c/strong>. 그에 따른 기술 인프라의 \u003cstrong>비용 무게\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>🗣 기후변화의 석탄·화석연료: 깔려 있는 사람도 많고 인프라도 있다. \u003cstrong>매몰비용(sunk cost)을 버릴 수 없기 때문에\u003c/strong> 고착된다.\u003c/li>\n\u003cli>🗣 경영학은 이것을 거꾸로 이용한다: \u003cstrong>switching cost를 높인다.\u003c/strong> 커스터마이제이션으로 다른 데 못 가게 만든다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-3-사용자-고착-user-lock-in-lim-2012\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">사용자 고착 (User lock-in) — Lim (2012)\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>요소\u003c/th>\n\u003cth>📄 슬라이드\u003c/th>\n\u003cth>🗣 수업 예시\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>네트워크 효과 / 수요측 규모의 경제\u003c/strong> (Shapiro &amp; Varian)\u003c/td>\n\u003ctd>네트워크 고착\u003c/td>\n\u003ctd>SKT에 속해 있으면 그 안에서 다 되니까 KT로 못 간다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>되튐 효과 (rebound effect)\u003c/strong> (Greening et al. 2000)\u003c/td>\n\u003ctd>효율 개선이 소비 증가로\u003c/td>\n\u003ctd>길이 막혀 도로를 넓혔더니 차가 더 늘었다. TV는 큰 것 보다가 작은 것으로 못 돌아간다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>소비의 심리적·사회적 요인\u003c/strong> (White 2002)\u003c/td>\n\u003ctd>&#39;Identity&#39;, &#39;소비는 미덕&#39;\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>소비행위는 기술 기반의 사회적 관습\u003c/strong> (Shove 2003)\u003c/td>\n\u003ctd>안락함·편안함·청결함은 모두 기술에 의지\u003c/td>\n\u003ctd>서울 사람과 농촌 사람의 에너지 소비 수준이 다르다. \u003cstrong>영국 저녁 전력 피크 = 뉴스 끝나고 모두가 전기포트로 차를 끓일 때\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;소비를 할 때 보면 기술이 밑에 다 깔려 들어가 있다는 거죠. 영국에서는 저녁 때 전력이 갑자기 올라갈 때가 있어요. 그게 언제냐, 뉴스 끝나고. 뉴스 끝나고 사람들이 차 한 잔 마시려고 전기 포트에 이렇게.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 43:44\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>기술 고착은 소비생활에서 사용자의 &#39;역적응&#39;을 통해 &#39;사회적 관습&#39;으로 내재화된다.\u003c/strong> 🗣 원래 전화·인터넷만 하려던 스마트폰에 하루 종일 매달리는 것처럼. → W01/02 역적응.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c05-h-4-슬라이드-하단-도식-고착의-겹침과-변이-variety\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">슬라이드 하단 도식: 고착의 겹침과 변이(variety)\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>규범 / 기술 / 행태·인지 / 규제·법칙이 서로 맞물려 있다.\u003c/li>\n\u003cli>🗣 기술 고착과 행태·인지 고착이 겹쳐 있으므로, 이를 깨려면 \u003cstrong>새로운 변이(variety)\u003c/strong> — \u003cstrong>Technology variety, User variety, Citizen variety\u003c/strong> — 를 만들어 내야 한다. \u003cstrong>기술경영이란 새로운 변이를 만드는 작업.\u003c/strong>\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>마지막 줄: 시장 실패, 시스템 실패, 전환 실패 → 시스템 전환은 경제·사회·정치·문화 프로젝트. → W01/06에서 별도 정리.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c06":{"title":"시장 실패·시스템 실패·전환 실패","en":"Market Failure / System Failure / Transformational Failure","week":"W01","href":"W01.html#c06","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>정부가 혁신에 개입하는 이유(정책 근거)는 세 단계로 진화했다. \u003cstrong>시장 실패\u003c/strong>(시장에 맡기면 R&amp;D가 부족하다) → \u003cstrong>시스템 실패\u003c/strong>(행위자들 사이의 연결·제도·역량이 부족하다) → \u003cstrong>전환 실패\u003c/strong>(시스템이 어느 방향으로 가야 하는지, 수요는 누가 말하는지, 정책은 조율되는지가 빠져 있다). 시스템 전환은 세 번째 실패를 다루므로, \u003cstrong>기술 프로젝트가 아니라 경제·사회·정치·문화 프로젝트\u003c/strong>다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>마을에 다리를 놓는 문제로 비유하면:\u003c/p>\n\u003ctable class=\"deflist\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">시장 실패\u003c/th>\u003ctd class=\"deflist-desc\">아무도 자기 돈으로 다리를 안 놓는다(놓으면 남도 공짜로 쓰니까). → 정부가 돈을 댄다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">시스템 실패\u003c/th>\u003ctd class=\"deflist-desc\">돈은 있는데 설계자·시공사·마을회가 서로 말이 안 통하고, 규정도 없다. → 연결하고 제도를 만든다.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\" class=\"deflist-term\">전환 실패\u003c/th>\u003ctd class=\"deflist-desc\">다리를 놓긴 놓는데, 애초에 \u003cstrong>차를 위한 다리인지 사람을 위한 다리인지\u003c/strong> 아무도 정하지 않았고, 주민이 원하는 게 뭔지 묻지 않았고, 도로과와 환경과가 따로 논다. → 방향·수요·조율·성찰이 필요하다.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c06-h-슬라이드-w01-p10-하단\">📄 슬라이드 (W01 p10 하단)\u003c/h3>\n\u003cfigure class=\"concept-diagram\">\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 320\" role=\"img\" aria-labelledby=\"w01c06-title\">\n  \u003ctitle id=\"ans-w01c06-title\">시장 실패에서 시스템 실패를 거쳐 전환 실패로 올라가는 3단 계단과 각 단의 정책 처방을 보여주는 그림\u003c/title>\n\n  \u003cline x1=\"12\" y1=\"280\" x2=\"368\" y2=\"280\" stroke=\"var(--line)\" stroke-width=\"1.4\">\u003c/line>\n\n  \u003c!-- 1단: 시장 실패 -->\n  \u003crect x=\"18\" y=\"210\" width=\"104\" height=\"70\" fill=\"var(--brand)\" fill-opacity=\"0.85\" rx=\"6\">\u003c/rect>\n  \u003ctext x=\"70\" y=\"192\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--brand)\">시장 실패\u003c/text>\n  \u003ctext x=\"70\" y=\"238\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--surface)\">돈이\u003c/text>\n  \u003ctext x=\"70\" y=\"253\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--surface)\">모자람\u003c/text>\n  \u003ctext x=\"70\" y=\"299\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">R&amp;D 보조금·IP\u003c/text>\n\n  \u003c!-- 2단: 시스템 실패 -->\n  \u003crect x=\"138\" y=\"160\" width=\"104\" height=\"120\" fill=\"var(--term)\" fill-opacity=\"0.85\" rx=\"6\">\u003c/rect>\n  \u003ctext x=\"190\" y=\"142\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--term)\">시스템 실패\u003c/text>\n  \u003ctext x=\"190\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--surface)\">연결이\u003c/text>\n  \u003ctext x=\"190\" y=\"227\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--surface)\">모자람\u003c/text>\n  \u003ctext x=\"190\" y=\"299\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">산학연·제도 정비\u003c/text>\n\n  \u003c!-- 3단: 전환 실패 -->\n  \u003crect x=\"258\" y=\"90\" width=\"104\" height=\"190\" fill=\"var(--note)\" fill-opacity=\"0.9\" rx=\"6\">\u003c/rect>\n  \u003ctext x=\"310\" y=\"72\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--note)\">전환 실패\u003c/text>\n  \u003ctext x=\"310\" y=\"177\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--surface)\">방향·합의가\u003c/text>\n  \u003ctext x=\"310\" y=\"192\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--surface)\">모자람\u003c/text>\n  \u003ctext x=\"310\" y=\"299\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">임무지향·참여 거버넌스\u003c/text>\n\n  \u003ctext x=\"18\" y=\"316\" font-size=\"10.5\" fill=\"var(--muted)\">시스템 전환은 경제·사회·정치·문화 프로젝트\u003c/text>\n\u003c/svg>\n\u003cfigcaption class=\"diagram-caption\">💡 이 그림은 강의 슬라이드가 아니라, 이해를 돕기 위해 직접 정리한 보충 다이어그램입니다.\u003c/figcaption>\n\u003c/figure>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p10.jpg\" alt=\"W01 p10\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p10\u003c/figcaption>\u003c/figure>\n\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">&quot;시장 실패, 시스템 실패, 전환 실패 → 시스템 전환은 경제·사회·정치·문화 프로젝트&quot;\u003c/span>\u003c/p>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-1-수업에서의-설명\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 수업에서의 설명\u003c/p>\n\u003cul>\n\u003cli>세 고착(W01/05)이 겹쳐 있으므로 이를 깨려면 새로운 변이(Technology / User / Citizen variety)를 만들어야 한다.\u003c/li>\n\u003cli>시장 실패·시스템 실패·\u003cstrong>전환 실패(transformational failure)\u003c/strong>. 시스템 전환은 단순 제품 혁신이 아니라 \u003cstrong>경제·사회·정치·문화 프로젝트\u003c/strong>. 쉽지 않지만, \u003cstrong>우리가 상대하는 것이 무엇인지 파악해야 변화의 씨앗이 된다.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-2-세-실패의-내용-weber-amp-rohracher-2012-기준\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">💡 세 실패의 내용 — Weber &amp; Rohracher (2012) 기준\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>실패 유형\u003c/th>\n\u003cth>무엇이 실패하나\u003c/th>\n\u003cth>정책 처방\u003c/th>\n\u003cth>대응하는 혁신정책 프레임\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>시장 실패\u003c/strong> (market failure)\u003c/td>\n\u003ctd>지식은 공공재라 민간이 과소투자. 정보 비대칭, 외부효과\u003c/td>\n\u003ctd>R&amp;D 보조금, 세제, 지식재산권\u003c/td>\n\u003ctd>Frame 1: 전후 R&amp;D 정책\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>시스템 실패\u003c/strong> (system failure)\u003c/td>\n\u003ctd>인프라 실패, 제도 실패(hard/soft), 상호작용·네트워크 실패(too weak / too strong), 역량 실패\u003c/td>\n\u003ctd>산학연 연계, 클러스터, 제도 정비, 역량 구축\u003c/td>\n\u003ctd>Frame 2: 국가혁신시스템(NIS)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>전환 실패\u003c/strong> (transformational failure)\u003c/td>\n\u003ctd>\u003cstrong>방향성 실패\u003c/strong>(어디로 갈지 합의 없음), \u003cstrong>수요 표출 실패\u003c/strong>(사용자·시민이 원하는 게 반영 안 됨), \u003cstrong>정책 조율 실패\u003c/strong>(부처·층위 간 따로), \u003cstrong>성찰성 실패\u003c/strong>(가는 길을 점검·수정 못함)\u003c/td>\n\u003ctd>임무지향 정책, 실험·니치 육성, 참여적 거버넌스\u003c/td>\n\u003ctd>Frame 3: 전환적 혁신정책\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"callout callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>\u003cspan class=\"callout-text\">시장 실패는 &quot;돈이 모자란다&quot;, 시스템 실패는 &quot;연결이 모자란다&quot;, 전환 실패는 &quot;\u003cstrong>방향과 합의가 모자란다\u003c/strong>&quot;로 기억하면 쉽다.\u003c/span>\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c06-h-3-왜-quot-경제-사회-정치-문화-프로젝트-quot-인가\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">왜 &quot;경제·사회·정치·문화 프로젝트&quot;인가\u003c/p>\n\u003cul>\n\u003cli>전환 실패의 네 가지(방향성·수요·조율·성찰)는 모두 \u003cstrong>기술 문제가 아니라 사회적 합의와 거버넌스 문제\u003c/strong>다. 누가 방향을 정하고(정치), 누구의 수요를 듣고(사회·시민), 어떤 관습을 바꿀 것인가(문화).\u003c/li>\n\u003cli>🗣 W01/05의 &quot;새로운 변이를 만든다&quot;와 연결: 시장 실패 처방(R&amp;D 돈)만으로는 변이가 안 나온다. \u003cstrong>Citizen variety\u003c/strong>(새 기술의 방향을 말하는 시민, W01/08)가 전환 실패의 방향성·수요 문제에 대한 답이다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c07":{"title":"공공가치와 Civic Actor","en":"Public Value and the Civic Actor (Craig 2012)","week":"W01","href":"W01.html#c07","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>혁신은 가치를 만들지만, \u003cstrong>그 가치가 누구에게 어떻게 돌아가느냐\u003c/strong>는 별개의 문제다. 자유시장 자본주의는 &quot;기회는 평등, 결과는 능력대로&quot;라고 하지만, 실제로는 부모의 재력·사는 동네 같은 \u003cstrong>구조적인 박스\u003c/strong>가 기회 자체를 가른다. 게다가 사회적 연대·신뢰(social capital)가 줄어들어 &quot;같이 움직이기&quot;가 점점 어려워진다. 그래서 사람을 \u003cstrong>기업가(entrepreneur)로만 보지 말고 시민(civic actor)으로도 봐야\u003c/strong> 한다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp class=\"callout callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cspan class=\"callout-text\">슬라이드 그림 그대로가 최고의 비유다. 야구장 담장 너머를 보려는 키 다른 세 사람에게 \u003cstrong>똑같은 상자 하나씩\u003c/strong> 주는 것이 보수가 말하는 평등(기회의 평등)이고, \u003cstrong>키에 맞춰 상자를 다르게\u003c/strong> 주는 것이 진보가 말하는 평등(결과의 평등)이다. 그런데 이 수업의 질문은 한 걸음 더 간다: \u003cstrong>애초에 상자를 살 돈이 부모에게서 오고, 야구장이 서울에만 있다면?\u003c/strong> 그것이 &quot;구조적인 박스&quot;다.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c07-h-슬라이드-w01-p11\">📄 슬라이드 (W01 p11)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p11.jpg\" alt=\"W01 p11 공공가치와 Civic Actor\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p11 공공가치와 Civic Actor\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-1-자유시장-자본주의와-공정\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">자유시장 자본주의와 공정\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>자유시장자본주의(미국, 한국). 기회의 평등 / 결과의 평등. 능력주의(Meritocracy). 공정은 &#39;Fairness&#39;. 오징어 게임(?).\u003c/li>\n\u003cli>🗣 중국은 스스로 사회주의라 하지만 실은 \u003cstrong>독재 자본주의\u003c/strong>.\u003c/li>\n\u003cli>🗣 그림(Craig 2012): 보수는 \u003cstrong>기회의 평등\u003c/strong>을 equality라 하고 결과의 평등은 equality가 아니라고 본다. 예전 방식은 국가가 개인 사이에 개입하는 방식이었는데, 이제는 \u003cstrong>개인들끼리 서로 주고받는 방식\u003c/strong>도 가능하다 — \u003cstrong>innovation ecosystem이 이런 방식일 수 있다\u003c/strong>는 복선.\u003c/li>\n\u003cli>🗣 \u003cstrong>인국공 사태\u003c/strong>: 인천공항 비정규직 정규직화를 &quot;잘한 일&quot;이라 생각했는데 사람들이 동의하지 않았다. 이건 공정이 아니라 동정이라는 것. → 피할 수 없는 \u003cstrong>정치적 가치\u003c/strong>의 문제.\u003c/li>\n\u003cli>🗣 \u003cstrong>능력주의\u003c/strong>: 공정은 기회의 공정이지 결과의 공정이 아니다. &quot;기회는 평등하고 과정은 공정하고 결과는 정의롭다&quot; — 정의·공정·평등이 무엇인지 계속 고민해야 한다.\u003c/li>\n\u003cli>🗣 \u003cstrong>오징어 게임\u003c/strong>: 자본주의의 룰을 \u003cstrong>누가 정하느냐\u003c/strong>를 적나라하게 드러냈다.\u003c/li>\n\u003cli>🗣 (W02) 최근 인사청문회 이슈들이 사회적 잣대로 들어와 있다. 부작용: 교수들이 공직에 손 들지 않게 됐다 — 수신제가치국평천하·입신양명처럼 public office를 가치 있게 여기던 문화가 바뀌고 있다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-2-그러나-구조적인-박스가-존재한다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">그러나 구조적인 박스가 존재한다\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>Bank of Parents\u003c/strong>: Access to Big Things(교육, 의료, 주거, 자녀양육) / Access to Small Things(여행, 외식, Tech…).\u003c/li>\n\u003cli>🗣 큰 것은 점점 비싸져 접근이 어렵고, 작은 것은 다 비슷하게 산다. 그래서 평소엔 비슷해 보이지만 \u003cstrong>큰 일이 닥치면 확 벌어진다.\u003c/strong> 부모가 부자면 해결된다.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;점점 비싸지는 거죠. 대신에 여행이나 테크놀로지는 다 비슷하게 사는 것 같은데, 정작 이게 닥치면 확 벌어지는 거죠. 대신에 엄마 아빠가 부자면 다 해결된다. 저희 세대 때는 대학만 졸업하면 웬만하면 다 취직을 하고, 집값도 그랬는데 이제는 아니잖아.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 49:31\u003c/span>\u003c/blockquote>\n\u003cul>\n\u003cli>🗣 세대 차이: 베이비붐 세대는 대학만 나오면 취직·집이 됐지만 밀레니얼은 아니다.\u003c/li>\n\u003cli>🗣 \u003cstrong>신자유주의\u003c/strong>는 20세기 후반의 룰. 어느 나라에서든 비즈니스를 할 수 있어 미국·영국에 유리했는데, 중국이 치고 올라오자 문을 닫기 시작했다.\u003c/li>\n\u003cli>🗣 한국은 GDP 대비 수출 비중 약 46%로 매우 높다(일본 20%, 영국·중국 약 30%, 대만 70%대). &quot;대만을 무조건 따라 하라&quot;는 칼럼은 \u003cstrong>컨텍스트가 다르다는 점을 숨기는 불공정한 논의\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-3-지역-격차\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">지역 격차\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>문화 자본(Baskin Robbins) / Neighborhood. 사회간접자본 — 수도권 광역망, 전력망.\u003c/li>\n\u003cli>🗣 \u003cstrong>문화자본\u003c/strong>: 경상도 아이돌이 &quot;니네 동네 백화점 있나, 스타벅스·배스킨라빈스 있나&quot; 하는 농담이 곧 문화자본의 지표. 로컬 크리에이션·로컬 마켓 논의.\u003c/li>\n\u003cli>🗣 \u003cstrong>Neighborhood 효과\u003c/strong>: 미국 경제학자들이 신용카드 데이터로 동네별 분석 → 좋은 동네에서 좋은 대학·로스쿨에 더 많이 간다는 정량적 연결.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-4-social-capital\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">Social Capital\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>Putnam(2000) \u003cem>Bowling Alone\u003c/em>, Bauman(2000) \u003cem>Liquid Modernity\u003c/em>. 사회적 연대, 신뢰, 상호성.\u003c/li>\n\u003cli>🗣 \u003cstrong>Putnam\u003c/strong>: 예전엔 동네·교회에서 모여 볼링을 쳤는데 점점 혼자 친다. 출퇴근이 길어지고 여가가 줄고 TV로 혼자 놀게 되면서 사회적 만남이 줄었다. 이를 다 측정했다.\u003c/li>\n\u003cli>🗣 \u003cstrong>Bauman\u003c/strong>: 폴란드 출신 유대인 좌파 사회학자. 정규직이 없어지고 여기저기 떠다니는 \u003cstrong>액체적 근대\u003c/strong>. 연대·신뢰·상호성이 줄어든다. (W02) 미국은 5천 달러씩 준다는 말이 나올 정도로 사회가 엉망 — 자리를 잡고 사회망을 쌓아야 하는데 부유(浮遊)하다 보니 연대가 깨진다.\u003c/li>\n\u003cli>🗣 한국의 경험: IMF 금 모으기, 코로나 시민 협조. \u003cstrong>Amitai Etzioni\u003c/strong>(공동체주의)는 일본·한국이 코로나를 성공적으로 해결한 것을 공동체적 시민성으로 본다. 고전적으로는 향약(鄕約)까지 거슬러 올라간다. 다만 질서를 침범하는 사람에겐 너그럽지 않다.\u003c/li>\n\u003cli>🗣 \u003cstrong>왜 중요한가\u003c/strong>: \u003cstrong>collective action problem을 풀려면 &quot;같이 움직이는 것&quot;에 대한 감이 있어야\u003c/strong> 하는데, 그 비용이 점점 높아지고 있다. → W01/01과 직결.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c07-h-5-civic-actor-entrepreneur\">\u003cspan class=\"step-no\" aria-hidden=\"true\">5\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">Civic Actor / Entrepreneur\u003c/p>\n\u003cul>\n\u003cli>🗣 (W02) 그래서 사람을 entrepreneur로만이 아니라 \u003cstrong>civic actor\u003c/strong>로 봐야 하지 않느냐.\u003c/li>\n\u003cli>🗣 (W02) \u003cstrong>GMO 사례\u003c/strong>: 유럽은 GMO를 공격적으로 반대했다(유럽 화학회사가 농약을 파니까 미국 GM에 반대한다는 해석도). 그런데 이제는 \u003cstrong>미국이 AI 데이터센터를 반대\u003c/strong>한다 — 맥락이 달라졌다. 가치 창출(value creation)도 중요하지만 \u003cstrong>civic actor가 무엇을 원하느냐, 그리고 공정성 문제가 같이\u003c/strong> 가야 한다.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c08":{"title":"시민성 — 사회계약과 네 가지 유형","en":"Citizenship as a Social Contract — Communitarian / Scientific / Digital / Ecological","week":"W01","href":"W01.html#c08","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>시민성(citizenship)은 &quot;국민이면 이 정도는 한다&quot;는 \u003cstrong>사회계약\u003c/strong>이다. 한국은 국가 위기 때 알아서 희생하는 \u003cstrong>공동체적 시민성\u003c/strong>으로 추격에 성공했지만, 이제 시민은 다른 얼굴로 나타난다. 전문가 판정을 못 믿어 직접 검증하는 \u003cstrong>과학적 시민\u003c/strong>, 디지털 접근을 요구하는 \u003cstrong>디지털 시민\u003c/strong>, 기술의 방향(온도 상승 한계)을 말하는 \u003cstrong>생태적 시민\u003c/strong>. 이들이 새 기술이 갈 방향을 말하는 \u003cstrong>citizen variety\u003c/strong>다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>축구팀 비유(🗣 교수)가 곧 이것이다. 옛날 한국 축구는 &quot;가끔 신이 천재(박지성)를 내려주는&quot; 팀이었고, 국민도 &quot;나라가 부르면 뛴다&quot;는 팀이었다. 그런데 팀워크는 해 봐야 안다. 이제 시민은 감독(정부·전문가)이 &quot;안전하다&quot;고 해도 직접 공을 만져 보고(과학적 시민), 경기장에 못 들어가는 사람이 없게 하라고 하고(디지털 시민), 애초에 어떤 경기를 할지 정하자고 한다(생태적 시민). \u003cstrong>팀의 룰을 선수도 같이 정하는 것\u003c/strong>이 새로운 시민성이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c08-h-슬라이드-w01-p12\">📄 슬라이드 (W01 p12)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p12.jpg\" alt=\"W01 p12 Citizenship\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"788\">\u003cfigcaption>W01 p12 Citizenship\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"step-group\">\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-1-도입-축구-비유-팀워크는-해-봐야-안다\">\u003cspan class=\"step-no\" aria-hidden=\"true\">1\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 도입: 축구 비유 — 팀워크는 해 봐야 안다\u003c/p>\n\u003cul>\n\u003cli>일본 축구인이 &quot;한국은 별것 없는데 가끔 신이 천재를 내려준다&quot;고 농담했는데, 지금 프리미어리그에 한국 선수는 없고 일본은 10명. \u003cstrong>팀워크\u003c/strong>를 못 하는 것. 일본은 기본기와 &quot;머리 쓰라&quot;로 팀워크를 만들었다.\u003c/li>\n\u003cli>팀워크는 해 봐야 안다 — \u003cstrong>learning by doing\u003c/strong>. 추격이 된 것도 collective action.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"quote-prof\">\u003cspan class=\"quote-icon\" aria-hidden=\"true\">🗣\u003c/span>\u003cp class=\"quote-text\">&quot;그 팀워크라는 거는 해봐야지 아셔야, 해봐야지. 직접 뛰어봐야지. … 러닝 바이 두잉, 러닝 바이 유징. 해봐야지 아는 거요. 해봐야지 아는 작업들을 하게 해줬느냐 아니었느냐. 그러니까 축구에서 필요한 지식은 이렇게 쌓여 있는 거.&quot;\u003c/p>\u003cspan class=\"quote-time\">W01 59:15\u003c/span>\u003c/blockquote>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-2-사회계약으로서의-시민성-슬라이드-좌측\">\u003cspan class=\"step-no\" aria-hidden=\"true\">2\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">사회계약으로서의 시민성 — 📄 슬라이드 좌측\u003c/p>\n\u003cul>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>\u003cstrong>의병 정신(義兵 精神)\u003c/strong>: &quot;국가위기 너그럽게 돕는 한국인, 나라 위한 희생이 왜 미담인가?&quot; 금 모으기 사진, 마스크 쓴 출근길 사진.\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>&quot;코로나 팬데믹 때 초기 국경통제 실패, 백신확보 지연 등 \u003cstrong>정부의 부실 대응을 전 국민 마스크 착용과 자영업자 희생으로 막았다.\u003c/strong>&quot;\u003c/li>\n\u003cli class=\"li-callout li-callout-slide\">\u003cspan class=\"callout-badge callout-badge-slide\" aria-hidden=\"true\">📄\u003c/span>Etzioni, \u003cem>The Diplomat\u003c/em> (2020.7.14) &quot;COVID-19 Tests Communitarian Values&quot;: 가장 공동체주의적인 나라들이 팬데믹을 잘 다루고, 가장 개인주의적인 나라들이 최악.\u003c/li>\n\u003cli>🗣 한국·일본이 해 온 것 = \u003cstrong>공동체적 시민성(Communitarian Citizenship)\u003c/strong>: &quot;이 정도는 우리가 해야지&quot;라는 규범. \u003cstrong>그런데 이것이 달라지고 있다.\u003c/strong>\u003c/li>\n\u003cli class=\"li-callout li-callout-note\">\u003cspan class=\"callout-badge callout-badge-note\" aria-hidden=\"true\">💡\u003c/span>슬라이드 제목의 &quot;잼버리를 끝으로 작별하고 싶다&quot;는 칼럼 제목은, 정부 실패를 시민 희생으로 메우는 방식(2023 새만금 잼버리 때 기업·시민 동원)을 이제 그만하자는 뜻.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-3-새로운-시민성의-세-유형-슬라이드-우측\">\u003cspan class=\"step-no\" aria-hidden=\"true\">3\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">새로운 시민성의 세 유형 — 📄 슬라이드 우측\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>유형\u003c/th>\n\u003cth>📄 이미지\u003c/th>\n\u003cth>🗣 설명\u003c/th>\n\u003cth>핵심 요구\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Scientific Citizenship\u003c/strong>\u003c/td>\n\u003ctd>방폐장(지하 처분 시설) 단면도\u003c/td>\n\u003ctd>국가·전문가가 안전하다고 해도 &quot;\u003cstrong>안심이 안 돼, 우리가 직접 하겠어\u003c/strong>&quot;. 신고리 원전 공론화, 방폐장 사례\u003c/td>\n\u003ctd>검증에 참여할 권리\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Digital Citizenship\u003c/strong>\u003c/td>\n\u003ctd>Digital Divide 그림\u003c/td>\n\u003ctd>\u003cstrong>접근 수단을 마련하고 교육 기회를 주라.\u003c/strong> 어르신의 키오스크 문제 — 자꾸 바꾸려면 교육도 같이 해야 한다\u003c/td>\n\u003ctd>접근권과 학습 기회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Ecological Citizenship\u003c/strong>\u003c/td>\n\u003ctd>산사태·개발 현장 사진\u003c/td>\n\u003ctd>기온 상승에 \u003cstrong>리밋을 두어야 하지 않느냐\u003c/strong>고 주장하며 새로운 시민 주체가 등장\u003c/td>\n\u003ctd>기술의 방향을 정할 권리\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>🗣 새 기술이 나올 때 \u003cstrong>어느 방향으로 갈지 말하는 사람들\u003c/strong> = \u003cstrong>citizen variety\u003c/strong>. → W01/05 &quot;고착을 깨는 변이&quot;의 시민 버전.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step-card\" id=\"ans-c08-h-4-세-문제의식의-마무리\">\u003cspan class=\"step-no\" aria-hidden=\"true\">4\u003c/span>\u003cdiv class=\"step-body\">\u003cp class=\"step-title\">🗣 세 문제의식의 마무리\u003c/p>\n\u003cp>이 세 가지 문제의식(인간–제도–과학기술 / 시스템 혁신 / 공공가치와 시민)을 계속 던지면서 혁신시스템 접근들을 볼 것.\u003c/p>\n\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/div>"},"W01/c09":{"title":"혁신시스템 접근법의 계보","en":"Innovation System Approaches by Disciplinary Context","week":"W01","href":"W01.html#c09","html":"\u003cdiv class=\"concept quiz-answer-body\">\u003cdiv class=\"sec sec-definition\">\u003ch4>한 줄 정의\u003c/h4>\u003cp>한 학기 동안 배울 이론들은 \u003cstrong>세 개의 다른 학문 동네\u003c/strong>에서 나왔다. \u003cstrong>혁신학(Innovation Studies)\u003c/strong>은 &quot;혁신은 집단 활동&quot;이라는 문제의식에서 NIS·SIS·TIS·StS를 만들었고, \u003cstrong>정치경제학\u003c/strong>은 노동·제도의 눈으로 SSIP를 만들었으며, \u003cstrong>경영학\u003c/strong>은 기업의 눈으로 비즈니스 시스템·비즈니스모델 혁신·혁신생태계론을 만들었다. 같은 &quot;시스템&quot;이라는 말을 쓰지만 출신이 다르므로, 각 이론이 \u003cstrong>무엇을 설명하려고 태어났는지\u003c/strong>를 알고 읽어야 한다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-analogy\">\u003ch4>쉽게 말하면\u003c/h4>\u003cp>같은 도시를 세 사람이 그린 지도라고 보면 된다.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>혁신학자\u003c/strong>의 지도: 지식이 어디서 만들어져 어디로 흐르는지가 굵게 그려져 있다.\u003c/li>\n\u003cli>\u003cstrong>정치경제학자\u003c/strong>의 지도: 노동자·자본·제도의 권력 관계가 굵다.\u003c/li>\n\u003cli>\u003cstrong>경영학자\u003c/strong>의 지도: 우리 회사에서 고객까지 가는 길, 누가 우리 편인지가 굵다.\u003c/li>\n\u003c/ul>\n\u003cp>세 지도 다 같은 도시를 그렸지만 굵게 그린 길이 다르다. 나중에 term paper를 쓸 때 \u003cstrong>어느 지도를 들고 갈지\u003c/strong> 고르는 것이 분석틀 선택이다.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"sec sec-core\">\u003ch4>핵심 내용\u003c/h4>\u003ch3 id=\"ans-c09-h-슬라이드-w01-p13\">📄 슬라이드 (W01 p13)\u003c/h3>\n\u003cfigure class=\"slide\">\u003cimg src=\"images/W01/p13.jpg\" alt=\"W01 p13 Innovation System a
