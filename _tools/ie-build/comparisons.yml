# 주차 간 비교표 — 개념정리/INDEX.md의 "주차 간 비교 개념" (X01~X03)에서 옮김.
#
# INDEX.md에는 각 비교의 한 줄 제목·메모만 있고, W02-2/05·07·08은 아직 파일이
# 작성되지 않았다(강의 미실시, 슬라이드 훅만 있음 — INDEX.md 개념 파일 템플릿
# 표 참조). 그래서 각 행의 내용은 다음만 근거로 삼는다:
#   - W01/*, W02-1/* 쪽: 실제 작성된 개념 파일의 한 줄 정의·핵심 내용
#   - W02-2/* 쪽: INDEX.md 템플릿 표의 "핵심 훅" 문구(슬라이드 p번호 있음, 초안)
# 브리핑 문서(task-12-brief.md)의 예시 행 중 위 두 근거로 확인되지 않는 문구
# (예: "처방" 행)는 넣지 않았다 — 각 항목에 이유를 note로 남긴다.

- id: X01
  title: 세 가지 고착 ↔ 사유화의 누적 lock-in
  note: >
    같은 메커니즘을 다른 층위에서 본다. W02-2/05는 아직 파일이 없어 INDEX.md
    슬라이드 훅 문구까지만 반영했다 — "처방" 행은 그쪽 근거가 없어 뺐다.
  columns: ["항목", "W01/05 세 가지 고착", "W02-2/05 사유화의 누적 lock-in"]
  rows:
    - ["층위", "조직·기술·사용자 세 군데 (시스템 전체)", "지식·기술의 채택 과정 (미작성 — 슬라이드 훅 기준)"]
    - ["메커니즘", "성공 공식 고착, 매몰비용(QWERTY), 네트워크·습관", "표준 확산·학습효과·네트워크효과 → 기술적 수렴"]
    - ["결과", "더 나은 대안이 있어도 못 바꾼다", "\"아직 가격이 없는 대안은 사라진다\""]

- id: X02
  title: 암묵지·STI/DUI ↔ 재현과 활용의 조건
  note: >
    "공개해도 못 쓰는 이유"의 미시적 근거. W02-2/07도 미작성 — INDEX.md 훅이
    W02-1/01·08과의 연결만 언급해서, 그 범위까지만 옮겼다.
  columns: ["항목", "W02-1/01·03 암묵지·STI/DUI", "W02-2/07 재현과 활용의 조건"]
  rows:
    - ["문제의식", "지식은 말·데이터로 다 옮겨지지 않는다 (Polanyi)", "형식지가 공개돼도 그것만으로 쓸 수 있는 건 아니다"]
    - ["핵심 개념", "형식지 vs 암묵지, STI(과학 원리) vs DUI(현장 경험)", "형식지 + 체화지식 + 인프라 + 조직 보완자산 — W02-1/01·08과 직접 연결 (미작성, 훅 기준)"]
    - ["함의", "STI·DUI를 결합한 기업이 혁신을 잘한다", "논문 공개(형식지 이전)가 곧 활용은 아니다 (미작성, 훅 기준)"]

- id: X03
  title: Entrepreneur ↔ Civic Actor · 문제제기
  note: >
    누가 새로운 문제를 제기하는가. W01/07·08은 이미 W02-2/08로 related가 걸려
    있는데(사유화의 누적처럼) W02-2/08 자체는 미작성이라 마지막 행만 훅 기준.
  columns: ["항목", "W01/03 Entrepreneur", "W01/07·08 Civic Actor · W02-2/08 문제제기"]
  rows:
    - ["동기", "시장 기회와 이윤 — '계산기 렌즈', 유틸리티 극대화", "공공가치와 시민성 — 사회적 관계 속의 존재"]
    - ["판단 기준", "개인의 자유로운 선택", "구조적인 박스(부모 재력·거주지)까지 고려한 공정"]
    - ["W02-2로 이어지는 물음", "(직접 연결 없음)", "새로운 문제를 제기할 권리와 능력은 누구에게 있는가 (미작성 — 훅 기준, Potts 2019 연결)"]
