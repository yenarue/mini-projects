  <text x="246" y="176" font-size="11.5" font-weight="700" fill="var(--term)">동태적 효율성</text>
  <text x="246" y="191" font-size="10" fill="var(--muted)">곡선 자체가 원점 쪽으로</text>

  <text x="50" y="318" font-size="10" fill="var(--muted)">곡선 = 같은 양을 만드는 L·K 조합(등량곡선)</text>
  <text x="50" y="334" font-size="10" fill="var(--muted)">학습하면 더 적은 투입으로 같은 양을 만든다</text>
</svg>
