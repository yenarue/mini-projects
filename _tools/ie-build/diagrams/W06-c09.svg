<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="w06c09-title">
  <title id="w06c09-title">노동(L)·자본(K) 평면의 등량곡선. 곡선 위에서 가장 싼 점을 고르는 것이 배분 효율성, 학습과 혁신으로 곡선 자체가 원점 쪽으로 옮겨 가는 것이 동태적 효율성</title>
  <defs>
    <marker id="w06c09-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="var(--ink)"></path>
    </marker>
    <marker id="w06c09-shift" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="var(--term)"></path>
    </marker>
  </defs>

  <path d="M50,290 L50,20" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#w06c09-arrow)"></path>
  <path d="M40,280 L360,280" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#w06c09-arrow)"></path>
  <text x="58" y="26" font-size="12" font-weight="700" fill="var(--ink)">자본 K</text>
  <text x="356" y="298" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">노동 L</text>

  <line x1="80" y1="70" x2="260" y2="250" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"></line>
  <text x="262" y="264" font-size="10" fill="var(--muted)">비용선</text>

