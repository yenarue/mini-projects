<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" role="img" aria-labelledby="w01c06-title">
  <title id="w01c06-title">시장 실패에서 시스템 실패를 거쳐 전환 실패로 올라가는 3단 계단과 각 단의 정책 처방을 보여주는 그림</title>

  <line x1="12" y1="280" x2="368" y2="280" stroke="var(--line)" stroke-width="1.4"></line>

  <!-- 1단: 시장 실패 -->
  <rect x="18" y="210" width="104" height="70" fill="var(--brand)" fill-opacity="0.85" rx="6"></rect>
  <text x="70" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="var(--brand)">시장 실패</text>
  <text x="70" y="238" text-anchor="middle" font-size="11" fill="var(--surface)">돈이</text>
  <text x="70" y="253" text-anchor="middle" font-size="11" fill="var(--surface)">모자람</text>
  <text x="70" y="299" text-anchor="middle" font-size="10" fill="var(--muted)">R&amp;D 보조금·IP</text>

  <!-- 2단: 시스템 실패 -->
  <rect x="138" y="160" width="104" height="120" fill="var(--term)" fill-opacity="0.85" rx="6"></rect>
  <text x="190" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="var(--term)">시스템 실패</text>
  <text x="190" y="212" text-anchor="middle" font-size="11" fill="var(--surface)">연결이</text>
  <text x="190" y="227" text-anchor="middle" font-size="11" fill="var(--surface)">모자람</text>
  <text x="190" y="299" text-anchor="middle" font-size="10" fill="var(--muted)">산학연·제도 정비</text>

  <!-- 3단: 전환 실패 -->
  <rect x="258" y="90" width="104" height="190" fill="var(--note)" fill-opacity="0.9" rx="6"></rect>
  <text x="310" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="var(--note)">전환 실패</text>
  <text x="310" y="177" text-anchor="middle" font-size="11" fill="var(--surface)">방향·합의가</text>
  <text x="310" y="192" text-anchor="middle" font-size="11" fill="var(--surface)">모자람</text>
  <text x="310" y="299" text-anchor="middle" font-size="10" fill="var(--muted)">임무지향·참여 거버넌스</text>

  <text x="18" y="316" font-size="10.5" fill="var(--muted)">시스템 전환은 경제·사회·정치·문화 프로젝트</text>
</svg>
