<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 360" role="img" aria-labelledby="w0201c08-title">
  <title id="w0201c08-title">수면 위는 구매 가능한 생산 능력, 수면 아래는 의도적 학습으로만 쌓이는 기술 역량 3단계임을 보여주는 빙산 그림</title>

  <text x="190" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--note)">생산 능력 (구매 가능)</text>

  <!-- 수면 위: 생산 능력 -->
  <path d="M190,32 L240,120 L140,120 Z" fill="var(--note-soft)" stroke="var(--note)" stroke-width="1.4"></path>

  <!-- 수면선 -->
  <line x1="16" y1="120" x2="364" y2="120" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4,3"></line>
  <text x="16" y="114" font-size="9.5" fill="var(--muted)">수면</text>

  <!-- 수면 아래: 기술 역량 3단계 -->
  <path d="M140,120 L240,120 L320,340 L60,340 Z" fill="var(--brand-soft)" stroke="var(--brand)" stroke-width="1.4"></path>
  <line x1="113" y1="193" x2="267" y2="193" stroke="var(--brand)" stroke-opacity="0.45" stroke-width="1"></line>
  <line x1="87" y1="267" x2="293" y2="267" stroke="var(--brand)" stroke-opacity="0.45" stroke-width="1"></line>

  <text x="190" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand)">1단계 — 운영·점진 개선</text>
  <text x="190" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand)">2단계 — 개조·창의적 응용</text>
  <text x="190" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand)">3단계 — 자체 R&amp;D·독자 혁신</text>
  <text x="190" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand)">기술 역량 (의도적 학습으로만 축적)</text>
</svg>
