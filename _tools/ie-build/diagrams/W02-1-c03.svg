<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="w0201c03-title">
  <title id="w0201c03-title">STI mode와 DUI mode를 지식 형태·주체·장소·학습 방식 네 줄로 대비하고, 두 모드를 결합한 기업이 혁신을 더 잘한다는 것을 보여주는 그림</title>

  <!-- 헤더 -->
  <rect x="12" y="10" width="168" height="36" rx="8" fill="var(--brand)"></rect>
  <text x="96" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="var(--surface)">STI mode</text>
  <rect x="200" y="10" width="168" height="36" rx="8" fill="var(--term)"></rect>
  <text x="284" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="var(--surface)">DUI mode</text>

  <!-- 표 본문 -->
  <rect x="12" y="50" width="356" height="220" rx="8" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1"></rect>
  <line x1="190" y1="50" x2="190" y2="270" stroke="var(--line)" stroke-width="1"></line>
  <line x1="12" y1="105" x2="368" y2="105" stroke="var(--line)" stroke-width="1"></line>
  <line x1="12" y1="150" x2="368" y2="150" stroke="var(--line)" stroke-width="1"></line>
  <line x1="12" y1="195" x2="368" y2="195" stroke="var(--line)" stroke-width="1"></line>

  <g font-size="9.5" fill="var(--muted)">
    <text x="20" y="64">지식 형태</text>
    <text x="20" y="118">주체</text>
    <text x="20" y="163">장소</text>
    <text x="20" y="208">학습 방식</text>
    <text x="20" y="253">한마디</text>
  </g>

  <g font-size="11" font-weight="600" fill="var(--ink)">
    <text x="96" y="80" text-anchor="middle">형식지(Explicit)</text>
    <text x="96" y="132" text-anchor="middle">과학자·전문가</text>
    <text x="96" y="176" text-anchor="middle">학교·연구기관</text>
    <text x="96" y="220" text-anchor="middle">강의·텍스트·시뮬레이션</text>
    <text x="96" y="260" text-anchor="middle" font-size="10" font-weight="400" fill="var(--ink-soft)">이론과 프레임워크</text>

    <text x="284" y="80" text-anchor="middle">암묵지(Tacit)</text>
    <text x="284" y="132" text-anchor="middle">장인·Engineer</text>
    <text x="284" y="176" text-anchor="middle">생산·문제발생 현장</text>
    <text x="284" y="220" text-anchor="middle">"해 봐야 안다"</text>
    <text x="284" y="260" text-anchor="middle" font-size="10" font-weight="400" fill="var(--ink-soft)">떠들고 토론하고 뒤풀이</text>
  </g>

  <text x="190" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">↔ 결합한 기업이 압도적으로 혁신을 잘한다</text>
</svg>
